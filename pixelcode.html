<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelCode</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --accent:#3aa0ff; --accent-dim:#2b6ba3; --ink:#d6e2ec; --ink-dim:#6c8698;
    --ok:#4fd67a; --err:#ff5b4d; --warn:#e0c46a;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    display:flex; flex-direction:column; overflow:hidden;
  }

  .topbar{
    min-height:42px; flex-shrink:0; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 14px; flex-wrap:wrap;
  }
  .topbar .brand{ font-weight:800; letter-spacing:1px; color:var(--accent); font-size:14px; }
  .topbar .brand small{ color:var(--ink-dim); font-weight:500; margin-left:8px; font-size:11px; }
  .topbar .actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:0.5px; text-transform:uppercase;
    background:var(--accent); color:#04150c; border:none; padding:8px 14px; cursor:pointer; border-radius:2px;
  }
  button.btn:hover{ background:#5cb3ff; }
  button.btn-secondary{ background:transparent; color:var(--accent); border:1px solid var(--accent-dim); }
  button.btn-secondary:hover{ background:rgba(58,160,255,0.1); }

  .modo{ display:flex; border:1px solid var(--accent-dim); border-radius:2px; overflow:hidden; }
  .modo button{ font-family:inherit; font-size:11px; font-weight:700; padding:7px 12px; border:none; cursor:pointer; background:transparent; color:var(--ink-dim); }
  .modo button.ativo{ background:var(--accent); color:#04150c; }
  .auto{ font-size:11px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .auto input{ accent-color:var(--accent); }

  .salvo{ font-size:10px; color:var(--ink-dim); min-width:70px; text-align:right; }
  .salvo.pendente{ color:var(--warn); }

  .workspace{ flex:1; min-height:0; display:flex; }
  .editor-pane{ flex:1 1 55%; min-width:0; min-height:0; overflow:hidden; display:flex; }
  .editor-col{ flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }

  /* ---------- Explorador de arquivos ---------- */
  .explorador{ flex:0 0 190px; min-height:0; display:flex; flex-direction:column; background:var(--panel2); border-right:1px solid var(--line); }
  .explorador[hidden]{ display:none; }
  .exp-topo{ height:32px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 6px 0 12px; border-bottom:1px solid var(--line);
    font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; }
  .exp-topo button{ font-family:inherit; font-size:14px; line-height:1; width:24px; height:24px; border:none; border-radius:3px; background:transparent; color:var(--ink-dim); cursor:pointer; }
  .exp-topo button:hover{ background:rgba(58,160,255,0.12); color:var(--accent); }
  .exp-lista{ flex:1; overflow-y:auto; list-style:none; margin:0; padding:4px 0; }
  .arq{ display:flex; align-items:center; gap:7px; padding:4px 6px 4px 12px; font-size:12px; cursor:pointer; color:var(--ink); white-space:nowrap; }
  .arq:hover{ background:rgba(255,255,255,0.04); }
  .arq.ativo{ background:rgba(58,160,255,0.14); color:#fff; }
  .arq .nome{ flex:1; overflow:hidden; text-overflow:ellipsis; }
  .arq .roda{ font-size:9px; color:var(--ok); }
  .arq .acoes{ display:none; gap:1px; }
  .arq:hover .acoes, .arq.ativo .acoes{ display:flex; }
  .arq .acoes button{ font-family:inherit; font-size:11px; border:none; background:transparent; color:var(--ink-dim); cursor:pointer; padding:1px 4px; border-radius:3px; }
  .arq .acoes button:hover{ color:var(--accent); background:rgba(58,160,255,0.12); }
  .arq .acoes button[data-acao="apagar"]:hover{ color:var(--err); }
  .arq input{ flex:1; min-width:0; font-family:inherit; font-size:12px; background:var(--bg); color:var(--ink); border:1px solid var(--accent); border-radius:2px; padding:2px 4px; outline:none; }
  .arq input.invalido{ border-color:var(--err); }
  .arq-erro{ font-size:10px; color:var(--err); padding:0 10px 4px 12px; white-space:normal; }
  .ico{ flex:0 0 22px; font-size:9px; font-weight:800; text-align:center; }
  .ico-html{ color:#ff8a4c; } .ico-css{ color:#4ca8ff; } .ico-js{ color:#f0d050; } .ico-json{ color:#c58af9; } .ico-md{ color:#8fd0a8; } .ico-img{ color:#6fd6c4; } .ico-outro{ color:var(--ink-dim); }
  .exp-rodape{ flex-shrink:0; padding:6px 12px; font-size:10px; color:var(--ink-dim); border-top:1px solid var(--line); line-height:1.4; }

  /* ---------- Abas dos arquivos abertos ---------- */
  .abas{ height:32px; flex-shrink:0; display:flex; background:var(--panel2); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:thin; }
  .abas button{ font-family:inherit; font-size:11px; font-weight:600; padding:0 10px 0 14px; border:none; border-right:1px solid var(--line); cursor:pointer; background:transparent; color:var(--ink-dim);
    display:flex; align-items:center; gap:6px; white-space:nowrap; flex-shrink:0; }
  .abas button.ativa{ background:var(--bg); color:var(--accent); box-shadow:inset 0 2px 0 var(--accent); }
  .abas .fechar{ font-size:13px; line-height:1; padding:0 3px; border-radius:3px; opacity:.6; }
  .abas .fechar:hover{ opacity:1; background:rgba(255,255,255,0.1); }
  .abas .toggle-exp{ padding:0 12px; font-size:14px; }
  #editor{ flex:1; min-height:0; overflow:hidden; }
  #editor[hidden]{ display:none; }

  /* ---------- Imagem aberta (aparece no lugar do editor) ---------- */
  .imagem-vista{ flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px;
    background:repeating-conic-gradient(#121c26 0% 25%, #0d1620 0% 50%) 0 0 / 16px 16px; }
  .imagem-vista[hidden]{ display:none; }
  .imagem-vista img{ image-rendering:pixelated; max-width:100%; max-height:60vh; object-fit:contain; outline:1px dashed var(--line); }
  .imagem-vista .info{ font-size:12px; color:var(--ink-dim); text-align:center; line-height:1.7; background:var(--panel2); padding:8px 14px; border-radius:4px; }
  .imagem-vista code{ color:var(--accent); }

  .lado{ flex:1 1 45%; min-width:280px; min-height:0; overflow:hidden; display:flex; flex-direction:column; border-left:1px solid var(--line); }
  .navegador{ flex:1 1 65%; min-height:0; display:flex; flex-direction:column; background:var(--panel); }
  .navegador[hidden]{ display:none; }
  .nav-barra{ height:34px; flex-shrink:0; display:flex; align-items:center; gap:6px; padding:0 8px; border-bottom:1px solid var(--line); background:var(--panel2); }
  .nav-barra button{ font-family:inherit; font-size:12px; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:4px; padding:3px 8px; cursor:pointer; }
  .nav-barra button:hover{ border-color:var(--accent); color:var(--accent); }
  .nav-url{ flex:1; font-size:11px; color:var(--ink-dim); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:4px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #preview{ flex:1; min-height:0; width:100%; border:0; background:#fff; }
  #runner{ display:none; }

  .console-pane{ flex:0 0 35%; min-height:90px; display:flex; flex-direction:column; background:var(--panel); border-top:1px solid var(--line); }
  .lado.so-js .console-pane{ flex:1 1 100%; border-top:none; }
  .console-header{
    height:32px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:0 12px; font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px;
    border-bottom:1px solid var(--line);
  }
  .console-header button{
    background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:11px;
    font-family:inherit; text-transform:uppercase; letter-spacing:0.5px;
  }
  .console-header button:hover{ color:var(--accent); }

  .console-body{ flex:1; overflow-y:auto; padding:10px 12px; font-size:12px; line-height:1.6; }
  .console-body .line{ white-space:pre-wrap; word-break:break-word; margin-bottom:4px; padding-bottom:4px; border-bottom:1px dashed rgba(255,255,255,0.05); }
  .console-body .line.log{ color:var(--ink); }
  .console-body .line.warn{ color:var(--warn); }
  .console-body .line.error{ color:var(--err); }
  .console-body .line.info{ color:var(--ink-dim); font-style:italic; }
  .console-body .empty{ color:var(--ink-dim); font-style:italic; }
  .console-body .line.ir{ cursor:pointer; }
  .console-body .line.ir:hover{ text-decoration:underline; }

  @media (max-width: 800px) {
    .workspace{ flex-direction:column; }
    .editor-pane{ flex:1 1 50%; }
    .lado{ min-width:0; border-left:none; border-top:1px solid var(--line); flex:1 1 50%; }
    .explorador{ flex-basis:150px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">PixelCode <small id="subtitulo">editor + navegador</small></div>
  <div class="actions">
    <span class="salvo" id="statusSalvo" title="Seus arquivos ficam salvos neste navegador">✓ salvo</span>
    <div class="modo" role="tablist" aria-label="Modo do editor">
      <button type="button" data-modo="web" id="modoWeb">Página web</button>
      <button type="button" data-modo="js" id="modoJs">Só JavaScript</button>
    </div>
    <label class="auto" title="Sugestões enquanto você digita (atalhos, ids, classes, arquivos). Desligado, só aparecem com Ctrl+Espaço"><input type="checkbox" id="chkSugestoes"> Autocompletar</label>
    <label class="auto" id="autoWrap" title="Atualiza o navegador sozinho, meio segundo depois de você parar de digitar"><input type="checkbox" id="chkAuto"> Atualizar sozinho</label>
    <button class="btn-secondary btn" id="btnBaixar" title="Baixar a página (com CSS e JS juntos num arquivo só)">⬇ Baixar</button>
    <button class="btn" id="btnRun">▶ Executar (Ctrl+Enter)</button>
  </div>
</div>

<div class="workspace">
  <div class="editor-pane">
    <aside class="explorador" id="explorador" aria-label="Arquivos do projeto">
      <div class="exp-topo">
        <span>Arquivos</span>
        <span>
          <button type="button" id="btnNovoArq" title="Novo arquivo">＋</button>
          <button type="button" id="btnImportar" title="Importar arquivos do computador">⤒</button>
        </span>
      </div>
      <ul class="exp-lista" id="expLista"></ul>
      <div class="exp-rodape">Salvo neste navegador.<br>Duplo clique renomeia.</div>
    </aside>
    <input type="file" id="inputImportar" multiple hidden accept=".html,.htm,.css,.js,.mjs,.json,.md,.txt,.csv,.svg,.xml,.png,.jpg,.jpeg,.gif,.webp">
    <div class="editor-col">
      <div class="abas" id="abas" role="tablist" aria-label="Arquivos abertos"></div>
      <div id="editor"></div>
      <div class="imagem-vista" id="imagemVista" hidden>
        <img id="imagemVistaImg" alt="">
        <div class="info" id="imagemVistaInfo"></div>
      </div>
    </div>
  </div>
  <div class="lado" id="lado">
    <div class="navegador" id="navegador">
      <div class="nav-barra">
        <button type="button" id="btnAtualizar" title="Recarregar a página">↻</button>
        <div class="nav-url" id="navUrl">pixelcode://index.html</div>
        <button type="button" id="btnNovaAba" title="Abrir a página numa aba nova, em tela cheia">⧉ Nova aba</button>
      </div>
      <iframe id="preview" title="Navegador do PixelCode" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
    </div>
    <div class="console-pane">
      <div class="console-header">
        <span>Console</span>
        <button type="button" id="btnClear">Limpar</button>
      </div>
      <div class="console-body" id="consoleBody">
        <div class="empty">Nada executado ainda. Escreva um código e clique em "Executar".</div>
      </div>
    </div>
  </div>
</div>
<iframe id="runner" title="Execução do JavaScript" sandbox="allow-scripts allow-modals"></iframe>

<script src="shared/pixelcode-docs.js"></script>
<script src="shared/pixelcode-autocomplete.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emmet-monaco-es@5.7.0/dist/emmet-monaco.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
  // PixelCode — editor do portal (Monaco, só CDN). O aluno tem um PROJETO com
  // vários arquivos (explorador à esquerda), salvo no localStorage. Dois modos:
  //  - "Página web": roda um .html do projeto num NAVEGADOR, com o console
  //    embaixo. Os link/script do .html (href='style.css', src='script.js') que apontam
  //    pra arquivos do projeto são embutidos na hora; fetch("dados.json") lê
  //    o arquivo do projeto; um link para outra.html troca de página.
  //  (Nos comentários e nas strings deste arquivo, atributo href/src só com
  //  aspas simples ou escapadas, e nada de tag de script solta: o
  //  tests/check-paths.mjs leria como referência de verdade.)
  //  - "Só JavaScript": roda o .js aberto, só com o console.
  // Imagens (.png, .jpg, .gif, .webp) entram pelo importar e ficam guardadas
  // como data URL, fora do Monaco. No navegador, o nome do arquivo
  // ('personagem.png') funciona em img, CSS url(...), new Image(), fetch e
  // XHR — é assim que o Phaser carrega o sprite com this.load.image.
  // Nos dois, o código roda num <iframe sandbox> SEM allow-same-origin: ele
  // não enxerga o portal (sessão, localStorage, cookies). O console e os
  // erros chegam por postMessage. Os laços do JS ganham uma checagem de
  // tempo (como o CodePen faz) para um laço infinito não congelar a aba.
  const MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs';
  const CHAVE = 'pixelcode_v3';
  const CHAVE_ANTIGA = 'pixelcode_v2'; // abas fixas HTML/CSS/JS — migrado uma vez

  // Monaco usa Web Workers pra recursos como diagnóstico de sintaxe. Como
  // aqui a página é servida sem bundler (só CDN), o worker é montado num
  // blob que importa o script do próprio CDN — padrão usual pra rodar o
  // Monaco "solto", sem servidor de assets dedicado.
  window.MonacoEnvironment = {
    getWorkerUrl: function () {
      return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
        `self.MonacoEnvironment = { baseUrl: '${MONACO_BASE}/../' };\n` +
        `importScripts('${MONACO_BASE}/base/worker/workerMain.js');`
      );
    }
  };

  // Página completa a partir do miolo do <body>, já ligada ao style.css e ao script.js.
  function paginaCom(corpo) {
    return [
      '<!DOCTYPE html>',
      '<html lang="pt-BR">',
      '<head>',
      '  <meta charset="UTF-8">',
      '  <title>Minha página</title>',
      '  <link rel="stylesheet" href=\"style.css\">',
      '</head>',
      '<body>',
      corpo.replace(/\n+$/, ''),
      '',
      '  <script src=\"script.js\"><\/script>',
      '</body>',
      '</html>',
      '',
    ].join('\n');
  }

  const EXEMPLO = {
    'index.html': paginaCom([
      '  <h1>Olá, PixelCode!</h1>',
      '  <p>Você clicou <strong id="contador">0</strong> vezes.</p>',
      '  <button id="botao">Clique aqui</button>',
    ].join('\n')),
    'style.css': [
      'body {',
      '  font-family: system-ui, sans-serif;',
      '  text-align: center;',
      '  padding: 40px;',
      '}',
      '',
      'button {',
      '  font-size: 18px;',
      '  padding: 10px 20px;',
      '  cursor: pointer;',
      '}',
      '',
    ].join('\n'),
    'script.js': [
      'let cliques = 0;',
      'const botao = document.getElementById("botao");',
      'const contador = document.getElementById("contador");',
      '',
      'botao.addEventListener("click", () => {',
      '  cliques++;',
      '  contador.textContent = cliques;',
      '  console.log("Cliques:", cliques);',
      '});',
      '',
    ].join('\n'),
    'teste.js': [
      '// Modo "Só JavaScript": escreva e clique em "Executar".',
      'function somar(a, b) {',
      '  return a + b;',
      '}',
      '',
      'console.log(somar(2, 3));',
      '',
    ].join('\n'),
  };

  // Projeto salvo: { modo, auto, ativo, abertos, pagina, scriptJs, explorador, arquivos: { nome: conteudo } }.
  // Na primeira vez, aproveita o que o aluno tinha nas abas antigas (pixelcode_v2).
  function carregarProjeto() {
    try {
      const p = JSON.parse(localStorage.getItem(CHAVE) || 'null');
      if (p && p.arquivos && Object.keys(p.arquivos).length) return p;
    } catch (e) {}
    let v2 = null;
    try { v2 = JSON.parse(localStorage.getItem(CHAVE_ANTIGA) || 'null'); } catch (e) {}
    const arquivos = Object.assign({}, EXEMPLO);
    if (v2) {
      if (v2.html != null) arquivos['index.html'] = paginaCom(v2.html);
      if (v2.css != null) arquivos['style.css'] = v2.css;
      if (v2.js != null) arquivos['script.js'] = v2.js;
      if (v2.jsSolo != null) arquivos['teste.js'] = v2.jsSolo;
    }
    const js = v2 && v2.modo === 'js';
    return {
      modo: js ? 'js' : 'web', auto: !v2 || v2.auto !== false, arquivos,
      abertos: js ? ['teste.js'] : ['index.html', 'style.css', 'script.js'], ativo: js ? 'teste.js' : 'index.html',
    };
  }
  const salvo = carregarProjeto();
  const estado = {
    modo: salvo.modo === 'js' ? 'js' : 'web',
    auto: salvo.auto !== false,
    sugestoes: salvo.sugestoes !== false, // autocompletar enquanto digita
    pagina: salvo.pagina || '',     // .html que o navegador mostra
    scriptJs: salvo.scriptJs || '', // .js que o modo "Só JavaScript" roda
    explorador: typeof salvo.explorador === 'boolean' ? salvo.explorador : window.innerWidth > 800,
  };

  const extensao = nome => (String(nome).match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
  const ehHtml = nome => ['html', 'htm'].includes(extensao(nome));
  const ehJs = nome => ['js', 'mjs'].includes(extensao(nome));
  const LINGUAGEM = { html: 'html', htm: 'html', css: 'css', js: 'javascript', mjs: 'javascript', json: 'json', md: 'markdown', svg: 'xml', xml: 'xml' };
  const ICONE = { html: ['&lt;&gt;', 'html'], htm: ['&lt;&gt;', 'html'], css: ['#', 'css'], js: ['JS', 'js'], mjs: ['JS', 'js'], json: ['{}', 'json'], md: ['M↓', 'md'],
    png: ['IMG', 'img'], jpg: ['IMG', 'img'], jpeg: ['IMG', 'img'], gif: ['IMG', 'img'], webp: ['IMG', 'img'] };
  const TIPO_MIME = { html: 'text/html', htm: 'text/html', css: 'text/css', js: 'text/javascript', mjs: 'text/javascript', json: 'application/json', svg: 'image/svg+xml', xml: 'application/xml', csv: 'text/csv', md: 'text/markdown' };
  const IMAGEM_MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp' };
  const ehImagem = nome => Object.prototype.hasOwnProperty.call(IMAGEM_MIME, extensao(nome));
  const IMAGEM_MAX = 300 * 1024; // o projeto inteiro mora no localStorage (~5 MB)

  // ---------- Proteção contra laço infinito ----------
  // Acha cada "for (...) {", "while (...) {" e "do {" fora de strings e
  // comentários e põe, logo depois da chave, uma chamada a __pcLaco(id): se o
  // mesmo laço rodar sem parar por mais de 2 s, ela lança um erro. Laço sem
  // chaves (ex.: for (...) x++;) não é protegido. Não muda o número de linhas.
  function protegerLacos(src) {
    let out = '', i = 0, id = 0;
    const n = src.length;
    const ident = c => /[A-Za-z0-9_$]/.test(c || '');
    while (i < n) {
      const c = src[i], d = src[i + 1];
      if (c === '/' && d === '/') { const f = src.indexOf('\n', i); const j = f < 0 ? n : f; out += src.slice(i, j); i = j; continue; }
      if (c === '/' && d === '*') { const f = src.indexOf('*/', i + 2); const j = f < 0 ? n : f + 2; out += src.slice(i, j); i = j; continue; }
      if (c === '"' || c === "'" || c === '`') {
        let j = i + 1;
        while (j < n && src[j] !== c) { if (src[j] === '\\') j++; j++; }
        out += src.slice(i, j + 1); i = j + 1; continue;
      }
      const palavra = ['for', 'while', 'do'].find(p => src.startsWith(p, i) && !ident(src[i - 1]) && !ident(src[i + p.length]));
      if (palavra) {
        let j = i + palavra.length;
        if (palavra !== 'do') {
          while (j < n && /\s/.test(src[j])) j++;
          if (src[j] !== '(') { out += src.slice(i, j); i = j; continue; }
          let nivel = 0;
          for (; j < n; j++) { if (src[j] === '(') nivel++; else if (src[j] === ')') { nivel--; if (nivel === 0) { j++; break; } } }
        }
        let k = j;
        while (k < n && /\s/.test(src[k])) k++;
        if (src[k] === '{') { out += src.slice(i, k + 1) + `__pcLaco(${id++});`; i = k + 1; continue; }
        out += src.slice(i, j); i = j; continue;
      }
      out += c; i++;
    }
    return out;
  }

  // Script injetado no <iframe>: redireciona console/erros para o PixelCode,
  // faz fetch("arquivo") ler os arquivos do projeto e um link para pagina.html
  // trocar de página.
  function ponte(arquivos) {
    const arq = JSON.stringify(arquivos).replace(/</g, '\\u003c');
    const mimes = JSON.stringify(TIPO_MIME);
    return `<script>(function(){
    var P = parent, inicio = {}, ultimo = {}, ARQ = ${arq}, MIME = ${mimes};
    function fmt(a){ if (typeof a === 'string') return a; if (a instanceof Error) return a.name + ': ' + a.message;
      if (a && a.nodeType === 1) return a.outerHTML.slice(0, 300);
      try { var s = JSON.stringify(a, null, 2); return s === undefined ? String(a) : s; } catch (e) { return String(a); } }
    function envia(tipo, args){
      args = Array.prototype.slice.call(args);
      // console.log('%cTexto', 'color: red'): o estilo não aparece aqui, então sai junto com o %c (o Phaser usa isso no aviso de versão).
      if (typeof args[0] === 'string' && args[0].indexOf('%c') >= 0) {
        var n = args[0].split('%c').length - 1;
        args = [args[0].replace(/%c/g, '').replace(/\\s+/g, ' ').trim()].concat(args.slice(1 + n));
      }
      try { P.postMessage({ pixelcode: true, tipo: tipo, texto: args.map(fmt).join(' ') }, '*'); } catch (e) {} }
    ['log','info','warn','error'].forEach(function(t){ console[t] = function(){ envia(t, arguments); }; });
    window.__pcLaco = function(id){ var t = Date.now();
      if (!inicio[id] || t - ultimo[id] > 200) { inicio[id] = t; ultimo[id] = t; return; }
      ultimo[id] = t;
      if (t - inicio[id] > 2000) { inicio[id] = 0; throw new RangeError('Laço infinito? Um laço rodou por mais de 2 segundos e foi interrompido.'); } };
    window.addEventListener('error', function(e){ P.postMessage({ pixelcode: true, tipo: 'erro', texto: e.message, linha: e.lineno || 0 }, '*'); });
    window.addEventListener('unhandledrejection', function(e){ P.postMessage({ pixelcode: true, tipo: 'erro', texto: 'Promise rejeitada: ' + fmt(e.reason), linha: 0 }, '*'); });
    function externo(u){ return /^[a-z][\\w+.-]*:|^\\/\\//i.test(u); }
    function limpa(u){ u = String(u).split(/[?#]/)[0].replace(/^\\.?\\//, ''); try { u = decodeURIComponent(u); } catch (e) {} return u; }
    var f0 = window.fetch;
    window.fetch = function(u, o){
      var s = typeof u === 'string' ? u : (u instanceof URL ? u.href : null);
      if (s === null || externo(s)) return f0.apply(window, arguments);
      var n = limpa(s);
      if (Object.prototype.hasOwnProperty.call(ARQ, n)) {
        var ext = (n.match(/\\.([^.]+)$/) || [,''])[1].toLowerCase();
        return Promise.resolve(new Response(ARQ[n], { status: 200, headers: { 'Content-Type': (MIME[ext] || 'text/plain') + ';charset=utf-8' } }));
      }
      console.warn('fetch("' + s + '"): esse arquivo não existe no projeto.');
      return Promise.resolve(new Response('Arquivo não encontrado', { status: 404, statusText: 'Not Found' }));
    };
    document.addEventListener('click', function(e){
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || e.defaultPrevented) return;
      var h = a.getAttribute('href');
      if (!h || externo(h) || h.charAt(0) === '#') return;
      var n = limpa(h);
      if (/\\.html?$/i.test(n)) { e.preventDefault(); P.postMessage({ pixelcode: true, tipo: 'navegar', arquivo: n }, '*'); }
    });
  })();<\/script>`;
  }

  // Script injetado (depois da ponte) quando o projeto tem imagens: troca o
  // nome do arquivo ('personagem.png') pela imagem guardada em quem carrega
  // imagem pelo JS — img.src, setAttribute, fetch e XHR (o loader do Phaser
  // usa XHR). Também vai na página baixada, que não tem a ponte.
  function ponteImagens(imagens) {
    if (!Object.keys(imagens).length) return '';
    const img = JSON.stringify(imagens).replace(/</g, '\\u003c');
    return `<script>(function(){
    var IMG = ${img};
    function acha(u){
      if (u instanceof URL) u = u.href;
      if (typeof u !== 'string' || /^[a-z][\\w+.-]*:|^\\/\\//i.test(u)) return null;
      u = u.split(/[?#]/)[0].replace(/^\\.?\\//, ''); try { u = decodeURIComponent(u); } catch (e) {}
      return Object.prototype.hasOwnProperty.call(IMG, u) ? IMG[u] : null; }
    var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    Object.defineProperty(HTMLImageElement.prototype, 'src', { configurable: true, enumerable: d.enumerable, get: d.get,
      set: function(v){ d.set.call(this, acha(v) || v); } });
    var sa = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function(n, v){ if (/^(src|href)$/i.test(n)) v = acha(v) || v; return sa.call(this, n, v); };
    var xo = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(){ var a = Array.prototype.slice.call(arguments), x = acha(a[1]); if (x) a[1] = x; return xo.apply(this, a); };
    var f0 = window.fetch;
    window.fetch = function(){ var a = Array.prototype.slice.call(arguments), x = acha(a[0]); if (x) a[0] = x; return f0.apply(window, a); };
  })();<\/script>`;
  }

  // Monta o documento guardando, pra cada trecho, de que arquivo e linha ele
  // veio — assim o erro "linha 57" do iframe vira "script.js, linha 3".
  function construtor() {
    let doc = '', linha = 1;
    const mapa = [];
    return {
      add(texto, arquivo, origem) {
        if (!texto) return;
        const quebras = (texto.match(/\n/g) || []).length;
        // Trecho nosso que começa com "\n": a linha em que ele começa ainda é
        // a última do arquivo anterior — senão um erro nela ficaria sem dono.
        const ini = !arquivo && texto[0] === '\n' ? linha + 1 : linha;
        mapa.push({ ini, arquivo: arquivo || null, origem: origem || 1, linhas: quebras + 1 });
        doc += texto;
        linha += quebras;
      },
      fim: () => ({ doc, mapa }),
    };
  }
  function traduzirLinha(mapa, n) {
    let seg = null, ultimoArq = null;
    for (const s of mapa) {
      if (s.ini > n) break;
      seg = s;
      if (s.arquivo) ultimoArq = s;
    }
    if (seg && seg.arquivo) return { arquivo: seg.arquivo, linha: seg.origem + n - seg.ini };
    // Erro logo depois do fim de um arquivo (ex.: "Unexpected end of input",
    // faltou uma "}"): aponta a última linha dele.
    const fim = ultimoArq && ultimoArq.ini + ultimoArq.linhas - 1;
    if (ultimoArq && n - fim <= 2) return { arquivo: ultimoArq.arquivo, linha: ultimoArq.origem + ultimoArq.linhas - 1 };
    return null;
  }
  const linhaEm = (texto, idx) => texto.slice(0, idx).split('\n').length;
  const fecharScript = s => s.replace(/<\/script/gi, '<\\/script');
  const externo = u => /^[a-z][\w+.-]*:|^\/\//i.test(u);
  const limparUrl = u => { u = String(u).split(/[?#]/)[0].replace(/^\.?\//, ''); try { u = decodeURIComponent(u); } catch (e) {} return u; };
  function lerAttr(tag, nome) {
    const m = tag.match(new RegExp('\\s' + nome + '\\s*=\\s*(?:"([^"]*)"|\'([^\']*)\'|([^\\s>]+))', 'i'));
    return m ? (m[1] ?? m[2] ?? m[3]) : null;
  }

  require.config({ paths: { vs: MONACO_BASE } });

  require(['vs/editor/editor.main'], function () {
    const modelos = new Map(); // nome → modelo do Monaco
    // Imagens ficam fora do Monaco: o base64 viraria sugestão de palavra no editor.
    const imagens = new Map(); // nome → data URL
    const vistas = {};         // nome → posição do cursor/rolagem
    const conteudo = nome => (modelos.get(nome) ? modelos.get(nome).getValue() : (imagens.get(nome) || ''));
    const existe = nome => modelos.has(nome) || imagens.has(nome);
    const nomes = () => [...modelos.keys(), ...imagens.keys()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    const listaArquivos = () => nomes().map(nome => ({ nome, conteudo: imagens.has(nome) ? '' : conteudo(nome) }));
    const arquivosTexto = () => Object.fromEntries([...modelos.keys()].map(n => [n, conteudo(n)]));
    function criarModelo(nome, texto) {
      const m = monaco.editor.createModel(texto, LINGUAGEM[extensao(nome)] || 'plaintext', monaco.Uri.file('/' + nome));
      modelos.set(nome, m);
      return m;
    }
    Object.keys(salvo.arquivos).forEach(nome => {
      const texto = String(salvo.arquivos[nome] ?? '');
      if (ehImagem(nome) && texto.startsWith('data:image/')) imagens.set(nome, texto);
      else criarModelo(nome, texto);
    });
    if (!modelos.size) criarModelo('index.html', EXEMPLO['index.html']);
    let abertos = (salvo.abertos || []).filter(existe);
    let ativo = existe(salvo.ativo) ? salvo.ativo : (abertos[0] || nomes()[0]);
    if (!abertos.includes(ativo)) abertos.push(ativo);

    // ---------- Autocomplete e documentação ----------
    // O TypeScript do Monaco enxerga TODOS os .js do projeto (como no
    // navegador, onde os scripts dividem as variáveis globais): uma função
    // criada em funcoes.js aparece no autocomplete do script.js.
    const ts = monaco.languages.typescript;
    if (ts) ts.javascriptDefaults.setEagerModelSync(true);
    if (window.PixelCodeAutocomplete) window.PixelCodeAutocomplete.registrar(monaco, { arquivos: listaArquivos });
    // Emmet no HTML: "ul>li*3" + Tab, "!" + Tab (página completa), etc.
    try { if (window.emmetMonaco) window.emmetMonaco.emmetHTML(monaco, ['html']); } catch (e) {}
    // Documentação em português ao passar o mouse (shared/pixelcode-docs.js).
    // Registrada DEPOIS dos provedores do Monaco (que só entram quando cada
    // linguagem termina de carregar), para aparecer em cima da explicação em
    // inglês: espera o worker de JavaScript ficar pronto e dá uma folga para
    // HTML e CSS.
    if (window.PixelCodeDocs) {
      const js = ts && ts.getJavaScriptWorker ? ts.getJavaScriptWorker().catch(() => null) : Promise.resolve();
      Promise.all([js, new Promise(r => setTimeout(r, 1500))]).then(() => window.PixelCodeDocs.registrar(monaco));
    }

    // Autocompletar (checkbox da barra de cima, salvo no projeto). Ligado:
    // sugestões aparecem sozinhas, inclusive dentro de aspas (ids, classes,
    // arquivos), e Tab completa os atalhos. Desligado: nada aparece enquanto
    // digita — só se a pessoa pedir com Ctrl+Espaço. A documentação ao passar
    // o mouse continua nos dois casos.
    function opcoesSugestoes(ligado) {
      return {
        quickSuggestions: ligado ? { other: true, comments: false, strings: true } : false,
        suggestOnTriggerCharacters: ligado,
        acceptSuggestionOnEnter: ligado ? 'on' : 'off',
        tabCompletion: ligado ? 'on' : 'off',
        wordBasedSuggestions: ligado ? 'allDocuments' : 'off',
        parameterHints: { enabled: ligado, cycle: true },
      };
    }

    const editor = monaco.editor.create(document.getElementById('editor'), {
      model: modelos.get(ativo) || modelos.values().next().value,
      theme: 'vs-dark',
      fontFamily: "'JetBrains Mono', monospace",
      fontSize: 13,
      minimap: { enabled: false },
      automaticLayout: true,
      scrollBeyondLastLine: false,
      tabSize: 2,
      quickSuggestionsDelay: 10,
      suggestSelection: 'recentlyUsedByPrefix',
      suggest: { preview: true, localityBonus: true, shareSuggestSelections: true, showStatusBar: true },
      ...opcoesSugestoes(estado.sugestoes),
      linkedEditing: true,
      bracketPairColorization: { enabled: true },
      guides: { bracketPairs: 'active' },
    });

    const consoleBody = document.getElementById('consoleBody');
    const preview = document.getElementById('preview');
    const runner = document.getElementById('runner');
    const expLista = document.getElementById('expLista');
    const abasEl = document.getElementById('abas');
    const statusSalvo = document.getElementById('statusSalvo');
    let mapaLinhas = [], timerAuto = 0, timerSalvar = 0, avisouCheio = false;
    // O contentWindow de um <iframe> continua o mesmo entre recarregamentos:
    // só aceita mensagens do quadro do modo ativo.
    const quadroAtivo = () => (estado.modo === 'web' ? preview : runner).contentWindow;

    function gravar() {
      clearTimeout(timerSalvar);
      const arquivos = {};
      nomes().forEach(n => { arquivos[n] = conteudo(n); });
      try {
        localStorage.setItem(CHAVE, JSON.stringify({
          modo: estado.modo, auto: estado.auto, sugestoes: estado.sugestoes, pagina: estado.pagina, scriptJs: estado.scriptJs,
          explorador: estado.explorador, ativo, abertos, arquivos,
        }));
        statusSalvo.textContent = '✓ salvo';
        statusSalvo.classList.remove('pendente');
      } catch (e) {
        statusSalvo.textContent = '⚠ não salvou';
        if (!avisouCheio) { avisouCheio = true; logLine('Não foi possível salvar: o espaço do navegador acabou. Apague ou diminua algum arquivo grande.', 'warn'); }
      }
    }
    function salvar() {
      statusSalvo.textContent = 'salvando…';
      statusSalvo.classList.add('pendente');
      clearTimeout(timerSalvar);
      timerSalvar = setTimeout(gravar, 400);
    }

    function logLine(text, type, destino) {
      const empty = consoleBody.querySelector('.empty');
      if (empty) empty.remove();
      const line = document.createElement('div');
      line.className = 'line ' + (type || 'log');
      line.textContent = text;
      if (destino && modelos.has(destino.arquivo)) {
        line.classList.add('ir');
        line.title = 'Clique para ir até a linha';
        line.addEventListener('click', () => irPara(destino.arquivo, destino.linha));
      }
      consoleBody.appendChild(line);
      consoleBody.scrollTop = consoleBody.scrollHeight;
    }
    function clearConsole() {
      consoleBody.innerHTML = '<div class="empty">Nada executado ainda. Escreva um código e clique em "Executar".</div>';
    }
    function irPara(arquivo, linha) {
      abrir(arquivo);
      editor.revealLineInCenter(linha);
      editor.setPosition({ lineNumber: linha, column: 1 });
      editor.focus();
    }

    // ---------- Montagem da página ----------
    function paginaAtual() {
      return modelos.has(estado.pagina) && ehHtml(estado.pagina) ? estado.pagina : (nomes().find(ehHtml) || '');
    }
    function scriptAtual() {
      if (ehJs(ativo)) return ativo;
      return modelos.has(estado.scriptJs) && ehJs(estado.scriptJs) ? estado.scriptJs : (nomes().find(ehJs) || '');
    }

    // Embute no .html os link/script (com src) que apontam pra arquivos do
    // projeto. Devolve { doc, mapa, avisos }.
    function montarPagina(nome, comPonte) {
      const html = conteudo(nome);
      const b = construtor();
      const avisos = [];
      const deProjeto = url => {
        if (!url || externo(url)) return null;
        const n = limparUrl(url);
        if (modelos.has(n)) return n;
        avisos.push(`"${url}" não existe no projeto (${nome}).`);
        return null;
      };
      let pos = 0;
      const pImg = ponteImagens(Object.fromEntries(imagens));
      if (comPonte || pImg) {
        // A ponte precisa rodar antes de qualquer outro script.
        const m = html.match(/<head\b[^>]*>/i) || html.match(/<html\b[^>]*>/i) || html.match(/<!doctype[^>]*>/i);
        pos = m ? m.index + m[0].length : 0;
        b.add(trocarImagens(html.slice(0, pos)), nome, 1);
        b.add('\n' + (comPonte ? ponte(arquivosTexto()) + '\n' : '') + (pImg ? pImg + '\n' : ''), null);
      }
      // (o "<!" + "--" vai escapado: escrito junto aqui dentro, ele quebraria o script desta página)
      const re = /<!\-\-[\s\S]*?\-\->|<link\b[^>]*>|<\x73cript\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
      re.lastIndex = pos;
      let m;
      while ((m = re.exec(html))) {
        b.add(trocarImagens(html.slice(pos, m.index)), nome, linhaEm(html, pos));
        const tag = m[0], aqui = linhaEm(html, m.index);
        pos = re.lastIndex;
        if (tag.startsWith('<!\-\-')) { b.add(tag, nome, aqui); continue; }
        if (/^<link/i.test(tag)) {
          const css = /stylesheet/i.test(lerAttr(tag, 'rel') || '') && deProjeto(lerAttr(tag, 'href'));
          if (css) b.add(`<style data-arquivo="${css}">\n${trocarImagens(conteudo(css))}\n</style>`, null);
          else b.add(trocarImagens(tag), nome, aqui);
          continue;
        }
        const abre = '<script' + m[1] + '>';
        const tipo = (lerAttr(abre, 'type') || '').toLowerCase();
        const codigoJs = !tipo || /javascript|module/.test(tipo);
        const src = lerAttr(abre, 'src');
        if (src) {
          const js = deProjeto(src);
          if (!js) { b.add(tag, nome, aqui); continue; }
          const resto = m[1].replace(/\s+src\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/i, '');
          b.add(`<script${resto} data-arquivo="${js}">\n`, null);
          b.add(fecharScript(comPonte && codigoJs ? protegerLacos(conteudo(js)) : conteudo(js)), js, 1);
          b.add('\n<\/script>', null);
        } else {
          b.add(comPonte && codigoJs ? abre + protegerLacos(m[2]) + '<\/script>' : tag, nome, aqui);
        }
      }
      b.add(trocarImagens(html.slice(pos)), nome, linhaEm(html, pos));
      return Object.assign(b.fim(), { avisos });
    }
    // Imagem do projeto escrita direto no HTML/CSS (atributo src/href ou
    // url(...) do CSS): troca o nome pela imagem guardada. Não muda o número
    // de linhas.
    function trocarImagens(texto) {
      if (!imagens.size || !texto) return texto;
      const dado = u => (!u || externo(u) ? null : imagens.get(limparUrl(u)) || null);
      return texto
        .replace(/(\s(?:src|href)\s*=\s*)(["'])([^"']*)\2/gi, (t, a, q, u) => { const d = dado(u); return d ? a + q + d + q : t; })
        .replace(/url\(\s*(["']?)([^"')]+)\1\s*\)/gi, (t, q, u) => { const d = dado(u.trim()); return d ? `url("${d}")` : t; });
    }

    function montarScript(nome) {
      const b = construtor();
      b.add(`<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="UTF-8">\n${ponte(arquivosTexto())}\n${ponteImagens(Object.fromEntries(imagens))}\n</head>\n<body>\n<script>\n`, null);
      b.add(fecharScript(protegerLacos(conteudo(nome))), nome, 1);
      b.add('\n<\/script>\n</body>\n</html>\n', null);
      return b.fim();
    }

    // Mensagens do <iframe> (só aceita as do quadro que está rodando agora).
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (!d || !d.pixelcode || ev.source !== quadroAtivo()) return;
      if (d.tipo === 'navegar') {
        if (modelos.has(d.arquivo)) { estado.pagina = d.arquivo; salvar(); executar(); }
        else logLine(`O link aponta para "${d.arquivo}", que não existe no projeto.`, 'warn');
      } else if (d.tipo === 'erro') {
        const onde = d.linha ? traduzirLinha(mapaLinhas, d.linha) : null;
        logLine(`${d.texto}${onde ? ` (${onde.arquivo}, linha ${onde.linha})` : ''}`, 'error', onde);
      } else {
        logLine(d.texto, d.tipo === 'warn' ? 'warn' : d.tipo === 'error' ? 'error' : d.tipo === 'info' ? 'info' : 'log');
      }
    });

    function executar() {
      clearConsole();
      consoleBody.innerHTML = '';
      if (estado.modo === 'web') {
        const pag = paginaAtual();
        document.getElementById('navUrl').textContent = 'pixelcode://' + (pag || '');
        if (!pag) { preview.srcdoc = ''; logLine('Crie um arquivo .html (ex.: index.html) para ver a página no navegador.', 'warn'); return; }
        const m = montarPagina(pag, true);
        mapaLinhas = m.mapa;
        m.avisos.forEach(a => logLine(a, 'warn'));
        preview.srcdoc = m.doc;
        renderExplorador();
      } else {
        const js = scriptAtual();
        if (!js) { logLine('Crie um arquivo .js para rodar no modo "Só JavaScript".', 'warn'); return; }
        estado.scriptJs = js;
        const m = montarScript(js);
        mapaLinhas = m.mapa;
        runner.onload = () => setTimeout(() => {
          if (!consoleBody.children.length) logLine(`${js} executado sem erros — nada foi exibido (use console.log(...)).`, 'info');
        }, 80);
        runner.srcdoc = m.doc;
        renderExplorador();
      }
    }
    function autoExecutar() {
      if (estado.modo === 'web' && estado.auto) { clearTimeout(timerAuto); timerAuto = setTimeout(executar, 600); }
    }

    // ---------- Explorador e abas ----------
    function icone(nome) {
      const [txt, cls] = ICONE[extensao(nome)] || ['•', 'outro'];
      return `<span class="ico ico-${cls}">${txt}</span>`;
    }
    const escHtml = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function renderExplorador() {
      const roda = estado.modo === 'web' ? paginaAtual() : scriptAtual();
      expLista.innerHTML = nomes().map(n => `
        <li class="arq${n === ativo ? ' ativo' : ''}" data-nome="${escHtml(n)}" title="${escHtml(n)}">
          ${icone(n)}<span class="nome">${escHtml(n)}</span>${n === roda ? '<span class="roda" title="É este arquivo que roda">▶</span>' : ''}
          <span class="acoes">
            <button type="button" data-acao="renomear" title="Renomear">✎</button>
            <button type="button" data-acao="baixar" title="Baixar este arquivo">⬇</button>
            <button type="button" data-acao="apagar" title="Apagar">✕</button>
          </span>
        </li>`).join('');
    }
    function renderAbas() {
      abasEl.innerHTML = `<button type="button" class="toggle-exp" data-acao="explorador" title="Mostrar/esconder os arquivos">☰</button>` +
        abertos.map(n => `<button type="button" role="tab" class="${n === ativo ? 'ativa' : ''}" data-nome="${escHtml(n)}">${icone(n)}${escHtml(n)}${abertos.length > 1 ? '<span class="fechar" data-acao="fechar" title="Fechar">×</span>' : ''}</button>`).join('');
      const a = abasEl.querySelector('.ativa');
      if (a) a.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
    function render() { renderExplorador(); renderAbas(); }

    // Imagem aberta: no lugar do editor, mostra a imagem ampliada (pixel art
    // de 32×32 sumiria na tela) e o nome que vai no código.
    const imagemVista = document.getElementById('imagemVista');
    const imagemVistaImg = document.getElementById('imagemVistaImg');
    const imagemVistaInfo = document.getElementById('imagemVistaInfo');
    function mostrarVista() {
      const dado = imagens.get(ativo);
      document.getElementById('editor').hidden = !!dado;
      imagemVista.hidden = !dado;
      if (!dado) return;
      const nome = ativo;
      imagemVistaImg.onload = () => {
        const w = imagemVistaImg.naturalWidth, h = imagemVistaImg.naturalHeight;
        const zoom = Math.max(1, Math.floor(256 / Math.max(w, h, 1)));
        imagemVistaImg.style.width = (w * zoom) + 'px';
        imagemVistaInfo.innerHTML = `<b>${escHtml(nome)}</b> · ${w}×${h} pixels${zoom > 1 ? ` · ampliada ${zoom}×` : ''}<br>`
          + `No código, use o nome do arquivo: <code>'${escHtml(nome)}'</code>`;
      };
      imagemVistaImg.src = dado;
      imagemVistaImg.alt = nome;
    }

    function abrir(nome) {
      if (!existe(nome)) return;
      if (modelos.has(ativo)) vistas[ativo] = editor.saveViewState();
      if (!abertos.includes(nome)) abertos.push(nome);
      ativo = nome;
      if (modelos.has(nome)) {
        editor.setModel(modelos.get(nome));
        if (vistas[nome]) editor.restoreViewState(vistas[nome]);
      }
      mostrarVista();
      const trocouPagina = ehHtml(nome) && estado.pagina !== nome;
      if (ehHtml(nome)) estado.pagina = nome;
      if (ehJs(nome)) estado.scriptJs = nome;
      render();
      salvar();
      if (estado.modo === 'web' && trocouPagina) executar();
      if (modelos.has(nome)) editor.focus();
    }
    function fecharAba(nome) {
      if (abertos.length <= 1) return;
      const i = abertos.indexOf(nome);
      abertos = abertos.filter(n => n !== nome);
      if (nome === ativo) abrir(abertos[Math.min(i, abertos.length - 1)]);
      else { renderAbas(); salvar(); }
    }

    function validarNome(nome, atual) {
      if (!nome) return 'Digite um nome.';
      if (!/^[\p{L}\p{N}_\-.]+$/u.test(nome)) return 'Use só letras, números, "-", "_" e "." (sem espaços nem barras).';
      if (nome.startsWith('.')) return 'O nome não pode começar com ponto.';
      if (nome.length > 60) return 'Nome muito comprido.';
      if (nomes().some(n => n.toLowerCase() === nome.toLowerCase() && n !== atual)) return 'Já existe um arquivo com esse nome.';
      return '';
    }
    const comExtensao = nome => (/\.[^.]+$/.test(nome) ? nome : nome + '.js');

    // Campo de nome dentro da lista (novo arquivo ou renomear).
    function pedirNome(li, inicial, aoConfirmar) {
      li.innerHTML = `${icone(inicial || 'x.js')}<input type="text" spellcheck="false" autocomplete="off" placeholder="nome.js">`;
      const input = li.querySelector('input');
      let erroEl = null, feito = false;
      input.value = inicial;
      li.after(erroEl = Object.assign(document.createElement('div'), { className: 'arq-erro' }));
      const fim = () => { feito = true; erroEl.remove(); };
      const confirmar = () => {
        const nome = comExtensao(input.value.trim());
        const erro = input.value.trim() ? aoConfirmar.validar(nome) : '';
        if (!input.value.trim()) { fim(); renderExplorador(); return true; }
        if (erro) { input.classList.add('invalido'); erroEl.textContent = erro; return false; }
        fim(); aoConfirmar.ok(nome); return true;
      };
      input.addEventListener('input', () => { input.classList.remove('invalido'); erroEl.textContent = ''; li.querySelector('.ico').outerHTML = icone(comExtensao(input.value || 'x')); });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); confirmar(); }
        else if (e.key === 'Escape') { fim(); renderExplorador(); editor.focus(); }
      });
      input.addEventListener('blur', () => { if (!feito && !confirmar()) { fim(); renderExplorador(); } });
      input.focus();
      // Seleciona só o nome, sem a extensão (como no VS Code).
      const ponto = inicial.lastIndexOf('.');
      input.setSelectionRange(0, ponto > 0 ? ponto : inicial.length);
    }

    function novoArquivo() {
      if (!estado.explorador) { estado.explorador = true; aplicarExplorador(); }
      const li = document.createElement('li');
      li.className = 'arq';
      expLista.prepend(li);
      pedirNome(li, '', {
        validar: n => validarNome(n) || (ehImagem(n) ? 'Imagem não se cria aqui: importe o arquivo pelo botão ⤒ (ou arraste para cá).' : ''),
        ok: nome => {
          criarModelo(nome, ehHtml(nome) ? paginaCom('  ') : '');
          abrir(nome);
          if (ehHtml(nome)) editor.setPosition({ lineNumber: 9, column: 3 });
        },
      });
    }

    function renomear(antigo) {
      const li = [...expLista.children].find(el => el.dataset.nome === antigo);
      if (!li) return;
      const img = ehImagem(antigo);
      pedirNome(li, antigo, {
        validar: n => validarNome(n, antigo) || (ehImagem(n) === img ? ''
          : img ? 'A imagem precisa continuar com extensão de imagem (.png, .jpg, .gif ou .webp).'
            : 'Para ter uma imagem no projeto, importe o arquivo pelo botão ⤒.'),
        ok: novo => {
          if (novo === antigo) { renderExplorador(); return; }
          abertos = abertos.map(n => (n === antigo ? novo : n));
          if (img) {
            // Mantém a ordem do mapa (e assim a do arquivo salvo).
            const entradas = [...imagens].map(([n, d]) => (n === antigo ? [novo, d] : [n, d]));
            imagens.clear(); entradas.forEach(([n, d]) => imagens.set(n, d));
            if (ativo === antigo) { ativo = novo; mostrarVista(); }
          } else {
            const velho = modelos.get(antigo);
            const m = monaco.editor.createModel(velho.getValue(), LINGUAGEM[extensao(novo)] || 'plaintext', monaco.Uri.file('/' + novo));
            const entradas = [...modelos].map(([n, mod]) => (n === antigo ? [novo, m] : [n, mod]));
            modelos.clear(); entradas.forEach(([n, mod]) => modelos.set(n, mod));
            if (estado.pagina === antigo) estado.pagina = novo;
            if (estado.scriptJs === antigo) estado.scriptJs = novo;
            if (vistas[antigo]) { vistas[novo] = vistas[antigo]; delete vistas[antigo]; }
            if (ativo === antigo) { ativo = novo; editor.setModel(m); if (vistas[novo]) editor.restoreViewState(vistas[novo]); }
            velho.dispose();
          }
          render(); salvar(); autoExecutar();
          // Avisa se outro arquivo ainda aponta para o nome antigo.
          const usam = [...modelos.keys()].filter(n => n !== novo && conteudo(n).includes(antigo));
          if (usam.length) logLine(`Renomeado para ${novo}. Atenção: ${usam.join(', ')} ainda cita "${antigo}" — troque lá também.`, 'warn');
        },
      });
    }

    function apagar(nome) {
      if (modelos.has(nome) && modelos.size <= 1) { logLine('O projeto precisa ter pelo menos um arquivo.', 'warn'); return; }
      if (!confirm(`Apagar "${nome}"? Não dá para desfazer.`)) return;
      const m = modelos.get(nome);
      modelos.delete(nome);
      imagens.delete(nome);
      abertos = abertos.filter(n => n !== nome);
      delete vistas[nome];
      if (ativo === nome) {
        const prox = abertos[0] || nomes()[0];
        if (!abertos.length) abertos.push(prox);
        ativo = '';
        abrir(prox);
      } else render();
      if (m) m.dispose();
      salvar(); autoExecutar();
    }

    function baixarArquivo(nome) {
      if (!imagens.has(nome)) return baixarTexto(conteudo(nome), nome);
      const a = document.createElement('a');
      a.href = imagens.get(nome);
      a.download = nome;
      document.body.appendChild(a); a.click(); a.remove();
    }

    function baixarTexto(texto, nome) {
      const blob = new Blob([texto], { type: (TIPO_MIME[extensao(nome)] || 'text/plain') + ';charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = nome;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }

    function importar(arquivos) {
      const lista = [...arquivos];
      let ultimo = '';
      Promise.all(lista.map(f => new Promise(ok => {
        const nome = f.name.replace(/\s+/g, '-');
        if (validarNome(nome, nome)) { logLine(`"${f.name}" não foi importado: ${validarNome(nome, nome)}`, 'warn'); return ok(); }
        const img = ehImagem(nome);
        if (img && f.size > IMAGEM_MAX) { logLine(`"${f.name}" é grande demais para uma imagem do projeto (máx. 300 KB). Exporte num tamanho menor.`, 'warn'); return ok(); }
        if (f.size > 1024 * 1024) { logLine(`"${f.name}" é grande demais (máx. 1 MB).`, 'warn'); return ok(); }
        const leitor = new FileReader();
        leitor.onload = () => {
          const texto = String(leitor.result);
          if (img && !texto.startsWith('data:image/')) { logLine(`"${f.name}" não parece ser uma imagem.`, 'warn'); return ok(); }
          const existente = nomes().find(n => n.toLowerCase() === nome.toLowerCase());
          if (existente) {
            if (!confirm(`Já existe "${existente}". Substituir pelo arquivo importado?`)) return ok();
            if (img) imagens.set(existente, texto);
            else modelos.get(existente).setValue(texto);
            ultimo = existente;
          } else {
            if (img) imagens.set(nome, texto); else criarModelo(nome, texto);
            ultimo = nome;
          }
          ok();
        };
        leitor.onerror = () => { logLine(`Não foi possível ler "${f.name}".`, 'warn'); ok(); };
        if (img) leitor.readAsDataURL(f); else leitor.readAsText(f);
      }))).then(() => { if (ultimo) abrir(ultimo); render(); salvar(); autoExecutar(); });
    }

    function aplicarExplorador() {
      document.getElementById('explorador').hidden = !estado.explorador;
    }

    function trocarModo(modo) {
      estado.modo = modo;
      document.getElementById('modoWeb').classList.toggle('ativo', modo === 'web');
      document.getElementById('modoJs').classList.toggle('ativo', modo === 'js');
      document.getElementById('navegador').hidden = modo !== 'web';
      document.getElementById('autoWrap').style.display = modo === 'web' ? '' : 'none';
      document.getElementById('lado').classList.toggle('so-js', modo !== 'web');
      document.getElementById('subtitulo').textContent = modo === 'web' ? 'editor + navegador (HTML, CSS e JS)' : 'editor + console de JavaScript';
      // No modo JS, deixa aberto o .js que vai rodar.
      if (modo === 'js' && !ehJs(ativo)) { const js = scriptAtual(); if (js) abrir(js); }
      render();
      salvar();
      if (modo === 'web') executar(); else clearConsole();
    }

    function baixar() {
      if (estado.modo === 'web') {
        const pag = paginaAtual();
        if (pag) baixarTexto(montarPagina(pag, false).doc, pag);
      } else if (scriptAtual()) baixarTexto(conteudo(scriptAtual()), scriptAtual());
    }

    // Nova aba: a página continua dentro de um <iframe sandbox>, em tela
    // cheia — assim ela também não enxerga o portal.
    function novaAba() {
      const pag = paginaAtual();
      if (!pag) return;
      const m = montarPagina(pag, true);
      const w = window.open('', '_blank');
      if (!w) { logLine('O navegador bloqueou a nova aba. Permita pop-ups para este site.', 'warn'); return; }
      const attr = m.doc.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>PixelCode — ${escHtml(pag)}</title><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe sandbox="allow-scripts allow-modals allow-forms allow-popups" srcdoc="${attr}"></iframe></body></html>`);
      w.document.close();
    }

    // ---------- Eventos ----------
    editor.onDidChangeModelContent(() => { salvar(); autoExecutar(); });

    expLista.addEventListener('click', e => {
      const li = e.target.closest('.arq[data-nome]');
      if (!li || e.target.closest('input')) return;
      const nome = li.dataset.nome, acao = e.target.closest('[data-acao]');
      // Clicar no arquivo que já está aberto não redesenha a lista: senão o
      // 2º clique de um duplo clique cai num item que já saiu da tela e o
      // dblclick (renomear) nunca chega aqui.
      if (!acao) { if (nome === ativo) { if (modelos.has(nome)) editor.focus(); } else abrir(nome); return; }
      e.stopPropagation();
      if (acao.dataset.acao === 'renomear') renomear(nome);
      else if (acao.dataset.acao === 'apagar') apagar(nome);
      else if (acao.dataset.acao === 'baixar') baixarArquivo(nome);
    });
    expLista.addEventListener('dblclick', e => {
      const li = e.target.closest('.arq[data-nome]');
      if (li && !e.target.closest('[data-acao], input')) renomear(li.dataset.nome);
    });
    abasEl.addEventListener('click', e => {
      const acao = e.target.closest('[data-acao]');
      if (acao && acao.dataset.acao === 'explorador') { estado.explorador = !estado.explorador; aplicarExplorador(); salvar(); return; }
      const aba = e.target.closest('[data-nome]');
      if (!aba) return;
      if (acao && acao.dataset.acao === 'fechar') fecharAba(aba.dataset.nome);
      else abrir(aba.dataset.nome);
    });
    // Botão do meio fecha a aba (como nos navegadores).
    abasEl.addEventListener('auxclick', e => { const aba = e.target.closest('[data-nome]'); if (aba && e.button === 1) fecharAba(aba.dataset.nome); });

    document.getElementById('btnNovoArq').addEventListener('click', novoArquivo);
    const inputImportar = document.getElementById('inputImportar');
    document.getElementById('btnImportar').addEventListener('click', () => inputImportar.click());
    inputImportar.addEventListener('change', () => { if (inputImportar.files.length) importar(inputImportar.files); inputImportar.value = ''; });
    // Arrastar arquivos do computador para cima do explorador também importa.
    const exp = document.getElementById('explorador');
    exp.addEventListener('dragover', e => { e.preventDefault(); });
    exp.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) importar(e.dataTransfer.files); });

    document.querySelectorAll('.modo button').forEach(b => b.addEventListener('click', () => trocarModo(b.dataset.modo)));
    const chkAuto = document.getElementById('chkAuto');
    chkAuto.checked = estado.auto;
    chkAuto.addEventListener('change', () => { estado.auto = chkAuto.checked; salvar(); });
    const chkSugestoes = document.getElementById('chkSugestoes');
    chkSugestoes.checked = estado.sugestoes;
    chkSugestoes.addEventListener('change', () => {
      estado.sugestoes = chkSugestoes.checked;
      editor.updateOptions(opcoesSugestoes(estado.sugestoes));
      editor.trigger('pixelcode', 'hideSuggestWidget', {});
      salvar();
      editor.focus();
    });
    document.getElementById('btnRun').addEventListener('click', executar);
    document.getElementById('btnAtualizar').addEventListener('click', executar);
    document.getElementById('btnNovaAba').addEventListener('click', novaAba);
    document.getElementById('btnBaixar').addEventListener('click', baixar);
    document.getElementById('btnClear').addEventListener('click', clearConsole);
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, executar);
    // Ctrl+S: salva na hora (e não abre o "Salvar página" do navegador).
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, gravar);
    window.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); gravar(); } });
    // Comentar linhas: Ctrl+/ do Monaco, mais as teclas do teclado brasileiro
    // (ABNT2: a tecla "/" ao lado do Shift direito chega como ABNT_C1) e Ctrl+;.
    const comentar = () => editor.trigger('teclado', 'editor.action.commentLine', null);
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.ABNT_C1, comentar);
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Semicolon, comentar);
    // Alt+N: novo arquivo.
    editor.addCommand(monaco.KeyMod.Alt | monaco.KeyCode.KeyN, novoArquivo);
    window.addEventListener('beforeunload', gravar);

    aplicarExplorador();
    mostrarVista();
    trocarModo(estado.modo);
    editor.focus();
    window.__pixelcode = { editor, modelos, imagens, importar, executar, trocarModo, abrir, montarPagina }; // usado só para testes manuais
  });
</script>

</body>
</html>
