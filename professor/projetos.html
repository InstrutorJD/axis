<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- App instalável (manifest.json na raiz) e ícone do Axis (shared/assets/app/). -->
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/svg+xml" href="../shared/assets/app/icone.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/assets/app/favicon-32.png">
<link rel="apple-touch-icon" href="../shared/assets/app/apple-touch-icon.png">
<meta name="theme-color" content="#0b0e12">
<meta name="apple-mobile-web-app-title" content="Axis">
<title>Axis — Projetos</title>

<!-- Caderno de projetos do professor: ideias, pesquisas e links de
     referência, com fixar e arquivar. SÓ o professor: aluno e substituto
     voltam pro login/painel (e no banco cada linha é do próprio professor —
     sql/professor-projetos.sql). Lógica em shared/projetos.js, visual em
     shared/projetos.css. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../shared/professor.css">
<link rel="stylesheet" href="../shared/projetos.css">

<script src="../shared/supabase-config.js"></script>
<script src="../shared/vendor/supabase.js"></script>
<script src="../shared/session.js"></script>
<script src="../shared/axis-logo.js"></script>
<script src="../shared/projetos.js"></script>
</head>
<body class="pj-body">

<header class="pr-topbar">
  <div class="pj-topo-titulo">
    <span data-axis-logo>Axis</span>
  </div>
  <div class="pr-usuario pj-topo-acoes">
    <span class="pr-usuario-nome" id="sessionUser"></span>
    <a class="btn btn-ghost" href="painel.html">Painel</a>
  </div>
</header>

<div id="projetos" class="pj-app"></div>

<script>
(async function () {
  const currentUser = await window.PortalSession.requireUser('../index.html');
  if (!currentUser) return;
  // Só o professor (o substituto aparece como professor na tela, mas não
  // entra aqui).
  if (currentUser.role !== 'professor' || currentUser.substituto) {
    window.location.href = currentUser.substituto ? 'painel.html' : '../index.html';
    return;
  }
  document.getElementById('sessionUser').textContent = currentUser.nome;
  window.Projetos.montar(document.getElementById('projetos'), window.PortalSession.client());
})();
</script>

</body>
</html>
