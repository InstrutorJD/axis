<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- App instalável (manifest.json na raiz) e ícone do Axis (shared/assets/app/). -->
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/svg+xml" href="../shared/assets/app/icone.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/assets/app/favicon-32.png">
<link rel="apple-touch-icon" href="../shared/assets/app/apple-touch-icon.png">
<meta name="theme-color" content="#0b0e12">
<meta name="apple-mobile-web-app-title" content="Axis">
<title>Axis — Painel do Professor</title>

<!-- Launcher do professor: só escolhe a turma. Chamada, notas, liberação de
     jogos e bloqueio de Ctrl+C/V vivem dentro do portal de cada turma
     (aba "Gestão", só visível pro professor) — ver shared/platform-core.js.
     Visual: shared/professor.css (moderno, sem tema de jogo). -->
<link rel="stylesheet" href="../shared/professor.css">
<link rel="stylesheet" href="../shared/professor-agenda.css">
<link rel="stylesheet" href="../shared/painel-layout.css">
<style>
  /* Modal do arquivo de lançamento (shared/lancamento.js). */
  .pr-btn-telao svg{ width:16px; height:16px; }
  @media (max-width:600px){ .pr-btn-telao span{ display:none; } }
  .lanc-titulo{ margin:0 0 4px; font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .lanc-semana{ display:flex; align-items:center; gap:8px; }
  .lanc-semana .btn{ width:38px; height:38px; padding:0; font-size:18px; }
  .lanc-intervalo{ margin-top:8px; font-size:15px; font-weight:600; }
  .lanc-turmas{ display:flex; flex-direction:column; gap:8px; }
  .lanc-turma{
    display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer;
    border:1px solid var(--pr-border); border-radius:var(--pr-radius-sm); font-size:15px; font-weight:500;
  }
  .lanc-turma:has(input:checked){ border-color:var(--pr-accent); background:var(--pr-accent-soft); }
  .lanc-acoes{ display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .lanc-acoes .status-msg{ margin-right:auto; word-break:break-all; }
  .lanc-erro{ margin-top:12px; padding:12px 14px; border-radius:var(--pr-radius-sm); background:var(--pr-danger-soft); color:var(--pr-danger); font-size:14px; }
  .lanc-erro-texto{ color:var(--pr-danger); }
  .lanc-resumo{ margin-top:20px; padding-top:16px; border-top:1px solid var(--pr-border); font-size:14px; }
  .lanc-resumo > p{ margin:12px 0 4px; }
  .lanc-lista{ margin:4px 0 8px; padding-left:20px; font-size:13px; max-height:180px; overflow-y:auto; }
</style>

<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/session.js"></script>
<!-- Só pelo campo codigoTurma, usado no arquivo de lançamento. -->
<script src="../turmas/jogos/config.js"></script>
<script src="../turmas/sistemas/config.js"></script>
<script src="../shared/lancamento.js"></script>
<script src="../shared/professor-fx.js"></script>
<script src="../shared/axis-logo.js"></script>
<script src="../shared/frases-estoicas.js"></script>
<script src="../shared/professor-agenda.js"></script>
<script src="../shared/painel-layout.js"></script>
</head>
<body>

<header class="pr-topbar">
  <div class="pr-marca"><span data-axis-logo>Axis</span></div>
  <div class="pr-usuario">
    <!-- Telão: janela separada (relógio, link do portal e banheiro) pra
         arrastar pra TV/monitor estendido — professor/telao.html. -->
    <button id="btnTelao" class="btn btn-ghost pr-btn-telao" type="button" title="Abrir o telão da sala numa janela separada, pra projetar na TV"
      onclick="window.open('telao.html', 'axis-telao', 'popup,width=1280,height=720')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
      <span>Telão</span>
    </button>
    <button id="btnPersonalizar" class="btn btn-ghost pr-btn-personalizar" type="button" aria-pressed="false" title="Mudar os cartões de lugar e de tamanho">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      <span>Personalizar</span>
    </button>
    <span class="pr-usuario-nome" id="sessionUser"></span>
    <button id="btnLogout" class="btn btn-ghost" type="button">Sair</button>
  </div>
</header>

<main class="pr-main pr-main-livre app-container">

  <!-- Tudo do painel (relógio e cartões) fica numa área livre da largura da
       tela, que o professor arruma do jeito que quiser: arrastar pra qualquer
       lugar, esticar pelo canto e ocultar (botão "Personalizar" no topo) —
       shared/painel-layout.js. Posição padrão no HTML, numa grade de 12
       colunas: data-x (coluna, 0 a 11), data-w (largura) e data-min (largura
       mínima); a altura sai do conteúdo e quem vem depois desce. No celular a
       grade é de 4 colunas: data-w-celular (padrão 2, dois por linha) e
       data-min-celular.

       IP do jogo do hacker (GitHack OS) é diferente por turma: cada linha de
       network_nodes pertence a uma turma só, então o professor precisa de
       um nó próprio em cada subnet (192.168.1.254 em Jogos, 192.168.2.254
       em Sistemas) pra aparecer no netscan dos alunos da turma que estiver
       jogando — ver sql/supabase-setup-completo.sql (bloco 6b). -->
  <section class="pr-secao">
    <div class="pr-painel" id="painelGrade">
      <div class="pr-bloco" data-bloco="relogio" data-nome="Relógio e frase" data-x="3" data-w="6" data-min="3" data-w-celular="4">
      <!-- Saudação, relógio, data e uma frase estoica que troca sozinha
           (shared/frases-estoicas.js). -->
      <section class="pr-hero">
        <div class="pr-relogio" id="relogio" aria-label="Hora atual">--:--</div>
        <p class="pr-saudacao"><span id="saudacao">Olá</span><span class="pr-hero-sep" aria-hidden="true">·</span><span id="dataHoje"></span></p>
        <figure class="pr-frase" id="frase" aria-live="polite">
          <blockquote id="fraseTexto"></blockquote>
          <figcaption id="fraseAutor"></figcaption>
        </figure>
      </section>
      </div>
      <div class="pr-bloco" data-bloco="jogos" data-nome="Jogos Digitais" data-x="3" data-w="3" data-min="2">
        <button type="button" class="pr-card turma-card cor-violeta" onclick="window.PortalSession.abrirPagina('../turmas/jogos/plataforma.html')">
          <span class="pr-card-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg>
          </span>
          <span class="pr-card-nome">Jogos Digitais</span>
        </button>
      </div>
      <div class="pr-bloco" data-bloco="sistemas" data-nome="Desenvolvimento de Sistemas" data-x="6" data-w="3" data-min="2">
        <button type="button" class="pr-card turma-card cor-azul" onclick="window.PortalSession.abrirPagina('../turmas/sistemas/plataforma.html')">
          <span class="pr-card-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
          </span>
          <span class="pr-card-nome">Desenvolvimento de Sistemas</span>
        </button>
      </div>
      <!-- Exporta a semana (conteúdo do FO + chamada) num CSV pro lançamento
           no SIAP/SENAI — shared/lancamento.js, base em data/conteudos.csv. -->
      <div class="pr-bloco" data-bloco="lancamento" data-nome="Lançamento" data-x="3" data-w="3" data-min="2">
        <button type="button" class="pr-card pr-card-ferramenta cor-verde" id="btnGerarLancamento" title="Gerar arquivo de lançamento (SIAP/SENAI)">
          <span class="pr-card-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
          </span>
          <span class="pr-card-nome">Lançamento</span>
        </button>
      </div>
      <!-- Aulas em slides a partir de um .md, pra projetar
           (professor/materiais.html, shared/slides-md.js). -->
      <div class="pr-bloco" data-bloco="materiais" data-nome="Criar Material" data-x="6" data-w="3" data-min="2">
        <button type="button" class="pr-card pr-card-ferramenta cor-laranja" onclick="window.PortalSession.abrirPagina('materiais.html')">
          <span class="pr-card-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/></svg>
          </span>
          <span class="pr-card-nome">Criar Material</span>
        </button>
      </div>
      <!-- Conhecimentos (notas conectadas, estilo Obsidian —
           professor/conhecimentos.html) e Projetos (caderno de ideias,
           pesquisas e links — professor/projetos.html). Só o professor: os
           dois somem pro substituto. -->
      <div class="pr-bloco" data-bloco="conhecimentos" data-nome="Conhecimentos" data-x="3" data-w="3" data-min="2">
        <button type="button" class="pr-card pr-card-ferramenta cor-rosa" onclick="window.PortalSession.abrirPagina('conhecimentos.html')">
          <span class="pr-card-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
          </span>
          <span class="pr-card-nome">Conhecimentos</span>
        </button>
      </div>
      <div class="pr-bloco" data-bloco="projetos" data-nome="Projetos" data-x="6" data-w="3" data-min="2">
        <button type="button" class="pr-card pr-card-ferramenta cor-ciano" onclick="window.PortalSession.abrirPagina('projetos.html')">
          <span class="pr-card-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M8 10v4"/><path d="M12 10v2"/><path d="M16 10v6"/></svg>
          </span>
          <span class="pr-card-nome">Projetos</span>
        </button>
      </div>
      <!-- Agenda: mini calendário que expande pra tela cheia (Mês/Semana),
           compromissos arrastáveis e lembretes com contador no sininho —
           shared/professor-agenda.js, tabela em sql/professor-agenda.sql. -->
      <div class="pr-bloco" data-bloco="agenda" data-nome="Agenda" data-x="3" data-w="6" data-min="4" data-w-celular="4" data-min-celular="4">
        <div id="agenda" aria-label="Agenda"></div>
      </div>
    </div>
  </section>
</main>

<script>
// Relógio, data e frases estoicas: começam já, antes do login terminar.
// A saudação é só "Bom dia/Boa tarde/Boa noite", sem o nome (pedido do
// professor).
function atualizarRelogio() {
  const agora = new Date();
  document.getElementById('relogio').textContent =
    agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const h = agora.getHours();
  const cumprimento = h < 5 ? 'Boa noite' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  document.getElementById('saudacao').textContent = cumprimento;
  const data = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('dataHoje').textContent = data.charAt(0).toUpperCase() + data.slice(1);
}
atualizarRelogio();
setInterval(atualizarRelogio, 1000);

(function () {
  const frases = window.FRASES_ESTOICAS || [];
  const caixa = document.getElementById('frase');
  if (frases.length === 0) { caixa.hidden = true; return; }
  const TROCA_MS = 15000;
  // Ordem embaralhada, sem repetir até passar por todas.
  let fila = [];
  function proxima() {
    if (fila.length === 0) fila = frases.map((_, i) => i).sort(() => Math.random() - 0.5);
    return frases[fila.pop()];
  }
  function mostrar(f) {
    document.getElementById('fraseTexto').textContent = `“${f.texto}”`;
    document.getElementById('fraseAutor').textContent = `— ${f.autor}`;
    caixa.title = f.fonte || '';
  }
  mostrar(proxima());
  // Com o mouse em cima, a frase não troca (dá tempo de ler até o fim).
  let pausada = false;
  caixa.addEventListener('pointerenter', () => { pausada = true; });
  caixa.addEventListener('pointerleave', () => { pausada = false; });
  setInterval(() => {
    if (pausada || document.hidden) return;
    caixa.classList.add('pr-frase-saindo');
    setTimeout(() => { mostrar(proxima()); caixa.classList.remove('pr-frase-saindo'); }, 400);
  }, TROCA_MS);
})();
</script>

<script>
(async function () {
  // Identidade real vem da sessão do Supabase Auth — quem não estiver
  // logado (ou não for professor) é mandado de volta pro login, igual já
  // acontece em shared/platform-core.js.
  const currentUser = await window.PortalSession.requireUser('../index.html');
  if (!currentUser) return;
  if (currentUser.role !== 'professor') {
    window.location.href = '../index.html';
    return;
  }

  document.getElementById('sessionUser').textContent = currentUser.nome;
  // Conhecimentos e Projetos são só do professor: o substituto nem vê os cartões.
  if (currentUser.substituto) document.querySelectorAll('[data-bloco="conhecimentos"], [data-bloco="projetos"]').forEach(b => b.remove());
  window.ProfessorAgenda.montar(document.getElementById('agenda'), window.PortalSession.client());
  window.PainelLayout.montar({
    grade: document.getElementById('painelGrade'),
    botao: document.getElementById('btnPersonalizar'),
    client: window.PortalSession.client(),
    email: currentUser.email,
  });

  document.getElementById('btnGerarLancamento').addEventListener('click', () => {
    const turmas = [window.TURMA_CONFIG_JOGOS, window.TURMA_CONFIG_SISTEMAS]
      .filter(c => c && c.codigoTurma)
      .map(c => ({ id: c.id, codigo: c.codigoTurma, label: c.label }));
    window.Lancamento.abrir({ urlBase: 'data/conteudos.csv', turmas });
  });

  document.getElementById('btnLogout').addEventListener('click', async () => {
    await window.PortalSession.signOut();
    window.location.href = '../index.html';
  });
})();
</script>

</body>
</html>
