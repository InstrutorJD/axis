<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../shared/assets/app/icone.svg">
<meta name="theme-color" content="#0b0e12">
<title>Axis — Telão</title>

<!-- Telão da sala: tela pra projetar na TV (monitor estendido) enquanto a
     turma faz atividade. Relógio, link do portal e se o
     banheiro está liberado. Aberta pelo botão "Telão" do painel
     (professor/painel.html), numa janela separada pra arrastar pra TV.
     Não precisa de login: não mostra nenhum dado de aluno.
     Horários do banheiro: HORARIOS_BANHEIRO abaixo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#0b0e12; --card:#141922; --borda:#232a36; --texto:#f3f5f8; --texto-2:#a7b0be; --texto-3:#6b7585;
    --ok:#22c55e; --nao:#ef4444;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; margin:0; }
  body{
    background:radial-gradient(1200px 700px at 15% 10%, #16202e 0%, var(--bg) 60%);
    color:var(--texto); font-family:Inter, system-ui, sans-serif; overflow:hidden;
    display:grid; grid-template-columns:1.25fr 1fr; gap:3vmin; padding:4vmin;
  }
  body.sem-cursor{ cursor:none; }

  /* Relógio */
  .relogio{ display:flex; flex-direction:column; justify-content:center; padding-left:2vmin; }
  .hora{ font-size:clamp(44px, 9vw, 180px); font-weight:800; line-height:.9; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .hora .seg{ font-size:.32em; font-weight:600; color:var(--texto-3); letter-spacing:0; margin-left:.15em; }
  .hora .pisca{ animation:pisca 1s steps(1) infinite; }
  @keyframes pisca{ 50%{ opacity:.25; } }
  .data{ margin-top:2vmin; font-size:clamp(15px, 1.8vw, 36px); font-weight:500; color:var(--texto-2); text-transform:capitalize; }

  /* Coluna da direita */
  .lado{ display:flex; flex-direction:column; gap:3vmin; min-height:0; }
  .cartao{ border:1px solid var(--borda); border-radius:3vmin; background:var(--card); padding:3.2vmin 3.6vmin; }

  /* Banheiro */
  .banheiro{ flex:1.15; display:flex; flex-direction:column; justify-content:center; gap:1.6vmin; position:relative; overflow:hidden;
    transition:border-color .6s ease, background .6s ease; }
  .banheiro::before{ content:''; position:absolute; inset:0; opacity:.16; background:radial-gradient(circle at 85% 20%, var(--cor) 0%, transparent 60%); transition:background .6s ease; }
  .banheiro > *{ position:relative; }
  .banheiro.liberado{ --cor:var(--ok); border-color:color-mix(in srgb, var(--ok) 55%, var(--borda)); }
  .banheiro.proibido{ --cor:var(--nao); border-color:color-mix(in srgb, var(--nao) 55%, var(--borda)); }
  .rotulo{ font-size:clamp(12px, 1.15vw, 22px); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--texto-3); }
  .status{ display:flex; align-items:center; gap:2vmin; font-size:clamp(26px, 3.6vw, 72px); font-weight:800; line-height:1; color:var(--cor); }
  .status .bolinha{ flex:none; width:.55em; height:.55em; border-radius:50%; background:var(--cor); box-shadow:0 0 0 0 var(--cor); animation:pulsa 2s ease-out infinite; }
  @keyframes pulsa{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--cor) 60%, transparent); } 100%{ box-shadow:0 0 0 .5em transparent; } }
  .detalhe{ font-size:clamp(14px, 1.5vw, 30px); font-weight:500; color:var(--texto-2); }
  .detalhe b{ color:var(--texto); font-weight:700; }
  .horarios{ display:flex; gap:1.2vmin; flex-wrap:wrap; margin-top:.6vmin; }
  .horarios span{ padding:.5vmin 1.4vmin; border:1px solid var(--borda); border-radius:99px; font-size:clamp(12px, 1.15vw, 22px); font-weight:600; color:var(--texto-3); font-variant-numeric:tabular-nums; }
  .horarios span.agora{ color:var(--texto); border-color:var(--cor); background:color-mix(in srgb, var(--cor) 18%, transparent); }

  /* Link do portal */
  .portal{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.4vmin; min-height:0; }
  .url{ font-size:clamp(18px, 2.1vw, 42px); font-weight:800; line-height:1.1; letter-spacing:-.01em; word-break:break-word; }

  /* Botão de tela cheia: some sozinho quando o mouse para */
  .tela-cheia{
    position:fixed; right:2vmin; bottom:2vmin; padding:10px 16px; border:1px solid var(--borda); border-radius:10px;
    background:var(--card); color:var(--texto-2); font:600 14px Inter, system-ui, sans-serif; cursor:pointer;
    transition:opacity .4s ease;
  }
  body.sem-cursor .tela-cheia{ opacity:0; pointer-events:none; }

  @media (max-aspect-ratio: 1/1){
    body{ grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    .relogio{ padding-left:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .hora .pisca, .status .bolinha{ animation:none; }
  }
</style>
</head>
<body>

<section class="relogio">
  <div class="hora" id="hora">--<span class="pisca">:</span>--<span class="seg" id="seg">--</span></div>
  <div class="data" id="data"></div>
</section>

<section class="lado">
  <div class="cartao banheiro proibido" id="banheiro">
    <div class="rotulo">Banheiro</div>
    <div class="status"><span class="bolinha"></span><span id="bStatus">—</span></div>
    <div class="detalhe" id="bDetalhe"></div>
    <div class="horarios" id="bHorarios"></div>
  </div>

  <div class="cartao portal">
    <div class="rotulo">Portal</div>
    <div class="url" id="url"></div>
  </div>
</section>

<button type="button" class="tela-cheia" id="btnTelaCheia">⛶ Tela cheia</button>

<script>
(function () {
  // Horários em que o banheiro é liberado (início incluso, fim não).
  // Fora deles, proibido.
  const HORARIOS_BANHEIRO = [
    ['09:50', '11:00'],
    ['13:10', '13:30'],
  ];

  const min = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const faixas = HORARIOS_BANHEIRO.map(([a, b]) => ({ a, b, ini: min(a), fim: min(b) }));
  const $ = id => document.getElementById(id);
  const dois = n => String(n).padStart(2, '0');

  function falta(minutos) {
    if (minutos < 60) return `${minutos} min`;
    const h = Math.floor(minutos / 60), m = minutos % 60;
    return m ? `${h} h ${m} min` : `${h} h`;
  }

  // Monta só o que mudou (o relógio roda a cada segundo).
  let ultimoBanheiro = '';
  function atualizar() {
    const agora = new Date();
    const h = agora.getHours(), m = agora.getMinutes();
    $('hora').innerHTML = `${dois(h)}<span class="pisca">:</span>${dois(m)}<span class="seg">${dois(agora.getSeconds())}</span>`;
    $('data').textContent = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

    const atual = h * 60 + m;
    const dentro = faixas.find(f => atual >= f.ini && atual < f.fim);
    const proxima = faixas.find(f => f.ini > atual);
    let status, detalhe;
    if (dentro) {
      status = 'Liberado';
      detalhe = `Até as <b>${dentro.b}</b> · faltam <b>${falta(dentro.fim - atual)}</b>`;
    } else if (proxima) {
      status = 'Proibido';
      detalhe = `Libera às <b>${proxima.a}</b> · daqui a <b>${falta(proxima.ini - atual)}</b>`;
    } else {
      status = 'Proibido';
      detalhe = 'Hoje não tem mais horário liberado';
    }
    const chave = `${status}|${detalhe}|${dentro ? dentro.a : ''}`;
    if (chave === ultimoBanheiro) return;
    ultimoBanheiro = chave;
    const caixa = $('banheiro');
    caixa.classList.toggle('liberado', !!dentro);
    caixa.classList.toggle('proibido', !dentro);
    $('bStatus').textContent = status;
    $('bDetalhe').innerHTML = detalhe;
    $('bHorarios').innerHTML = faixas.map(f => `<span class="${f === dentro ? 'agora' : ''}">${f.a} – ${f.b}</span>`).join('');
  }

  // Link do portal: a raiz do site onde esta página está (no GitHub Pages,
  // instrutorjd.github.io/axis/), sem "https://" pra caber grande.
  const portal = new URL('../', location.href).href;
  $('url').textContent = portal.replace(/^https?:\/\//, '').replace(/\/$/, '');

  // Acerta o primeiro tique no começo do segundo.
  atualizar();
  setTimeout(() => { atualizar(); setInterval(atualizar, 1000); }, 1000 - new Date().getMilliseconds());

  // Tela cheia: botão, duplo clique ou F.
  function alternarTelaCheia() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
  $('btnTelaCheia').addEventListener('click', alternarTelaCheia);
  document.addEventListener('dblclick', alternarTelaCheia);
  document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') alternarTelaCheia(); });
  document.addEventListener('fullscreenchange', () => {
    $('btnTelaCheia').textContent = document.fullscreenElement ? '✕ Sair da tela cheia' : '⛶ Tela cheia';
  });

  // Esconde o cursor e o botão quando o mouse fica parado.
  let parado;
  function mexeu() {
    document.body.classList.remove('sem-cursor');
    clearTimeout(parado);
    parado = setTimeout(() => document.body.classList.add('sem-cursor'), 2500);
  }
  document.addEventListener('mousemove', mexeu);
  mexeu();

  // Mantém a TV/monitor sem apagar enquanto a página estiver aberta.
  let trava = null;
  async function manterAcesa() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') { trava = await navigator.wakeLock.request('screen'); trava.addEventListener('release', () => { trava = null; }); } } catch (e) { /* sem suporte */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !trava) manterAcesa(); });
  manterAcesa();
})();
</script>
</body>
</html>
