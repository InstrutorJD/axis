<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Criar Slides no Canva (Engel)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); min-height:100vh;
  }

  .env{
    max-width:760px; margin:0 auto; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
    min-height:calc(100vh - 20px);
  }

  .topbar{
    height:34px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 14px;
    font-size:13px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .steps{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:12px 12px 0; }
  .step-dot{
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    font-size:17px; border:2px solid var(--line); background:var(--panel2); border-radius:8px;
  }
  .step-dot.active{ border-color:var(--green); }
  .step-dot.done{ border-color:var(--green); background:rgba(124,255,63,0.15); }

  .stage{ flex:1; padding:16px; display:flex; flex-direction:column; gap:16px; }

  .card{ background:var(--panel); border:1px solid var(--line); padding:20px; }
  .card .big-icon{ font-size:56px; line-height:1; text-align:center; margin-bottom:10px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--yellow);
    margin:0 0 12px; letter-spacing:1px; text-align:center;
  }

  .lead{ font-size:18px; line-height:1.7; text-align:center; margin:0 0 6px; }

  /* Guia "como fazer no Canva" — só aparece na Apresentação */
  .howto{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .howto-item{
    display:flex; align-items:center; gap:12px; background:var(--panel2);
    border:1px solid var(--line); padding:10px 12px;
  }
  .howto-item .n{
    flex-shrink:0; width:30px; height:30px; border-radius:50%; background:var(--green);
    color:#04220a; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .howto-item .t{ font-size:16px; }
  .reminder{
    margin-top:14px; text-align:center; font-size:15px; color:var(--yellow);
    border:1px dashed var(--yellow); padding:10px; background:var(--panel2);
  }

  /* Tela de slide: cor do título (swatch grande) + caixas "digite isso" */
  .color-row{ display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:14px; }
  .swatch{ width:44px; height:44px; border-radius:8px; border:2px solid #000; flex-shrink:0; }
  .color-label{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:22px; letter-spacing:1px;
  }

  .type-label{
    font-size:13px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px;
    margin:0 0 6px; text-align:center;
  }
  .type-box{
    background:#000; border:2px solid var(--line); padding:16px; margin-bottom:16px;
    text-align:center; font-size:22px; font-weight:800; line-height:1.4;
    user-select:none; -webkit-user-select:none; -ms-user-select:none; -webkit-touch-callout:none;
    cursor:default;
  }
  .type-box.title-box{ border-color:var(--swatch-color, var(--green)); color:var(--swatch-color, var(--green)); font-family:var(--user-font-display, 'VT323', monospace); font-size:30px; }
  .type-box.body-box{ color:var(--ink); font-weight:600; font-size:19px; white-space:pre-line; text-align:left; }

  .step-nav{ display:flex; justify-content:space-between; align-items:center; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:16px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:14px 26px; cursor:pointer; border-radius:8px;
  }
  button.btn:disabled{ opacity:0.5; cursor:wait; }
  button.btn-secondary{ background:transparent; color:var(--green); border:2px solid var(--green-dim); }

  .visto-box p{ font-size:18px; line-height:1.7; margin:0 0 10px; text-align:center; }
  .visto-form{ display:flex; flex-direction:column; gap:12px; max-width:320px; margin:14px auto 0; }
  .visto-form label{ display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px; text-align:center; }
  .visto-form input{
    font-family:inherit; font-size:16px; padding:10px; background:#000; color:var(--ink);
    border:1px solid var(--line); border-radius:2px; text-align:center;
  }
  .visto-form input:focus{ outline:none; border-color:var(--green-dim); }
  .visto-msg{ font-size:14px; padding:8px 10px; border:1px dashed var(--line); text-align:center; }
  .visto-msg.erro{ border-color:#ff3b30; color:#ff3b30; }
  .visto-msg.ok{ border-color:var(--green); color:var(--green); }

  .entrega-box{ font-size:17px; line-height:1.7; text-align:center; }
  .entrega-box pre{
    background:#000; border:1px solid var(--line); padding:10px 12px; font-size:16px;
    display:inline-block; margin:6px 0 14px; color:var(--green);
  }

  /* Toast do bloqueio de copiar/colar nas caixas de "digite isso" */
  #noCopyToast{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:99999;
    background:#1a1a1a; color:#f5f5f5; font:600 13px 'JetBrains Mono', monospace;
    padding:9px 18px; border-radius:6px; box-shadow:0 2px 10px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  #noCopyToast.show{ opacity:1; }

  @media (max-width: 600px) {
    .card{ padding:14px; }
    .type-box{ font-size:19px; }
    .type-box.title-box{ font-size:24px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'teste_roteiros_trabalho_engel';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/professor-visto.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>🖼️ CRIAR SLIDES NO CANVA</div>
    <div>✅ <span id="lblStepNum">1</span>/<span id="lblStepTotal">7</span></div>
  </div>
  <div class="steps" id="stepsRow"></div>
  <div class="stage">
    <div id="stepWrap"></div>
  </div>
</div>
<div id="noCopyToast">✍️ Digite com a mão — não dá pra copiar aqui!</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `teste_roteiros_trabalho_engel_progress_${username}`;
  const STEP_KEY = `teste_roteiros_trabalho_engel_step_${username}`;
  const PROFESSOR_EMAIL = 'jairondouglas.senai@fieg.com.br';

  // Reformulada a pedido do professor: a versão anterior pedia pro Engel
  // testar o Campo Minado e escrever os próprios resultados — mesmo sendo
  // um jogo real e jogável, ainda exigia decidir o que escrever, que é
  // justamente o obstáculo pro perfil dele. Esta versão é mais fácil
  // ainda: o "assunto" (título + texto de cada slide) já vem PRONTO — a
  // habilidade sendo treinada é só a mecânica de montar slide no Canva
  // (criar título, criar texto, pintar a cor da fonte do título, cada
  // slide numa cor diferente). Não pede mais pra ele testar nada nem
  // decidir o que escrever — só ler e digitar.
  //
  // "Não pode permitir copiar e colar": diferente do bloqueio de
  // Ctrl+C/V ligado pelo professor por turma (shared/clipboard-guard.js,
  // opcional e afeta a turma inteira), aqui o bloqueio é próprio desta
  // atividade e sempre ligado, mas só nas caixas ".no-copy" (o
  // título/texto que ele precisa digitar) — não afeta copiar o e-mail do
  // professor na etapa de entrega, por exemplo. Ver isNoCopyZone()/
  // listeners no fim do arquivo. Mesmo aviso de shared/clipboard-guard.js:
  // é desincentivo pedagógico (força ele a digitar de verdade, treinando
  // leitura/digitação — mesma lógica de js-basico-adaptado-engel.html),
  // não segurança de verdade.
  const HOWTO = [
    { n: 1, t: 'No Canva, clique na caixa de "Adicionar título".' },
    { n: 2, t: 'Digite o título (com a mão, sem colar).' },
    { n: 3, t: 'Selecione o título digitado (arraste por cima do texto).' },
    { n: 4, t: 'Clique no ícone "A" (cor da fonte) e escolha a cor mostrada aqui.' },
    { n: 5, t: 'Clique numa caixa de texto normal e digite o texto do slide.' },
    { n: 6, t: 'Clique no "+" pra criar o próximo slide e repita.' }
  ];

  // 10 slides — capa + os 4 tipos de teste do trabalho regular (turmas/
  // jogos/atividades/teste-roteiros-trabalho.html: Certificação Técnica,
  // Teste de Plataforma, Smoke Test, Teste Exploratório), 2 slides por
  // tipo (nome+definição, depois quando/por quê se usa — mesmo conteúdo
  // que os outros alunos pesquisam, só que já pronto pra digitar) +
  // encerramento. Mesmo assunto, mesma cobertura dos 4 tipos — só muda
  // que aqui não tem pesquisa nem redação, é ler e digitar.
  const SLIDES = [
    {
      icon: '🖼️', corNome: 'Verde-água', cor: '#00acc1', emoji: '🔷',
      titulo: 'Roteiros de Teste',
      texto: 'Por Engel Fraga\nTurma Jogos Digitais\nPixelForge Studios'
    },
    {
      icon: '🎖️', corNome: 'Vermelho', cor: '#e53935', emoji: '🔴',
      titulo: 'Certificação Técnica',
      texto: 'Teste feito antes de vender o jogo numa loja de console.\nO fabricante do console dá as regras.\nSem seguir as regras, o jogo não é aprovado.'
    },
    {
      icon: '🚫', corNome: 'Laranja', cor: '#fb8c00', emoji: '🟠',
      titulo: 'Antes de Lançar',
      texto: 'Feito antes de mandar o jogo pro fabricante.\nCada fabricante tem suas próprias regras.\nSem seguir, o jogo não entra na loja.'
    },
    {
      icon: '🖥️', corNome: 'Amarelo', cor: '#fdd835', emoji: '🟡',
      titulo: 'Teste de Plataforma',
      texto: 'Ver se o jogo funciona em telas diferentes.\nTelas grandes, pequenas e no meio do caminho.\nO jogo precisa funcionar em todas.'
    },
    {
      icon: '📐', corNome: 'Verde', cor: '#43a047', emoji: '🟢',
      titulo: 'Telas Diferentes',
      texto: 'Testar o jogo em telas de tamanhos diferentes.\nUma tela grande e uma tela pequena.\nGarante que funciona igual nas duas.'
    },
    {
      icon: '💨', corNome: 'Azul', cor: '#1e88e5', emoji: '🔵',
      titulo: 'Smoke Test',
      texto: 'Teste rápido, feito antes de publicar o jogo.\nSó olha se o básico funciona.\nNão substitui um teste completo.'
    },
    {
      icon: '⏱️', corNome: 'Roxo', cor: '#ab47bc', emoji: '🟣',
      titulo: 'Teste Rápido',
      texto: 'Feito bem antes de lançar uma versão nova.\nServe pra confirmar o básico rápido.\nDepois, dá pra testar mais a fundo.'
    },
    {
      icon: '🔎', corNome: 'Marrom', cor: '#6d4c41', emoji: '🟤',
      titulo: 'Teste Exploratório',
      texto: 'Jogar bastante tentando quebrar o jogo.\nSem seguir um roteiro fixo.\nDe propósito, tentando achar problemas.'
    },
    {
      icon: '🐞', corNome: 'Cinza', cor: '#cfd8dc', emoji: '⚪',
      titulo: 'Sem Roteiro Fixo',
      texto: 'Feito quando o jogo já está estável.\nAcha bugs escondidos.\nUm teste comum não pegaria esses bugs.'
    },
    {
      icon: '🏁', corNome: 'Verde-água', cor: '#00acc1', emoji: '🔷',
      titulo: 'Fim!',
      texto: 'Terminei os slides! 🏁\nTestes de Jogos Digitais\nPor Engel Fraga'
    }
  ];

  // Passos: índice 0 = Apresentação, 1..SLIDES.length = os slides,
  // TOTAL_STEPS-1 = Como entregar. Depois disso (índice TOTAL_STEPS) entra
  // o visto — ver renderStep()/renderVisto().
  const TOTAL_STEPS = 2 + SLIDES.length; // apresentação + slides + entrega

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveProgress(data) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }

  function loadStepIndex() {
    try {
      const n = parseInt(localStorage.getItem(STEP_KEY), 10);
      return Number.isInteger(n) && n >= 0 && n <= TOTAL_STEPS ? n : 0;
    } catch (e) { return 0; }
  }
  function saveStepIndex(i) { try { localStorage.setItem(STEP_KEY, String(i)); } catch (e) {} }

  const savedProgress = loadProgress();
  let currentIndex = (savedProgress && savedProgress.completed) ? TOTAL_STEPS : loadStepIndex();

  const stepsRowEl = document.getElementById('stepsRow');
  const stepWrap = document.getElementById('stepWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  lblStepTotal.textContent = TOTAL_STEPS + 1;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('teste_roteiros_trabalho_engel', label, { step: currentIndex + 1, total: TOTAL_STEPS + 1 });
    }
  }

  // Ícone de cada "bolinha" da barra de progresso: apresentação (🖼️),
  // 1 por slide (o emoji da cor), entrega (📧), visto (🧑‍🏫).
  function stepIcon(i) {
    if (i === 0) return '🖼️';
    if (i >= 1 && i <= SLIDES.length) return SLIDES[i - 1].emoji;
    if (i === TOTAL_STEPS - 1) return '📧';
    return '🧑‍🏫';
  }

  function renderStepsRow() {
    let html = '';
    for (let i = 0; i < TOTAL_STEPS; i++) {
      const done = i < currentIndex;
      const active = i === currentIndex;
      html += `<div class="step-dot${active ? ' active' : ''}${done ? ' done' : ''}">${done ? '✅' : stepIcon(i)}</div>`;
    }
    const vistoDone = currentIndex > TOTAL_STEPS || (loadProgress() && loadProgress().completed);
    html += `<div class="step-dot${currentIndex >= TOTAL_STEPS ? ' active' : ''}${vistoDone ? ' done' : ''}">${vistoDone ? '✅' : '🧑‍🏫'}</div>`;
    stepsRowEl.innerHTML = html;
  }

  function renderNav(showBack, showNext) {
    return `
      <div class="step-nav">
        ${showBack ? '<button class="btn btn-secondary" id="btnBack">← Voltar</button>' : '<span></span>'}
        ${showNext ? '<button class="btn" id="btnNext">Próximo ➡️</button>' : ''}
      </div>`;
  }

  function renderApresentacao() {
    stepWrap.innerHTML = `
      <div class="card">
        <div class="big-icon">🖼️</div>
        <h2>Vamos criar os slides!</h2>
        <p class="lead">São ${SLIDES.length} slides. Cada um já vem com o TÍTULO, a COR e o TEXTO prontos — você só precisa digitar no Canva.</p>
        <div class="howto">
          ${HOWTO.map(h => `<div class="howto-item"><div class="n">${h.n}</div><div class="t">${escapeHtml(h.t)}</div></div>`).join('')}
        </div>
        <div class="reminder">✍️ Digite tudo com a mão — copiar e colar não funciona aqui.</div>
      </div>
      ${renderNav(false, true)}
    `;
    document.getElementById('btnNext').addEventListener('click', () => { currentIndex++; renderStep(); });
  }

  function renderSlide(slideIdx) {
    const s = SLIDES[slideIdx];
    stepWrap.innerHTML = `
      <div class="card" style="--swatch-color:${s.cor}">
        <div class="big-icon">${s.icon}</div>
        <h2>Slide ${slideIdx + 1}</h2>
        <div class="color-row">
          <div class="swatch" style="background:${s.cor}"></div>
          <div class="color-label" style="color:${s.cor}">${s.emoji} ${escapeHtml(s.corNome)}</div>
        </div>
        <p class="type-label">Título (nesta cor)</p>
        <div class="type-box title-box no-copy">${escapeHtml(s.titulo)}</div>
        <p class="type-label">Texto</p>
        <div class="type-box body-box no-copy">${escapeHtml(s.texto)}</div>
      </div>
      ${renderNav(true, true)}
    `;
    document.getElementById('btnBack').addEventListener('click', () => { currentIndex--; renderStep(); });
    document.getElementById('btnNext').addEventListener('click', () => { currentIndex++; renderStep(); });
  }

  function renderEntrega() {
    stepWrap.innerHTML = `
      <div class="card">
        <div class="big-icon">📧</div>
        <h2>Como entregar</h2>
        <div class="entrega-box">
          <p>1. Baixe os slides em PDF.</p>
          <p>2. Mande e-mail pro professor:</p>
          <pre>${escapeHtml(PROFESSOR_EMAIL)}</pre>
          <p>3. Anexe o PDF.</p>
          <p>4. Depois, avance e peça o visto aqui.</p>
        </div>
      </div>
      ${renderNav(true, true)}
    `;
    document.getElementById('btnBack').addEventListener('click', () => { currentIndex--; renderStep(); });
    document.getElementById('btnNext').addEventListener('click', () => { currentIndex++; renderStep(); });
  }

  function renderStep() {
    if (currentIndex >= TOTAL_STEPS) { renderVisto(); return; }
    saveStepIndex(currentIndex);
    lblStepNum.textContent = currentIndex + 1;
    renderStepsRow();

    if (currentIndex === 0) {
      reportStep('Slides (Engel) — Apresentação');
      renderApresentacao();
    } else if (currentIndex >= 1 && currentIndex <= SLIDES.length) {
      const slideIdx = currentIndex - 1;
      reportStep(`Slides (Engel) — Slide ${slideIdx + 1}: ${SLIDES[slideIdx].titulo}`);
      renderSlide(slideIdx);
    } else {
      reportStep('Slides (Engel) — Como entregar');
      renderEntrega();
    }
  }

  function renderVisto() {
    lblStepNum.textContent = TOTAL_STEPS + 1;
    renderStepsRow();
    reportStep('Slides (Engel) — Visto do professor');

    const already = loadProgress();
    if (already && already.completed) {
      const quando = already.vistoEm ? new Date(already.vistoEm).toLocaleString('pt-BR') : '';
      stepWrap.innerHTML = `
        <div class="card visto-box">
          <div class="big-icon">🏆</div>
          <h2>Atividade concluída!</h2>
          <p>Visto dado por <b>${escapeHtml(already.vistoPor || '')}</b>${quando ? ' em ' + escapeHtml(quando) : ''}.</p>
        </div>
        ${renderNav(true, false)}
      `;
      document.getElementById('btnBack').addEventListener('click', () => { currentIndex = TOTAL_STEPS - 1; renderStep(); });
      return;
    }

    stepWrap.innerHTML = `
      <div class="card visto-box">
        <div class="big-icon">🧑‍🏫</div>
        <h2>Etapa final — Visto do professor</h2>
        <p>Você já mandou o e-mail com o PDF pro professor?</p>
        <p>Peça pro professor conferir. Quando ele confirmar, peça o token dele e digite abaixo.</p>
        <div class="visto-form">
          <label>Token do professor
            <input type="text" id="vistoToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnDarVisto">Dar visto</button>
          <div class="visto-msg" id="vistoMsg" style="display:none;"></div>
        </div>
      </div>
      ${renderNav(true, false)}
    `;
    document.getElementById('btnBack').addEventListener('click', () => { currentIndex = TOTAL_STEPS - 1; renderStep(); });

    const btnDarVisto = document.getElementById('btnDarVisto');
    const vistoMsg = document.getElementById('vistoMsg');
    btnDarVisto.addEventListener('click', async () => {
      const t = document.getElementById('vistoToken').value;
      vistoMsg.style.display = 'none';
      if (!t) {
        vistoMsg.className = 'visto-msg erro';
        vistoMsg.textContent = 'Peça o token pro professor.';
        vistoMsg.style.display = 'block';
        return;
      }
      btnDarVisto.disabled = true;
      btnDarVisto.textContent = 'Verificando...';
      try {
        const result = window.PortalProfessorVisto
          ? await window.PortalProfessorVisto.verificarToken(t)
          : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!result.ok) {
          vistoMsg.className = 'visto-msg erro';
          vistoMsg.textContent = result.erro;
          vistoMsg.style.display = 'block';
          btnDarVisto.disabled = false;
          btnDarVisto.textContent = 'Dar visto';
          return;
        }
        saveProgress({ completed: true, vistoPor: result.nome, vistoEm: new Date().toISOString() });
        renderVisto();
      } catch (e) {
        vistoMsg.className = 'visto-msg erro';
        vistoMsg.textContent = 'Deu erro. Tente de novo.';
        vistoMsg.style.display = 'block';
        btnDarVisto.disabled = false;
        btnDarVisto.textContent = 'Dar visto';
      }
    });
  }

  // Gabarito pro professor: o que conferir no PDF (4 títulos com a cor
  // certa + 4 textos), igual ao que foi digitado aqui.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Criar Slides no Canva (Engel) — Checklist de correção',
      subtitle: 'Trabalho adaptado (Canva/PDF, entregue por e-mail) · Testes de Jogos Digitais · Turma Jogos Digitais',
      items: SLIDES.map((s, i) => ({
        number: i + 1,
        title: `Slide ${i + 1}`,
        prompt: 'Título na cor certa e texto igual ao pedido?',
        answer: `Título "${s.titulo}" na cor ${s.corNome}; texto "${s.texto}".`
      })).concat([
        { number: SLIDES.length + 1, title: 'Entrega', prompt: 'O aluno entregou corretamente?', answer: 'PDF exportado, enviado por e-mail para jairondouglas.senai@fieg.com.br, PDF anexado.' }
      ]),
      fileName: 'teste-roteiros-trabalho-engel-gabarito.txt'
    });
  };

  // Bloqueio de copiar/colar específico desta atividade (sempre ligado,
  // independente do toggle por turma de shared/clipboard-guard.js) — só
  // nas caixas ".no-copy" (título/texto do slide). Não afeta copiar o
  // e-mail do professor na etapa de entrega.
  const noCopyToast = document.getElementById('noCopyToast');
  let noCopyToastTimer = null;
  function showNoCopyToast() {
    noCopyToast.classList.add('show');
    clearTimeout(noCopyToastTimer);
    noCopyToastTimer = setTimeout(() => noCopyToast.classList.remove('show'), 1600);
  }
  function isInNoCopyZone(target) {
    if (target && target.closest && target.closest('.no-copy')) return true;
    const sel = window.getSelection();
    const node = sel && sel.anchorNode;
    const el = node ? (node.nodeType === 1 ? node : node.parentElement) : null;
    return !!(el && el.closest && el.closest('.no-copy'));
  }
  document.addEventListener('copy', e => { if (isInNoCopyZone(e.target)) { e.preventDefault(); showNoCopyToast(); } }, true);
  document.addEventListener('cut', e => { if (isInNoCopyZone(e.target)) { e.preventDefault(); showNoCopyToast(); } }, true);
  document.addEventListener('contextmenu', e => { if (isInNoCopyZone(e.target)) { e.preventDefault(); showNoCopyToast(); } }, true);
  document.addEventListener('keydown', e => {
    const key = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (key === 'c' || key === 'x') && isInNoCopyZone(e.target)) {
      e.preventDefault();
      showNoCopyToast();
    }
  }, true);

  renderStep();
</script>
