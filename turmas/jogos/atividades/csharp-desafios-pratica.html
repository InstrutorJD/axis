<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Jogos: Desafios de C#</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:190px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--green); color:var(--green); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex:1 1 0%; min-height:90px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }
  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--green); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:14px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--yellow); }

  .explanation-box{
    background:#081208; border:1px solid var(--green-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--green); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--yellow); }
  .explanation-box pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:6px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--yellow); white-space:pre;
  }

  .given-vars{ font-size:10.5px; color:var(--ink-dim); margin-top:8px; }
  .given-vars b{ color:var(--yellow); }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--yellow); border:1px solid var(--green-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(212,200,106,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--yellow);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--yellow); }

  textarea#codeInput{
    width:100%; flex:0 0 230px; min-height:140px; resize:vertical; background:#000; color:var(--green);
    border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; outline:none; line-height:1.5;
  }
  textarea#codeInput:focus{ border-color:var(--green); }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .console{
    background:#060806; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:0 0 100px; min-height:70px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass{ color:var(--green); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--green); font-weight:bold; }
  .console .line.warn{ color:var(--yellow); }

  /* Celular/telas estreitas: mesma regra das outras práticas de desafio —
     empilha tudo numa coluna só e deixa a página inteira rolar. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    textarea#codeInput{ min-height:200px; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'csharp_desafios';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/csharp-challenge-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>C# — DESAFIOS DE CÓDIGO</div>
    <div>CONCLUÍDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Desafios</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>
          <div class="given-vars" id="givenVarsLabel" style="display:none;"></div>

          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <textarea id="codeInput" spellcheck="false"></textarea>

        <div class="actions">
          <button class="btn" id="btnRun">▶ Executar</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo desafio →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Bloco 1 — Variável (7 desafios): declarar número/texto, somar, subtrair,
  // multiplicar, dividir, atualizar uma variável a partir de outra já existente.
  // Bloco 2 — Console (3 desafios): Console.WriteLine com variável, texto
  // fixo e o resultado de uma conta direto.
  // Bloco 3 — Constante, Função, If/else e For (1 desafio cada): fecha o gap
  // com os 5 conceitos ensinados na Comparação JS vs C# (csharp-comparacao.html)
  // — até aqui só "Variável" tinha desafio de código de verdade; os outros 4
  // eram só comparados em texto, nunca praticados.
  const CHALLENGES = [
    {
      id: 1,
      title: 'Guardando um número',
      givenVars: [],
      starter: '// crie uma variável chamada resultado, do tipo int, com o valor 100\n\n',
      explanation: 'Em C#, toda variável precisa de um <b>tipo</b> antes do nome. Pra números inteiros, use <code>int</code>.<pre>int pontos = 5;</pre>',
      desc: 'Crie uma variável chamada <code>resultado</code>, do tipo <code>int</code>, com o valor <b>100</b>.',
      hint: 'Toda variável em C# segue <code>TIPO nome = valor;</code>. Qual palavra-chave de tipo serve pra números inteiros?',
      solution: 'int resultado = 100;',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: {}, expected: 100 }
      ]
    },
    {
      id: 2,
      title: 'Guardando um texto',
      givenVars: [],
      starter: '// crie uma variável chamada resultado, do tipo string, com o texto "Unity"\n\n',
      explanation: 'Um texto (chamado de <b>string</b>) precisa ficar entre aspas duplas, e a variável precisa ser do tipo <code>string</code>.<pre>string engine = "Godot";</pre>',
      desc: 'Crie uma variável chamada <code>resultado</code>, do tipo <code>string</code>, com o texto <code>"Unity"</code>.',
      hint: 'Coloque o texto entre aspas duplas, exatamente como pedido (maiúsculas/minúsculas importam).',
      solution: 'string resultado = "Unity";',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: {}, expected: 'Unity' }
      ]
    },
    {
      id: 3,
      title: 'Somando duas variáveis',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável int chamada resultado com a soma de a e b\n\n',
      explanation: 'Para somar dois números, use o sinal <code>+</code>.<pre>int total = x + y;</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie uma variável <code>int</code> chamada <code>resultado</code> com a soma delas.',
      hint: 'Qual operador matemático soma dois valores? Aplique entre <code>a</code> e <code>b</code>.',
      solution: 'int resultado = a + b;',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 2, b: 3 }, expected: 5 },
        { values: { a: 10, b: 15 }, expected: 25 },
        { values: { a: 0, b: 0 }, expected: 0 }
      ]
    },
    {
      id: 4,
      title: 'Subtraindo duas variáveis',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável int chamada resultado com a subtração de a por b\n\n',
      explanation: 'Para subtrair, use o sinal <code>-</code>.<pre>int diferenca = x - y;</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie uma variável <code>int</code> chamada <code>resultado</code> com <code>a</code> menos <code>b</code>.',
      hint: 'A ordem dos valores importa numa subtração — pense em qual variável vem primeiro pra não inverter o resultado.',
      solution: 'int resultado = a - b;',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 10, b: 3 }, expected: 7 },
        { values: { a: 5, b: 5 }, expected: 0 },
        { values: { a: 3, b: 10 }, expected: -7 }
      ]
    },
    {
      id: 5,
      title: 'Multiplicando duas variáveis',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável int chamada resultado com a multiplicação de a por b\n\n',
      explanation: 'Para multiplicar, use o sinal <code>*</code>.<pre>int area = x * y;</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie uma variável <code>int</code> chamada <code>resultado</code> com <code>a</code> vezes <code>b</code>.',
      hint: 'Qual sinal representa multiplicação em C#? É o mesmo símbolo usado em quase toda linguagem de programação.',
      solution: 'int resultado = a * b;',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 2, b: 3 }, expected: 6 },
        { values: { a: 4, b: 5 }, expected: 20 },
        { values: { a: 0, b: 9 }, expected: 0 }
      ]
    },
    {
      id: 6,
      title: 'Dividindo duas variáveis',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável double chamada resultado com a divisão de a por b\n\n',
      explanation: 'Para dividir, use o sinal <code>/</code>. Lembrete: se declarar como <code>int</code>, o C# corta a parte decimal — use <code>double</code> quando o resultado pode ter vírgula.<pre>double media = x / y;</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie <code>resultado</code>, do tipo <code>double</code>, com o valor de <code>a</code> dividido por <code>b</code>.',
      hint: 'Declare <code>resultado</code> como <code>double</code>, não <code>int</code> — senão o resultado perde a casa decimal.',
      solution: 'double resultado = a / b;',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 10, b: 2 }, expected: 5 },
        { values: { a: 9, b: 2 }, expected: 4.5 },
        { values: { a: 7, b: 2 }, expected: 3.5 }
      ]
    },
    {
      id: 7,
      title: 'Atualizando uma variável',
      givenVars: ['pontos'],
      starter: '// a variável pontos já existe\n// crie uma variável int chamada resultado somando 10 ao valor de pontos\n\n',
      explanation: 'Você pode criar uma variável nova a partir do valor de outra que já existe, usando qualquer operador — aqui, soma.<pre>int vidaExtra = vida + 3;</pre>',
      desc: 'A variável <code>pontos</code> já existe. Crie <code>resultado</code>, do tipo <code>int</code>, com o valor de <code>pontos</code> mais <b>10</b>.',
      hint: 'Você pode usar o valor de uma variável que já existe pra criar uma nova — qual operação aumenta um valor em uma quantia fixa?',
      solution: 'int resultado = pontos + 10;',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { pontos: 0 }, expected: 10 },
        { values: { pontos: 5 }, expected: 15 },
        { values: { pontos: -10 }, expected: 0 }
      ]
    },
    {
      id: 8,
      title: 'Mostrando uma variável no console',
      givenVars: ['idade'],
      starter: '// a variável idade já existe\n// use Console.WriteLine para mostrar o valor de idade\n\n',
      explanation: 'O comando <code>Console.WriteLine(...)</code> mostra qualquer valor na tela — é a forma mais comum de exibir um resultado em C#.<pre>Console.WriteLine(idade);</pre>',
      desc: 'A variável <code>idade</code> já existe. Use <code>Console.WriteLine</code> para mostrar o valor dela.',
      hint: 'O comando que exibe algo na tela recebe, entre parênteses, aquilo que você quer mostrar.',
      solution: 'Console.WriteLine(idade);',
      check: { type: 'console' },
      tests: [
        { values: { idade: 10 }, expected: [10] },
        { values: { idade: 25 }, expected: [25] },
        { values: { idade: 0 }, expected: [0] }
      ]
    },
    {
      id: 9,
      title: 'Mostrando um texto fixo',
      givenVars: [],
      starter: '// use Console.WriteLine para mostrar o texto "Olá, mundo!"\n\n',
      explanation: 'Você também pode mostrar um texto direto, sem precisar de uma variável.<pre>Console.WriteLine("Bem-vindo!");</pre>',
      desc: 'Use <code>Console.WriteLine</code> para mostrar o texto <code>"Olá, mundo!"</code>.',
      hint: 'Coloque o texto entre aspas duplas, exatamente como pedido, dentro dos parênteses.',
      solution: 'Console.WriteLine("Olá, mundo!");',
      check: { type: 'console' },
      tests: [
        { values: {}, expected: ['Olá, mundo!'] }
      ]
    },
    {
      id: 10,
      title: 'Mostrando o resultado de uma conta',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// mostre no console a soma delas\n\n',
      explanation: 'Não precisa guardar numa variável antes — dá pra mostrar o resultado de uma conta direto dentro do <code>Console.WriteLine</code>.<pre>Console.WriteLine(x + y);</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Use <code>Console.WriteLine</code> para mostrar a soma delas, sem precisar criar outra variável.',
      hint: 'Você não precisa criar uma variável antes — dá pra escrever a conta direto dentro dos parênteses de quem exibe o valor.',
      solution: 'Console.WriteLine(a + b);',
      check: { type: 'console' },
      tests: [
        { values: { a: 2, b: 3 }, expected: [5] },
        { values: { a: 10, b: 15 }, expected: [25] },
        { values: { a: 1, b: 1 }, expected: [2] }
      ]
    },
    {
      id: 11,
      title: 'Criando uma constante',
      givenVars: [],
      starter: '// crie uma constante chamada limite, do tipo int, com o valor 10\n\n',
      explanation: 'Uma <b>constante</b> usa a palavra <code>const</code> antes do tipo — depois de criada, o valor nunca muda.<pre>const int maxVidas = 3;</pre>',
      desc: 'Crie uma constante chamada <code>limite</code>, do tipo <code>int</code>, com o valor <b>10</b>.',
      hint: 'Existe uma palavra-chave que vem antes do tipo quando o valor de uma variável nunca deve mudar depois de criada.',
      solution: 'const int limite = 10;',
      check: { type: 'variable', name: 'limite' },
      tests: [
        { values: {}, expected: 10 }
      ]
    },
    {
      id: 12,
      title: 'Criando uma função',
      givenVars: [],
      starter: '// crie a funcao Dobro(int numero) que devolve numero vezes 2\n\n\n// depois, crie a variavel resultado chamando Dobro(5)\n',
      explanation: 'Uma <b>função</b> declara o tipo de cada parâmetro e o tipo que ela devolve com <code>return</code>.<pre>static int Triplo(int x) {\n  return x * 3;\n}</pre>',
      desc: 'Crie uma função chamada <code>Dobro</code>, que recebe um <code>int</code> chamado <code>numero</code> e devolve o dobro dele. Depois, crie <code>resultado</code> com o valor de <code>Dobro(5)</code>.',
      hint: 'Uma função começa com <code>static</code> + o tipo que ela devolve + o nome + os parâmetros entre parênteses — e usa <code>return</code> pra devolver o valor. Depois, você a chama como chamaria qualquer outro comando.',
      solution: 'static int Dobro(int numero) {\n  return numero * 2;\n}\nint resultado = Dobro(5);',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: {}, expected: 10 }
      ]
    },
    {
      id: 13,
      title: 'Decidindo com if/else',
      givenVars: ['idade'],
      starter: 'string resultado;\nif (idade >= 18) {\n  \n} else {\n  \n}\n',
      explanation: 'O <code>if</code> testa uma condição; o <code>else</code> roda quando ela é falsa.<pre>string status;\nif (vida > 0) {\n  status = "Vivo";\n} else {\n  status = "Morto";\n}</pre>',
      desc: 'A variável <code>idade</code> já existe. Complete o código: se <code>idade</code> for maior ou igual a <b>18</b>, <code>resultado</code> deve ser <code>"Maior"</code>; senão, <code>"Menor"</code>.',
      hint: 'Dentro de cada bloco você reatribui a variável <code>resultado</code> (ela já foi declarada, não repita o tipo) — pense no texto certo pra cada lado da condição.',
      solution: 'string resultado;\nif (idade >= 18) {\n  resultado = "Maior";\n} else {\n  resultado = "Menor";\n}',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { idade: 20 }, expected: 'Maior' },
        { values: { idade: 18 }, expected: 'Maior' },
        { values: { idade: 10 }, expected: 'Menor' }
      ]
    },
    {
      id: 14,
      title: 'Repetindo com for',
      givenVars: [],
      starter: '// use um for pra mostrar 0, 1, 2, 3 e 4 no console (5 números)\n\n',
      explanation: 'O <code>for</code> repete um bloco enquanto a condição continuar verdadeira.<pre>for (int i = 0; i < 3; i++) {\n  Console.WriteLine(i);\n}</pre>',
      desc: 'Use um laço <code>for</code> para mostrar no console os números de <b>0</b> a <b>4</b>, um <code>Console.WriteLine</code> por número.',
      hint: 'Um <code>for</code> tem 3 partes: onde a contagem começa, até quando ela repete, e o que muda a cada volta — a mesma variável que muda é a que você deve exibir.',
      solution: 'for (int i = 0; i < 5; i++) {\n  Console.WriteLine(i);\n}',
      check: { type: 'console' },
      tests: [
        { values: {}, expected: [0, 1, 2, 3, 4] }
      ]
    }
  ];

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'C# — Desafios de Código',
      subtitle: 'Prática · Trilha C# · Turma Jogos Digitais',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        answer: c.tests.map(t => {
          const inputs = Object.entries(t.values || {}).map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join(', ');
          const prefix = inputs ? `Com ${inputs}` : 'Sem variáveis de entrada';
          if (c.check.type === 'console') {
            return `${prefix} → Console.WriteLine deve mostrar ${JSON.stringify(t.expected)}`;
          }
          return `${prefix} → ${c.check.name} deve ser ${JSON.stringify(t.expected)}`;
        }).join('\n') + '\n\nCódigo de referência (não é a única forma correta):\n' + c.solution
      })),
      fileName: 'csharp-desafios-pratica-gabarito.txt'
    });
  };

  window.PortalCsharpChallenges.run({
    activityLocation: 'csharp_desafios',
    challenges: CHALLENGES,
    reportLabel: 'C# — Desafios de Código'
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
