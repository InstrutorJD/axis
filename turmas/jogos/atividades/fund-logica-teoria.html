<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Lógica e Algoritmos para Jogos 2D: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(124,255,63,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(124,255,63,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(124,255,63,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'fund_logica_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>

</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JOGOS — LÓGICA E ALGORITMOS (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const STEPS = [
    {
      story: 'De volta ao oceano de código! Sou o <b>Eri</b> outra vez. Todo jogo, por baixo dos panos, roda um <b>game loop</b>: um ciclo que se repete várias vezes por segundo, lendo entrada do jogador, atualizando o estado do jogo e redesenhando a tela — de novo, e de novo, e de novo.',
      question: {
        prompt: 'Por que um jogo precisa repetir constantemente o mesmo ciclo (ler entrada → atualizar → desenhar), em vez de rodar essa lógica só uma vez?',
        options: [
          'Porque o jogo precisa reagir em tempo real ao jogador e atualizar a tela continuamente enquanto está em execução',
          'Porque rodar uma vez só deixaria o jogo mais rápido e mais leve, sem nenhuma perda de resposta ao jogador',
          'Porque isso é uma limitação antiga de hardware que os jogos modernos já não usam mais em nenhuma engine',
          'Porque só repetindo o ciclo o computador consegue ligar a placa de vídeo e o teclado corretamente'
        ],
        correctIndex: 0,
        explanation: 'Isso! O game loop é o coração do jogo: sem repetir esse ciclo continuamente, nada reagiria ao jogador nem se moveria na tela.'
      }
    },
    {
      story: 'Pra saber ONDE cada elemento está na tela, jogos 2D usam um <b>sistema de coordenadas</b>: um eixo <code>X</code> (horizontal) e um eixo <code>Y</code> (vertical). Na maioria das engines, a origem <code>(0,0)</code> fica no canto superior esquerdo, e o eixo Y cresce pra <b>baixo</b> — diferente do gráfico de matemática que você já viu na escola.',
      question: {
        prompt: 'Num sistema de coordenadas 2D típico de jogo (origem no canto superior esquerdo), o que acontece com a posição de um personagem quando o valor do eixo Y AUMENTA?',
        options: [
          'Ele se move para BAIXO na tela',
          'Ele se move para CIMA na tela',
          'Ele se move para a DIREITA na tela',
          'O eixo Y não afeta a posição vertical'
        ],
        correctIndex: 0,
        explanation: 'Correto! Na maioria dos motores de jogo 2D, Y cresce pra baixo — o oposto do gráfico cartesiano da escola, onde Y cresce pra cima.'
      }
    },
    {
      story: 'Pra montar o <b>cenário</b> do jogo, é comum organizar o mapa como uma <b>matriz</b> (uma grade de linhas e colunas) — cada posição da matriz guarda qual tile (bloco de cenário: grama, parede, água) deve aparecer ali. Assim, o nível inteiro vira só uma tabela de números fácil de editar e reaproveitar.',
      question: {
        prompt: 'Qual é a principal vantagem de representar o cenário de um jogo como uma matriz de tiles, em vez de posicionar cada peça manualmente pixel a pixel?',
        options: [
          'Fica muito mais fácil editar, reaproveitar e gerar níveis de forma organizada, já que cada posição da grade só guarda um número/código do tile',
          'A matriz deixa o jogo automaticamente mais bonito, com gráficos mais detalhados e realistas na tela, sem esforço extra do artista',
          'Não existe nenhuma vantagem real — é só uma forma alternativa de organizar dados, sem diferença prática nenhuma no resultado final',
          'Matrizes só servem para cálculos matemáticos de física, nunca pra representar cenário de jogo, isso é tarefa exclusiva de sprites'
        ],
        correctIndex: 0,
        explanation: 'Isso! Guardar o cenário como uma matriz de tiles simplifica muito a edição e a reutilização de peças — em vez de posicionar cada pixel na mão.'
      }
    },
    {
      story: 'As cores na tela seguem o <b>sistema RGB</b>: cada cor é uma mistura de Vermelho (Red), Verde (Green) e Azul (Blue), cada um variando de 0 a 255. Muitas vezes existe um quarto valor, o <b>alpha</b> (transparência): 0 é totalmente transparente, 255 (ou 1.0) é totalmente opaco.',
      question: {
        prompt: 'Você quer que o sprite de um fantasma fique parcialmente transparente, como se estivesse "sumindo". Qual valor da cor (RGBA) você deve ajustar?',
        options: [
          'O canal alpha (transparência)',
          'Só o canal vermelho (R)',
          'Só o canal verde (G)',
          'Não é possível deixar um sprite transparente'
        ],
        correctIndex: 0,
        explanation: 'Exato! O canal alpha controla a transparência de um elemento — reduzi-lo é exatamente como se faz um sprite "sumir" gradualmente.'
      }
    },
    {
      story: 'Por fim, mesmo sem simular física de verdade, todo jogo 2D usa <b>elementos básicos de física</b>: <b>gravidade</b> (uma aceleração constante puxando pra baixo), <b>velocidade</b> (o quanto um objeto se move por frame) e <b>colisão</b> (detectar quando dois elementos se tocam). É esse combo que faz um personagem cair, pular e parar ao encostar no chão.',
      question: {
        prompt: 'Um personagem foi programado para pular, mas depois do pulo ele fica flutuando parado no ar em vez de descer de volta. O que provavelmente falta na lógica dele?',
        options: [
          'Aplicar gravidade — uma aceleração constante puxando o personagem pra baixo a cada frame',
          'Trocar a cor do personagem, pra deixar mais visível durante o pulo no ar',
          'Aumentar o tamanho do sprite, pra ele parecer mais pesado durante o pulo',
          'Nada, personagens flutuando parados no ar são o comportamento padrão de qualquer jogo 2D'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Sem aplicar gravidade continuamente (reduzindo a posição Y a cada frame, por exemplo), o personagem nunca volta a descer sozinho.'
      }
    },
    {
      story: 'Um detalhe importante do game loop: nem todo computador roda o jogo na mesma velocidade de quadros por segundo (FPS). Se você mover um personagem "um pixel por frame", ele andará mais rápido em PCs potentes (mais frames por segundo) e mais devagar em PCs fracos. A solução é o <b>delta time</b>: o tempo real que passou desde o último frame, usado pra escalar o movimento.',
      question: {
        prompt: 'Um jogo se move mais rápido em computadores potentes e mais devagar em computadores fracos, mesmo usando exatamente o mesmo código. Qual conceito resolve essa inconsistência?',
        options: [
          'Usar o delta time (tempo desde o último frame) pra escalar o movimento, independente do FPS',
          'Travar o jogo pra rodar só num tipo específico de computador, garantindo a mesma velocidade sempre',
          'Aumentar o tamanho dos sprites, pra o jogo parecer rodar na mesma velocidade em qualquer PC',
          'Isso é normal e não tem solução — todo jogo varia de velocidade dependendo do computador'
        ],
        correctIndex: 0,
        explanation: 'Exato! Multiplicar o movimento pelo delta time garante que o personagem percorra a mesma distância por segundo, não importa quantos frames por segundo o computador consiga rodar.'
      }
    },
    {
      story: 'Assim como o eixo Y controla o vertical, o eixo <b>X</b> controla o horizontal: na maioria das engines, aumentar o valor de X move o elemento pra <b>direita</b>, e diminuir move pra <b>esquerda</b> — isso não muda de sentido como o Y costuma mudar.',
      question: {
        prompt: 'Um personagem precisa andar para a ESQUERDA na tela. O que deve acontecer com o valor do eixo X dele a cada frame?',
        options: [
          'O valor de X deve DIMINUIR a cada frame',
          'O valor de X deve AUMENTAR a cada frame',
          'O valor de Y deve diminuir, X não importa pra movimento horizontal',
          'X e Y precisam mudar juntos sempre'
        ],
        correctIndex: 0,
        explanation: 'Isso! Diferente do Y (que costuma crescer pra baixo), o X segue o sentido "natural": crescer é ir pra direita, diminuir é ir pra esquerda.'
      }
    },
    {
      story: 'Pra saber quando dois elementos se tocam, jogos usam <b>colisores</b>: formas simples (geralmente retângulos) associadas a cada objeto. O método mais comum pra jogos 2D é a <b>colisão AABB</b> (Axis-Aligned Bounding Box), que compara as bordas dos dois retângulos pra saber se eles se sobrepõem.',
      question: {
        prompt: 'Dois personagens estão visualmente se sobrepondo na tela, mas o jogo não registra nenhuma colisão entre eles. O que provavelmente está faltando?',
        options: [
          'Um colisor associado aos personagens e a lógica de detecção de colisão (como AABB) comparando suas bordas',
          'Aumentar o brilho dos sprites, pra ficar mais fácil enxergar visualmente quando eles se encostam de verdade',
          'Diminuir a resolução da tela, pra reduzir a distância visual entre os dois personagens sobrepostos',
          'Trocar a cor de fundo do cenário, pra destacar melhor visualmente os personagens que estão sobrepostos'
        ],
        correctIndex: 0,
        explanation: 'Correto! Sem um colisor e uma lógica de detecção (como comparar as bordas dos retângulos na AABB), o jogo não tem como "saber" que dois elementos se tocaram.'
      }
    },
    {
      story: 'Fechando o RGB: as cores nascem da <b>mistura</b> dos três canais. Vermelho e Verde no máximo, com Azul baixo, formam o <b>amarelo</b>. Os três no máximo formam branco; os três em zero formam preto. Entender essa mistura ajuda a criar exatamente a cor que você imagina.',
      question: {
        prompt: 'Você quer que um sprite fique AMARELO. Quais canais do RGB você deve deixar altos, e qual deve ficar baixo?',
        options: [
          'Vermelho (R) e Verde (G) altos, Azul (B) baixo',
          'Só o canal Azul (B) alto, os outros em zero',
          'Só o canal alpha alto, os outros não importam',
          'Vermelho (R) baixo e os outros dois altos'
        ],
        correctIndex: 0,
        explanation: 'Isso! Misturar Vermelho e Verde no máximo, mantendo o Azul baixo, produz o amarelo — é assim que o sistema RGB combina luz colorida.'
      }
    },
    {
      story: 'Por último: <b>velocidade</b> não é a mesma coisa que <b>posição</b>. A posição é ONDE o objeto está; a velocidade é o QUANTO ela muda a cada frame. Se você for somando velocidade à própria velocidade sem limite (em vez de somar à posição), o personagem acelera pra sempre, sem controle.',
      question: {
        prompt: 'Um personagem começa a acelerar cada vez mais rápido, sem nenhum limite, até sair da tela descontroladamente. O que provavelmente está errado na lógica?',
        options: [
          'A velocidade está sendo acumulada sem limite (ou aplicada à própria velocidade, em vez de à posição), faltando um teto máximo',
          'O personagem está com a cor errada, o que confunde a física do motor do jogo e faz ele acelerar sem controle',
          'Faltou aumentar a resolução da tela pra o motor calcular a posição e a velocidade corretamente a cada frame',
          'O eixo Y foi invertido, fazendo o personagem acelerar pra cima em vez de pra frente na direção certa'
        ],
        correctIndex: 0,
        explanation: 'Exato! Velocidade sem um limite máximo (ou aplicada incorretamente) faz o personagem acelerar indefinidamente — é preciso somar a velocidade à posição a cada frame, e limitar a própria velocidade.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Jogos — Lógica e Algoritmos para Jogos 2D',
      subtitle: 'Aula Teórica · Trilha Lógica e Algoritmos · Turma Jogos Digitais',
      capacidade: 'Reconhecer técnicas e algoritmos utilizados na programação de elementos em jogos.',
      steps: STEPS,
      fileName: 'fund-logica-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Suporte: Lógica e Algoritmos" no Axis para os alunos resolverem chamados de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Jogos — Lógica e Algoritmos para Jogos 2D',
      subtitle: 'Aula Teórica · Trilha Lógica e Algoritmos · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'fund-logica-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "fund_logica_teoria",
    steps: STEPS,
    reportLabel: "Jogos — Lógica e Algoritmos",
    mentor: { rowClass: "eri", avatar: "🦈", name: "Eri, o Guardião do Oceano de Código" },
    finishPassed: {
      title: "Lógica e Algoritmos concluídos!",
      introHtml: "<p>Você já reconhece o game loop, coordenadas 2D, matriz de cenário, sistema de cores/alpha e física básica (gravidade, velocidade, colisão).</p>",
      closingHtml: "<p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Suporte.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>
