<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bia-row{ display:flex; align-items:flex-start; gap:12px; }
  .bia-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bia-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — MOTOR GODOT: O PACMAN POR TRÁS DO CÓDIGO (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">9</span></span>

<script>
  const STEPS = [
        {
              story: "Bem-vindo(a) de volta! Sou a <b>Bia</b>, a joaninha debugger — hoje vamos revisar as decisões técnicas por trás do <b>Pacman</b> que você acabou de construir na Godot. Repare que <code>pacman.gd</code>, <code>ghost.gd</code> e <code>main.gd</code> chamam <code>GameManager.add_score(10)</code> sem NUNCA declarar essa variável em lugar nenhum do código. Isso só funciona porque <code>game_manager.gd</code> foi registrado em <b>Project Settings &gt; Globals &gt; Autoload</b>, com o nome exato <code>GameManager</code> — um Autoload roda como um nó global, carregado antes de qualquer cena, acessível de qualquer script do projeto sem precisar de <code>$caminho</code> nem de referência manual.",
              question: {
                    prompt: "Por que os scripts do jogo conseguem chamar GameManager.add_score(10) sem nunca declarar uma variável chamada GameManager?",
                    options: [
                          "Porque game_manager.gd foi registrado como Autoload com o nome \"GameManager\", virando um singleton global acessível de qualquer script",
                          "Porque toda variável que começa com letra maiúscula na Godot é automaticamente global",
                          "Porque o GDScript cria a variável sozinho na primeira vez que ela é usada",
                          "Porque main.gd declara \"var GameManager\" escondido dentro do _ready()"
                    ],
                    correctIndex: 0,
                    explanation: "Isso! Um Autoload é um nó carregado globalmente antes de qualquer cena, acessível pelo nome que você deu a ele (\"GameManager\") em qualquer script do projeto — sem isso, GameManager.add_score(10) daria erro de variável inexistente."
              }
        },
        {
              story: "O labirinto, o Pacman e os fantasmas do seu jogo não usam nenhum <code>Sprite2D</code> nem <code>AnimatedSprite2D</code> — tudo é desenhado direto por código, dentro da função <code>_draw()</code> de cada script (retângulos pro labirinto, círculos pro Pacman e fantasmas). A Godot chama <code>_draw()</code> automaticamente sempre que o nó precisa ser redesenhado — mas só quando você AVISA que algo mudou, chamando <code>queue_redraw()</code>. Por isso <code>maze.gd</code> chama <code>queue_redraw()</code> toda vez que uma pastilha é comida (dentro de <code>try_eat()</code>): sem isso, o desenho na tela continuaria mostrando a pastilha, mesmo ela já tendo sido \"comida\" nos dados internos do grid.",
              question: {
                    prompt: "Depois de comer uma pastilha, os dados internos do grid mostram que ela sumiu (virou 0), mas o pontinho branco continua aparecendo na tela. Qual é a causa mais provável?",
                    options: [
                          "Faltou chamar queue_redraw() depois de mudar o grid — sem isso, a Godot não chama _draw() de novo pra atualizar o desenho na tela",
                          "A constante CELL_SIZE está errada",
                          "O script maze.gd não tem \"extends Node2D\"",
                          "A pastilha só pode ser removida reiniciando o jogo inteiro"
                    ],
                    correctIndex: 0,
                    explanation: "Isso! _draw() só roda de novo quando você chama queue_redraw() — é o \"avise a Godot que precisa redesenhar\" depois de qualquer mudança visual nos dados."
              }
        },
        {
              story: "Repare como <code>pacman.gd</code> e <code>ghost.gd</code> se movem: em vez de simplesmente somar velocidade à posição a cada frame, o código calcula o centro da PRÓXIMA célula (<code>maze.cell_to_world(current_cell + direction)</code>) e usa <code>position.move_toward(target, SPEED * delta)</code> pra andar até lá — e só quando <code>position == target</code> é que <code>current_cell</code> avança de verdade. Esse é o padrão de \"movimento em grade\": o personagem nunca fica \"no meio do caminho\" quando você troca de direção, e nunca ultrapassa o alvo — por isso ele nunca atravessa uma parede, mesmo sem nenhum CollisionShape2D no jogo.",
              question: {
                    prompt: "Por que o Pacman e os fantasmas nunca atravessam uma parede, mesmo o jogo não usando nenhum CollisionShape2D ou detecção de colisão física?",
                    options: [
                          "Porque o movimento sempre anda até o centro exato da próxima célula (move_toward) e só avança current_cell quando chega lá — e a troca de direção já checa antes se a célula de destino é parede",
                          "Porque toda célula do grid tem uma parede física invisível",
                          "Porque o SPEED é baixo demais pra atravessar qualquer coisa",
                          "Porque _draw() bloqueia automaticamente o movimento em cima de paredes"
                    ],
                    correctIndex: 0,
                    explanation: "Isso! O movimento em grade nunca \"pula\" mais que o necessário pra chegar ao centro da célula-alvo, e a direção só muda quando a próxima célula não é parede (is_wall) — dispensando colisão física de verdade."
              }
        },
        {
              story: "Se você reparar, <code>pacman.gd</code> e <code>ghost.gd</code> NÃO calculam <code>current_cell</code> dentro de <code>_ready()</code> — em vez disso, têm um método <code>initialize()</code>, chamado manualmente por <code>main.gd</code> logo depois de atribuir <code>pacman.maze = maze</code>. O comentário no código é direto: \"NÃO usar _ready aqui: o _ready dos filhos roda antes do _ready do pai\". Na Godot, quando uma cena inicializa, o <code>_ready()</code> de cada nó filho roda ANTES do <code>_ready()</code> do nó pai — então, se o Pacman tentasse usar <code>maze</code> dentro do próprio <code>_ready()</code>, essa variável ainda estaria vazia (null), porque main.gd (o pai) só atribui ela no PRÓPRIO <code>_ready()</code>, que roda depois.",
              question: {
                    prompt: "Por que pacman.gd usa um método próprio chamado initialize() (chamado manualmente por main.gd), em vez de colocar essa mesma lógica dentro de _ready()?",
                    options: [
                          "Porque o _ready() dos nós filhos roda antes do _ready() do nó pai — se initialize() estivesse em _ready(), a variável \"maze\" ainda não teria sido atribuída pelo main.gd nesse momento",
                          "Porque _ready() não existe em Godot 4",
                          "Porque initialize() roda mais rápido que _ready()",
                          "Porque _ready() só funciona em nós do tipo CharacterBody2D"
                    ],
                    correctIndex: 0,
                    explanation: "Isso! A ordem é: _ready() dos filhos primeiro, depois o _ready() do pai. Como main.gd só atribui \"maze\" ao Pacman dentro do próprio _ready(), qualquer código que dependa dessa referência precisa rodar DEPOIS disso — daí o initialize() chamado manualmente, na ordem certa."
              }
        },
        {
              story: "Tanto <code>pacman.gd</code> quanto <code>ghost.gd</code> começam o <code>_process(delta)</code> com a linha <code>delta = min(delta, 0.05)</code>, com o comentário \"trava pico de lag, evita atravessar parede\". O parâmetro <code>delta</code> é o tempo (em segundos) que passou desde o frame anterior — normalmente um valor bem pequeno (perto de 0.016s, a 60 FPS). Mas se o jogo travar por um instante (o computador engasgar, uma janela abrir por cima), um único frame pode demorar bem mais que o normal, e um <code>delta</code> grande multiplicado pela velocidade pode mover o personagem uma distância grande demais NUM SÓ frame.",
              question: {
                    prompt: "Por que o código trava o delta num valor máximo (min(delta, 0.05)) antes de usá-lo pra mover o personagem?",
                    options: [
                          "Porque um pico de lag pode gerar um delta grande demais num único frame — multiplicado pela velocidade, isso moveria o personagem uma distância grande o bastante pra atravessar uma parede",
                          "Porque a Godot exige por padrão um valor máximo de delta",
                          "Porque delta maior que 0.05 trava o jogo inteiro",
                          "Porque isso deixa o jogo mais bonito visualmente"
                    ],
                    correctIndex: 0,
                    explanation: "Isso! Sem esse limite, um frame anormalmente longo (pico de lag) geraria um delta grande, e \"distância = velocidade × delta\" poderia mover o personagem além do centro da célula-alvo — na prática, atravessando uma parede."
              }
        },
        {
              story: "O fantasma tem dois comportamentos bem diferentes, controlados pela variável booleana <code>frightened</code>. Em modo normal, <code>_pick_direction()</code> testa cada direção válida e escolhe a que resulta na MENOR distância até a célula do Pacman (uma perseguição simples, gulosa). Em modo assustado, a mesma função ignora essa lógica e sorteia (<code>randi() % options.size()</code>) entre as direções válidas — o fantasma anda sem rumo. Em ambos os casos, o fantasma nunca escolhe voltar pra célula de onde acabou de vir (<code>if d == -direction: continue</code>), a não ser que seja um beco sem saída (nenhuma outra opção disponível).",
              question: {
                    prompt: "O que muda no comportamento do fantasma quando GameManager.is_frightened vira true (depois do Pacman comer um power pellet)?",
                    options: [
                          "_pick_direction() para de perseguir a célula do Pacman e passa a sortear a direção entre as opções válidas — o fantasma anda sem rumo",
                          "O fantasma para de se mover completamente até o efeito acabar",
                          "O fantasma passa a se mover 2x mais rápido pra fugir",
                          "O script ghost.gd é trocado por outro arquivo automaticamente"
                    ],
                    correctIndex: 0,
                    explanation: "Isso! frightened muda só a ESCOLHA de direção (perseguir vs. sortear) — o resto do movimento (move_toward até o centro da célula) continua idêntico nos dois estados."
              }
        },
        {
              story: "Quando o Pacman come um power pellet, <code>GameManager.start_frightened()</code> liga <code>is_frightened = true</code> e zera um cronômetro (<code>frightened_timer = frightened_time</code>, 6 segundos). O próprio <code>game_manager.gd</code> conta essa contagem regressiva sozinho, dentro do seu <code>_process(delta)</code> — sem precisar que nenhum outro script \"avise\" quando o tempo passou. Em <code>main.gd</code>, a cada frame, cada fantasma recebe <code>ghost.set_frightened(GameManager.is_frightened)</code> — e é só esse booleano que decide, dentro de <code>ghost.gd</code>, se o círculo desenhado fica azul (<code>Color.BLUE if frightened else color</code>) ou da cor normal.",
              question: {
                    prompt: "Depois dos 6 segundos do power pellet, o que faz os fantasmas pararem de ficar azuis e voltarem a perseguir o Pacman?",
                    options: [
                          "O _process(delta) do próprio game_manager.gd conta a contagem regressiva e desliga is_frightened sozinho — main.gd repassa esse valor pra cada fantasma a cada frame, e é ele que decide a cor desenhada e a lógica de perseguição",
                          "Cada fantasma tem seu próprio cronômetro interno, independente dos outros",
                          "O jogador precisa apertar uma tecla pra \"cancelar\" o efeito",
                          "O efeito nunca acaba sozinho — só reiniciando o jogo"
                    ],
                    correctIndex: 0,
                    explanation: "Isso! Um único cronômetro central, dentro do GameManager (Autoload), é a fonte da verdade pro estado \"assustado\" — todo o resto (cor do fantasma, se ele persegue ou sorteia direção) só LÊ esse valor, sem duplicar lógica em cada fantasma."
              }
        },
        {
              story: "Em <code>main.gd</code>, quando um fantasma normal encosta no Pacman, o código não só desconta uma vida — ele também liga <code>invulnerable = true</code> e arma um cronômetro de 1.5 segundos. Enquanto <code>invulnerable</code> estiver ligado, a mesma colisão (fantasma na mesma célula do Pacman) é ignorada pela checagem de \"perder vida\". Sem essa trava, um único encontro com um fantasma poderia descontar VÁRIAS vidas de uma vez só — porque o Pacman e o fantasma continuam na mesma célula por vários frames seguidos, até um dos dois se mover pra célula vizinha.",
              question: {
                    prompt: "Por que main.gd liga uma invulnerabilidade temporária de 1.5s depois de descontar 1 vida, em vez de simplesmente descontar a vida e seguir em frente?",
                    options: [
                          "Porque o Pacman e o fantasma continuam na mesma célula por vários frames seguidos — sem essa trava, um único encontro descontaria várias vidas de uma só vez",
                          "Porque a Godot exige um cooldown de 1.5s entre qualquer colisão",
                          "Porque isso deixa o fantasma mais lento por 1.5s",
                          "Porque sem isso o jogo trava (crash)"
                    ],
                    correctIndex: 0,
                    explanation: "Isso! Cada frame em que os dois ficam na mesma célula, sem a trava, contaria como uma nova colisão — descontando várias vidas de um único encostão. A invulnerabilidade temporária garante que só conta 1 vida por encontro."
              }
        },
        {
              story: "A cena final segue uma árvore específica: <code>Main</code> (com o script main.gd) tem 4 filhos diretos — <code>Maze</code>, <code>Pacman</code>, <code>Ghosts</code> (que por sua vez tem <code>Ghost1</code>, <code>Ghost2</code> e <code>Ghost3</code> dentro) e <code>UI</code> (com <code>ScoreLabel</code> dentro). Repare que <code>Ghosts</code> e <code>UI</code> não têm NENHUM script anexado — eles só existem pra AGRUPAR outros nós (os 3 fantasmas, e o placar), deixando a árvore organizada. É <code>main.gd</code> quem varre esses grupos em <code>_ready()</code>, com <code>$Ghosts.get_children()</code>, pra inicializar os 3 fantasmas sem precisar referenciar cada um manualmente.",
              question: {
                    prompt: "Por que os nós Ghosts e UI não têm nenhum script (.gd) anexado a eles?",
                    options: [
                          "Porque eles servem só pra AGRUPAR outros nós (os 3 fantasmas, e o placar) — main.gd usa $Ghosts.get_children() pra inicializar todos os fantasmas de uma vez, sem precisar de lógica própria em cada agrupador",
                          "Porque nós do tipo CanvasLayer nunca podem ter script",
                          "Porque só o nó raiz de uma cena pode ter script anexado",
                          "Foi esquecido por engano — todo nó deveria ter um script"
                    ],
                    correctIndex: 0,
                    explanation: "Isso! Nem todo nó precisa de lógica própria — Ghosts e UI são só organização da árvore, e main.gd centraliza a inicialização de tudo que está dentro deles."
              }
        }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Codificação de Jogos — Motor Godot: o Pacman por trás do código',
      subtitle: 'Aula Teórica · Trilha Motor Godot (Construa o Pacman) · Turma Jogos Digitais',
      capacidade: 'Explicar as decisões técnicas de um projeto Godot 4 completo (Autoload/singleton, _draw()/queue_redraw(), movimento em grade sem colisão física, ordem de _ready() entre pai e filhos, máquina de estados simples e organização da árvore de nós) a partir de um jogo que o próprio aluno construiu.',
      steps: STEPS,
      fileName: 'cod-godot-teoria-slides.pptx',
      closingTitle: 'Projeto revisado!',
      closingText: 'Se ainda não construiu o jogo, abra primeiro o módulo "Prática — Construa o Pacman no Godot" no Axis — é ele quem libera esta teoria.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos — Motor Godot: o Pacman por trás do código',
      subtitle: 'Aula Teórica · Trilha Motor Godot (Construa o Pacman) · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'cod-godot-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "cod_godot_teoria",
    steps: STEPS,
    reportLabel: "Codificação — Motor Godot: o Pacman por trás do código",
    mentor: { rowClass: "bia", avatar: "🐞", name: "Bia, a Joaninha Debugger" },
    finishPassed: {
      title: "Você entende o Pacman que construiu!",
      introHtml: "<p>Você já sabe explicar por que o GameManager funciona sem ser declarado em lugar nenhum (Autoload), por que o jogo nunca atravessa parede sem nenhum colisor físico, por que initialize() existe em vez de _ready(), e como o estado \"assustado\" se propaga por um único cronômetro central.</p>",
      closingHtml: "<p>Se ainda tiver o projeto aberto na Godot, aproveite pra reler o código com esse olhar novo — cada decisão técnica agora tem um porquê.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>
