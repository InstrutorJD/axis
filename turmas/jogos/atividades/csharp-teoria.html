<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Introdução ao C#: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bia-row{ display:flex; align-items:flex-start; gap:12px; }
  .bia-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bia-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'csharp_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/quiz-teoria-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>C# — INTRODUÇÃO (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">8</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const STEPS = [
    {
      story: 'Oi! Eu sou a <b>Bia</b>, a joaninha debugger da PixelForge Studios. Hoje vamos conhecer o <code>C#</code> ("C sharp") de verdade. Ele foi criado pela <b>Microsoft</b>, lançado em <b>2000</b> junto com a plataforma <b>.NET</b>, e teve como principal arquiteto <b>Anders Hejlsberg</b> — o mesmo engenheiro que antes tinha criado o Turbo Pascal e o Delphi.',
      question: {
        prompt: 'Quem foi o principal arquiteto/criador do C#, contratado pela Microsoft pra esse projeto?',
        options: ['Anders Hejlsberg', 'James Gosling (criador do Java)', 'Guido van Rossum (criador do Python)', 'Brendan Eich (criador do JavaScript)'],
        correctIndex: 0,
        explanation: 'Isso! Anders Hejlsberg liderou a criação do C# na Microsoft, lançado em 2000 junto com o .NET.'
      }
    },
    {
      story: 'Por que a Microsoft criou uma linguagem nova? Na época, quem queria uma linguagem moderna, orientada a objetos e com <b>coleta de lixo automática</b> (a linguagem gerencia a memória sozinha, sem o programador precisar liberar cada pedacinho manualmente) dependia muito do <code>Java</code>, da Sun Microsystems — e licenciar/depender da tecnologia de outra empresa não era o ideal pra Microsoft. O C# nasce como uma linguagem própria, com sintaxe parecida com a do Java, mas sob controle total da Microsoft e integrada à sua nova plataforma .NET.',
      question: {
        prompt: 'Qual foi um dos principais motivos que levou a Microsoft a criar o C#?',
        options: [
          'Ter sua própria linguagem moderna e orientada a objetos, sem depender do Java da Sun, integrada à nova plataforma .NET',
          'Reduzir a dependência de licenciamento do sistema operacional Windows em outros fabricantes de hardware',
          'Criar uma linguagem usada apenas para automatizar planilhas dentro do Microsoft Office',
          'Substituir completamente o HTML e o CSS na criação de páginas e sites da web'
        ],
        correctIndex: 0,
        explanation: 'Exato! A Microsoft queria uma linguagem própria e moderna pra sua plataforma .NET, sem depender do Java de outra empresa.'
      }
    },
    {
      story: 'E por que o C# virou tão famoso especificamente em <b>jogos</b>? A resposta tem nome: <b>Unity</b>. A Unity é uma das engines de desenvolvimento de jogos mais usadas do mundo — de jogos indie a projetos mobile gigantes — e ela adotou o C# como sua linguagem oficial de script. Isso fez milhões de desenvolvedores de jogos aprenderem C# só pra poder usar a Unity.',
      question: {
        prompt: 'Por que o C# é tão associado ao desenvolvimento de jogos hoje em dia?',
        options: [
          'Porque é a linguagem oficial de script da engine Unity, uma das mais usadas do mundo',
          'Porque só roda dentro de consoles de videogame, nunca em PC',
          'Porque foi criada especificamente pra jogos de tabuleiro',
          'Porque substituiu o HTML dentro dos navegadores'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! A adoção do C# pela Unity é o principal motivo dele ser tão popular entre devs de jogos.'
      }
    },
    {
      story: 'Vamos aos <b>pontos positivos</b> do C#: ele tem <b>tipagem forte</b> (o compilador avisa sobre erros de tipo ANTES do jogo rodar, não só quando um jogador tropeça no bug), é totalmente <b>orientado a objetos</b> (ótimo pra organizar um jogo com centenas de scripts — inimigos, itens, interface) e tem <b>coleta de lixo automática</b>, então o programador não precisa gerenciar memória manualmente igual precisaria em C++.',
      question: {
        prompt: 'Qual é uma vantagem real de o C# ter "tipagem forte" e "coleta de lixo automática"?',
        options: [
          'O compilador identifica erros de tipo antes do jogo rodar, e o programador não precisa gerenciar memória manualmente',
          'O código roda direto no navegador sem precisar de compilação ou de nenhuma engine de jogos',
          'Não é mais necessário declarar o tipo de nenhuma variável, em nenhuma situação do código',
          'O jogo sempre roda mais rápido que qualquer outro feito em qualquer outra linguagem, sem exceção'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! Tipagem forte pega erros cedo, e coleta de lixo automática tira do programador o trabalho manual de gerenciar memória.'
      }
    },
    {
      story: 'Outros pontos positivos: o C# tem um <b>ecossistema gigante</b> por trás (a plataforma .NET) e hoje é <b>multiplataforma</b> — dá pra rodar em Windows, Linux e Mac, e a Unity compila o mesmo projeto C# pra PC, celular, console e até navegador. Some a isso uma <b>comunidade enorme</b> (bem maior por causa da Unity): muita documentação, tutorial e gente pra ajudar quando o código não compila.',
      question: {
        prompt: 'Hoje em dia, o C# é uma linguagem...',
        options: [
          'Multiplataforma, com um ecossistema (.NET) e uma comunidade grandes — inclusive por causa da Unity',
          'Que só roda dentro do sistema operacional Windows, sem nenhuma exceção',
          'Sem nenhuma documentação oficial, tutorial ou comunidade ativa por trás',
          'Que não pode ser usada pra nada além de scripts dentro de jogos da Unity'
        ],
        correctIndex: 0,
        explanation: 'Isso! Multiplataforma, com ecossistema robusto (.NET) e comunidade grande — parte dela graças à popularidade da Unity.'
      }
    },
    {
      story: 'Nem tudo são flores — os <b>pontos negativos</b>: o C# é mais <b>verboso</b> que linguagens como GDScript ou Python (precisa declarar o tipo de cada variável, entre outras exigências de sintaxe), tem uma <b>curva de aprendizado maior</b> pra quem tá começando, e historicamente era muito ligado ao ecossistema Windows/Microsoft (hoje isso mudou bastante, mas a fama ainda existe). E pra jogos AAA de altíssima exigência de performance, muitos estúdios preferem <code>C++</code> — mais próximo do hardware — em vez de C#, que é a linguagem preferida por engines como Unreal.',
      question: {
        prompt: 'Qual é um ponto negativo real do C#, comparado a outras linguagens de jogos?',
        options: [
          'É mais verboso (exige declarar tipos) e tem curva de aprendizado maior que linguagens como GDScript ou Python',
          'É impossível de instalar ou rodar fora do sistema operacional Windows',
          'Não existe nenhuma documentação oficial ou comunidade ativa sobre ele',
          'Nunca foi usado em nenhum jogo de sucesso comercial até hoje'
        ],
        correctIndex: 0,
        explanation: 'Exato! A verbosidade (precisa declarar tipo) e a curva de aprendizado maior são pontos negativos reais do C#, especialmente pra quem tá começando.'
      }
    },
    {
      story: 'E quais jogos famosos foram feitos majoritariamente em C#? Como a Unity usa C# como linguagem de script, praticamente todo jogo feito nela tem a maior parte da sua lógica em C#. Exemplos conhecidos: <b>Hollow Knight</b>, <b>Cuphead</b>, <b>Among Us</b>, <b>Cities: Skylines</b>, <b>Subnautica</b>, <b>Rust</b> (o de sobrevivência) e <b>Pokémon GO</b> — todos construídos com Unity, ou seja, com C# fazendo a maior parte do trabalho de gameplay.',
      question: {
        prompt: 'Por que jogos como Hollow Knight, Cuphead, Among Us e Subnautica têm a maior parte da sua programação em C#?',
        options: [
          'Porque foram feitos na engine Unity, que usa C# como linguagem oficial de script',
          'Porque C# é a única linguagem que existe pra jogos indie',
          'Porque foram programados só em HTML e CSS',
          'Porque nenhum deles usa nenhuma engine de jogos'
        ],
        correctIndex: 0,
        explanation: 'Isso! Todos esses são jogos feitos com a engine Unity, então a maior parte da programação de gameplay deles é C#.'
      }
    },
    {
      story: 'Recapitulando: o C# foi criado pela <b>Microsoft</b> em <b>2000</b> (Anders Hejlsberg), como resposta ao Java, pra ter uma linguagem moderna e própria pro .NET. Virou famoso em jogos por causa da <b>Unity</b>. Pontos fortes: tipagem forte, orientação a objetos, coleta de lixo automática, multiplataforma e comunidade grande. Pontos fracos: mais verboso, curva de aprendizado maior, e menos indicado que C++ pra jogos AAA de altíssima performance. E jogos como Hollow Knight, Cuphead e Among Us mostram o C# em ação no mundo real. Agora é hora de ver como o C# se compara ao JavaScript que você já conhece!',
      question: {
        prompt: 'De tudo que vimos, qual é a relação mais direta entre C# e jogos digitais hoje em dia?',
        options: [
          'O C# é a linguagem de script oficial da Unity, uma das engines de jogos mais usadas do mundo',
          'O C# só funciona dentro de planilhas de escritório',
          'O C# foi abandonado pela Microsoft logo depois de criado',
          'O C# nunca teve nenhuma relação com desenvolvimento de jogos'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! É a adoção pela Unity que explica boa parte da fama do C# no mundo dos jogos.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'C# — Introdução',
      subtitle: 'Aula Teórica · Trilha C# · Turma Jogos Digitais',
      capacidade: 'Reconhecer a origem, o propósito e o contexto de uso da linguagem C# no desenvolvimento de jogos, incluindo seus principais pontos fortes e fracos.',
      steps: STEPS,
      fileName: 'csharp-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — JavaScript vs C#" no Axis pra comparar a sintaxe das duas linguagens e escrever seu primeiro código em C#.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'C# — Introdução',
      subtitle: 'Aula Teórica · Trilha C# · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'csharp-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "csharp_teoria",
    steps: STEPS,
    reportLabel: "C# — Introdução",
    mentor: { rowClass: "bia", avatar: "🐞", name: "Bia, a Joaninha Debugger" },
    finishPassed: {
      title: "Introdução ao C# concluída!",
      introHtml: "<p>Você já conhece a história do C#, por que ele foi criado, por que é tão usado em jogos (Unity), seus pontos fortes e fracos, e alguns jogos famosos feitos com ele.</p>",
      closingHtml: "<p>Agora é hora de comparar: volte à trilha e abra a prática que compara C# com o JavaScript que você já viu.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
