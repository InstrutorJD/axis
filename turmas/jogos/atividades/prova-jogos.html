<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Prova Diagnóstica: Turma Jogos Digitais</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#070a06;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }
  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }
  .card p{ font-size:13px; line-height:1.7; margin:0 0 10px; }
  .card .materia-tag{
    display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--green);
    border:1px solid var(--green-dim); padding:3px 8px; border-radius:2px; margin-bottom:10px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(124,255,63,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .gate-card ul{ margin:10px 0 0; padding-left:20px; font-size:13px; line-height:1.8; }
  .gate-card li{ margin-bottom:4px; }
  .gate-card .warn-icon{ font-size:40px; margin-bottom:8px; }
  .token-form{ display:flex; flex-direction:column; gap:12px; max-width:320px; margin-top:16px; }
  .token-form label{ display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .token-form input{
    font-family:inherit; font-size:14px; padding:9px 10px; background:#000; color:var(--ink);
    border:1px solid var(--line); border-radius:2px;
  }
  .token-form input:focus{ outline:none; border-color:var(--green-dim); }
  .token-msg{ font-size:12.5px; padding:8px 10px; border:1px dashed var(--line); }
  .token-msg.erro{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .token-msg.ok{ border-color:var(--green); color:var(--green); }

  /* Overlay de advertência — aparece POR CIMA da prova quando o aluno volta
     pra aba depois de ter saído (ver shared/exam-proctor.js) */
  .warn-overlay{
    position:fixed; inset:0; background:rgba(3,6,3,0.9); z-index:999;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .warn-overlay .card{ max-width:420px; text-align:center; border-color:var(--blood-bright); }
  .warn-overlay .warn-icon{ font-size:44px; margin-bottom:8px; }
  .warn-overlay h2{ color:var(--blood-bright); }
  .warn-overlay p{ font-size:13.5px; line-height:1.7; margin:0 0 14px; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'prova_jogos';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>

</head>
<body>

<div class="env">
  <div class="topbar">
    <div>PROVA — TURMA JOGOS DIGITAIS</div>
    <div>QUESTÃO <span id="lblStepNum">1</span> DE <span id="lblStepTotal">20</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="gateWrap" style="display:none;"></div>
    <div class="story-wrap" id="storyWrap" style="display:none;"></div>
  </div>
</div>

<script>
  const EXAM_SIZE = 20;
  // Prova vale 100 pontos no total, divididos igualmente entre as 20
  // questões — 5 pontos cada, sempre um número redondo (nunca precisa
  // arredondar). O Relatório de Notas (aba Gestão) lê esse valor de dentro
  // de `state.nota`, salvo junto do resto do progresso — ver finishExam()
  // e shared/platform-core.js, renderRelatorioNotas().
  const PONTOS_POR_QUESTAO = 100 / EXAM_SIZE;

  // ============================================================
  // BANCO DE 80 QUESTÕES — cobre todas as matérias/trilhas com
  // conteúdo real trabalhadas na turma Jogos Digitais (Projeto de
  // Vida, Mundo do Trabalho, Introdução ao Desenvolvimento de
  // Projetos, Codificação de Jogos, Fundamentos de Programação de
  // Jogos e Testes de Jogos Digitais). Mesmo esquema de
  // turmas/sistemas/atividades/prova-sistemas.html: 5 alternativas
  // por questão, posição NUNCA fixa (reembaralhadas a cada exibição
  // — ver renderQuestion), e 20 das 80 sorteadas por aluno (ver
  // pickExamIndices). As questões de Projeto de Vida e Mundo do
  // Trabalho reaproveitam o mesmo conteúdo da prova de Sistemas —
  // são exatamente as mesmas trilhas, copiadas entre as duas turmas.
  // Sem NENHUMA questão de Motor Godot (nem conceitual nem prática) —
  // a pedido explícito do professor: a trilha "Motor Godot: Construa
  // o Pacman" é toda roteiro prático + visto do professor + quiz de
  // teoria próprio (ver cod-godot-pratica.html e cod-godot-teoria.html),
  // então não entra também no banco compartilhado desta prova. Pelo
  // mesmo espírito de reforçar código real (não só sintaxe isolada),
  // JavaScript e C# ganharam 2 questões práticas cada (função real de
  // um desafio da trilha), além das 2 conceituais que já existiam pra
  // cada uma.
  const QUESTION_POOL = [
    // ---- Projeto de Vida ----
    {
      materia: 'Projeto de Vida — Autoconhecimento',
      prompt: 'Qual opção descreve corretamente a diferença entre TALENTO e HABILIDADE?',
      options: [
        "Talento é algo que já vem naturalmente fácil; habilidade é um talento treinado com prática",
        "Talento e habilidade são a mesma coisa, só mudam de nome dependendo de quem está explicando",
        "Habilidade vem naturalmente fácil, sem esforço; talento só se constrói com anos de treino árduo",
        "Talento só existe em atividades esportivas, nunca em áreas como música, arte ou tecnologia",
        "Habilidade é sempre mais rara e mais valiosa do que qualquer tipo de talento natural"
      ],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Autoconhecimento',
      prompt: 'Por que os motivadores PESSOAIS de alguém às vezes são diferentes dos motivadores PROFISSIONAIS?',
      options: [
        "Porque o que dá energia na vida como um todo nem sempre é o mesmo que motiva no ambiente de trabalho",
        "Porque uma pessoa só pode ter um único tipo de motivador durante toda a vida, sem nunca mudar",
        "Porque motivadores profissionais sempre anulam por completo qualquer motivador pessoal que exista",
        "Porque isso nunca acontece de verdade — os dois tipos de motivador são sempre idênticos",
        "Porque motivadores pessoais só passam a existir depois que a pessoa se aposenta do trabalho"
      ],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Autoconhecimento',
      prompt: 'Refletir sobre seus pontos fortes, pontos fracos, oportunidades e ameaças (uma ferramenta emprestada do mundo corporativo, aplicada à vida pessoal) é conhecida como:',
      options: [
        'Análise SWOT (ou FOFA) pessoal',
        'Game loop pessoal',
        'Object pooling de carreira',
        'Requisito funcional de vida',
        'Spritesheet de metas'
      ],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Cidadania',
      prompt: 'O direito de uma comunidade a um espaço público limpo, mantido pelo esforço de todos, é um exemplo de direito/dever:',
      options: [
        'Coletivo, porque pertence ao grupo como um todo, não a uma pessoa isolada',
        'Individual, porque cada pessoa cuida só da própria casa',
        'Inexistente — esse tipo de direito/dever não existe',
        'Individual, porque só o prefeito tem essa responsabilidade',
        'Coletivo, mas só quando menos de 10 pessoas moram no local'
      ],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Cidadania',
      prompt: 'Respeitar filas e evitar barulho excessivo à noite são exemplos de:',
      options: [
        "Urbanidade — normas de boa convivência do dia a dia, mesmo sem serem leis escritas",
        "Requisitos funcionais de um sistema de software em desenvolvimento",
        "Cardinalidade de um relacionamento dentro de um modelo de banco de dados",
        "Chaves estrangeiras usadas para conectar duas tabelas de um banco de dados",
        "Tecnologias habilitadoras associadas ao conceito de Indústria 4.0"
      ],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Inteligência Emocional',
      prompt: 'Perceber uma emoção forte (raiva, frustração) e escolher como reagir, em vez de simplesmente explodir no impulso, é a definição de:',
      options: ['Autocontrole', 'Empatia', 'Networking', 'Cardinalidade', 'Urbanidade'],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Inteligência Emocional',
      prompt: 'Se colocar no lugar de alguém ANTES de agir, de forma que suas atitudes causem um impacto melhor nas outras pessoas, é a definição de:',
      options: ['Empatia', 'Autocontrole', 'Adaptabilidade', 'Feedback', 'Networking'],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Equipe',
      prompt: 'Numa equipe organizando um evento, definir que cada pessoa assume uma função clara (um cuida da logística, outro da comunicação) ajuda a evitar principalmente:',
      options: [
        "Duas pessoas fazendo a mesma coisa por engano, ou tarefas importantes sem ninguém responsável",
        "Que a equipe consiga terminar o projeto rápido demais, antes do prazo combinado",
        "Que o evento organizado pela equipe tenha um número muito grande de participantes",
        "Que a equipe precise se comunicar com frequência durante todo o projeto",
        "Que exista qualquer tipo de compromisso da equipe com metas e prazos definidos"
      ],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Equipe',
      prompt: 'Numa equipe, silêncio prolongado sobre o andamento de uma tarefa (o que já foi feito, o que está travado) costuma ser sinal de que:',
      options: [
        'Algo não está indo bem, e falta comunicação constante sobre o progresso',
        'Está tudo perfeito, silêncio é sempre sinal de sucesso',
        'A equipe não precisa mais se comunicar depois da primeira reunião',
        'Os papéis da equipe nunca foram definidos — é a única causa possível',
        'A equipe atingiu 100% das metas'
      ],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Equipe',
      prompt: 'Um colega de equipe recebe uma crítica sobre um erro no trabalho de forma calma, agradece, e ajusta o que precisa — em vez de ficar na defensiva. Essa atitude é um exemplo de saber:',

        'Receber feedback de forma madura',

        'Repassar a culpa pra outra pessoa da equipe',

      ],
      correctIndex: 0

    {
      materia: 'Projeto de Vida — Metas e Carreira',

      options: [
        "Definir uma meta clara de desenvolvimento, usando IA como apoio para estruturar um plano de estudos",
        "Procrastinação, já que ele gastou um bom tempo apenas conversando em vez de estudar direto",
        "Networking, simplesmente porque ele se comunicou com uma ferramenta durante todo o processo",
        "Um objetivo ainda vago, já que ele não decidiu sozinho, sem ajuda nenhuma, quando vai começar",
        "Falta de comprometimento, só por ter usado uma ferramenta externa pra montar o plano de estudos"
      ],
      correctIndex: 0
    },
    {
      materia: 'Projeto de Vida — Metas e Carreira',
      prompt: "Definir uma meta como 'estudar lógica de programação 3 vezes por semana, por 40 minutos, durante os próximos 2 meses' (em vez de só 'quero aprender lógica algum dia') é um exemplo de meta:",
      options: [
        'Específica e mensurável, com prazo definido',
        'Vaga, porque não menciona nenhuma ferramenta de IA',
        'Impossível de cumprir, só por ter um prazo definido',
        'Coletiva, porque envolve mais de uma pessoa',
        'Profissional, nunca podendo ser pessoal ao mesmo tempo'
      ],
      correctIndex: 0
    },

    // ---- Mundo do Trabalho ----
    {
      materia: 'Mundo do Trabalho — Revoluções Industriais',
      prompt: 'A substituição da força humana e animal pela máquina a vapor nas fábricas de tecelagem, no final do século 18, marca qual Revolução Industrial?',
      options: ['1ª Revolução Industrial', '2ª Revolução Industrial', '3ª Revolução Industrial', '4ª Revolução Industrial (Indústria 4.0)', 'Nenhuma revolução industrial específica'],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Revoluções Industriais',
      prompt: 'A introdução de computadores, eletrônica e automação parcial nas linhas de produção, a partir da segunda metade do século 20, marca qual Revolução Industrial?',
      options: ['3ª Revolução Industrial', '1ª Revolução Industrial', '2ª Revolução Industrial', '4ª Revolução Industrial (Indústria 4.0)', 'Nenhuma revolução industrial específica'],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Indústria 4.0',
      prompt: 'O que caracteriza a Indústria 4.0, diferente das revoluções industriais anteriores?',
      options: [
        "Máquinas conectadas entre si e à internet em tempo real, formando sistemas ciber-físicos que decidem com base em dados",
        "O uso da eletricidade dentro das fábricas pela primeira vez ao longo da história da indústria moderna",
        "A substituição total da força humana de trabalho pela máquina a vapor movida por carvão nas fábricas",
        "O surgimento dos primeiros grandes sindicatos organizados de trabalhadores dentro das fábricas industriais",
        "A linha de montagem com produção em massa surgindo pela primeira vez na história da indústria"
      ],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Indústria 4.0',
      prompt: 'Sensores espalhados por uma fábrica coletam dados o tempo todo e enviam pra servidores remotos, que guardam e processam essas informações de qualquer lugar. Que combinação de tecnologias habilitadoras é essa?',
      options: [
        'IoT (sensores) + Nuvem (processamento remoto)',
        'Manufatura aditiva + Robótica colaborativa',
        'Segurança digital + Integração de sistemas',
        'Apenas manufatura aditiva, sozinha',
        'Apenas robótica colaborativa, sozinha'
      ],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Indústria 4.0',
      prompt: 'Um robô que trabalha lado a lado com humanos na linha de produção, dividindo tarefas repetitivas, sem precisar de gaiolas de segurança isolando ele, é chamado de:',
      options: ['Cobot (robô colaborativo)', 'Sensor IoT', 'Servidor de nuvem', 'Impressora 3D', 'Access point'],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Inovação',
      prompt: 'Trocar de ferramenta só porque ela é "mais nova", sem resolver nenhum problema real, é um exemplo de:',
      options: [
        'Mudança por mudança — não é inovação de verdade',
        'Inovação real, por definição',
        'Melhoria contínua aplicada corretamente',
        'Raciocínio dedutivo bem aplicado',
        'Decomposição de um problema complexo'
      ],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Inovação',
      prompt: 'Observar vários casos parecidos e chegar numa regra geral a partir deles é o raciocínio:',
      options: ['Indutivo', 'Dedutivo', 'Hipotético', 'Inferencial isolado', 'Não existe esse tipo de raciocínio'],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Inovação',
      prompt: 'Partir de uma regra geral já conhecida e aplicá-la a um caso específico pra chegar numa conclusão é o raciocínio:',
      options: ['Dedutivo', 'Indutivo', 'Hipotético', 'Inferencial isolado', 'Não existe esse tipo de raciocínio'],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Trabalho em Equipe',
      prompt: 'Numa gestão de conflitos construtiva, em vez de dizer "você errou", a pergunta mais adequada é:',
      options: [
        "\"O que podemos ajustar nesse processo pra isso não acontecer de novo?\"",
        "\"Por que você é sempre desse jeito, sempre errando as mesmas coisas?\"",
        "\"Quem exatamente vai levar a culpa oficial por esse erro que aconteceu?\"",
        "\"Isso aqui nunca vai ter jeito de ser resolvido mesmo, então nem adianta.\"",
        "\"Prefiro não falar mais sobre esse assunto com você nunca mais.\""
      ],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Trabalho em Equipe',
      prompt: 'Durante uma reunião de equipe, ouvir o colega até o fim, sem interromper, e só depois responder ao que ele realmente disse (não ao que você presumiu que ele ia dizer) é um exemplo de:',
      options: ['Escuta ativa', 'Autocontrole', 'Cardinalidade', 'Requisito não funcional', 'Manufatura aditiva'],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Comprometimento',
      prompt: 'Numa simulação de prazo crítico, um aluno precisa terminar um cálculo em um tempo bem curto. Em vez de travar com a pressão, ele respira, organiza os passos e entrega dentro do prazo combinado. Isso é um exemplo de quê?',
      options: [
        'Comprometimento com a meta e autocontrole diante da pressão de tempo',
        'Sorte, já que o cálculo era simples de fazer',
        'Falta de planejamento, pois ele só organizou os passos durante a prova',
        'Um comportamento isolado, sem relação com compromisso ou prazos',
        'Urbanidade, por ter respeitado o tempo dos outros colegas'
      ],
      correctIndex: 0
    },
    {
      materia: 'Mundo do Trabalho — Comprometimento',
      prompt: 'Um integrante da equipe percebe que não vai conseguir entregar sua parte no prazo combinado. Qual atitude demonstra mais comprometimento?',
      options: [
        'Avisar a equipe o quanto antes, explicando o motivo e buscando ajuda ou um novo combinado',
        'Ficar quieto e só explicar depois que o prazo já tiver passado',
        'Entregar qualquer coisa, mesmo incompleta, sem avisar ninguém',
        'Culpar outro colega pelo atraso, sem assumir a própria parte',
        'Esperar que alguém perceba o atraso sozinho, sem falar nada'
      ],
      correctIndex: 0
    },

    // ---- Introdução ao Desenvolvimento de Projetos ----
    {
      materia: 'Introdução ao Dev. de Projetos — Métodos',
      prompt: 'Observar vários casos particulares e chegar a uma regra geral é o método:',
      options: ['Indutivo', 'Dedutivo', 'Hipotético-dedutivo', 'Dialético', 'Nenhum método específico'],
      correctIndex: 0
    },
    {

      prompt: "Um documento descrevendo passo a passo o que fazer (ex: 'abrir o menu, clicar em Novo Jogo'), o resultado ESPERADO, e um campo pra marcar se passou ou falhou, é chamado de:",
      options: ['Caso de teste', 'Escopo', 'Rastreabilidade', 'Cronograma', 'Critério de aceite'],
      correctIndex: 0
    },
    {
      materia: 'Testes — Execução por Versão',
      prompt: 'Na fase em que só a própria equipe do estúdio joga, e várias funcionalidades ainda nem existem, o foco é caçar bugs estruturais grandes. Essa fase é a:',
      options: ['Alfa', 'Beta', 'Release Candidate', 'Gold', 'Smoke Test'],
      correctIndex: 0
    },
    {
      materia: 'Testes — Execução por Versão',
      prompt: 'Por que o ambiente de testes deve ficar separado do ambiente de produção (o que os jogadores de verdade usam)?',
      options: [
        "Porque rodar testes usando contas e dados reais de jogadores é arriscado e pode corromper progresso real",
        "Porque o ambiente de produção, por padrão, não aceita nenhum tipo de teste automatizado",
        "Porque testes automatizados, nessa engine, só chegam a funcionar em computadores mais fracos",
        "Não existe um motivo real por trás disso — é apenas uma formalidade sem efeito prático",
        "Porque o ambiente de testes sempre precisa de uma conexão de internet muito mais rápida que o normal"
      ],
      correctIndex: 0
    },
    {
      materia: 'Testes — Roteiros Avançados',
      prompt: 'Um checklist rápido que confere só o básico (o jogo abre, a tela inicial carrega, o controle responde, fecha sem travar) antes de uma publicação, sem substituir um teste completo, é chamado de:',
      options: ['Smoke Test', 'Teste de Regressão', 'Teste Exploratório', 'Certificação Técnica', 'Teste de Plataforma'],
      correctIndex: 0
    },
    {
      materia: 'Testes — Roteiros Avançados',
      prompt: 'Depois de corrigir um bug, a equipe roda de novo os testes de funcionalidades que já estavam funcionando antes, só pra garantir que a correção não quebrou nada que já funcionava. Esse é o teste de:',
      options: ['Regressão', 'Smoke Test', 'Teste Exploratório', 'Certificação Técnica', 'Teste de Plataforma'],
      correctIndex: 0
    }
  ];

  // ============================================================
  // SORTEIO: 20 das 80, embaralhadas — recalculado só na primeira
  // vez que o aluno clica "Iniciar" (persistido em SELECTION_KEY
  // pra não mudar no meio de uma tentativa em andamento). As
  // ALTERNATIVAS de cada questão são reembaralhadas a cada exibição
  // (ver renderQuestion).
  function shuffleIndexes(length) {
    const arr = Array.from({ length }, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function pickExamIndices() {
    return shuffleIndexes(QUESTION_POOL.length).slice(0, EXAM_SIZE);
  }

  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `prova_jogos_progress_${username}`;
  const SELECTION_KEY = `prova_jogos_selecao_${username}`;
  const STATE_KEY = `prova_jogos_estado_${username}`;

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveProgress(data) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }

  function loadSelection() {
    try {
      const arr = JSON.parse(localStorage.getItem(SELECTION_KEY) || 'null');
      if (Array.isArray(arr) && arr.length === EXAM_SIZE && arr.every(n => Number.isInteger(n) && n >= 0 && n < QUESTION_POOL.length)) return arr;
    } catch (e) {}
    return null;
  }
  function saveSelection(arr) { localStorage.setItem(SELECTION_KEY, JSON.stringify(arr)); }

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
      if (s && typeof s.currentIndex === 'number' && typeof s.correctCount === 'number') return s;
    } catch (e) {}
    return null;
  }
  function saveState(s) { localStorage.setItem(STATE_KEY, JSON.stringify(s)); }

  // IMPORTANTE: o sorteio das 20 questões só acontece dentro de
  // startExam() (clique em "Iniciar prova"), nunca só por carregar a
  // página — senão toda visita (inclusive antes do aluno ver as regras)
  // já "começaria" uma tentativa. `selection` existir é o sinal real de
  // "essa tentativa já foi iniciada" (ver boot()), independente do valor
  // de currentIndex (que começa em 0 e fica 0 até a 1ª resposta).
  let selection = loadSelection();
  let state = loadState();
  const alreadyDone = loadProgress();

  // Pergunta salva já respondida -> resume na PRÓXIMA (mesmo esquema anti-
  // "recarrega e tenta de novo" do shared/quiz-teoria-engine.js).
  let currentIndex = state ? (state.answered ? state.currentIndex + 1 : state.currentIndex) : 0;
  let correctCount = state ? state.correctCount : 0;

  function startExam() {
    selection = pickExamIndices();
    saveSelection(selection);
    state = { currentIndex: 0, correctCount: 0, answered: false };
    saveState(state);
    currentIndex = 0;
    correctCount = 0;
  }

  // Botão exclusivo do professor (pré-visualizando com seu próprio usuário)
  // pra testar o sorteio: apaga a seleção/estado/progresso salvos sob o
  // login dele e sorteia 20 questões novas na hora, sem afetar nenhum
  // aluno (cada um tem sua própria SELECTION_KEY/STATE_KEY/PROGRESS_KEY).
  function resetForProfessor() {
    localStorage.removeItem(SELECTION_KEY);
    localStorage.removeItem(STATE_KEY);
    localStorage.removeItem(PROGRESS_KEY);
    startExam();
    storyWrap.innerHTML = '';
    renderQuestion();
  }

  const gateWrap = document.getElementById('gateWrap');
  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');
  lblStepTotal.textContent = EXAM_SIZE;

  let isProfessor = false;
  (async function () {
    const user = window.PortalSession ? await window.PortalSession.getUser() : null;
    isProfessor = !!(user && user.role === 'professor');
  })();

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('prova_jogos', label, { step: currentIndex + 1, total: EXAM_SIZE, correctCount });
    }
  }

  function updateProgressBar() {
    const pct = Math.round((currentIndex / EXAM_SIZE) * 100);
    progressFill.style.width = Math.min(pct, 100) + '%';
    lblStepNum.textContent = Math.min(currentIndex + 1, EXAM_SIZE);
  }

  function renderQuestion() {
    storyWrap.style.display = 'flex';
    gateWrap.style.display = 'none';
    updateProgressBar();

    const q = QUESTION_POOL[selection[currentIndex]];
    reportStep(`Prova — Questão ${currentIndex + 1}/${EXAM_SIZE}`);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<span class="materia-tag">${q.materia}</span><h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D', 'E'];
    let answered = false;

    const order = shuffleIndexes(q.options.length);
    const correctPos = order.indexOf(q.correctIndex);

    // Fecha a questão (respondida OU pulada) e mostra o botão de avançar —
    // usado tanto por selectAnswer quanto por skipQuestion, já que dali pra
    // frente o fluxo é idêntico nos dois casos.
    function proceedAfterAnswer(stepLabel) {
      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.style.marginTop = '14px';
      actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">${currentIndex + 1 >= EXAM_SIZE ? 'Ver resultado' : 'Próxima →'}</button>`;
      card.appendChild(actions);

      state = { currentIndex, correctCount, answered: true };
      saveState(state);
      reportStep(`Prova — Questão ${currentIndex + 1}/${EXAM_SIZE} (${stepLabel})`);

      document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
        currentIndex++;
        if (currentIndex >= EXAM_SIZE) {
          finishExam();
        } else {
          state = { currentIndex, correctCount, answered: false };
          saveState(state);
          storyWrap.innerHTML = '';
          renderQuestion();
        }
      });
    }

    function selectAnswer(chosenIdx) {
      const allOptionEls = optionsWrap.querySelectorAll('.option');
      allOptionEls.forEach(el => el.classList.add('disabled'));
      pularWrap.remove();

      const isCorrect = chosenIdx === correctPos;
      allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
      if (isCorrect) correctCount++;

      const feedback = document.createElement('div');
      feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
      feedback.textContent = isCorrect ? '✅ Resposta registrada.' : '❌ Resposta registrada.';
      card.appendChild(feedback);

      proceedAfterAnswer('respondida');
    }

    // Pular: o aluno abre mão da questão atual (não conta como acerto) em
    // troca de seguir em frente sem responder — mesma trava de "não dá pra
    // responder de novo depois" da resposta normal (answered: true).
    function skipQuestion() {
      const allOptionEls = optionsWrap.querySelectorAll('.option');
      allOptionEls.forEach(el => el.classList.add('disabled'));
      pularWrap.remove();

      const feedback = document.createElement('div');
      feedback.className = 'feedback incorrect';
      feedback.textContent = '⏭️ Questão pulada — não conta como acerto.';
      card.appendChild(feedback);

      proceedAfterAnswer('pulada');
    }

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);
    });

    card.appendChild(optionsWrap);

    const pularWrap = document.createElement('div');
    pularWrap.className = 'actions';
    pularWrap.style.marginTop = '10px';
    pularWrap.innerHTML = `<button class="btn btn-secondary" id="btnPularQuestao">⏭️ Pular questão (perde esta questão, sem chance de responder de novo)</button>`;
    card.appendChild(pularWrap);

    if (isProfessor) {
      const profActions = document.createElement('div');
      profActions.className = 'actions';
      profActions.style.marginTop = '10px';
      profActions.innerHTML = `
        <button class="btn btn-secondary" id="btnResetProfessor">🔄 Reiniciar prova (professor)</button>
        <button class="btn btn-secondary" id="btnSkipProfessor">⏭️ Pular (professor)</button>
      `;
      card.appendChild(profActions);
    }

    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);

    document.getElementById('btnPularQuestao').addEventListener('click', () => {
      if (answered) return;
      answered = true;
      skipQuestion();
    });

    if (isProfessor) {
      // Reinicia com uma seleção de 20 questões nova (embaralhada de novo),
      // só pra conferir que o sorteio/embaralhamento está funcionando —
      // não afeta a tentativa de nenhum aluno.
      document.getElementById('btnResetProfessor').addEventListener('click', resetForProfessor);
      document.getElementById('btnSkipProfessor').addEventListener('click', () => {
        currentIndex++;
        if (currentIndex >= EXAM_SIZE) {
          finishExam(true);
        } else {
          state = { currentIndex, correctCount, answered: false };
          saveState(state);
          storyWrap.innerHTML = '';
          renderQuestion();
        }
      });
    }
  }

  function finishExam(reviewOnly) {
    const nota = Math.round(correctCount * PONTOS_POR_QUESTAO);
    if (!reviewOnly) {
      saveProgress({ completed: true, correctCount, total: EXAM_SIZE, nota, finishedAt: new Date().toISOString() });
      reportStep(`Prova — Concluída (${correctCount}/${EXAM_SIZE} — nota ${nota}/100)`);
      window.PortalExamGuard && guard && window.PortalExamGuard.disarm(guard);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = EXAM_SIZE;

    // Abaixo de 60 pontos não é hora de comemorar (🏁/"!") — a tela vira
    // um aviso neutro apontando pra reforçar o conteúdo, não um elogio.
    const aprovado = nota >= 60;

    storyWrap.innerHTML = `
      <div class="card finish-screen">
        <div class="trophy">${aprovado ? '🏁' : '📋'}</div>
        <h2>Prova concluída${aprovado ? '!' : ''}</h2>
        <p>Sua prova foi entregue e registrada — não é possível refazer esta tentativa.</p>
        <div class="score">Nota: ${nota} de 100 pontos</div>
        <p>Você acertou ${correctCount} de ${EXAM_SIZE} questões — cada uma vale ${PONTOS_POR_QUESTAO} pontos.</p>
        ${aprovado
          ? '<p>O professor já pode conferir sua nota na aba Gestão.</p>'
          : '<p>Esse resultado aponta conteúdos que ainda precisam de reforço. O professor já pode ver sua nota na aba Gestão e te ajudar a focar onde estudar mais.</p>'}
        ${isProfessor ? '<div class="actions" style="justify-content:center; margin-top:10px;"><button class="btn btn-secondary" id="btnResetProfessor">🔄 Reiniciar prova (professor)</button></div>' : ''}
      </div>
    `;

    if (isProfessor) {
      document.getElementById('btnResetProfessor').addEventListener('click', resetForProfessor);
    }
  }

  // ============================================================
  // GATE (regras + trava anti-saída) e TELA DE BLOQUEIO — mesmo
  // padrão de modelagem-dados-requisitos-questionario.html /
  // prova-sistemas.html (shared/exam-proctor.js).
  // ============================================================
  let guard = null;

  function renderWarningOverlay(count, onDismiss) {
    const overlay = document.createElement('div');
    overlay.className = 'warn-overlay';
    overlay.innerHTML = `
      <div class="card">
        <div class="warn-icon">⚠️</div>
        <h2>Advertência ${count}/2</h2>
        <p>Você saiu da aba/janela do portal durante a prova. Isso conta como uma advertência.<br>
        Na <b>2ª advertência</b>, a prova é <b>bloqueada</b> — só o professor consegue liberar de novo.</p>
        <div class="actions" style="justify-content:center;">
          <button class="btn" id="btnWarnOk">Entendi, continuar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('btnWarnOk').addEventListener('click', () => {
      overlay.remove();
      if (onDismiss) onDismiss();
    });
  }

  function renderBlockedScreen() {
    storyWrap.style.display = 'none';
    gateWrap.style.display = 'flex';
    progressFill.style.width = '0%';
    gateWrap.innerHTML = `
      <div class="card gate-card" style="text-align:center;">
        <div class="warn-icon">🔒</div>
        <h2>Prova bloqueada</h2>
        <p>Você saiu da aba/janela do portal 2 vezes durante a prova. Por isso, esta atividade foi bloqueada.</p>
        <p>Procure o professor. Ele pode liberar de novo com o mesmo token que usa pra "Dar visto" (Gestão → "Token — Dar Visto / Pular Etapa").</p>
        <div class="token-form" style="margin-left:auto; margin-right:auto; text-align:left;">
          <label>Token do professor
            <input type="text" id="unlockToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnUnlock">Desbloquear</button>
          <div class="token-msg" id="unlockMsg" style="display:none;"></div>
        </div>
      </div>
    `;
    const btnUnlock = document.getElementById('btnUnlock');
    const unlockMsg = document.getElementById('unlockMsg');
    btnUnlock.addEventListener('click', async () => {
      const t = document.getElementById('unlockToken').value;
      unlockMsg.style.display = 'none';
      if (!t) {
        unlockMsg.className = 'token-msg erro';
        unlockMsg.textContent = 'Informe o token do professor.';
        unlockMsg.style.display = 'block';
        return;
      }
      btnUnlock.disabled = true;
      btnUnlock.textContent = 'Verificando...';
      const result = await window.PortalExamGuard.unlock(guard, t);
      if (!result.ok) {
        unlockMsg.className = 'token-msg erro';
        unlockMsg.textContent = result.erro;
        unlockMsg.style.display = 'block';
        btnUnlock.disabled = false;
        btnUnlock.textContent = 'Desbloquear';
        return;
      }
      renderStartScreen();
    });
  }

  function renderStartScreen() {
    storyWrap.style.display = 'none';
    gateWrap.style.display = 'flex';
    progressFill.style.width = '0%';
    gateWrap.innerHTML = `
      <div class="card gate-card">
        <h2>📋 Prova Diagnóstica — Turma Jogos Digitais</h2>
        <p>Esta é uma prova diagnóstica: o objetivo é identificar o que você já aprendeu (e o que ainda precisa reforçar) em TODAS as matérias trabalhadas até agora — Projeto de Vida, Mundo do Trabalho, Introdução ao Desenvolvimento de Projetos, Codificação de Jogos, Fundamentos de Programação de Jogos e Testes de Jogos Digitais.</p>
        <ul>
          <li>Existe um banco de <b>80 questões</b> — você vai responder <b>20</b>, sorteadas aleatoriamente pro seu login.</li>
          <li>Cada questão tem <b>5 alternativas</b>, sempre embaralhadas — não decore posição, leia com atenção.</li>
          <li>Você tem <b>uma única tentativa oficial</b>. Ao final, sua pontuação fica registrada pro professor.</li>
          <li>Dá pra <b>pular uma questão</b> sem responder — mas ela conta como <b>errada</b>, sem chance de voltar depois.</li>
          <li>A partir do momento que você clicar em "Iniciar", <b>não saia da aba/janela do portal</b> até terminar.</li>
          <li>Se você sair (trocar de aba, minimizar, trocar de app ou <b>clicar em outra janela, mesmo com a tela dividida</b>), recebe uma <b>advertência</b>.</li>
          <li><b>Copiar, colar e arrastar texto</b> ficam bloqueados durante toda a prova.</li>
          <li>Na <b>2ª advertência</b>, a prova é <b>bloqueada</b> — só o professor libera de novo.</li>
        </ul>
        <div class="actions" style="margin-top:14px;">
          <button class="btn" id="btnIniciar">▶ Iniciar prova</button>
        </div>
      </div>
    `;
    document.getElementById('btnIniciar').addEventListener('click', () => {
      startExam();
      window.PortalExamGuard.arm(guard, {
        onWarning: (count) => renderWarningOverlay(count, () => {}),
        onBlocked: () => renderBlockedScreen()
      });
      renderQuestion();
    });
  }

  // Gabarito: lista o BANCO INTEIRO de 80 questões (não só as 20 que um
  // aluno específico recebeu), agrupado por matéria — referência completa
  // pro professor, sem precisar abrir esta tela.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Prova Diagnóstica — Turma Jogos Digitais — Banco de 80 questões',
      subtitle: 'Diagnóstico (20 sorteadas de 80, por aluno) · Turma Jogos Digitais',
      items: QUESTION_POOL.map((q, i) => ({
        number: i + 1,
        title: q.materia,
        prompt: q.prompt,
        options: q.options,
        correctIndex: q.correctIndex,
        answer: q.options[q.correctIndex]
      })),
      fileName: 'prova-jogos-gabarito.txt'
    });
  };

  (async function boot() {
    guard = await window.PortalExamGuard.create('prova_jogos');

    if (alreadyDone && alreadyDone.completed) {
      correctCount = alreadyDone.correctCount;
      finishExam(true);
      return;
    }

    if (guard.disabled) {
      // Sem sessão de aluno reconhecida (professor pré-visualizando, ou
      // iframe oculto da Gestão) — abre a prova direto, sem tela de regras
      // nem trava, sorteando uma seleção de preview se ainda não existir.
      if (!selection) startExam();
      renderQuestion();
      return;
    }

    if (guard.blocked) {
      renderBlockedScreen();
    } else if (selection) {
      // `selection` existir é o sinal de que essa tentativa já foi
      // iniciada antes (ex.: recarregou a página no meio) — volta direto
      // pra prova, sem passar pela tela de regras de novo.
      window.PortalExamGuard.arm(guard, {
        onWarning: (count) => renderWarningOverlay(count, () => {}),
        onBlocked: () => renderBlockedScreen()
      });
      if (currentIndex >= EXAM_SIZE) {
        // Respondeu tudo e saiu antes de ver o resultado — fecha a
        // tentativa de verdade agora, em vez de tentar renderizar uma
        // 21ª pergunta que não existe.
        finishExam();
      } else {
        renderQuestion();
      }
    } else {
      renderStartScreen();
    }
  })();
</script>

<script src="../../../shared/vlibras-widget.js"></script>
