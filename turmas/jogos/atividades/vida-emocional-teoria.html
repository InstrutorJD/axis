<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Inteligência Emocional e Relacionamentos: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .uma-row{ display:flex; align-items:flex-start; gap:12px; }
  .uma-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .uma-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'vida_emocional_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/quiz-teoria-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>PROJETO DE VIDA — INTELIGÊNCIA EMOCIONAL (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const STEPS = [
    {
      story: 'Oi! Eu sou a <b>Uma</b>, a coruja mentora da PixelForge Studios. Vamos falar de <b>inteligência emocional</b>, começando pelo <b>autocontrole</b>: a capacidade de perceber uma emoção forte (frustração, raiva, ansiedade) e escolher como reagir, em vez de simplesmente explodir no impulso. Não é "não sentir" a emoção — é sentir e ainda assim escolher uma resposta equilibrada.',
      question: {
        prompt: 'Um dev perde horas de trabalho porque esqueceu de salvar um arquivo. Ele sente uma raiva forte, respira, espera alguns minutos e só depois volta a mexer no código, evitando digitar algo por impulso. Isso é um exemplo de quê?',
        options: [
          'Autocontrole — perceber a emoção forte e escolher uma resposta equilibrada, em vez de agir por impulso',
          'Falta de emoção — ele simplesmente não sentiu nenhuma raiva nesse exato momento do erro',
          'Networking, já que ele estava pensando em pedir ajuda pra outras pessoas do time depois',
          'Nenhuma habilidade emocional envolvida ali, foi só uma reação totalmente aleatória dele'
        ],
        correctIndex: 0,
        explanation: 'Isso! Sentir a raiva e mesmo assim escolher esperar antes de agir, em vez de reagir por impulso, é exatamente autocontrole.'
      }
    },
    {
      story: 'Já a <b>adaptabilidade</b> (ou flexibilidade emocional) é a capacidade de se ajustar bem diante de mudanças inesperadas, sem travar emocionalmente. Planos mudam o tempo todo — quem tem adaptabilidade consegue reorganizar as próprias expectativas rápido, em vez de ficar preso à frustração de "não era assim que eu tinha planejado".',
      question: {
        prompt: 'Um estagiário planejou terminar uma tarefa até sexta, mas o escopo muda no meio da semana. Em vez de travar de frustração, ele reorganiza rapidamente suas expectativas e ajusta o plano pra nova realidade. Isso ilustra qual habilidade?',
        options: [
          'Adaptabilidade/flexibilidade emocional diante de mudanças inesperadas',
          'Autocontrole, mas sem nenhuma relação direta com essa mudança de escopo',
          'Networking com outras pessoas envolvidas no mesmo projeto',
          'Feedback recebido de um colega sobre a qualidade da tarefa'
        ],
        correctIndex: 0,
        explanation: 'Exato! Reorganizar expectativas rapidamente diante de uma mudança inesperada, sem travar, é a marca da adaptabilidade emocional.'
      }
    },
    {
      story: 'A <b>empatia</b> conecta diretamente as suas <b>atitudes</b> ao <b>comportamento</b> das outras pessoas: quando você se coloca no lugar de alguém antes de agir, tende a escolher atitudes que geram um impacto melhor nos outros — e isso volta pra você em forma de relações mais saudáveis.',
      question: {
        prompt: 'Antes de dar um retorno duro sobre o trabalho de um colega, uma pessoa para e pensa em como ele provavelmente vai se sentir ao ouvir aquilo — e escolhe palavras mais cuidadosas, sem perder a honestidade. Que habilidade está sendo usada?',
        options: [
          'Empatia — pensar no impacto da própria atitude no comportamento/sentimento do outro',
          'Autocontrole, sem nenhuma relação direta com o sentimento do outro colega ali',
          'Networking, só porque a situação envolve conversar diretamente com outra pessoa',
          'Nenhuma habilidade emocional envolvida ali, foi apenas educação básica bem comum'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Pensar em como sua atitude vai impactar o outro, antes de agir, é o núcleo da empatia.'
      }
    },
    {
      story: '<b>Dar e receber feedback</b> também exige inteligência emocional: pra dar, é preciso equilibrar honestidade com cuidado; pra receber, é preciso controlar a reação defensiva imediata e realmente escutar o que foi dito, mesmo quando dói um pouco.',
      question: {
        prompt: 'Um dev recebe uma crítica sobre a qualidade do seu código. Em vez de se defender imediatamente, ele respira, agradece o retorno e pergunta exemplos específicos pra entender melhor o que pode melhorar. Isso ilustra qual habilidade?',
        options: [
          'Inteligência emocional ao receber feedback — controlar a reação defensiva e realmente escutar',
          'Falta de autocontrole, já que ele hesitou um pouco antes de responder à crítica recebida',
          'Networking, mesmo sem nenhuma relação real com o feedback recebido nesse momento',
          'Adaptabilidade emocional, mas sem nenhuma relação direta com esse tipo de feedback'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! Controlar o impulso defensivo e buscar entender o feedback de verdade é inteligência emocional aplicada aos relacionamentos.'
      }
    },
    {
      story: 'Por fim, existem as <b>redes de relacionamento</b> (<b>networking</b>): cultivar conexões genuínas com outras pessoas, baseadas em interesse real e troca mútua — não em "usar" alguém só quando você precisa de algo. Uma boa rede se constrói com tempo, ajudando os outros também, não só pedindo ajuda quando é conveniente. Agora você já reconhece autocontrole, adaptabilidade, empatia, feedback com inteligência emocional e como construir relações genuínas!',
      question: {
        prompt: 'Uma pessoa mantém contato com colegas de outros projetos mesmo quando não precisa de nada deles, trocando ideias e ajudando quando pode. Meses depois, quando precisa de uma indicação, várias pessoas se dispõem a ajudar de volta. O que essa história ilustra?',
        options: [
          'Networking genuíno — construir conexões reais com o tempo, não só quando é conveniente',
          'Que ela só teve muita sorte, sem nenhuma habilidade emocional envolvida nessa história',
          'Autocontrole, sem nenhuma relação direta com esse tipo de relacionamento profissional',
          'Falta de empatia, já que ela ajudou várias pessoas diferentes ao mesmo tempo'
        ],
        correctIndex: 0,
        explanation: 'Isso! Construir conexões genuínas ao longo do tempo, sem interesse imediato, é exatamente o que sustenta um bom networking.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Projeto de Vida — Inteligência Emocional e Relacionamentos',
      subtitle: 'Aula Teórica · Trilha Inteligência Emocional e Relacionamentos · Turma Jogos Digitais',
      capacidade: 'Identificar as habilidades socioemocionais que impactam nos relacionamentos interpessoais / Avaliar o impacto de atitudes e comportamentos próprios com relação às demais pessoas.',
      steps: STEPS,
      fileName: 'vida-emocional-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central do Projeto de Vida: Inteligência Emocional" no Axis para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Projeto de Vida — Inteligência Emocional e Relacionamentos',
      subtitle: 'Aula Teórica · Trilha Inteligência Emocional e Relacionamentos · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'vida-emocional-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "vida_emocional_teoria",
    steps: STEPS,
    reportLabel: "Projeto de Vida — Inteligência Emocional",
    mentor: { rowClass: "uma", avatar: "🦉", name: "Uma, a Coruja Mentora" },
    finishPassed: {
      title: "Inteligência Emocional concluída!",
      introHtml: "<p>Você já reconhece autocontrole, adaptabilidade emocional, empatia, feedback com inteligência emocional e o que sustenta um networking genuíno.</p>",
      closingHtml: "<p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central do Projeto de Vida.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
