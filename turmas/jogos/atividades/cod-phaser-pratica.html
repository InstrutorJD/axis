§§§javascript
function criar() {
  paredes = this.physics.add.staticGroup();
  moedas = this.physics.add.staticGroup();

  for (let linha = 0; linha < mapa.length; linha++) {
    for (let coluna = 0; coluna < mapa[linha].length; coluna++) {
      const x = coluna * tamanhoBloco + tamanhoBloco / 2;
      const y = linha * tamanhoBloco + tamanhoBloco / 2;
      if (mapa[linha][coluna] === '1') {
        paredes.create(x, y, 'parede');
      } else {
        moedas.create(x, y, 'moeda');
      }
    }
  }

- ¤staticGroup()¤ cria um grupo de objetos de física que **não se movem** (paredes e moedas nunca andam) — mais leve que um grupo dinâmico.
- O laço duplo percorre cada linha e coluna do ¤mapa¤. ¤x¤/¤y¤ convertem a posição na grade (coluna/linha) pra posição em pixels na tela, centralizando o objeto dentro do bloco de ¤tamanhoBloco¤ pixels.
- Onde o mapa tem ¤'1'¤, nasce uma parede; em qualquer outro caractere, nasce uma moeda.

§§§javascript
  // movimento simples dos inimigos: direção aleatória, muda periodicamente
  [inimigo1, inimigo2].forEach(inimigo => {

- Cada fantasma ganha uma propriedade extra ¤direcao¤ (um vetor 2D) — o Phaser não tem isso por padrão num sprite, o código simplesmente anexa a propriedade no objeto.

  moeda.destroy();

  textoPontuacao.setText('Pontos: ' + pontuacao);

    encerrarJogo(this, 'Você venceu!');

}

function colidirComInimigo() {
  encerrarJogo(this, 'Game Over');

function encerrarJogo(cena, mensagem) {

    fill: '#fff',
    align: 'center'
  }).setOrigin(0.5).setDepth(10);
}

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de cod-godot-pratica.html.
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }
