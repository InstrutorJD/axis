### Código completo para conferir

§§§javascript
const configuracao = {
  type: Phaser.AUTO,
  width: 640,
  height: 360,
  backgroundColor: '#1d2b3a',
  pixelArt: true,
  physics: { default: 'arcade' },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: { preload: preCarregar, create: criar, update: atualizar }
};

const VELOCIDADE = 200;
let heroi;
let teclas;
let wasd;

function preCarregar() {
  this.load.spritesheet('heroi', 'andando.png', { frameWidth: 32, frameHeight: 32 });
}

function criar() {
  // chão: a área onde o personagem pode andar
  this.add.rectangle(320, 280, 640, 160, 0x2e6b3f);
  this.physics.world.setBounds(0, 200, 640, 160);

  heroi = this.physics.add.sprite(320, 280, 'heroi');
  heroi.setScale(3);
  heroi.setCollideWorldBounds(true);
  teclas = this.input.keyboard.createCursorKeys();
  wasd = this.input.keyboard.addKeys('W,A,S,D');

  // animação de andar: quadros 1 e 2 da folha, 8 por segundo, sem parar
  this.anims.create({
    key: 'andar',
    frames: this.anims.generateFrameNumbers('heroi', { start: 1, end: 2 }),
    frameRate: 8,
    repeat: -1
  });
}

function atualizar() {
  heroi.setVelocity(0);

  if (teclas.left.isDown || wasd.A.isDown) {
    heroi.setVelocityX(-VELOCIDADE);
    heroi.setFlipX(true);
  } else if (teclas.right.isDown || wasd.D.isDown) {
    heroi.setVelocityX(VELOCIDADE);
    heroi.setFlipX(false);
  }

  if (teclas.up.isDown || wasd.W.isDown) {
    heroi.setVelocityY(-VELOCIDADE);
  } else if (teclas.down.isDown || wasd.S.isDown) {
    heroi.setVelocityY(VELOCIDADE);
  }

  // na diagonal, a mesma velocidade das retas
  heroi.body.velocity.normalize().scale(VELOCIDADE);

  if (heroi.body.velocity.length() > 0) {
    heroi.anims.play('andar', true);
  } else {
    heroi.anims.stop();
    heroi.setFrame(0);
  }
}

new Phaser.Game(configuracao);
§§§

- [ ] Na diagonal, ele anda na mesma velocidade que na reta
- [ ] Continua preso no chão, sem erro no Console`

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de cod-phaser-final-pratica.html.
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        // Lista que continua depois de um bloco de código começa no número escrito.
        const inicio = parseInt(line, 10);
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += `<ol class="md-list"${inicio > 1 ? ` start="${inicio}"` : ''}>` + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }

  function reportStep(label) {

        <span class="ab-nav-dica">use ← → do teclado</span>

  let direcao = 1;
  function irPara(i) {
    direcao = i < currentIndex ? -1 : 1;
    currentIndex = Math.max(0, Math.min(i, STEPS.length));
    renderStep();
  }
  function mostrarEtapa() {
    document.getElementById('palco').scrollTop = 0;
    window.AulaBase.transicao(stepWrap.querySelector('.ab-cartao'), direcao);
  }
  window.AulaBase.teclado({
    proximo: () => { const b = document.getElementById('btnNext'); if (b) b.click(); },
    anterior: () => { const b = document.getElementById('btnBack'); if (b) b.click(); },
  });

  function renderStep() {
    if (currentIndex >= STEPS.length) { renderVisto(); return; }
    saveStepIndex(currentIndex);
    progressFill.style.width = Math.min(Math.round((currentIndex / STEPS.length) * 100), 100) + '%';
    lblStepNum.textContent = currentIndex + 1;

    const step = STEPS[currentIndex];
    reportStep(`Personagem animado — ${step.titulo}`);
    stepWrap.innerHTML = `
      <article class="ab-cartao">
        <div class="ab-cartao-etapa">Etapa ${currentIndex + 1} de ${STEPS.length + 1}</div>
        <h2>${escapeHtml(step.titulo)}</h2>
        <div class="ab-conteudo">${mdToHtml(step.corpo)}</div>
      </article>
      ${renderNav(currentIndex > 0, true)}
    `;
    window.AulaBase.decorar(stepWrap, { chaveChecklist: `${LOC}_check_${username}_${currentIndex}` });
    mostrarEtapa();
    const btnBack = document.getElementById('btnBack');
    if (btnBack) btnBack.addEventListener('click', () => irPara(currentIndex - 1));
    document.getElementById('btnNext').addEventListener('click', () => irPara(currentIndex + 1));
  }

  function renderVisto() {
    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length + 1;
    reportStep('Personagem animado — Visto do professor');

    const already = loadProgress();
    if (already && already.completed) {
      const quando = already.vistoEm ? new Date(already.vistoEm).toLocaleString('pt-BR') : '';
      stepWrap.innerHTML = `
        <div class="ab-cartao ab-concluida">
          <h2>✅ Personagem animado concluído</h2>
          <p>Visto dado por <b>${escapeHtml(already.vistoPor || '')}</b>${quando ? ' em ' + escapeHtml(quando) : ''}.</p>
        </div>
        ${renderNav(true, false)}
      `;
      mostrarEtapa();
      document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));
      return;
    }

    stepWrap.innerHTML = `
      <div class="ab-cartao">
        <div class="ab-cartao-etapa">Etapa ${STEPS.length + 1} de ${STEPS.length + 1}</div>
        <h2>🧑‍🏫 Etapa final — Visto do professor</h2>
        <div class="ab-conteudo">
          <p>O personagem mexe as pernas <b>só enquanto anda</b>, volta ao desenho parado ao soltar, <b>vira</b> para o lado em que anda e responde às setas e a <b>W A S D</b>, com a mesma velocidade na diagonal?</p>
          <p>Chame o professor e mostre o jogo rodando no PixelCode: a folha <code>andando.png</code> no painel (96×32), o andar animado, o personagem virando e a diagonal. Se fez desafios extras, mostre também. Quando ele confirmar, peça o token de professor e digite abaixo.</p>
        </div>
        <div class="ab-form">
          <label>Token do professor
            <input type="text" id="vistoToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnDarVisto">Dar visto</button>
          <div class="ab-msg" id="vistoMsg" style="display:none;"></div>
        </div>
      </div>
      ${renderNav(true, false)}
    `;
    mostrarEtapa();
    document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));

    const btnDarVisto = document.getElementById('btnDarVisto');
    const vistoMsg = document.getElementById('vistoMsg');
    btnDarVisto.addEventListener('click', async () => {
      const t = document.getElementById('vistoToken').value;
      vistoMsg.style.display = 'none';
      if (!t) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Informe o token do professor.';
        vistoMsg.style.display = 'block';
        return;
      }
      btnDarVisto.disabled = true;
      btnDarVisto.textContent = 'Verificando...';
      try {
        const result = window.PortalProfessorVisto
          ? await window.PortalProfessorVisto.verificarToken(t)
          : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!result.ok) {
          vistoMsg.className = 'ab-msg erro';
          vistoMsg.textContent = result.erro;
          vistoMsg.style.display = 'block';
          btnDarVisto.disabled = false;
          btnDarVisto.textContent = 'Dar visto';
          return;
        }
        saveProgress({ completed: true, vistoPor: result.nome, vistoEm: new Date().toISOString() });
        renderVisto();
      } catch (e) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Erro inesperado ao verificar. Tente de novo.';
        vistoMsg.style.display = 'block';
        btnDarVisto.disabled = false;
        btnDarVisto.textContent = 'Dar visto';
      }
    });
  }

  // Gabarito = checklist pra o professor conferir o projeto na tela do aluno.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Fundamentos — Meu Personagem Animado — Checklist de correção',
      subtitle: 'Roteiro prático (spritesheet no Piskel + animação em Phaser no PixelCode, verificado presencialmente) · Fundamentos de Programação de Jogos · Turma Jogos Digitais',
      items: [
        { number: 1, title: 'Folha de quadros', prompt: 'andando.png está no PixelCode com 96×32 pixels: 3 quadros de 32×32 (parado, passo A, passo B), desenhados pelo aluno, com fundo transparente?', answer: 'No Piskel: 3 quadros (duplicar o quadro 1), Title "andando", EXPORT > PNG com Columns 3 e Rows 1. No PixelCode, clicar em andando.png mostra os 3 desenhos e "96×32 pixels".' },
        { number: 2, title: 'Spritesheet no jogo', prompt: 'O jogo mostra um personagem só (não os 3 lado a lado), parado no quadro 0?', answer: "preCarregar(): this.load.spritesheet('heroi', 'andando.png', { frameWidth: 32, frameHeight: 32 })." },
        { number: 3, title: 'Animação de andar', prompt: 'As pernas se mexem só enquanto ele anda e, ao soltar, ele volta ao desenho parado?', answer: "criar(): this.anims.create({ key: 'andar', frames: this.anims.generateFrameNumbers('heroi', { start: 1, end: 2 }), frameRate: 8, repeat: -1 }). atualizar(): if (heroi.body.velocity.length() > 0) heroi.anims.play('andar', true); senão, heroi.anims.stop() e heroi.setFrame(0)." },
        { number: 4, title: 'Virar, WASD e diagonal', prompt: 'Ele vira para o lado em que anda, anda com W A S D e com as setas, e na diagonal não fica mais rápido?', answer: "setFlipX(true) na esquerda e setFlipX(false) na direita; wasd = this.input.keyboard.addKeys('W,A,S,D') e condições com || (teclas.left.isDown || wasd.A.isDown); heroi.body.velocity.normalize().scale(VELOCIDADE) depois dos if do x e do y." },
      ],
      fileName: 'fund-movimento-animado-pratica-checklist.txt',
    });
  };

  renderStep();
</script>
<script src="../../../shared/vlibras-widget.js"></script>
</body>
