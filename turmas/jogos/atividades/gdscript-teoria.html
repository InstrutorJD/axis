<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Introdução ao GDScript: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0f0a14; --panel:#161020; --panel2:#120d1a; --line:#2e2038;
    --purple:#b98cff; --purple-dim:#7a4fb8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#e6dbf2; --ink-dim:#8b7898;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--purple-dim); background:#0a0710;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(185,140,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--purple); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .godi-row{ display:flex; align-items:flex-start; gap:12px; }
  .godi-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(185,140,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--purple-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .godi-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--purple);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--purple-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--purple); background:rgba(185,140,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--purple); color:var(--purple); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--purple); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--purple); color:#1a0a2a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--purple); border:1px solid var(--purple-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--purple); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--purple); border:1px solid var(--purple-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(185,140,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'gdscript_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/quiz-teoria-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>GDSCRIPT — INTRODUÇÃO (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">8</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const STEPS = [
    {
      story: 'Bip-bip! Eu sou o <b>Godi</b>, o robô curioso da Godot. Hoje vamos conhecer o <code>GDScript</code> de verdade. Ele foi criado pela própria equipe da <b>Godot Engine</b> — os argentinos <b>Juan Linietsky</b> e <b>Ariel Manzur</b>, que começaram o projeto Godot em 2007 e o tornaram open-source em 2014.',
      question: {
        prompt: 'Quem criou o GDScript?',
        options: [
          'A própria equipe da Godot Engine',
          'A Valve, criadora da plataforma Steam',
          'A Electronic Arts, uma das maiores publishers',
          'A Khronos Group, mantenedora do padrão OpenGL'
        ],
        correctIndex: 0,
        explanation: 'Isso! O GDScript nasceu junto com a Godot Engine, criada por Juan Linietsky e Ariel Manzur.'
      }
    },
    {
      story: 'Por que criar uma linguagem própria em vez de usar Python ou Lua, já prontas? Porque a Godot precisava de algo <b>integrado de verdade</b> ao editor: acesso direto a nós (nodes), cenas e sinais (signals), sem precisar de "pontes" entre a linguagem e a engine. O GDScript foi desenhado com sintaxe parecida com Python (indentação, sem <code>;</code>) justamente pra ser fácil de aprender.',
      question: {
        prompt: 'Qual foi um dos principais motivos de criar o GDScript em vez de usar uma linguagem pronta?',
        options: [
          'Ter uma linguagem integrada de verdade ao editor, com acesso direto a nós, cenas e sinais da Godot',
          'Rodar código GDScript direto dentro de qualquer navegador de internet, sem instalação nenhuma',
          'Substituir totalmente o C++ usado internamente no código-fonte da própria engine Godot',
          'Criar uma linguagem paga, vendida separadamente da engine Godot pra outros desenvolvedores'
        ],
        correctIndex: 0,
        explanation: 'Exato! O GDScript foi desenhado especificamente pra se integrar com o sistema de nós/sinais da Godot, algo que uma linguagem genérica não faria tão bem.'
      }
    },
    {
      story: 'E por que a Godot (e o GDScript) vêm crescendo tanto entre devs indie? A Godot é <b>gratuita e open-source</b> (sem taxas, sem royalties), leve, e o GDScript é a linguagem "de primeira classe" do editor — autocompletar de nós, live-reload (editar o jogo rodando) e integração total, tudo pensado pra ela.',
      question: {
        prompt: 'Por que o GDScript é tão associado à Godot Engine especificamente?',
        options: [
          'Porque é a linguagem nativa e "de primeira classe" da Godot, com integração total ao editor',
          'Porque é a única linguagem que roda dentro de consoles de videogame modernos, nunca em PC',
          'Porque foi originalmente criada pela Unity Technologies pra competir com o C#',
          'Porque substituiu completamente o HTML e o CSS usados dentro de navegadores de internet'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! GDScript é a linguagem nativa da Godot — nenhuma outra linguagem suportada pela engine tem essa integração tão profunda com o editor.'
      }
    },
    {
      story: 'Vamos aos <b>pontos positivos</b> do GDScript: sintaxe <b>enxuta</b> (sem <code>;</code>, sem chaves — só indentação, parecido com Python), <b>tipagem dinâmica</b> (não precisa declarar o tipo de cada variável, o que acelera protótipos) e integração <b>nativa</b> com nós, cenas e sinais — muito menos código "de conexão" do que em outras linguagens.',
      question: {
        prompt: 'Qual é uma vantagem real da sintaxe do GDScript?',
        options: [
          'É enxuta (sem `;` nem chaves, só indentação) e de tipagem dinâmica, acelerando protótipos',
          'Ela obriga o programador a declarar o tipo de toda variável antes de usá-la, igual o C#',
          'Não é mais necessário usar nenhum tipo de bloco condicional (se/senão) em todo o jogo',
          'O código sempre roda mais rápido do que qualquer outra linguagem existente, sem exceção'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! A sintaxe enxuta (indentação, sem `;`/chaves) e a tipagem dinâmica tornam o GDScript rápido de escrever, principalmente em protótipos.'
      }
    },
    {
      story: 'Outros pontos positivos do GDScript: <b>hot-reload</b> (editar um script e ver o resultado no jogo rodando, sem reiniciar), documentação oficial excelente (mantida junto com a engine) e uma comunidade cada vez maior, puxada pelo crescimento da própria Godot como alternativa gratuita à Unity/Unreal.',
      question: {
        prompt: 'O que é "hot-reload", um dos pontos positivos do fluxo de trabalho com GDScript na Godot?',
        options: [
          'Editar um script e ver o resultado no jogo rodando, sem precisar reiniciar tudo',
          'Um comando que apaga automaticamente todo o progresso salvo do jogador, sem aviso prévio',
          'Um tipo especial de variável que só pode existir dentro de laços de repetição',
          'Um efeito visual de fogo e fumaça que a própria engine desenha sozinha, sem código'
        ],
        correctIndex: 0,
        explanation: 'Isso! Hot-reload deixa você editar código e ver o efeito quase na hora, sem parar e reiniciar o jogo — ótimo pra testar ajustes rápido.'
      }
    },
    {
      story: 'Nem tudo são flores — os <b>pontos negativos</b>: o GDScript é <b>interpretado</b>, então tarefas muito pesadas de CPU rodam mais devagar que em C# (compilado via .NET) ou C++. Ele também só existe <b>dentro da Godot</b> — não dá pra reaproveitar esse código fora da engine. E o mercado de trabalho ainda procura muito mais gente com C#/C++/Unity do que especificamente GDScript.',
      question: {
        prompt: 'Qual é um ponto negativo real do GDScript, comparado a outras linguagens de jogos?',
        options: [
          'É interpretado (mais lento em tarefas pesadas de CPU) e só existe dentro da Godot, sem uso fora dela',
          'É impossível de usar pra programar qualquer tipo de jogo bidimensional (2D)',
          'Não existe absolutamente nenhuma documentação oficial disponível sobre essa linguagem',
          'Nunca foi utilizado em nenhum jogo de sucesso comercial reconhecido até hoje'
        ],
        correctIndex: 0,
        explanation: 'Exato! Por ser interpretado, o GDScript perde de C#/C++ em tarefas pesadas de CPU — e por ser exclusivo da Godot, não dá pra reaproveitar o código em outro lugar.'
      }
    },
    {
      story: 'E quais jogos de sucesso foram feitos com Godot (e GDScript)? <b>Brotato</b> (um dos indies mais vendidos de 2023), <b>Dome Keeper</b> e <b>Cassette Beasts</b> são exemplos bem conhecidos — todos jogos indie de sucesso comercial, construídos majoritariamente com GDScript.',
      question: {
        prompt: 'Por que jogos como Brotato, Dome Keeper e Cassette Beasts são citados como exemplos de sucesso do GDScript?',
        options: [
          'Porque são jogos indie de sucesso comercial construídos com a engine Godot, usando GDScript',
          'Porque foram, literalmente, os primeiros jogos digitais já criados em toda a história',
          'Porque foram programados inteiramente usando apenas HTML e CSS, sem nenhum script',
          'Porque nenhum deles utiliza absolutamente nenhuma engine de desenvolvimento de jogos'
        ],
        correctIndex: 0,
        explanation: 'Isso! Brotato, Dome Keeper e Cassette Beasts mostram que dá pra fazer um jogo indie de sucesso comercial de verdade usando Godot + GDScript.'
      }
    },
    {
      story: 'Recapitulando: o GDScript foi criado pela própria equipe da <b>Godot Engine</b> (Juan Linietsky e Ariel Manzur), pra ter integração total com nós, cenas e sinais. Pontos fortes: sintaxe enxuta, tipagem dinâmica, hot-reload, ótima documentação. Pontos fracos: mais lento que C#/C++ em tarefas pesadas, e só existe dentro da Godot. Jogos como Brotato e Dome Keeper mostram ele em ação no mundo real. Agora é hora de ver como o GDScript se compara ao JavaScript e ao C# que você já conhece!',
      question: {
        prompt: 'De tudo que vimos, qual é a relação mais direta entre GDScript e a engine Godot?',
        options: [
          'O GDScript é a linguagem nativa e mais integrada da Godot, criada junto com a própria engine',
          'O GDScript só funciona dentro de planilhas eletrônicas de escritório, como o Excel',
          'O GDScript foi abandonado pela equipe da Godot logo depois de ser criado',
          'O GDScript nunca teve absolutamente nenhuma relação com a engine Godot'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! É essa integração nativa com a Godot que faz do GDScript uma linguagem tão eficiente pra prototipar e construir jogos nela.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'GDScript — Introdução',
      subtitle: 'Aula Teórica · Trilha GDScript · Turma Jogos Digitais',
      capacidade: 'Reconhecer a origem, o propósito e o contexto de uso da linguagem GDScript no desenvolvimento de jogos, incluindo seus principais pontos fortes e fracos.',
      steps: STEPS,
      fileName: 'gdscript-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Comparação — JavaScript/C# vs GDScript" no Axis pra comparar a sintaxe das três linguagens.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'GDScript — Introdução',
      subtitle: 'Aula Teórica · Trilha GDScript · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'gdscript-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "gdscript_teoria",
    steps: STEPS,
    reportLabel: "GDScript — Introdução",
    mentor: { rowClass: "godi", avatar: "🤖", name: "Godi, o Robô da Godot" },
    finishPassed: {
      title: "Introdução ao GDScript concluída!",
      introHtml: "<p>Você já conhece a história do GDScript, por que ele foi criado, o que o torna especial dentro da Godot, seus pontos fortes e fracos, e alguns jogos famosos feitos com ele.</p>",
      closingHtml: "<p>Agora é hora de comparar: volte à trilha e abra a comparação entre GDScript e o JavaScript/C# que você já viu.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
