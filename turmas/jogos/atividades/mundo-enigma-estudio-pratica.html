<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundo do Trabalho — O Enigma dos Crachás</title>
<link rel="stylesheet" href="../../../shared/aula-base.css">
<link rel="stylesheet" href="../../../shared/enigma-logica.css">
<script>
  window.ACTIVITY_LOCATION = 'mundo_enigma_estudio_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/professor-visto.js"></script>
<script src="../../../shared/aula-base.js"></script>
<script src="../../../shared/enigma-logica.js"></script>
</head>
<body>

<div class="ab-app">
  <header class="ab-topo">
    <div class="ab-topo-titulo">Mundo do Trabalho — O Enigma dos Crachás</div>
    <div class="ab-topo-etapa">Etapa <span id="lblStepNum">1</span> de <span id="lblStepTotal">9</span></div>
  </header>
  <div class="ab-progresso"><div class="ab-progresso-fill" id="progressFill"></div></div>
  <main class="ab-palco" id="palco">
    <div class="ab-coluna" id="stepWrap"></div>
  </main>
</div>

<script>
  const PROG = 'Programa', REGRAS = 'Regras', ARTE = 'Arte', TESTES = 'Testes';
  const APR = 'Aprendiz', EST = 'Estágio', CLT = 'CLT', PJ = 'PJ';

  EnigmaLogica.iniciar({
    activityLocation: 'mundo_enigma_estudio_pratica',
    nome: 'O Enigma dos Crachás',
    subtitulo: 'Prática · Aulão Missão 1 · Mundo do Trabalho · Turma Jogos',
    abertura: {
      titulo: 'Os crachás do Estúdio Pequi sumiram',
      html: `
        <p>O estúdio vai lançar o jogo <b>Lenda do Cerrado</b>. Sua missão é descobrir o que cada pessoa faz.</p>
        <ol>
          <li>Nos enigmas, toque na tabela para marcar <b>✖</b> ou <b>✔</b>.</li>
          <li>Nos casos, escolha uma resposta.</li>
          <li>No fim, crie suas pistas e peça o visto.</li>
        </ol>
        <blockquote>O trabalho é individual. Se errar, você recebe uma dica e tenta de novo.</blockquote>`,
    },
    fechamento: {
      titulo: '✅ Crachás entregues!',
      html: `
        <p>Você descobriu o trabalho de cada pessoa pelo que ela faz, e não pelo nome no crachá.</p>
        <p>Na <b>Missão 2</b>, em Projeto de Vida, essa equipe vai precisar de ajuda.</p>`,
    },
    etapas: [
      {
        id: 'grade-crachas', tipo: 'grade', icone: '🪪',
        titulo: 'Enigma 1: de quem é o crachá?',
        intro: '<p>Cada pessoa faz <b>um</b> trabalho, e cada trabalho é de <b>uma</b> pessoa.</p>',
        rotuloLinha: 'Pessoa',
        linhas: ['Bia', 'Caio', 'Duda', 'Enzo'],
        colunas: [PROG, REGRAS, ARTE, TESTES],
        pistas: [
          { t: 'Duda passa o dia escrevendo código.', ok: s => s.Duda === PROG },
          { t: 'Enzo leva um caderno de desenhos para o trabalho e cria os personagens.', ok: s => s.Enzo === ARTE },
          { t: 'Bia nunca joga a mesma fase para procurar erros.', ok: s => s.Bia !== TESTES },
        ],
        solucao: { Bia: REGRAS, Caio: TESTES, Duda: PROG, Enzo: ARTE },
        resultado: '<p><b>Descoberto:</b> Bia é game designer, Caio é testador, Duda é programadora e Enzo é artista.</p>',
      },
      {
        id: 'grade-contratos', tipo: 'grade', icone: '📄',
        titulo: 'Enigma 2: como foram contratados?',
        intro: '<table><tr><th>Tipo</th><th>Como reconhecer</th></tr><tr><td>Aprendiz</td><td>Trabalha e faz um curso de aprendizagem</td></tr><tr><td>Estágio</td><td>Estuda e tem um supervisor no trabalho</td></tr><tr><td>CLT</td><td>Carteira assinada, férias e 13º salário</td></tr><tr><td>PJ</td><td>Tem empresa e emite nota fiscal</td></tr></table>',
        rotuloLinha: 'Pessoa',
        linhas: ['Bia', 'Caio', 'Duda', 'Enzo'],
        colunas: [APR, EST, CLT, PJ],
        pistas: [
          { t: 'Bia tem a própria empresa e emite nota fiscal.', ok: s => s.Bia === PJ },
          { t: 'Duda tem carteira assinada e recebe 13º salário.', ok: s => s.Duda === CLT },
          { t: 'Enzo faz faculdade de design, e uma supervisora acompanha seu trabalho.', ok: s => s.Enzo === EST },
        ],
        solucao: { Bia: PJ, Caio: APR, Duda: CLT, Enzo: EST },
        resultado: '<p><b>Descoberto:</b> Bia é PJ, Caio é aprendiz, Duda é CLT e Enzo faz estágio.</p>',
      },
      {
        id: 'caso-detalhista', tipo: 'caso', icone: '🔍',
        titulo: 'Caso 1: a detalhista',
        cenario: '<p>Todo testador presta atenção aos detalhes. Nina também presta.</p>',
        pergunta1: 'Dá para ter certeza de que Nina é testadora?',
        opcoes: [
          { t: 'Sim, porque ela tem essa qualidade' },
          { t: 'Não, porque outras profissões também pedem atenção', ok: true },
          { t: 'Sim, porque essa qualidade só existe em testes' },
          { t: 'Não, porque testador não presta atenção' },
        ],
        dica: 'Lembre do celular que não ligou: pode existir mais de uma explicação?',
        explica: 'É como o celular que não ligou: existe mais de uma explicação. Falta saber o que Nina faz.',
      },
      {
        id: 'caso-ninja', tipo: 'caso', icone: '🥷',
        titulo: 'Caso 2: o nome engraçado',
        cenario: '<p>O crachá de Theo diz <b>"Ninja do Código"</b>. Mas ele só testa o jogo e anota os erros.</p>',
        pergunta1: 'Qual é o trabalho de Theo?',
        opcoes: [
          { t: 'Programador, por causa do nome no crachá' },
          { t: 'Testador, por causa do que ele faz', ok: true },
          { t: 'Artista, porque o nome é criativo' },
          { t: 'Não dá para saber quem é Theo' },
        ],
        dica: 'Esqueça o crachá por um instante. O que Theo faz no dia a dia?',
        explica: 'O nome do cargo pode enganar. O que vale é o que a pessoa faz no dia a dia.',
      },
      {
        id: 'caso-registro', tipo: 'caso', icone: '⚖️',
        titulo: 'Caso 3: precisa de registro?',
        cenario: '<p>Médicos precisam de registro em um conselho, porque uma lei exige.</p>',
        pergunta1: 'Bia precisa disso para ser game designer?',
        opcoes: [
          { t: 'Sim, toda profissão precisa de um conselho' },
          { t: 'Não, nenhuma lei exige isso de game designers', ok: true },
          { t: 'Sim, porque jogos também são tecnologia' },
          { t: 'Só se ela trabalhar com médicos' },
        ],
        dica: 'De onde vem a exigência de registro dos médicos?',
        explica: 'Só profissões regulamentadas por lei têm essa exigência, e game design não é uma delas.',
      },
      {
        id: 'criar-pistas', tipo: 'escrita', icone: '🕵️',
        titulo: 'Agora é com você',
        intro: '<p>Escolha uma profissão ligada a jogos e escreva <b>3 pistas</b> sobre ela, sem dizer o nome.</p>',
        campos: ['Profissão escolhida', 'Pista 1', 'Pista 2', 'Pista 3'],
        gabarito: 'Resposta pessoal. As pistas devem falar de características da profissão, sem dizer o nome dela.',
      },
      {
        id: 'visto', tipo: 'visto', icone: '✍️',
        titulo: 'Visto da Missão 1',
        intro: '<p>Mostre para o professor suas pistas e os enigmas resolvidos.</p>',
      },
    ],
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>
</body>
</html>
