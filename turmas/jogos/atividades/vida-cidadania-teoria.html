<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Cidadania e Convivência Social: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .uma-row{ display:flex; align-items:flex-start; gap:12px; }
  .uma-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .uma-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'vida_cidadania_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/quiz-teoria-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>PROJETO DE VIDA — CIDADANIA E CONVIVÊNCIA SOCIAL (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const STEPS = [
    {
      story: 'Oi de novo! Eu sou a <b>Uma</b>, a coruja mentora da PixelForge Studios. Agora vamos falar de <b>convivência cidadã</b>. <b>Urbanidade</b> é o conjunto de normas de boa convivência no dia a dia — coisas simples como respeitar filas, não fazer barulho excessivo à noite, ceder o lugar a quem precisa. Não são leis escritas, mas afetam diretamente a qualidade da convivência em qualquer comunidade, inclusive dentro de uma equipe de trabalho.',
      question: {
        prompt: 'Em um transporte público lotado, uma pessoa percebe alguém com dificuldade de se equilibrar e cede seu lugar, mesmo sem nenhuma lei obrigando isso. Que conceito essa atitude representa?',
        options: [
          'Urbanidade — norma de boa convivência que não é uma lei, mas melhora a vida em comunidade',
          'Direito individual garantido por lei, que qualquer cidadão pode exigir a qualquer momento',
          'Dever coletivo previsto em contrato, que obriga o grupo inteiro a cumprir',
          'Nenhum desses conceitos se aplica a essa situação de convivência no transporte'
        ],
        correctIndex: 0,
        explanation: 'Isso! Ceder o lugar não é uma obrigação legal — é uma norma de urbanidade que melhora a convivência de todo mundo.'
      }
    },
    {
      story: 'Já os <b>direitos e deveres individuais</b> são aquilo que cada pessoa tem garantido (ou deve cumprir) só por ser cidadã — como o direito de expressar sua opinião, e o dever de respeitar a opinião alheia. São "individuais" porque valem pra cada pessoa isoladamente, independente do grupo.',
      question: {
        prompt: 'Um aluno tem o direito de discordar publicamente de uma decisão da equipe, mas também tem o dever de fazer isso com respeito, sem ofender ninguém. Isso ilustra qual conceito?',
        options: [
          'Direitos e deveres individuais — cada pessoa tem, isoladamente, um direito e um dever correspondente',
          'Direitos e deveres coletivos, já que a decisão envolve a equipe inteira, não só uma pessoa',
          'Urbanidade, já que é só uma questão de boa educação, sem relação com direitos e deveres',
          'Nenhuma relação real com cidadania — é apenas uma discussão técnica bem comum'
        ],
        correctIndex: 0,
        explanation: 'Exato! O direito de discordar e o dever de fazer isso com respeito são garantias e obrigações que cada indivíduo carrega — daí serem individuais.'
      }
    },
    {
      story: 'Já os <b>direitos e deveres coletivos</b> pertencem ao grupo como um todo, não só a uma pessoa — como o direito de uma comunidade a um espaço público limpo, e o dever coletivo de todos cuidarem desse espaço juntos. Ninguém sozinho garante isso: depende da ação conjunta de todos.',
      question: {
        prompt: 'Uma equipe compartilha uma sala de reuniões e todos têm o dever conjunto de deixá-la organizada pro próximo grupo, além do direito coletivo de usá-la em boas condições. Que conceito é esse?',
        options: [
          'Direitos e deveres coletivos — pertencem ao grupo como um todo, dependendo da ação conjunta',
          'Direitos e deveres individuais, já que cada pessoa usa a sala sozinha em vários momentos',
          'Urbanidade, sem nenhuma relação real com direitos ou deveres formais do grupo',
          'Nenhuma relação com cidadania — é só uma questão prática de organização da sala'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Um espaço compartilhado que depende do cuidado conjunto de todos ilustra bem os direitos e deveres coletivos.'
      }
    },
    {
      story: 'Numa convivência cidadã real, as pessoas trazem <b>valores e crenças</b> diferentes — e isso é normal. O desafio é conviver bem mesmo com essas diferenças, sem que ninguém precise abandonar quem é, mas também sem impor sua própria visão sobre os outros à força.',
      question: {
        prompt: 'Em um grupo com pessoas de crenças religiosas diferentes, todos concordam em respeitar as práticas de cada um, sem que ninguém tente convencer o outro a mudar de crença à força. Que princípio de convivência cidadã isso mostra?',
        options: [
          'Respeito à diversidade de valores e crenças como base da convivência cidadã',
          'Que todo mundo deveria ter a mesma crença religiosa pra evitar qualquer conflito',
          'Que valores e crenças diferentes não têm nenhuma relação com a convivência',
          'Um dever coletivo previsto especificamente por uma lei sobre religião'
        ],
        correctIndex: 0,
        explanation: 'Isso! Respeitar valores e crenças diferentes, sem impor a própria visão, é justamente o que sustenta uma boa convivência cidadã.'
      }
    },
    {
      story: 'Por fim, nossos <b>valores e crenças</b> também moldam como <b>tomamos decisões</b> no dia a dia, mesmo em situações que parecem "só técnicas". Reconhecer isso ajuda a entender por que pessoas diferentes, com os mesmos dados na mão, às vezes chegam a conclusões diferentes: cada uma está aplicando seus próprios valores na hora de decidir. Agora você já reconhece urbanidade, direitos e deveres individuais/coletivos, e como valores influenciam a convivência e as decisões!',
      question: {
        prompt: 'Diante da mesma informação sobre um atraso de entrega, uma pessoa decide priorizar avisar o cliente imediatamente (valoriza transparência), enquanto outra prefere só resolver o problema primeiro e avisar depois (valoriza eficiência). O que essa diferença de decisão ilustra?',
        options: [
          'Como valores e crenças pessoais influenciam a tomada de decisão, mesmo diante dos mesmos dados',
          'Que uma das duas pessoas está claramente errada e a outra está totalmente certa nisso',
          'Que decisões desse tipo nunca têm relação alguma com valores pessoais de ninguém envolvido',
          'Um exemplo de direito coletivo previsto formalmente numa lei específica sobre entregas'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! Pessoas diferentes, com os mesmos dados, podem decidir de formas diferentes porque aplicam valores pessoais distintos na hora de decidir.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Projeto de Vida — Cidadania e Convivência Social',
      subtitle: 'Aula Teórica · Trilha Cidadania e Convivência Social · Turma Jogos Digitais',
      capacidade: 'Identificar normas e valores sociais relevantes à convivência cidadã.',
      steps: STEPS,
      fileName: 'vida-cidadania-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central do Projeto de Vida: Cidadania" no Axis para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Projeto de Vida — Cidadania e Convivência Social',
      subtitle: 'Aula Teórica · Trilha Cidadania e Convivência Social · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'vida-cidadania-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "vida_cidadania_teoria",
    steps: STEPS,
    reportLabel: "Projeto de Vida — Cidadania",
    mentor: { rowClass: "uma", avatar: "🦉", name: "Uma, a Coruja Mentora" },
    finishPassed: {
      title: "Cidadania e Convivência Social concluídas!",
      introHtml: "<p>Você já reconhece urbanidade, direitos e deveres individuais/coletivos, e como valores e crenças moldam a convivência e as decisões do dia a dia.</p>",
      closingHtml: "<p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central do Projeto de Vida.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
