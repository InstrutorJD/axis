      corpo: `
Abra ¤maze.gd¤ (clique duas vezes nele no FileSystem). **Apague todo o conteúdo** e cole o código abaixo. Depois salve com **Ctrl+S**.

Esse script gera o grid do labirinto por código (parede / pastilha / vazio), desenha tudo com ¤_draw()¤ e expõe funções de consulta: se uma célula é parede, comer a pastilha de uma célula, e converter célula ↔ pixel.

§§§gdscript
extends Node2D
class_name Maze

const CELL_SIZE = 24
const WIDTH = 21
const HEIGHT = 21

var grid: Array = []

func _ready():
	_generate_grid()
	queue_redraw()

# Gera um labirinto tipo "grade": pilares nas posições pares,
# corredores nas ímpares. Sempre conectado, de qualquer tamanho.
func _generate_grid():
	grid.clear()
	for y in HEIGHT:
		var row = []
		for x in WIDTH:
			if y == 0 or y == HEIGHT - 1 or x == 0 or x == WIDTH - 1:
				row.append(1)
			elif x % 2 == 0 and y % 2 == 0:
				row.append(1)
			else:
				row.append(2)
		grid.append(row)

	# power pellets nos 4 cantos internos
	grid[1][1] = 3
	grid[1][WIDTH - 2] = 3
	grid[HEIGHT - 2][1] = 3
	grid[HEIGHT - 2][WIDTH - 2] = 3

	# sala vazia no centro pros fantasmas
	var cx = WIDTH / 2
	var cy = HEIGHT / 2
	for y in range(cy - 1, cy + 2):
		for x in range(cx - 2, cx + 3):
			grid[y][x] = 0

# Desenha paredes (retângulo azul), pastilhas (pontinho branco)
# e power pellets (bolinha branca maior). Sem sprite nenhum.
func _draw():
	for y in grid.size():
		for x in grid[y].size():
			var cell = grid[y][x]
			var pos = Vector2(x, y) * CELL_SIZE
			if cell == 1:
				draw_rect(Rect2(pos, Vector2(CELL_SIZE, CELL_SIZE)), Color(0.1, 0.1, 0.6))
			elif cell == 2:
				draw_circle(pos + Vector2(CELL_SIZE / 2.0, CELL_SIZE / 2.0), 3, Color.WHITE)
			elif cell == 3:
				draw_circle(pos + Vector2(CELL_SIZE / 2.0, CELL_SIZE / 2.0), 7, Color.WHITE)

# true se a célula é parede ou está fora do grid (conta como parede)
func is_wall(cell: Vector2i) -> bool:
	if cell.y < 0 or cell.y >= grid.size():
		return true
	if cell.x < 0 or cell.x >= grid[cell.y].size():
		return true
	return grid[cell.y][cell.x] == 1

# come a pastilha da célula (se houver) e devolve o que tinha: 0/2/3
func try_eat(cell: Vector2i) -> int:
	if cell.y < 0 or cell.y >= grid.size():
		return 0
	if cell.x < 0 or cell.x >= grid[cell.y].size():
		return 0
	var val = grid[cell.y][cell.x]
	if val == 2 or val == 3:
		grid[cell.y][cell.x] = 0
		queue_redraw()
	return val

# quantas pastilhas (normais + power) ainda restam no mapa
func pellets_left() -> int:
	var count = 0
	for row in grid:
		for cell in row:
			if cell == 2 or cell == 3:
				count += 1
	return count

# posição em pixels -> coordenada de célula (linha/coluna)
func world_to_cell(world_pos: Vector2) -> Vector2i:
	return Vector2i(int(world_pos.x / CELL_SIZE), int(world_pos.y / CELL_SIZE))

# coordenada de célula -> posição em pixels (centro da célula)
func cell_to_world(cell: Vector2i) -> Vector2:
	return Vector2(cell.x * CELL_SIZE + CELL_SIZE / 2.0, cell.y * CELL_SIZE + CELL_SIZE / 2.0)
§§§

Abra ¤pacman.gd¤, apague o conteúdo padrão, cole o código abaixo e salve.

Esse script controla o Pacman: movimento em grade (célula por célula, nunca "no meio do caminho"), leitura do teclado, e o desenho de um círculo amarelo com uma "fatia" preta simulando a boca.

§§§gdscript
extends Node2D
class_name Pacman

const SPEED = 120.0
const CELL_SIZE = 24

var maze: Maze
var current_cell: Vector2i
var direction := Vector2i.ZERO
var next_direction := Vector2i.ZERO
var mouth_open := true
var mouth_timer := 0.0

# chamado pelo main.gd depois de atribuir "maze"
# (NÃO usar _ready aqui: o _ready dos filhos roda antes do _ready do pai)
func initialize():
	current_cell = maze.world_to_cell(position)
	position = maze.cell_to_world(current_cell)

func _process(delta):
	delta = min(delta, 0.05)  # trava pico de lag, evita atravessar parede
	if maze == null:
		return
	_read_input()
	_move(delta)
	_animate_mouth(delta)
	queue_redraw()

# lê as setas do teclado e guarda a direção desejada
func _read_input():
	if Input.is_action_pressed("ui_right"):
		next_direction = Vector2i(1, 0)
	elif Input.is_action_pressed("ui_left"):
		next_direction = Vector2i(-1, 0)
	elif Input.is_action_pressed("ui_up"):
		next_direction = Vector2i(0, -1)
	elif Input.is_action_pressed("ui_down"):
		next_direction = Vector2i(0, 1)

# anda até o centro da PRÓXIMA célula usando move_toward
# (nunca ultrapassa o alvo, por isso nunca atravessa parede)
func _move(delta):
	if direction == Vector2i.ZERO:
		if next_direction != Vector2i.ZERO and not maze.is_wall(current_cell + next_direction):
			direction = next_direction
		return

	var target = maze.cell_to_world(current_cell + direction)
	position = position.move_toward(target, SPEED * delta)

	if position == target:
		current_cell += direction

		var eaten = maze.try_eat(current_cell)
		if eaten == 2:
			GameManager.add_score(10)
		elif eaten == 3:
			GameManager.add_score(50)
			GameManager.start_frightened()

		# troca de direção só é aceita se a próxima célula não for parede
		if next_direction != Vector2i.ZERO and not maze.is_wall(current_cell + next_direction):
			direction = next_direction
		if maze.is_wall(current_cell + direction):
			direction = Vector2i.ZERO

# pisca a "boca" abrindo e fechando
func _animate_mouth(delta):
	mouth_timer += delta
	if mouth_timer > 0.15:
		mouth_timer = 0.0
		mouth_open = not mouth_open

# desenha o círculo amarelo + fatia preta (boca) na direção do movimento
func _draw():
	var radius = CELL_SIZE / 2.0 - 2
	draw_circle(Vector2.ZERO, radius, Color.YELLOW)

	if mouth_open and direction != Vector2i.ZERO:
		var angle = Vector2(direction).angle()
		var wedge = PackedVector2Array([
			Vector2.ZERO,
			Vector2(radius * 2, 0).rotated(angle - 0.4),
			Vector2(radius * 2, 0).rotated(angle + 0.4)
		])
		# cor igual ao fundo simula a "boca" aberta
		draw_colored_polygon(wedge, Color.BLACK)
§§§

Repare em duas decisões importantes:

- **¤initialize()¤, não ¤_ready()¤**: o main.gd chama esse método manualmente depois de atribuir ¤maze¤ ao Pacman — se a inicialização estivesse dentro de ¤_ready()¤, ela rodaria ANTES do main.gd conseguir passar a referência do labirinto, porque o ¤_ready()¤ dos filhos executa antes do ¤_ready()¤ do nó pai.
- **¤delta = min(delta, 0.05)¤**: trava um possível pico de lag (um frame muito longo) pra o Pacman nunca "pular" célula suficiente pra atravessar uma parede.

      corpo: `
Abra ¤ghost.gd¤, apague o conteúdo padrão, cole o código abaixo e salve.

Mesmo esquema de movimento em grade do Pacman. Em modo normal, o fantasma persegue o Pacman escolhendo a direção que mais aproxima; em modo assustado, ele anda aleatório e pode ser "comido".

§§§gdscript
extends Node2D
class_name Ghost

const SPEED = 100.0
const CELL_SIZE = 24

@export var color: Color = Color.RED

var maze: Maze
var pacman: Pacman
var current_cell: Vector2i
var direction := Vector2i.ZERO
var frightened := false

# chamado pelo main.gd depois de atribuir "maze" e "pacman"
func initialize():
	current_cell = maze.world_to_cell(position)
	position = maze.cell_to_world(current_cell)
	_pick_direction()

func _process(delta):
	delta = min(delta, 0.05)  # mesma trava de segurança do Pacman
	if maze == null:
		return
	_move(delta)
	queue_redraw()

# anda até o centro da próxima célula; ao chegar, escolhe pra onde ir
func _move(delta):
	var target = maze.cell_to_world(current_cell + direction)
	position = position.move_toward(target, SPEED * delta)
	if position == target:
		current_cell += direction
		_pick_direction()

# decide a próxima direção: persegue o Pacman (normal) ou anda
# aleatório (assustado), nunca voltando pra célula anterior à toa
func _pick_direction():
	var options: Array = []
	for d in [Vector2i(1, 0), Vector2i(-1, 0), Vector2i(0, 1), Vector2i(0, -1)]:
		if d == -direction:
			continue
		if not maze.is_wall(current_cell + d):
			options.append(d)

	if options.is_empty():
		direction = -direction
		return

	if frightened or pacman == null:
		direction = options[randi() % options.size()]
		return

	# perseguição simples: escolhe a direção que mais aproxima do Pacman
	var target_cell = maze.world_to_cell(pacman.position)
	var best = options[0]
	var best_dist = INF
	for d in options:
		var dist = (current_cell + d).distance_to(Vector2(target_cell))
		if dist < best_dist:
			best_dist = dist
			best = d
	direction = best

func set_frightened(value: bool):
	frightened = value

# desenha um círculo colorido; fica azul enquanto assustado
func _draw():
	var radius = CELL_SIZE / 2.0 - 2
	var c = Color.BLUE if frightened else color
	draw_circle(Vector2.ZERO, radius, c)

Esse script guarda a pontuação, as vidas e o cronômetro do modo "assustado" — no próximo passo, ele vira uma variável global (Autoload) chamada ¤GameManager¤, acessível de qualquer outro script do jogo.

§§§gdscript
extends Node

signal score_changed(new_score)
signal frightened_ended
signal game_over
signal game_won

var score := 0
var lives := 3
var frightened_time := 6.0
var frightened_timer := 0.0
var is_frightened := false

# conta regressiva do modo "assustado" (depois de comer power pellet)
func _process(delta):
	if is_frightened:
		frightened_timer -= delta
		if frightened_timer <= 0:
			is_frightened = false
			emit_signal("frightened_ended")

func add_score(amount: int):
	score += amount
	emit_signal("score_changed", score)

func start_frightened():
	is_frightened = true
	frightened_timer = frightened_time

func lose_life():
	lives -= 1
	if lives <= 0:
		emit_signal("game_over")

Abra ¤main.gd¤, apague o conteúdo padrão, cole o código abaixo e salve.

Esse script liga o labirinto, o Pacman e os fantasmas entre si, checa colisão (com invulnerabilidade temporária pra não descontar várias vidas de uma encostada só) e atualiza o placar na tela.

§§§gdscript
extends Node2D

var maze: Maze
var pacman: Pacman
var ghosts: Array = []
var invulnerable := false
var invulnerable_timer := 0.0

func _ready():
	maze = $Maze
	pacman = $Pacman
	pacman.maze = maze
	pacman.initialize()

	for ghost in $Ghosts.get_children():

  function saveStepIndex(i) { try { localStorage.setItem(STEP_KEY, String(i)); } catch (e) {} }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de cod-godot-personagem-roteiro.html /
  // oficina-comunicacao-trabalho.html (cabeçalhos, blocos §§§lang...§§§,
  // tabela, listas/checklist, citação).
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }
