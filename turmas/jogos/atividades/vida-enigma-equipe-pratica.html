<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto de Vida — A Semana do Lançamento</title>
<link rel="stylesheet" href="../../../shared/aula-base.css">
<link rel="stylesheet" href="../../../shared/enigma-logica.css">
<script>
  window.ACTIVITY_LOCATION = 'vida_enigma_equipe_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>

<body>

<div class="ab-app">
  <header class="ab-topo">
    <div class="ab-topo-titulo">Projeto de Vida — A Semana do Lançamento</div>
    <div class="ab-topo-etapa">Etapa <span id="lblStepNum">1</span> de <span id="lblStepTotal">9</span></div>
  </header>
  <div class="ab-progresso"><div class="ab-progresso-fill" id="progressFill"></div></div>
  <main class="ab-palco" id="palco">
    <div class="ab-coluna" id="stepWrap"></div>
  </main>
</div>

<script>
  const APRES = 'Apresentar', NOVATO = 'Ajudar novato', TEXTOS = 'Textos', CORES = 'Cores';

  EnigmaLogica.iniciar({
    activityLocation: 'vida_enigma_equipe_pratica',
    nome: 'A Semana do Lançamento',
    subtitulo: 'Prática · Aulão Missão 2 · Projeto de Vida · Turma Jogos',
    abertura: {
      titulo: 'A equipe está em crise',
      html: `
        <p>Faltam poucos dias para o lançamento, e a equipe da Missão 1 precisa da sua ajuda.</p>
        <table><tr><th>Pessoa</th><th>Trabalho</th><th>Contratação</th></tr>
          <tr><td>Bia</td><td>Game designer</td><td>PJ</td></tr>
          <tr><td>Caio</td><td>Testador</td><td>Aprendiz</td></tr>
          <tr><td>Duda</td><td>Programadora</td><td>CLT</td></tr>
          <tr><td>Enzo</td><td>Artista</td><td>Estágio</td></tr></table>
        <blockquote>O trabalho é individual. Se errar, você recebe uma dica e tenta de novo.</blockquote>`,
    },
    fechamento: {
      titulo: '✅ Equipe pronta para o lançamento!',
      html: `
        <p>Você dividiu o trabalho considerando as diferenças e resolveu os problemas usando fatos e respeito.</p>
        <p>Na <b>Missão 3</b>, em Introdução ao Desenvolvimento de Projetos, a equipe vai organizar o documento do jogo.</p>`,
    },
    etapas: [
      {
        id: 'grade-tarefas', tipo: 'grade', icone: '🗓️',
        titulo: 'Enigma 3: quem faz cada tarefa?',
        intro: '<p>Cada pessoa assume <b>uma</b> tarefa extra.</p>',
        rotuloLinha: 'Pessoa',
        linhas: ['Bia', 'Caio', 'Duda', 'Enzo'],
        colunas: [APRES, NOVATO, TEXTOS, CORES],
        pistas: [
          { t: 'Enzo entende de arte e vai cuidar das cores.', ok: s => s.Enzo === CORES },
          { t: 'A apresentação é em inglês, e só Bia e Caio falam inglês.', ok: s => s.Bia === APRES || s.Caio === APRES },
          { t: 'Caio tem curso na hora da apresentação.', ok: s => s.Caio !== APRES },
          { t: 'Ajudar o novato pede experiência, e Caio chegou há um mês.', ok: s => s.Caio !== NOVATO },
        ],
        solucao: { Bia: APRES, Caio: TEXTOS, Duda: NOVATO, Enzo: CORES },
        resultado: '<p><b>Plano da equipe:</b> Bia apresenta, Caio revisa os textos, Duda ajuda o novato e Enzo cuida das cores.</p><p>O plano levou em conta o curso e a experiência de cada um, sem excluir ninguém.</p>',
      },
      {
        id: 'caso-duda', tipo: 'caso', icone: '🤫',
        titulo: 'Caso 1: "Duda não fala nada"',
        cenario: '<p>Um colega diz: <b>"Duda não fala na reunião, então não se importa"</b>. Mas ela manda ideias por escrito e corrigiu o pior erro do jogo.</p>',
        pergunta1: 'Qual conclusão os fatos mostram?',
        opcoes: [
          { t: 'Duda contribui, só que de outro jeito', ok: true },
          { t: 'Duda não se importa, porque fala pouco' },
          { t: 'Duda deve sair da equipe' },
          { t: 'Todos devem falar o mesmo tempo' },
        ],
        dica: 'O que dá para comprovar no caso? E o que é só a opinião do colega?',
        explica: '"Fala pouco" é fato. "Não se importa" é achismo, e os fatos mostram o contrário.',
      },
      {
        id: 'caso-briga', tipo: 'caso', icone: '🎨',
        titulo: 'Caso 2: a briga',
        cenario: '<p>Enzo quer um cenário cheio de detalhes. Bia acha que isso esconde os obstáculos. Os dois começam a se ofender.</p>',
        pergunta1: 'O que resolve melhor?',
        opcoes: [
          { t: 'Quem falar mais alto decide' },
          { t: 'Testar as duas versões com jogadores', ok: true },
          { t: 'Separar os dois até o lançamento' },
          { t: 'Manter o cenário de Enzo' },
        ],
        dica: 'A discussão virou sobre as pessoas. O que faria o foco voltar para o jogo?',
        explica: 'O teste tira o foco da briga e mostra qual opção é melhor para o jogo.',
      },
      {
        id: 'caso-erro', tipo: 'caso', icone: '🐞',
        titulo: 'Caso 3: o erro no código',
        cenario: '<p>Caio achou um erro no código de Duda, mas tem medo de parecer uma acusação.</p>',
        pergunta1: 'O que ele deve fazer?',
        opcoes: [
          { t: 'Mostrar o erro e pedir ajuda para resolver', ok: true },
          { t: 'Ficar quieto para não criar problema com Duda' },
          { t: 'Contar para todo mundo que Duda errou' },
          { t: 'Esperar outra pessoa encontrar o erro' },
        ],
        dica: 'O objetivo é consertar o jogo. Qual atitude ajuda sem expor ninguém?',
        explica: 'Falar do problema, e não da pessoa, ajuda a consertar o jogo e mantém a confiança.',
      },
      {
        id: 'caso-prova', tipo: 'caso', icone: '⏰',
        titulo: 'Caso 4: a prova surpresa',
        cenario: '<p>Na segunda, Enzo descobre uma prova na quinta, o dia da entrega.</p>',
        pergunta1: 'O que mostra compromisso com a equipe?',
        opcoes: [
          { t: 'Não contar e tentar fazer tudo de última hora' },
          { t: 'Avisar agora e combinar um novo plano', ok: true },
          { t: 'Esperar quinta para ver o que acontece' },
          { t: 'Largar a tarefa sem explicar nada' },
        ],
        dica: 'Qual escolha dá mais tempo para a equipe se organizar?',
        explica: 'Quem avisa cedo dá tempo para a equipe se organizar. Isso também é compromisso.',
      },
      {
        id: 'criar-frase', tipo: 'escrita', icone: '🕵️',
        titulo: 'Agora é com você',
        intro: '<p>Pense em uma situação comum de trabalho em grupo.</p>',
        campos: ['Um achismo que alguém poderia dizer', 'Troque por um fato', 'Uma frase respeitosa para resolver a situação'],
        gabarito: 'Resposta pessoal. O fato precisa poder ser comprovado, e a frase deve falar do problema, sem atacar a pessoa.',
      },
      {
        id: 'visto', tipo: 'visto', icone: '✍️',
        titulo: 'Visto da Missão 2',
        intro: '<p>Mostre para o professor seu achismo, seu fato e sua frase.</p>',
      },
    ],
  });
</script>
