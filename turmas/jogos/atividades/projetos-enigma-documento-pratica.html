<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos — O Documento Embaralhado</title>
<link rel="stylesheet" href="../../../shared/aula-base.css">
<link rel="stylesheet" href="../../../shared/enigma-logica.css">
<script>
  window.ACTIVITY_LOCATION = 'projetos_enigma_documento_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/professor-visto.js"></script>
<script src="../../../shared/aula-base.js"></script>
<script src="../../../shared/enigma-logica.js"></script>
</head>
<body>

<div class="ab-app">
  <header class="ab-topo">
    <div class="ab-topo-titulo">Projetos — O Documento Embaralhado</div>
    <div class="ab-topo-etapa">Etapa <span id="lblStepNum">1</span> de <span id="lblStepTotal">10</span></div>
  </header>
  <div class="ab-progresso"><div class="ab-progresso-fill" id="progressFill"></div></div>
  <main class="ab-palco" id="palco">
    <div class="ab-coluna" id="stepWrap"></div>
  </main>
</div>

<script>
  const INTRO = 'Introdução', DES = 'Desenvolvimento', REF = 'Referências', APE = 'Apêndice';
  const pos = p => parseInt(p, 10);

  EnigmaLogica.iniciar({
    activityLocation: 'projetos_enigma_documento_pratica',
    nome: 'O Documento Embaralhado',
    subtitulo: 'Prática · Aulão Missão 3 · Introdução ao Desenvolvimento de Projetos · Turma Jogos',
    abertura: {
      titulo: 'O documento do jogo se misturou',
      html: `
        <p>A equipe precisa entregar o documento do <b>Lenda do Cerrado</b>, mas as partes estão fora do lugar.</p>
        <ol>
          <li>Resolva os enigmas sobre as partes do documento.</li>
          <li>Responda aos casos.</li>
          <li>Planeje as partes de um jogo seu e peça o visto.</li>
        </ol>
        <blockquote>O trabalho é individual. Se errar, você recebe uma dica e tenta de novo.</blockquote>`,
    },
    fechamento: {
      titulo: '🎉 Caso encerrado!',
      html: `
        <p>O documento está organizado, e o <b>Lenda do Cerrado</b> está pronto para o lançamento.</p>
        <p>Você descobriu quem faz o quê, ajudou a equipe a colaborar e organizou o projeto para todos entenderem.</p>`,
    },
    etapas: [
      {
        id: 'grade-autoria', tipo: 'grade', icone: '✍️',
        titulo: 'Enigma 4: quem escreveu o quê?',
        intro: '<p>Cada pessoa escreveu <b>uma</b> parte do documento.</p>',
        rotuloLinha: 'Pessoa',
        linhas: ['Bia', 'Caio', 'Duda', 'Enzo'],
        colunas: [INTRO, DES, REF, APE],
        pistas: [
          { t: 'Bia explicou qual é o problema e por que o jogo importa.', ok: s => s.Bia === INTRO },
          { t: 'Duda contou como o jogo foi feito e o resultado dos testes.', ok: s => s.Duda === DES },
          { t: 'Enzo criou um guia de cores e o colocou no fim, como extra.', ok: s => s.Enzo === APE },
        ],
        solucao: { Bia: INTRO, Caio: REF, Duda: DES, Enzo: APE },
        resultado: '<p><b>Descoberto:</b> Bia fez a introdução, Duda o desenvolvimento, Enzo o apêndice e Caio as referências.</p>',
      },
      {
        id: 'grade-ordem', tipo: 'grade', icone: '🔢',
        titulo: 'Enigma 5: qual é a ordem?',
        intro: '<p>Descubra a posição de cada parte.</p>',
        rotuloLinha: 'Parte',
        linhas: ['Referências', 'Glossário', 'Apêndice', 'Anexo'],
        colunas: ['1º', '2º', '3º', '4º'],
        pistas: [
          { t: 'As referências vêm antes das outras três partes.', ok: s => s['Referências'] === '1º' },
          { t: 'O anexo vem logo depois do apêndice.', ok: s => pos(s['Anexo']) === pos(s['Apêndice']) + 1 },
          { t: 'O glossário vem antes do apêndice.', ok: s => pos(s['Glossário']) < pos(s['Apêndice']) },
        ],
        solucao: { 'Referências': '1º', 'Glossário': '2º', 'Apêndice': '3º', 'Anexo': '4º' },
        resultado: '<p><b>Ordem:</b> referências, glossário, apêndice e anexo. Se o documento tiver índice, ele fica por último.</p>',
      },
      {
        id: 'caso-comeco', tipo: 'caso', icone: '🧭',
        titulo: 'Caso 1: por onde começar?',
        cenario: '<p>"Muitos jovens não conhecem as lendas do Cerrado. Por isso, vamos criar um jogo sobre elas."</p>',
        pergunta1: 'Onde esse trecho entra?',
        opcoes: [{ t: 'Introdução', ok: true }, { t: 'Desenvolvimento' }, { t: 'Conclusão' }, { t: 'Referências' }],
        dica: 'O trecho conta o que já aconteceu ou explica por que o projeto existe?',
        explica: 'O trecho apresenta o problema e diz o que o projeto quer fazer.',
      },
      {
        id: 'caso-deu-certo', tipo: 'caso', icone: '🏁',
        titulo: 'Caso 2: deu certo?',
        cenario: '<p>"Atingimos o objetivo do projeto. No futuro, vamos criar novas fases."</p>',
        pergunta1: 'Onde esse trecho entra?',
        opcoes: [{ t: 'Introdução' }, { t: 'Desenvolvimento' }, { t: 'Conclusão', ok: true }, { t: 'Glossário' }],
        dica: 'Qual parte responde "Deu certo? O que vem depois?"',
        explica: 'O trecho responde se deu certo e aponta o que vem depois.',
      },
      {
        id: 'caso-extras', tipo: 'caso', icone: '📋',
        titulo: 'Caso 3: apêndice ou anexo?',
        cenario: '<p>Caio criou um questionário para os jogadores. A editora enviou a licença da música.</p>',
        pergunta1: 'Onde fica cada um?',
        opcoes: [
          { t: 'Questionário no apêndice; licença no anexo', ok: true },
          { t: 'Questionário no anexo; licença no apêndice' },
          { t: 'Os dois no apêndice' },
          { t: 'Os dois no anexo' },
        ],
        dica: 'Para cada material, pergunte: quem o criou?',
        explica: 'A equipe criou o questionário, e a editora criou a licença.',
      },
      {
        id: 'caso-souza', tipo: 'caso', icone: '🔎',
        titulo: 'Caso 4: o erro no documento',
        cenario: '<p>O texto usa uma informação do livro de Souza, mas esse livro não aparece nas referências.</p>',
        pergunta1: 'O que a equipe faz?',
        opcoes: [
          { t: 'Nada, porque citar no texto já basta' },
          { t: 'Inclui o livro nas referências', ok: true },
          { t: 'Coloca o livro no apêndice' },
          { t: 'Apaga as referências do documento' },
        ],
        dica: 'Qual é a função das referências?',
        explica: 'Se usou uma obra e citou no texto, ela precisa aparecer nas referências.',
      },
      {
        id: 'criar-jogo', tipo: 'escrita', icone: '🕵️',
        titulo: 'Agora é com você',
        intro: '<p>Pense em um jogo que você gostaria de criar e escreva uma frase para cada parte.</p>',
        campos: ['Introdução: por que esse jogo importa?', 'Desenvolvimento: como você faria?', 'Conclusão: como saberia que deu certo?'],
        gabarito: 'Resposta pessoal. Cada frase deve cumprir a função da parte indicada.',
      },
      {
        id: 'visto', tipo: 'visto', icone: '✍️',
        titulo: 'Visto da Missão 3',
        intro: '<p>Mostre para o professor as 3 frases do seu jogo.</p>',
      },
    ],
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>
</body>
</html>
