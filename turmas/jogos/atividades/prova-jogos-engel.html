<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Prova Diagnóstica (Engel)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); min-height:100vh;
  }

  .env{
    max-width:760px; margin:0 auto; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
    min-height:calc(100vh - 20px);
  }

  .topbar{
    height:34px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 14px;
    font-size:13px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .steps{ display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:12px 12px 0; }
  .step-dot{
    width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    font-size:15px; border:2px solid var(--line); background:var(--panel2); border-radius:8px;
  }
  .step-dot.active{ border-color:var(--green); }
  .step-dot.done{ border-color:var(--green); background:rgba(124,255,63,0.15); }

  .stage{ flex:1; padding:16px; display:flex; flex-direction:column; gap:16px; }

  .card{ background:var(--panel); border:1px solid var(--line); padding:20px; }
  .card .big-icon{ font-size:56px; line-height:1; text-align:center; margin-bottom:10px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--yellow);
    margin:0 0 12px; letter-spacing:1px; text-align:center;
  }

  .lead{ font-size:18px; line-height:1.7; text-align:center; margin:0 0 6px; }

  .bloco-label{
    font-size:13px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px;
    margin:0 0 6px; text-align:center;
  }
  .question-lead{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:30px; color:var(--green);
    text-align:center; margin:0 0 6px; letter-spacing:0.5px;
  }
  .question-sub{ font-size:17px; text-align:center; margin:0 0 16px; color:var(--ink-dim); }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    border:2px solid var(--line); background:var(--panel2); cursor:pointer; font-size:19px; font-weight:700;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:28px; height:28px; flex-shrink:0; border:2px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink-dim); font-weight:800;
  }
  .option.correct{ border-color:var(--green); background:rgba(124,255,63,0.1); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.1); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:16px; padding:14px 16px; font-size:16px; line-height:1.6;
    border:1px dashed var(--line); text-align:center;
  }
  .feedback.correct{ border-color:var(--green); color:var(--green); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }

  .step-nav{ display:flex; justify-content:flex-end; align-items:center; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:16px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:14px 26px; cursor:pointer; border-radius:8px;
  }
  button.btn-secondary{ background:transparent; color:var(--green); border:2px solid var(--green-dim); }

  .score-box{ text-align:center; }
  .score-box .score{ font-size:22px; color:var(--yellow); font-weight:800; margin:14px 0; }

  /* Tela de regras/início e tela de bloqueio (trava de tela — sair da aba
     conta aviso, ver shared/exam-proctor.js) */
  .gate-wrap{ width:100%; min-height:calc(100vh - 20px); display:none; align-items:center; justify-content:center; padding:14px; }
  .gate-card{ max-width:440px; width:100%; text-align:center; }
  .gate-card .warn-icon{ font-size:44px; margin-bottom:8px; }
  .gate-card p{ font-size:15px; line-height:1.7; color:var(--ink); margin:0 0 8px; }
  .token-form{ display:flex; flex-direction:column; gap:12px; max-width:280px; margin:16px auto 0; text-align:left; }
  .token-form label{ display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .token-form input{
    font-family:inherit; font-size:14px; padding:9px 10px; background:#000; color:var(--ink);
    border:1px solid var(--line); border-radius:2px;
  }
  .token-form input:focus{ outline:none; border-color:var(--green-dim); }
  .token-msg{ font-size:12.5px; padding:8px 10px; border:1px dashed var(--line); }
  .token-msg.erro{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .token-msg.ok{ border-color:var(--green); color:var(--green); }

  .warn-overlay{
    position:fixed; inset:0; background:rgba(5,10,16,0.88); z-index:999;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .warn-overlay .card{ max-width:380px; text-align:center; border-color:var(--blood-bright); }
  .warn-overlay .warn-icon{ font-size:44px; margin-bottom:8px; }
  .warn-overlay h2{ color:var(--blood-bright); }
  .warn-overlay p{ font-size:15px; line-height:1.7; margin:0 0 14px; color:var(--ink); }

  @media (max-width: 600px) {
    .card{ padding:14px; }
    .question-lead{ font-size:24px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'prova_jogos_engel';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/professor-visto.js"></script>
<script src="../../../shared/exam-proctor.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>📋 PROVA DIAGNÓSTICA</div>
    <div>✅ <span id="lblStepNum">1</span>/<span id="lblStepTotal">16</span></div>
  </div>

  <div class="gate-wrap" id="gateWrap"></div>

  <div id="stageWrap" style="display:none;">
    <div class="steps" id="stepsRow"></div>
    <div class="stage">
      <div id="stepWrap"></div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `prova_jogos_engel_progress_${username}`;

  // Prova diagnóstica adaptada pro Engel: mesmo espírito de simplicidade
  // de teste-roteiros-questionario-engel.html (Cor e Título) na PERGUNTA
  // em si (lista curta e fixa, sem sorteio, só 3 alternativas, nunca 5) —
  // mas com a MESMA trava de integridade da prova padrão (prova-jogos.html)
  // e das outras atividades avaliativas do Engel (frases-engel.html e
  // afins): sair da aba conta aviso, a 2ª vez bloqueia até o professor
  // liberar com o token (shared/exam-proctor.js). É uma "prova" de
  // verdade — não faria sentido ficar sem essa trava só porque o resto do
  // formato é mais leve.
  //
  // Cobre só as trilhas do Engel que têm resposta certa/errada de verdade
  // (ele também tem "Ponto de Virada"/"A Jornada do Lucas", mas são
  // narrativas sem certo ou errado — não davam pra virar pergunta de
  // prova do mesmo jeito):
  //  - JavaScript Básico (Engel): reconhecer o sinal de cada operação
  //    (mesmo vocabulário/emoji de js-basico-adaptado-engel.html).
  //  - Roteiros de Teste (Engel): reconhecer o tipo de teste a partir da
  //    definição (mesmo conteúdo de teste-roteiros-trabalho-engel.html,
  //    só que definição→nome em vez de cor→nome, pra não repetir
  //    literalmente o questionário que ele já resolve lá).
  //  - Comunicação — Formar Frases (Engel): completar a frase com a
  //    palavra certa (reaproveita, com a mesma redação, uma amostra das
  //    frases já validadas em frases-engel.html, cobrindo os 3 níveis).
  const QUESTIONS = [
    // ---- JavaScript Básico (Engel) ----
    { bloco: 'JavaScript', icon: '➕', lead: '🐱 + 🐶', sub: 'Qual sinal você usa pra SOMAR?', options: ['-', '*', '+'], certa: 2 },
    { bloco: 'JavaScript', icon: '➖', lead: '🚗 − 🏍️', sub: 'Qual sinal você usa pra TIRAR (subtrair)?', options: ['-', '+', '/'], certa: 0 },
    { bloco: 'JavaScript', icon: '✖️', lead: '🐵 × 2', sub: 'Qual sinal você usa pra MULTIPLICAR?', options: ['+', '*', '%'], certa: 1 },
    { bloco: 'JavaScript', icon: '➗', lead: '🚗 ÷ 2', sub: 'Qual sinal você usa pra DIVIDIR?', options: ['*', '-', '/'], certa: 2 },
    { bloco: 'JavaScript', icon: '⚖️', lead: '🐭 ___ 🦆', sub: 'Qual sinal você usa pra saber se um número é MAIOR que o outro?', options: ['>', '<', '==='], certa: 0 },

    // ---- Roteiros de Teste (Engel) ----
    { bloco: 'Roteiros de Teste', icon: '🎖️', lead: 'Feito ANTES de vender o jogo numa loja de console, seguindo as regras do fabricante.', sub: 'Qual teste é esse?', options: ['Smoke Test', 'Certificação Técnica', 'Teste Exploratório'], certa: 1 },
    { bloco: 'Roteiros de Teste', icon: '🖥️', lead: 'Verifica se o jogo funciona em telas de tamanhos diferentes — grande, pequena e no meio.', sub: 'Qual teste é esse?', options: ['Certificação Técnica', 'Smoke Test', 'Teste de Plataforma'], certa: 2 },
    { bloco: 'Roteiros de Teste', icon: '💨', lead: 'Teste RÁPIDO, feito só pra ver se o básico funciona antes de publicar.', sub: 'Qual teste é esse?', options: ['Smoke Test', 'Teste Exploratório', 'Certificação Técnica'], certa: 0 },
    { bloco: 'Roteiros de Teste', icon: '🔎', lead: 'Jogar bastante tentando QUEBRAR o jogo, sem seguir um roteiro fixo.', sub: 'Qual teste é esse?', options: ['Smoke Test', 'Teste Exploratório', 'Teste de Plataforma'], certa: 1 },

    // ---- Comunicação — Formar Frases (Engel) ----
    { bloco: 'Formar Frases', icon: '☀️', lead: '"Bom ___"', sub: 'Qual palavra completa certo?', options: ['Noite', 'Carro', 'Dia'], certa: 2 },
    { bloco: 'Formar Frases', icon: '🐶', lead: '"Meu ___"', sub: 'Qual palavra completa certo?', options: ['Cachorro', 'Gato', 'Livro'], certa: 0 },
    { bloco: 'Formar Frases', icon: '💧', lead: '"Eu quero ___"', sub: 'Qual palavra completa certo?', options: ['Suco', 'Água', 'Bola'], certa: 1 },
    { bloco: 'Formar Frases', icon: '👫', lead: '"Nós somos ___"', sub: 'Qual palavra completa certo?', options: ['Irmãos', 'Vizinhos', 'Amigos'], certa: 2 },
    { bloco: 'Formar Frases', icon: '😴', lead: '"O cachorro está ___"', sub: 'Qual palavra completa certo?', options: ['Dormindo', 'Correndo', 'Comendo'], certa: 0 },
    { bloco: 'Formar Frases', icon: '🎉', lead: '"Amanhã vai ter ___"', sub: 'Qual palavra completa certo?', options: ['Aula', 'Festa', 'Chuva'], certa: 1 }
  ];
  const TOTAL_STEPS = QUESTIONS.length;

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveProgress(data) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }

  let progress = loadProgress();
  if (!progress || !Array.isArray(progress.respostas) || progress.respostas.length !== QUESTIONS.length) {
    progress = { respostas: new Array(QUESTIONS.length).fill(null), completed: false, correctCount: 0 };
  }

  // Nunca reabre uma pergunta já respondida (recarregar a página não
  // libera tentativa de novo) — mesma regra do resto do portal.
  function allQuestionsAttempted() {
    return progress.respostas.every(r => r !== null);
  }

  let currentIndex = progress.completed
    ? TOTAL_STEPS
    : (() => {
        const firstUnanswered = progress.respostas.findIndex(r => r === null);
        return firstUnanswered === -1 ? TOTAL_STEPS : firstUnanswered;
      })();

  let isProfessor = false;
  (async function () {
    const user = window.PortalSession ? await window.PortalSession.getUser() : null;
    isProfessor = !!(user && user.role === 'professor');
  })();

  const stepsRowEl = document.getElementById('stepsRow');
  const stepWrap = document.getElementById('stepWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  lblStepTotal.textContent = TOTAL_STEPS + 1;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('prova_jogos_engel', label, { step: currentIndex + 1, total: TOTAL_STEPS + 1, correctCount: progress.correctCount });
    }
  }

  function stepIcon(i) {
    if (i >= 0 && i < QUESTIONS.length) return QUESTIONS[i].icon;
    return '🏆';
  }

  function renderStepsRow() {
    let html = '';
    for (let i = 0; i < TOTAL_STEPS; i++) {
      const done = i < currentIndex;
      const active = i === currentIndex;
      html += `<div class="step-dot${active ? ' active' : ''}${done ? ' done' : ''}">${done ? '✅' : stepIcon(i)}</div>`;
    }
    const finalDone = currentIndex >= TOTAL_STEPS;
    html += `<div class="step-dot${finalDone ? ' active done' : ''}">${finalDone ? '✅' : '🏆'}</div>`;
    stepsRowEl.innerHTML = html;
  }

  function renderQuestion(qIdx) {
    const q = QUESTIONS[qIdx];
    const letters = ['A', 'B', 'C'];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="big-icon">${q.icon}</div>
      <p class="bloco-label">${escapeHtml(q.bloco)} · Pergunta ${qIdx + 1}</p>
      <p class="question-lead">${escapeHtml(q.lead)}</p>
      <p class="question-sub">${escapeHtml(q.sub)}</p>
    `;

    const optionsWrap = document.createElement('div');
    optionsWrap.className = 'options';
    let answered = false;

    q.options.forEach((texto, i) => {
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${escapeHtml(texto)}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(i);
      });
      optionsWrap.appendChild(opt);
    });
    card.appendChild(optionsWrap);

    if (isProfessor) {
      const profNav = document.createElement('div');
      profNav.className = 'step-nav';
      profNav.style.marginTop = '10px';
      profNav.innerHTML = `<button class="btn btn-secondary" id="btnSkipProfessor">⏭️ Pular (professor)</button>`;
      card.appendChild(profNav);
    }

    stepWrap.innerHTML = '';
    stepWrap.appendChild(card);

    if (isProfessor) {
      document.getElementById('btnSkipProfessor').addEventListener('click', () => {
        currentIndex++;
        renderStep();
      });
    }

    function selectAnswer(chosenIdx) {
      const allOptionEls = optionsWrap.querySelectorAll('.option');
      allOptionEls.forEach(el => el.classList.add('disabled'));

      const isCorrect = chosenIdx === q.certa;
      allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
      if (!isCorrect) allOptionEls[q.certa].classList.add('correct');

      progress.respostas[qIdx] = isCorrect;
      if (isCorrect) progress.correctCount++;
      saveProgress(progress);

      const feedback = document.createElement('div');
      feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
      feedback.textContent = isCorrect
        ? `✅ Isso! A resposta certa é "${q.options[q.certa]}".`
        : `❌ Quase! A resposta certa é "${q.options[q.certa]}".`;
      card.appendChild(feedback);

      const nav = document.createElement('div');
      nav.className = 'step-nav';
      nav.style.marginTop = '16px';
      nav.innerHTML = `<button class="btn" id="btnNext">Próximo ➡️</button>`;
      card.appendChild(nav);

      reportStep(`Prova Diagnóstica (Engel) — Pergunta ${qIdx + 1}: respondida`);

      document.getElementById('btnNext').addEventListener('click', () => {
        currentIndex++;
        renderStep();
      });
    }
  }

  function renderResultado() {
    const total = QUESTIONS.length;
    progress.completed = true;
    saveProgress(progress);
    reportStep(`Prova Diagnóstica (Engel) — Concluído (${progress.correctCount}/${total})`);

    stepWrap.innerHTML = `
      <div class="card score-box">
        <div class="big-icon">🏆</div>
        <h2>Você terminou!</h2>
        <p class="lead">Você acertou ${progress.correctCount} de ${total} perguntas.</p>
        <div class="score">${progress.correctCount}/${total} 🎉</div>
      </div>
    `;
  }

  function renderStep() {
    if (currentIndex >= TOTAL_STEPS) { renderResultado(); return; }
    lblStepNum.textContent = currentIndex + 1;
    renderStepsRow();
    reportStep(`Prova Diagnóstica (Engel) — Pergunta ${currentIndex + 1}`);
    renderQuestion(currentIndex);
  }

  // Gabarito pro professor: pergunta → resposta certa de cada uma das 15.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Prova Diagnóstica (Engel) — Gabarito',
      subtitle: 'Prova adaptada (3 alternativas, sem sorteio, com trava anti-saída) · Turma Jogos Digitais',
      items: QUESTIONS.map((q, i) => ({
        number: i + 1,
        title: q.bloco,
        prompt: `${q.lead} — ${q.sub}`,
        options: q.options,
        correctIndex: q.certa,
        answer: q.options[q.certa]
      })),
      fileName: 'prova-jogos-engel-gabarito.txt'
    });
  };

  // Trava de tela: sair da aba/janela durante a prova conta 1 aviso; na
  // 2ª vez, bloqueia até o professor liberar com o token — mesmo
  // mecanismo (shared/exam-proctor.js) da prova padrão (prova-jogos.html)
  // e das outras atividades avaliativas do Engel (frases-engel.html e
  // afins).
  const gateWrap = document.getElementById('gateWrap');
  const stageWrapEl = document.getElementById('stageWrap');

  function startExam() {
    gateWrap.style.display = 'none';
    stageWrapEl.style.display = 'block';
    renderStep();
  }

  function renderWarningOverlay(count, onDismiss) {
    const overlay = document.createElement('div');
    overlay.className = 'warn-overlay';
    overlay.innerHTML = `
      <div class="card">
        <div class="warn-icon">⚠️</div>
        <h2>Aviso ${count}/2</h2>
        <p>Você saiu da tela da prova. Na <b>2ª vez</b>, ela fica <b>bloqueada</b> até o professor liberar.</p>
        <div class="step-nav" style="justify-content:center;">
          <button class="btn" id="btnWarnOk">Entendi</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('btnWarnOk').addEventListener('click', () => {
      overlay.remove();
      if (onDismiss) onDismiss();
    });
  }

  function renderBlockedScreen(guard) {
    stageWrapEl.style.display = 'none';
    gateWrap.style.display = 'flex';
    gateWrap.innerHTML = `
      <div class="card gate-card">
        <div class="warn-icon">🔒</div>
        <h2>Prova bloqueada</h2>
        <p>Você saiu da tela 2 vezes. Peça ajuda ao professor.</p>
        <p>Ele libera com o mesmo token de "Dar visto" (Gestão → Token).</p>
        <div class="token-form">
          <label>Token do professor
            <input type="text" id="unlockToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnUnlock">Desbloquear</button>
          <div class="token-msg" id="unlockMsg" style="display:none;"></div>
        </div>
      </div>
    `;
    const btnUnlock = document.getElementById('btnUnlock');
    const unlockMsg = document.getElementById('unlockMsg');
    btnUnlock.addEventListener('click', async () => {
      const t = document.getElementById('unlockToken').value;
      unlockMsg.style.display = 'none';
      if (!t) {
        unlockMsg.className = 'token-msg erro';
        unlockMsg.textContent = 'Informe o token do professor.';
        unlockMsg.style.display = 'block';
        return;
      }
      btnUnlock.disabled = true;
      btnUnlock.textContent = 'Verificando...';
      const result = await window.PortalExamGuard.unlock(guard, t);
      if (!result.ok) {
        unlockMsg.className = 'token-msg erro';
        unlockMsg.textContent = result.erro;
        unlockMsg.style.display = 'block';
        btnUnlock.disabled = false;
        btnUnlock.textContent = 'Desbloquear';
        return;
      }
      renderStartScreen(guard);
    });
  }

  function renderStartScreen(guard) {
    stageWrapEl.style.display = 'none';
    gateWrap.style.display = 'flex';
    gateWrap.innerHTML = `
      <div class="card gate-card">
        <div class="warn-icon">📋</div>
        <h2>Antes de começar</h2>
        <p>São ${QUESTIONS.length} perguntas: JavaScript, Roteiros de Teste e Formar Frases. Em cada uma, escolha 1 das 3 opções.</p>
        <p>Se errar, sem problema: a resposta certa aparece na hora, pra você aprender.</p>
        <p>Depois de clicar em <b>Começar</b>, fique nesta tela até terminar — sair da tela ou clicar em outra janela conta um aviso, e a 2ª vez bloqueia até o professor liberar.</p>
        <div class="step-nav" style="justify-content:center; margin-top:10px;">
          <button class="btn" id="btnIniciar">▶ Começar</button>
        </div>
      </div>
    `;
    document.getElementById('btnIniciar').addEventListener('click', () => {
      window.PortalExamGuard.arm(guard, {
        onWarning: (count) => renderWarningOverlay(count, () => {}),
        onBlocked: () => renderBlockedScreen(guard),
        isCompleted: allQuestionsAttempted
      });
      startExam();
    });
  }

  (async function boot() {
    const guard = await window.PortalExamGuard.create('prova_jogos_engel');

    // Sem sessão de aluno reconhecida (professor, ou iframe oculto da
    // Gestão gerando gabarito remotamente) ou prova já 100% respondida —
    // guarda desligada: abre direto, sem tela de regras nem risco de bloqueio.
    if (guard.disabled || allQuestionsAttempted()) {
      startExam();
      return;
    }

    // Já respondeu pelo menos 1 pergunta antes (ex.: recarregou a página
    // no meio) — sinal de que essa tentativa já foi iniciada: volta
    // direto pra prova, sem passar pela tela de regras de novo, só
    // rearmando a trava silenciosamente — mesmo padrão de prova-jogos.html.
    const alreadyStarted = progress.respostas.some(r => r !== null);

    if (guard.blocked) {
      renderBlockedScreen(guard);
    } else if (alreadyStarted) {
      window.PortalExamGuard.arm(guard, {
        onWarning: (count) => renderWarningOverlay(count, () => {}),
        onBlocked: () => renderBlockedScreen(guard),
        isCompleted: allQuestionsAttempted
      });
      startExam();
    } else {
      renderStartScreen(guard);
    }
  })();
</script>
<script src="../../../shared/vlibras-widget.js"></script>
</body>
</html>
