<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundamentos de Programação — Desafios de Lógica 2D</title>
<!-- Padrão novo de trilhas (docs/padrao-trilhas.md): visual base
     compartilhado (aula-base.css) + o motor de desafios de código de sempre
     (shared/js-challenge-engine.js, com os mesmos ids que ele espera). O
     aluno escreve funções de verdade; cada desafio tem testes automáticos.
     Progresso = lista de ids resolvidos (progressTotal no config.js). -->
<link rel="stylesheet" href="../../../shared/aula-base.css">
<style>
  /* Específico deste exercício: lista de desafios, editor e console. */
  .dj-layout{ display:grid; grid-template-columns:220px minmax(0, 1fr); gap:16px; align-items:start; }
  .dj-lista{ display:flex; flex-direction:column; gap:6px; position:sticky; top:0; }
  .dj-lista-titulo{ display:flex; justify-content:space-between; font-family:var(--ab-mono); font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-dim); margin-bottom:2px; }
  .challenge-item{ display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px; transition:border-color .2s; }
  .challenge-item:hover{ border-color:var(--green-dim); }
  .challenge-item .status{ width:18px; text-align:center; flex-shrink:0; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .challenge-item.active{ border-color:var(--green); color:var(--ab-acento); }
  .challenge-item.locked{ opacity:.45; cursor:not-allowed; }
  .dj-explica{ margin:12px 0; padding:12px 16px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); font-size:.95em; line-height:1.6; }
  .dj-explica pre{ margin:8px 0 0; padding:10px 12px; border-radius:10px; background:var(--bg); border:1px solid var(--line); font-family:var(--ab-mono); font-size:13px; overflow-x:auto; white-space:pre; }
  .dj-explica code, #challengeDesc code{ font-family:var(--ab-mono); font-size:.9em; color:var(--ab-acento); }
  .given-vars{ font-size:13px; color:var(--ink-dim); margin-top:6px; }
  .hint-toggle{ margin-top:10px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; padding:6px 14px; border-radius:999px; border:1px solid var(--green-dim); background:transparent; color:var(--ab-acento); }
  .hint-box{ display:none; margin-top:8px; padding:10px 14px; border-radius:12px; border:1px dashed var(--yellow); font-size:14px; line-height:1.55; }
  .hint-box.show{ display:block; }
  textarea#codeInput{ width:100%; min-height:220px; resize:vertical; margin-top:14px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-family:var(--ab-mono); font-size:14px; line-height:1.55; outline:none; tab-size:2; }
  textarea#codeInput:focus{ border-color:var(--green); }
  .dj-acoes{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .console{ margin-top:12px; min-height:70px; max-height:220px; overflow-y:auto; padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); font-family:var(--ab-mono); font-size:13px; line-height:1.6; }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass, .console .line.success{ color:var(--ok); }
  .console .line.success{ font-weight:800; }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.warn{ color:var(--yellow); }
  @media (max-width:760px){
    .dj-layout{ grid-template-columns:1fr; }
    .dj-lista{ position:static; flex-direction:row; flex-wrap:wrap; }
    .challenge-item{ flex:1 1 140px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'fund_jogo2d_desafios';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/js-challenge-engine.js"></script>
</head>
<body>

<div class="ab-app">
  <header class="ab-topo">
    <div class="ab-topo-titulo">Fundamentos de Programação — Desafios de Lógica 2D</div>
    <div class="ab-topo-etapa">Concluídos: <span id="lblProgress">0/0</span></div>
  </header>
  <main class="ab-palco">
    <div class="ab-coluna">
      <div class="dj-layout">
        <nav class="dj-lista" aria-label="Desafios">
          <div class="dj-lista-titulo"><span>Desafios</span></div>
          <div id="challengeList" style="display:contents;"></div>
        </nav>
        <article class="ab-cartao">
          <div class="ab-cartao-etapa">Motor do jogo · escreva a função pedida</div>
          <h2 id="challengeTitle">--</h2>
          <div class="ab-conteudo">
            <div class="dj-explica" id="explanationText"></div>
            <p id="challengeDesc"></p>
            <div class="given-vars" id="givenVarsLabel" style="display:none;"></div>
          </div>
          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
          <textarea id="codeInput" spellcheck="false" aria-label="Seu código"></textarea>
          <div class="dj-acoes">
            <button class="btn" id="btnRun">▶ Executar testes</button>
            <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo desafio →</button>
          </div>
          <div class="console" id="consoleOutput" aria-live="polite"></div>
        </article>
      </div>
    </div>
  </main>
</div>

<script>
  // 8 funções do "motor" de um jogo 2D, na ordem da teoria: movimento,
  // limite de tela, colisão, pontuação, regras de vitória/vida e
  // perseguição. Cada uma APLICA a ideia vista na teoria com uma variação
  // (o aluno não copia o código do slide). A dica dá o norte, não a resposta.
  const CHALLENGES = [
    {
      id: 1,
      title: 'Andando vários frames',
      givenVars: [],
      starter: 'function andar(x, velocidade, frames) {\n  // devolva a posição depois de todos os frames\n}\n',
      explanation: 'A cada frame, o jogo soma a <b>velocidade</b> na posição. Depois de vários frames, a posição muda várias vezes a mesma quantidade.<pre>// 1 frame:  x + velocidade\n// 2 frames: x + velocidade + velocidade</pre>',
      desc: 'Escreva <code>andar(x, velocidade, frames)</code> que devolve a posição depois de <code>frames</code> quadros. Ex.: <code>andar(100, 5, 3)</code> → <b>115</b>.',
      hint: 'Somar a mesma velocidade várias vezes é o mesmo que multiplicar. Quantas vezes ela é somada?',
      solution: 'function andar(x, velocidade, frames) {\n  return x + velocidade * frames;\n}',
      check: { type: 'function', name: 'andar' },
      tests: [
        { args: [100, 5, 3], expected: 115 },
        { args: [300, -4, 3], expected: 288 },
        { args: [50, 10, 0], expected: 50 },
      ],
    },
    {
      id: 2,
      title: 'Sem sair da tela',
      givenVars: [],
      starter: 'function limitarX(x, larguraSprite, larguraTela) {\n  // o x não pode ser menor que 0\n  // nem passar de larguraTela - larguraSprite\n}\n',
      explanation: 'O <code>x</code> marca a <b>borda esquerda</b> do sprite. Para ele caber inteiro na tela, o x vai de <b>0</b> até <b>larguraTela − larguraSprite</b>.',
      desc: 'Escreva <code>limitarX(x, larguraSprite, larguraTela)</code> que devolve o x corrigido. Ex.: <code>limitarX(700, 32, 640)</code> → <b>608</b>.',
      hint: 'Calcule primeiro o x máximo. Depois, dois testes: se passou do mínimo para baixo, devolva o mínimo; se passou do máximo, devolva o máximo.',
      solution: 'function limitarX(x, larguraSprite, larguraTela) {\n  const maximo = larguraTela - larguraSprite;\n  if (x < 0) return 0;\n  if (x > maximo) return maximo;\n  return x;\n}',
      check: { type: 'function', name: 'limitarX' },
      tests: [
        { args: [700, 32, 640], expected: 608 },
        { args: [-15, 32, 640], expected: 0 },
        { args: [200, 32, 640], expected: 200 },
        { args: [480, 40, 480], expected: 440 },
      ],
    },
    {
      id: 3,
      title: 'Pegou a moeda?',
      givenVars: [],
      starter: 'function colidiu(a, b) {\n  // a e b têm x, y, w (largura) e h (altura)\n  // devolva true se os retângulos se sobrepõem\n}\n',
      explanation: 'Dois retângulos se sobrepõem quando se cruzam <b>no eixo x E no eixo y</b> ao mesmo tempo. No x: o começo de um vem antes do fim do outro, e o fim de um vem depois do começo do outro.',
      desc: 'Escreva <code>colidiu(a, b)</code> que devolve <b>true</b> ou <b>false</b>. Cada objeto tem <code>x</code>, <code>y</code>, <code>w</code> e <code>h</code>.',
      hint: 'São 4 comparações ligadas por &&: duas para o eixo x (usando x e w) e duas para o eixo y (usando y e h). Use &lt; e &gt;, sem =, para que encostar na borda não conte.',
      solution: 'function colidiu(a, b) {\n  return a.x < b.x + b.w && a.x + a.w > b.x &&\n         a.y < b.y + b.h && a.y + a.h > b.y;\n}',
      check: { type: 'function', name: 'colidiu' },
      tests: [
        { args: [{ x: 0, y: 0, w: 32, h: 32 }, { x: 20, y: 10, w: 10, h: 10 }], expected: true },
        { args: [{ x: 0, y: 0, w: 32, h: 32 }, { x: 40, y: 0, w: 10, h: 10 }], expected: false },
        { args: [{ x: 0, y: 0, w: 32, h: 32 }, { x: 10, y: 50, w: 10, h: 10 }], expected: false },
        { args: [{ x: 0, y: 0, w: 32, h: 32 }, { x: 32, y: 0, w: 10, h: 10 }], expected: false },
      ],
    },
    {
      id: 4,
      title: 'Quanto vale cada item',
      givenVars: [],
      starter: 'function pontosDoItem(tipo) {\n  // moeda = 10, fruta = 50, fantasma = 200\n  // qualquer outra coisa = 0\n}\n',
      explanation: 'Uma função pode <b>decidir</b> o que devolver com <code>if</code>. Cada <code>return</code> encerra a função na hora.<pre>if (tipo === \'moeda\') return 10;</pre>',
      desc: 'Escreva <code>pontosDoItem(tipo)</code>: <b>moeda</b> vale 10, <b>fruta</b> 50, <b>fantasma</b> 200 e qualquer outro texto vale 0.',
      hint: 'Um if para cada tipo, comparando com === e o texto entre aspas. Depois de todos os ifs, um return para o caso que não bateu com nenhum.',
      solution: "function pontosDoItem(tipo) {\n  if (tipo === 'moeda') return 10;\n  if (tipo === 'fruta') return 50;\n  if (tipo === 'fantasma') return 200;\n  return 0;\n}",
      check: { type: 'function', name: 'pontosDoItem' },
      tests: [
        { args: ['moeda'], expected: 10 },
        { args: ['fruta'], expected: 50 },
        { args: ['fantasma'], expected: 200 },
        { args: ['pedra'], expected: 0 },
      ],
    },
    {
      id: 5,
      title: 'Perdendo uma vida',
      givenVars: [],
      starter: 'function perderVida(vidas) {\n  // tira 1 vida, mas nunca deixa ficar negativo\n}\n',
      explanation: 'Contadores de jogo não podem ficar negativos: <b>-1 vida</b> não existe. <code>Math.max(a, b)</code> devolve o maior dos dois números.<pre>Math.max(0, -3); // 0\nMath.max(0, 2);  // 2</pre>',
      desc: 'Escreva <code>perderVida(vidas)</code> que devolve as vidas menos 1, sem nunca passar abaixo de <b>0</b>.',
      hint: 'Faça a conta normal e use o 0 como "piso": entre a conta e o zero, fica o maior.',
      solution: 'function perderVida(vidas) {\n  return Math.max(0, vidas - 1);\n}',
      check: { type: 'function', name: 'perderVida' },
      tests: [
        { args: [3], expected: 2 },
        { args: [1], expected: 0 },
        { args: [0], expected: 0 },
      ],
    },
    {
      id: 6,
      title: 'Venceu a fase?',
      givenVars: [],
      starter: 'function venceu(moedasRestantes, vidas) {\n  // vence quem pegou todas as moedas e ainda está vivo\n}\n',
      explanation: 'Uma condição pode juntar duas regras com <code>&&</code> (E): o resultado só é <b>true</b> se as duas forem verdadeiras.',
      desc: 'Escreva <code>venceu(moedasRestantes, vidas)</code> que devolve <b>true</b> só quando não sobrou moeda <b>e</b> o jogador ainda tem vida.',
      hint: 'Duas comparações: uma sobre as moedas (quantas precisam sobrar?) e outra sobre as vidas (mais que quanto?). Ligue as duas com &&.',
      solution: 'function venceu(moedasRestantes, vidas) {\n  return moedasRestantes === 0 && vidas > 0;\n}',
      check: { type: 'function', name: 'venceu' },
      tests: [
        { args: [0, 2], expected: true },
        { args: [3, 2], expected: false },
        { args: [0, 0], expected: false },
      ],
    },
    {
      id: 7,
      title: 'O próximo passo na grade',
      givenVars: [],
      starter: "function proximaPosicao(x, y, direcao, passo) {\n  // direcao: 'cima', 'baixo', 'esquerda' ou 'direita'\n  // devolva [novoX, novoY]\n}\n",
      explanation: 'Uma função pode devolver <b>dois valores</b> dentro de um array. Lembre: na tela, <b>y cresce para baixo</b>.<pre>return [x, y];</pre>',
      desc: "Escreva <code>proximaPosicao(x, y, direcao, passo)</code> que devolve <code>[novoX, novoY]</code>. Ex.: <code>proximaPosicao(40, 40, 'cima', 40)</code> → <b>[40, 0]</b>.",
      hint: 'Só um dos dois valores muda em cada direção. Esquerda e direita mexem no x; cima e baixo, no y. Qual sentido soma e qual subtrai?',
      solution: "function proximaPosicao(x, y, direcao, passo) {\n  if (direcao === 'cima') return [x, y - passo];\n  if (direcao === 'baixo') return [x, y + passo];\n  if (direcao === 'esquerda') return [x - passo, y];\n  if (direcao === 'direita') return [x + passo, y];\n  return [x, y];\n}",
      check: { type: 'function', name: 'proximaPosicao' },
      tests: [
        { args: [40, 40, 'cima', 40], expected: [40, 0] },
        { args: [40, 40, 'baixo', 40], expected: [40, 80] },
        { args: [40, 40, 'esquerda', 40], expected: [0, 40] },
        { args: [40, 40, 'direita', 40], expected: [80, 40] },
      ],
    },
    {
      id: 8,
      title: 'O fantasma que persegue',
      givenVars: [],
      starter: 'function direcaoParaAlvo(fx, fy, jx, jy) {\n  // fantasma em (fx, fy), jogador em (jx, jy)\n  // anda no eixo em que está mais longe\n}\n',
      explanation: 'O fantasma calcula a diferença até o jogador em x (<code>jx - fx</code>) e em y (<code>jy - fy</code>). Ele anda no eixo em que a diferença é <b>maior</b> (compare o tamanho com <code>Math.abs</code>). O <b>sinal</b> da diferença diz o sentido.',
      desc: "Escreva <code>direcaoParaAlvo(fx, fy, jx, jy)</code> que devolve <b>'cima'</b>, <b>'baixo'</b>, <b>'esquerda'</b> ou <b>'direita'</b>. Em caso de empate, prefira o eixo <b>y</b>.",
      hint: 'Guarde dx e dy. Se o tamanho de dx for MAIOR que o de dy, decida entre esquerda e direita pelo sinal de dx; senão, entre cima e baixo pelo sinal de dy (y cresce para baixo).',
      solution: "function direcaoParaAlvo(fx, fy, jx, jy) {\n  const dx = jx - fx, dy = jy - fy;\n  if (Math.abs(dx) > Math.abs(dy)) {\n    return dx > 0 ? 'direita' : 'esquerda';\n  }\n  return dy > 0 ? 'baixo' : 'cima';\n}",
      check: { type: 'function', name: 'direcaoParaAlvo' },
      tests: [
        { args: [100, 100, 120, 300], expected: 'baixo' },
        { args: [100, 100, 400, 120], expected: 'direita' },
        { args: [300, 300, 50, 280], expected: 'esquerda' },
        { args: [200, 200, 210, 20], expected: 'cima' },
      ],
    },
  ];

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Fundamentos de Programação — Desafios de Lógica 2D',
      subtitle: 'Prática · Trilha Lógica de Jogo 2D em JavaScript · Turma Jogos',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc.replace(/<[^>]+>/g, ''),
        answer: c.tests.map(t => `${c.check.name}(${t.args.map(a => JSON.stringify(a)).join(', ')}) → ${JSON.stringify(t.expected)}`).join('\n')
          + '\n\nCódigo de referência (não é a única forma correta):\n' + c.solution,
      })),
      fileName: 'fund-jogo2d-desafios-gabarito.txt',
    });
  };

  window.PortalJsChallenges.run({
    activityLocation: 'fund_jogo2d_desafios',
    challenges: CHALLENGES,
    reportLabel: 'Fundamentos — Desafios de Lógica 2D',
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>
</body>
</html>
