Hoje você cria o **seu próprio personagem**: desenha a arte, coloca no jogo e faz ele andar pelas setas do teclado, sem sair da área permitida.

### O que entregar no fim da aula

1. O personagem desenhado por você no **Piskel**, salvo em PNG.
2. O jogo no **PixelCode** mostrando o seu desenho (não um quadrado de "imagem faltando").
3. O personagem andando nas 4 direções e parando ao soltar a seta.
4. O personagem preso no **chão**: não sai da tela e não sobe para o céu.

### Ferramentas (as duas sem login)

- **Piskel** (¤piskelapp.com¤): editor de pixel art no navegador.
- **PixelCode**: o editor do portal, no botão **💻 PixelCode** da tela inicial. Ele abre numa aba nova e salva tudo neste navegador.

No ¤criar()¤, logo abaixo de ¤heroi.setScale(3);¤, acrescente:

Execute e teste **as 4 bordas**: segure cada seta até o fim.

Agora o personagem só pode andar no **chão**, a faixa de baixo da tela. O céu fica proibido.

**1.** No começo do ¤criar()¤, **antes** da linha do ¤heroi = this.physics.add.sprite(...)¤, acrescente:

  this.physics.world.setBounds(0, 200, 640, 160);

§§§javascript

§§§

- ¤this.add.rectangle(x, y, largura, altura, cor)¤ desenha o chão verde. O x e o y são o **centro** do retângulo: ele vai de y = 200 até y = 360.
- ¤setBounds(0, 200, 640, 160)¤ muda o mundo da física para essa mesma faixa. O ¤setCollideWorldBounds(true)¤ da etapa anterior agora prende o personagem **nela**.
- O retângulo vem antes do sprite para ficar **atrás** do personagem.

### Código completo para conferir

§§§javascript
const configuracao = {
  type: Phaser.AUTO,
  width: 640,
  height: 360,
  backgroundColor: '#1d2b3a',
  pixelArt: true,
  physics: { default: 'arcade' },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: { preload: preCarregar, create: criar, update: atualizar }
};

const VELOCIDADE = 200;
let heroi;
let teclas;

function preCarregar() {
  this.load.image('heroi', 'personagem.png');
}

function criar() {
  // chão: a área onde o personagem pode andar
  this.add.rectangle(320, 280, 640, 160, 0x2e6b3f);
  this.physics.world.setBounds(0, 200, 640, 160);

  heroi = this.physics.add.sprite(320, 280, 'heroi');
  heroi.setScale(3);
  heroi.setCollideWorldBounds(true);
  teclas = this.input.keyboard.createCursorKeys();
}

function atualizar() {
  heroi.setVelocity(0);

  if (teclas.left.isDown) {
    heroi.setVelocityX(-VELOCIDADE);
  } else if (teclas.right.isDown) {
    heroi.setVelocityX(VELOCIDADE);
  }

  if (teclas.up.isDown) {
    heroi.setVelocityY(-VELOCIDADE);
  } else if (teclas.down.isDown) {
    heroi.setVelocityY(VELOCIDADE);
  }
}

new Phaser.Game(configuracao);
§§§

- [ ] O chão verde aparece atrás do personagem
- [ ] Segurando a seta para cima, ele para na beirada do chão
- [ ] Continua sem sair pelas laterais nem por baixo`

| Sintoma | O que conferir |

| Tela preta, nada aparece | Mensagem vermelha do Console; o Phaser vem antes do ¤jogo.js¤ no ¤jogo.html¤ |

- [ ] Fiz pelo menos um desafio extra`

  ];

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveProgress(data) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }
  function loadStepIndex() {
    try {
      const n = parseInt(localStorage.getItem(STEP_KEY), 10);
      return Number.isInteger(n) && n >= 0 && n <= STEPS.length ? n : 0;
    } catch (e) { return 0; }
  }
  function saveStepIndex(i) { try { localStorage.setItem(STEP_KEY, String(i)); } catch (e) {} }

  const savedProgress = loadProgress();
  let currentIndex = (savedProgress && savedProgress.completed) ? STEPS.length : loadStepIndex();

  const stepWrap = document.getElementById('stepWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const progressFill = document.getElementById('progressFill');
  document.getElementById('lblStepTotal').textContent = STEPS.length + 1;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de cod-phaser-final-pratica.html.
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity(LOC, label, { step: currentIndex + 1, total: STEPS.length + 1 });
    }
  }

  function renderNav(showBack, showNext) {
    return `
      <div class="ab-nav">
        ${showBack ? '<button class="btn btn-secondary" id="btnBack">← Voltar</button>' : '<span></span>'}
        <span class="ab-nav-dica">use ← → do teclado</span>
        ${showNext ? '<button class="btn" id="btnNext">Próximo →</button>' : '<span></span>'}
      </div>`;
  }

  let direcao = 1;
  function irPara(i) {
    direcao = i < currentIndex ? -1 : 1;
    currentIndex = Math.max(0, Math.min(i, STEPS.length));
    renderStep();
  }
  function mostrarEtapa() {
    document.getElementById('palco').scrollTop = 0;
    window.AulaBase.transicao(stepWrap.querySelector('.ab-cartao'), direcao);
  }
  window.AulaBase.teclado({
    proximo: () => { const b = document.getElementById('btnNext'); if (b) b.click(); },
    anterior: () => { const b = document.getElementById('btnBack'); if (b) b.click(); },
  });

  function renderStep() {
    if (currentIndex >= STEPS.length) { renderVisto(); return; }
    saveStepIndex(currentIndex);
    progressFill.style.width = Math.min(Math.round((currentIndex / STEPS.length) * 100), 100) + '%';
    lblStepNum.textContent = currentIndex + 1;

    const step = STEPS[currentIndex];
    reportStep(`Meu personagem — ${step.titulo}`);
    stepWrap.innerHTML = `
      <article class="ab-cartao">
        <div class="ab-cartao-etapa">Etapa ${currentIndex + 1} de ${STEPS.length + 1}</div>
        <h2>${escapeHtml(step.titulo)}</h2>
        <div class="ab-conteudo">${mdToHtml(step.corpo)}</div>
      </article>
      ${renderNav(currentIndex > 0, true)}
    `;
    window.AulaBase.decorar(stepWrap, { chaveChecklist: `${LOC}_check_${username}_${currentIndex}` });
    mostrarEtapa();
    const btnBack = document.getElementById('btnBack');
    if (btnBack) btnBack.addEventListener('click', () => irPara(currentIndex - 1));
    document.getElementById('btnNext').addEventListener('click', () => irPara(currentIndex + 1));
  }

  function renderVisto() {
    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length + 1;
    reportStep('Meu personagem — Visto do professor');

    const already = loadProgress();
    if (already && already.completed) {
      const quando = already.vistoEm ? new Date(already.vistoEm).toLocaleString('pt-BR') : '';
      stepWrap.innerHTML = `
        <div class="ab-cartao ab-concluida">
          <h2>✅ Personagem em movimento concluído</h2>
          <p>Visto dado por <b>${escapeHtml(already.vistoPor || '')}</b>${quando ? ' em ' + escapeHtml(quando) : ''}.</p>
        </div>
        ${renderNav(true, false)}
      `;
      mostrarEtapa();
      document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));
      return;
    }

    stepWrap.innerHTML = `
      <div class="ab-cartao">
        <div class="ab-cartao-etapa">Etapa ${STEPS.length + 1} de ${STEPS.length + 1}</div>
        <h2>🧑‍🏫 Etapa final — Visto do professor</h2>
        <div class="ab-conteudo">
          <p>O jogo mostra o <b>seu desenho</b>, o personagem anda pelas setas, para ao soltar e fica <b>preso no chão</b>, sem sair da tela?</p>
          <p>Chame o professor e mostre o jogo rodando no PixelCode: a imagem <code>personagem.png</code> no painel, o movimento nas 4 direções e as bordas do chão. Se fez desafios extras, mostre também. Quando ele confirmar, peça o token de professor e digite abaixo.</p>
        </div>
        <div class="ab-form">
          <label>Token do professor
            <input type="text" id="vistoToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnDarVisto">Dar visto</button>
          <div class="ab-msg" id="vistoMsg" style="display:none;"></div>
        </div>
      </div>
      ${renderNav(true, false)}
    `;
    mostrarEtapa();
    document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));

    const btnDarVisto = document.getElementById('btnDarVisto');
    const vistoMsg = document.getElementById('vistoMsg');
    btnDarVisto.addEventListener('click', async () => {
      const t = document.getElementById('vistoToken').value;
      vistoMsg.style.display = 'none';
      if (!t) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Informe o token do professor.';
        vistoMsg.style.display = 'block';
        return;
      }
      btnDarVisto.disabled = true;
      btnDarVisto.textContent = 'Verificando...';
      try {
        const result = window.PortalProfessorVisto
          ? await window.PortalProfessorVisto.verificarToken(t)
          : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!result.ok) {
          vistoMsg.className = 'ab-msg erro';
          vistoMsg.textContent = result.erro;
          vistoMsg.style.display = 'block';
          btnDarVisto.disabled = false;
          btnDarVisto.textContent = 'Dar visto';
          return;
        }
        saveProgress({ completed: true, vistoPor: result.nome, vistoEm: new Date().toISOString() });
        renderVisto();
      } catch (e) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Erro inesperado ao verificar. Tente de novo.';
        vistoMsg.style.display = 'block';
        btnDarVisto.disabled = false;
        btnDarVisto.textContent = 'Dar visto';
      }
    });
  }

  // Gabarito = checklist pra o professor conferir o projeto na tela do aluno.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Fundamentos — Meu Personagem em Movimento — Checklist de correção',
      subtitle: 'Roteiro prático (Piskel + Phaser no PixelCode, verificado presencialmente) · Fundamentos de Programação de Jogos · Turma Jogos Digitais',
      items: [
        { number: 1, title: 'Arte própria', prompt: 'O personagem foi desenhado pelo aluno no Piskel, 32×32, com fundo transparente, e está no PixelCode como personagem.png?', answer: 'Clicar em personagem.png no painel ARQUIVOS do PixelCode mostra o desenho e "32×32 pixels". Fundo sem pintar (sem quadrado em volta no jogo).' },
        { number: 2, title: 'Sprite no jogo', prompt: 'jogo.html carrega o Phaser (CDN) antes de jogo.js, e o desenho aparece no jogo (não a marca de imagem faltando)?', answer: "preCarregar(): this.load.image('heroi', 'personagem.png'); criar(): heroi = this.physics.add.sprite(320, 280, 'heroi') com setScale(3); pixelArt: true na configuração." },
        { number: 3, title: 'Movimento', prompt: 'O personagem anda nas 4 direções (e na diagonal) pelas setas e para ao soltar?', answer: 'teclas = this.input.keyboard.createCursorKeys() no criar(); atualizar() começa com heroi.setVelocity(0) e usa dois if/else if (x e y) com setVelocityX/Y(±VELOCIDADE).' },
        { number: 4, title: 'Limites', prompt: 'O personagem não sai da tela e fica preso no chão verde (não sobe para o céu)?', answer: 'heroi.setCollideWorldBounds(true) + this.physics.world.setBounds(0, 200, 640, 160), com o retângulo do chão this.add.rectangle(320, 280, 640, 160, 0x2e6b3f) criado antes do sprite.' },
      ],
      fileName: 'fund-movimento-pratica-checklist.txt',
    });
  };

  renderStep();
</script>
<script src="../../../shared/vlibras-widget.js"></script>
</body>
