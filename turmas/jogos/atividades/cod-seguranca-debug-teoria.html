<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Segurança da Informação e Debugging: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bia-row{ display:flex; align-items:flex-start; gap:12px; }
  .bia-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bia-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'cod_seguranca_debug_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/quiz-teoria-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — SEGURANÇA DA INFORMAÇÃO E DEBUGGING (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const STEPS = [
    {
      story: 'Oi! Eu sou a <b>Bia</b>, a joaninha debugger da PixelForge Studios. Hoje: <b>segurança da informação</b>, que se apoia em três pilares — o <b>CID</b>: <b>Confidencialidade</b> (só quem deve acessar, acessa), <b>Integridade</b> (os dados não são alterados indevidamente) e <b>Disponibilidade</b> (o sistema está acessível quando precisa). Todo sistema de login de jogo, por exemplo, depende desses três pilares.',
      question: {
        prompt: 'Um sistema de login garante que a senha de um jogador não pode ser lida por outros jogadores, nem pela equipe de suporte sem autorização. Qual pilar da segurança da informação está sendo protegido?',
        options: ['Confidencialidade', 'Integridade', 'Disponibilidade', 'Nenhum pilar específico'],
        correctIndex: 0,
        explanation: 'Isso! Garantir que só quem deve acessar uma informação consegue acessá-la é justamente confidencialidade.'
      }
    },
    {
      story: 'O CID também orienta como modelar <b>permissões</b> de acesso ao banco de dados: nem todo mundo deve poder ler ou alterar tudo. Um jogador comum, por exemplo, não deveria conseguir alterar a pontuação de outro jogador direto no banco — isso protege tanto a <b>integridade</b> quanto a <b>confidencialidade</b> dos dados.',
      question: {
        prompt: 'Um sistema impede que jogadores comuns alterem diretamente a pontuação de outros jogadores no banco de dados, permitindo essa alteração só pra contas administrativas. Que prática de segurança é essa?',
        options: [
          'Modelagem de permissões de acesso, protegendo integridade e confidencialidade',
          'Um bug do sistema qualquer, sem nenhuma relação real com segurança',
          'Um requisito não funcional de performance geral do sistema',
          'Nenhuma prática de segurança específica sendo aplicada aqui de verdade'
        ],
        correctIndex: 0,
        explanation: 'Exato! Restringir quem pode alterar dados sensíveis é uma modelagem de permissões que protege integridade e confidencialidade.'
      }
    },
    {
      story: 'Quando um bug aparece, é hora de <b>debugar</b>. No VSCode, a janela <b>Watch</b> permite acompanhar o valor de variáveis específicas em tempo real enquanto o código roda, e a <b>Call Stack</b> mostra a sequência de funções que foi chamada até chegar no ponto do erro — como um "rastro" de como o programa chegou ali.',
      question: {
        prompt: 'Um dev quer ver exatamente qual sequência de funções foi chamada até o código chegar na linha onde o erro aconteceu. Qual ferramenta do debugger do VSCode mostra esse "rastro"?',
        options: ['Call Stack, sequência de chamadas', 'Watch, janela de acompanhar variáveis', 'Extensões instaladas no editor', 'Variáveis de ambiente do sistema'],
        correctIndex: 0,
        explanation: 'Isso mesmo! A Call Stack mostra exatamente a sequência de chamadas de função até o ponto do erro.'
      }
    },
    {
      story: 'Já a janela <b>Watch</b> serve pra outra coisa: acompanhar o <b>valor</b> de uma variável específica enquanto o código roda passo a passo, ajudando a descobrir exatamente em que momento ela ganhou um valor errado.',
      question: {
        prompt: 'Um dev suspeita que uma variável de vida do jogador está recebendo um valor errado em algum ponto do código, e quer acompanhar seu valor mudando em tempo real enquanto o código roda. Qual ferramenta do debugger ele deve usar?',
        options: ['Watch, pra acompanhar o valor da variável', 'Call Stack, sequência de chamadas de função', 'Extensões instaladas no editor', 'Pipeline de renderização de sprites'],
        correctIndex: 0,
        explanation: 'Perfeito! A janela Watch é feita exatamente pra acompanhar o valor de variáveis específicas em tempo real.'
      }
    },
    {
      story: 'Por fim, jogos precisam <b>manipular dados externos</b>: um arquivo <code>JSON</code> com dados de itens, por exemplo, pode ser lido e convertido em objetos que a engine usa diretamente — sem precisar recompilar o jogo toda vez que um item muda. Isso permite que designers ajustem valores só editando o arquivo de dados. Agora você já reconhece os pilares CID, permissões de acesso, Watch, Call Stack e manipulação de dados externos!',
      question: {
        prompt: 'Um designer altera o dano de uma arma só editando um arquivo JSON externo, sem precisar recompilar o jogo, porque a engine lê esse arquivo e cria os objetos automaticamente. Que prática está sendo usada aqui?',
        options: [
          'Manipulação de dados externos — ler e converter arquivos em objetos sem recompilar',
          'Debugging com Call Stack pra encontrar exatamente onde está o erro',
          'Confidencialidade de dados de login dos jogadores cadastrados',
          'Pipeline de renderização de sprites e texturas na tela'
        ],
        correctIndex: 0,
        explanation: 'Isso! Ler um arquivo externo e converter seu conteúdo em objetos utilizáveis, sem recompilar, é manipulação de dados externos.'
      }
    },
    {
      story: 'O terceiro pilar do CID é a <b>Disponibilidade</b>: garantir que o sistema esteja acessível quando os usuários precisam dele. Um servidor de jogo que cai com frequência, mesmo sem vazar nem corromper nenhum dado, ainda representa uma falha grave de segurança da informação.',
      question: {
        prompt: 'O servidor de login de um jogo fica fora do ar por horas, impedindo todos os jogadores de entrar — mesmo sem nenhum dado vazado ou corrompido. Qual pilar do CID foi violado?',
        options: ['Disponibilidade', 'Confidencialidade', 'Integridade', 'Nenhum pilar, pois nenhum dado foi alterado'],
        correctIndex: 0,
        explanation: 'Isso! Mesmo sem vazamento ou corrupção de dados, o sistema ficar fora do ar é uma falha de disponibilidade.'
      }
    },
    {
      story: 'Além dos três pilares, sistemas costumam ter <b>níveis hierárquicos de acesso</b>: um jogador comum, um moderador e um administrador não deveriam ter as mesmas permissões. Definir essa hierarquia é essencial pra limitar o estrago que uma conta comprometida pode causar.',
      question: {
        prompt: 'Um sistema define que jogadores comuns só podem ver suas próprias informações, moderadores podem silenciar jogadores no chat, e só administradores podem alterar dados financeiros. Que conceito de segurança está sendo aplicado?',
        options: ['Níveis hierárquicos de acesso, com permissões diferentes por papel', 'Confidencialidade simples, sem nenhuma hierarquia envolvida', 'Um bug de permissões não intencional', 'Pipeline de renderização de elementos visuais'],
        correctIndex: 0,
        explanation: 'Exato! Definir permissões diferentes por papel/hierarquia é justamente estabelecer níveis hierárquicos de acesso.'
      }
    },
    {
      story: 'Além de rastrear erros com Watch e Call Stack, um bom <b>tratamento de erros</b> evita que o jogo inteiro trave por causa de uma falha pequena e previsível — como tentar carregar um arquivo de save que não existe. Capturar esse tipo de erro e reagir com uma mensagem adequada é bem melhor que deixar o jogo simplesmente fechar.',
      question: {
        prompt: 'Ao tentar carregar um arquivo de save que não existe, o jogo captura esse problema e mostra "Nenhum save encontrado, iniciando novo jogo" — em vez de travar e fechar sozinho. Que prática de programação está sendo usada aqui?',
        options: ['Tratamento de erros, capturando e reagindo a uma falha esperada', 'Confidencialidade de dados de jogadores', 'Pipeline de renderização de assets gráficos', 'Nenhuma prática específica, é só sorte do sistema'],
        correctIndex: 0,
        explanation: 'Isso mesmo! Antecipar uma falha possível e reagir a ela, em vez de deixar o programa travar, é tratamento de erros.'
      }
    },
    {
      story: 'Uma técnica fundamental de debugging é o <b>breakpoint</b>: um ponto marcado no código onde a execução PAUSA automaticamente, permitindo inspecionar variáveis (com Watch) e a sequência de chamadas (com Call Stack) exatamente naquele instante, em vez de adivinhar onde o erro está.',
      question: {
        prompt: 'Um dev marca um ponto específico numa linha de código pra que a execução do jogo pare exatamente ali, permitindo inspecionar variáveis e a Call Stack naquele momento. Como se chama esse ponto marcado?',
        options: ['Breakpoint, ponto de pausa da execução', 'Pipeline de renderização de sprites', 'Requisito funcional do GDD', 'Extensão instalada na IDE'],
        correctIndex: 0,
        explanation: 'Perfeito! Um breakpoint é justamente um ponto marcado no código onde a execução pausa pra permitir inspeção.'
      }
    },
    {
      story: 'Ao converter dados externos, também é preciso <b>validar</b> o conteúdo antes de confiar nele: um arquivo JSON malformado, ou com um campo faltando, pode quebrar a conversão em objeto se o código simplesmente assumir que os dados sempre estarão corretos. Agora você já reconhece os três pilares do CID, níveis hierárquicos, tratamento de erros, breakpoints e a importância de validar dados externos!',
      question: {
        prompt: 'Um arquivo JSON de itens do jogo vem com um campo obrigatório faltando, e o código quebra ao tentar converter esse arquivo em objeto sem checar nada antes. O que faltou nesse processo?',
        options: ['Validação do conteúdo do arquivo externo antes de confiar nele', 'Um pilar novo de segurança, ainda não estudado', 'Um breakpoint marcado naquela linha específica', 'Nenhuma prática específica poderia ter evitado isso'],
        correctIndex: 0,
        explanation: 'Isso! Validar o conteúdo de um arquivo externo antes de convertê-lo evita que dados malformados quebrem o programa.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Codificação de Jogos — Segurança da Informação e Debugging',
      subtitle: 'Aula Teórica · Trilha Segurança da Informação e Debugging · Turma Jogos Digitais',
      capacidade: 'Reconhecer os pilares e os níveis hierárquicos de segurança da informação / Reconhecer e aplicar processos de depuração (debugging) e tratamento de erros / Aplicar técnicas de conversão e manipulação de dados e arquivos externos.',
      steps: STEPS,
      fileName: 'cod-seguranca-debug-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Codificação: Segurança e Debugging" no Axis para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos — Segurança da Informação e Debugging',
      subtitle: 'Aula Teórica · Trilha Segurança da Informação e Debugging · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'cod-seguranca-debug-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "cod_seguranca_debug_teoria",
    steps: STEPS,
    reportLabel: "Codificação — Segurança e Debugging",
    mentor: { rowClass: "bia", avatar: "🐞", name: "Bia, a Joaninha Debugger" },
    finishPassed: {
      title: "Segurança da Informação e Debugging concluídos!",
      introHtml: "<p>Você já reconhece os pilares CID, permissões de acesso, as ferramentas Watch e Call Stack do debugger, e como manipular dados externos sem recompilar.</p>",
      closingHtml: "<p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Codificação.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>

</body>
