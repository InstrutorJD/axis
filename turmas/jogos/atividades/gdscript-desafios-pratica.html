<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Jogos: Desafios de GDScript</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0f0a14; --panel:#161020; --panel2:#120d1a; --line:#2e2038;
    --purple:#b98cff; --purple-dim:#7a4fb8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#e6dbf2; --ink-dim:#8b7898;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--purple-dim); background:#0a0710;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(185,140,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:190px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--purple); color:var(--purple); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex:1 1 0%; min-height:90px; overflow-y:auto; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }
  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--purple); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:14px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--gold); }

  .explanation-box{
    background:#12081c; border:1px solid var(--purple-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--purple); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--gold); }
  .explanation-box pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:6px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold); white-space:pre;
  }

  .given-vars{ font-size:10.5px; color:var(--ink-dim); margin-top:8px; }
  .given-vars b{ color:var(--gold); }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--gold); border:1px solid var(--purple-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(224,184,74,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--gold);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--gold); }

  textarea#codeInput{
    width:100%; flex:0 0 230px; min-height:140px; resize:vertical; background:#000; color:var(--purple);
    border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; outline:none; line-height:1.5; tab-size:4;
  }
  textarea#codeInput:focus{ border-color:var(--purple); }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--purple); color:#1a0a2a; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--purple); border:1px solid var(--purple-dim); }

  .console{
    background:#0a0610; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:0 0 100px; min-height:70px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass{ color:var(--purple); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--purple); font-weight:bold; }
  .console .line.warn{ color:var(--gold); }

  /* Celular/telas estreitas: mesma regra das outras práticas de desafio —
     empilha tudo numa coluna só e deixa a página inteira rolar. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    textarea#codeInput{ min-height:200px; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'gdscript_desafios';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/gdscript-challenge-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>GDSCRIPT — DESAFIOS DE CÓDIGO</div>
    <div>CONCLUÍDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Desafios</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>
          <div class="given-vars" id="givenVarsLabel" style="display:none;"></div>

          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <textarea id="codeInput" spellcheck="false"></textarea>

        <div class="actions">
          <button class="btn" id="btnRun">▶ Executar</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo desafio →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Bloco 1 — Variável (7 desafios): declarar número/texto, somar, subtrair,
  // multiplicar, dividir, atualizar uma variável a partir de outra já existente.
  // Bloco 2 — print (3 desafios): print com variável, texto fixo e o
  // resultado de uma conta direto.
  // Bloco 3 — Constante, Função, If/else e For (1 desafio cada): fecha o gap
  // com os 5 conceitos ensinados na Comparação (gdscript-comparacao.html) —
  // até aqui só "Variável" tinha desafio de código de verdade.
  const CHALLENGES = [
    {
      id: 1,
      title: 'Guardando um número',
      givenVars: [],
      starter: '# crie uma variavel chamada resultado, com o valor 100\n\n',
      explanation: 'Em GDScript, toda variável começa com <code>var</code> — sem tipo, sem <code>;</code>.<pre>var pontos = 5</pre>',
      desc: 'Crie uma variável chamada <code>resultado</code>, com o valor <b>100</b>.',
      hint: 'Toda variável em GDScript começa com <code>var nome = valor</code>. Lembre-se: sem tipo antes do nome, sem ponto e vírgula no final.',
      solution: 'var resultado = 100',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: {}, expected: 100 }
      ]
    },
    {
      id: 2,
      title: 'Guardando um texto',
      givenVars: [],
      starter: '# crie uma variavel chamada resultado, com o texto "Godot"\n\n',
      explanation: 'Um texto (chamado de <b>string</b>) fica entre aspas duplas — em GDScript não precisa declarar o tipo.<pre>var engine = "Godot"</pre>',
      desc: 'Crie uma variável chamada <code>resultado</code>, com o texto <code>"Godot"</code>.',
      hint: 'Coloque o texto entre aspas duplas, exatamente como pedido (maiúsculas/minúsculas importam).',
      solution: 'var resultado = "Godot"',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: {}, expected: 'Godot' }
      ]
    },
    {
      id: 3,
      title: 'Somando duas variáveis',
      givenVars: ['a', 'b'],
      starter: '# as variaveis a e b ja existem\n# crie uma variavel resultado com a soma de a e b\n\n',
      explanation: 'Para somar dois números, use o sinal <code>+</code>.<pre>var total = x + y</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie uma variável chamada <code>resultado</code> com a soma delas.',
      hint: 'Qual operador matemático soma dois valores? Aplique entre <code>a</code> e <code>b</code>.',
      solution: 'var resultado = a + b',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 2, b: 3 }, expected: 5 },
        { values: { a: 10, b: 15 }, expected: 25 },
        { values: { a: 0, b: 0 }, expected: 0 }
      ]
    },
    {
      id: 4,
      title: 'Subtraindo duas variáveis',
      givenVars: ['a', 'b'],
      starter: '# as variaveis a e b ja existem\n# crie uma variavel resultado com a subtracao de a por b\n\n',
      explanation: 'Para subtrair, use o sinal <code>-</code>.<pre>var diferenca = x - y</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie uma variável <code>resultado</code> com <code>a</code> menos <code>b</code>.',
      hint: 'A ordem dos valores importa numa subtração — pense em qual variável vem primeiro pra não inverter o resultado.',
      solution: 'var resultado = a - b',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 10, b: 3 }, expected: 7 },
        { values: { a: 5, b: 5 }, expected: 0 },
        { values: { a: 3, b: 10 }, expected: -7 }
      ]
    },
    {
      id: 5,
      title: 'Multiplicando duas variáveis',
      givenVars: ['a', 'b'],
      starter: '# as variaveis a e b ja existem\n# crie uma variavel resultado com a multiplicacao de a por b\n\n',
      explanation: 'Para multiplicar, use o sinal <code>*</code>.<pre>var area = x * y</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie uma variável <code>resultado</code> com <code>a</code> vezes <code>b</code>.',
      hint: 'Qual sinal representa multiplicação? É o mesmo símbolo usado em quase toda linguagem de programação.',
      solution: 'var resultado = a * b',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 2, b: 3 }, expected: 6 },
        { values: { a: 4, b: 5 }, expected: 20 },
        { values: { a: 0, b: 9 }, expected: 0 }
      ]
    },
    {
      id: 6,
      title: 'Dividindo duas variáveis',
      givenVars: ['a', 'b'],
      starter: '# as variaveis a e b ja existem (a divisao sempre fecha redondo)\n# crie uma variavel resultado com a divisao de a por b\n\n',
      explanation: 'Para dividir, use o sinal <code>/</code>.<pre>var media = x / y</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Crie uma variável <code>resultado</code> com <code>a</code> dividido por <code>b</code>.',
      hint: 'Qual símbolo representa divisão? É o mesmo usado em quase toda calculadora.',
      solution: 'var resultado = a / b',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { a: 10, b: 2 }, expected: 5 },
        { values: { a: 9, b: 3 }, expected: 3 },
        { values: { a: 20, b: 4 }, expected: 5 }
      ]
    },
    {
      id: 7,
      title: 'Atualizando uma variável',
      givenVars: ['pontos'],
      starter: '# a variavel pontos ja existe\n# crie uma variavel resultado somando 10 ao valor de pontos\n\n',
      explanation: 'Você pode criar uma variável nova a partir do valor de outra que já existe, usando qualquer operador — aqui, soma.<pre>var vidaExtra = vida + 3</pre>',
      desc: 'A variável <code>pontos</code> já existe. Crie <code>resultado</code> com o valor de <code>pontos</code> mais <b>10</b>.',
      hint: 'Você pode usar o valor de uma variável que já existe pra criar uma nova — qual operação aumenta um valor em uma quantia fixa?',
      solution: 'var resultado = pontos + 10',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { pontos: 0 }, expected: 10 },
        { values: { pontos: 5 }, expected: 15 },
        { values: { pontos: -10 }, expected: 0 }
      ]
    },
    {
      id: 8,
      title: 'Mostrando uma variável no console',
      givenVars: ['idade'],
      starter: '# a variavel idade ja existe\n# use print para mostrar o valor de idade\n\n',
      explanation: 'O comando <code>print(...)</code> mostra qualquer valor na tela — é a forma mais comum de exibir um resultado em GDScript.<pre>print(idade)</pre>',
      desc: 'A variável <code>idade</code> já existe. Use <code>print</code> para mostrar o valor dela.',
      hint: 'O comando que exibe algo na tela recebe, entre parênteses, aquilo que você quer mostrar.',
      solution: 'print(idade)',
      check: { type: 'console' },
      tests: [
        { values: { idade: 10 }, expected: [10] },
        { values: { idade: 25 }, expected: [25] },
        { values: { idade: 0 }, expected: [0] }
      ]
    },
    {
      id: 9,
      title: 'Mostrando um texto fixo',
      givenVars: [],
      starter: '# use print para mostrar o texto "Ola, mundo!"\n\n',
      explanation: 'Você também pode mostrar um texto direto, sem precisar de uma variável.<pre>print("Bem-vindo!")</pre>',
      desc: 'Use <code>print</code> para mostrar o texto <code>"Olá, mundo!"</code>.',
      hint: 'Coloque o texto entre aspas duplas, exatamente como pedido, dentro dos parênteses.',
      solution: 'print("Olá, mundo!")',
      check: { type: 'console' },
      tests: [
        { values: {}, expected: ['Olá, mundo!'] }
      ]
    },
    {
      id: 10,
      title: 'Mostrando o resultado de uma conta',
      givenVars: ['a', 'b'],
      starter: '# as variaveis a e b ja existem\n# mostre no console a soma delas\n\n',
      explanation: 'Não precisa guardar numa variável antes — dá pra mostrar o resultado de uma conta direto dentro do <code>print</code>.<pre>print(x + y)</pre>',
      desc: 'As variáveis <code>a</code> e <code>b</code> já existem. Use <code>print</code> para mostrar a soma delas, sem precisar criar outra variável.',
      hint: 'Você não precisa criar uma variável antes — dá pra escrever a conta direto dentro dos parênteses de quem exibe o valor.',
      solution: 'print(a + b)',
      check: { type: 'console' },
      tests: [
        { values: { a: 2, b: 3 }, expected: [5] },
        { values: { a: 10, b: 15 }, expected: [25] },
        { values: { a: 1, b: 1 }, expected: [2] }
      ]
    },
    {
      id: 11,
      title: 'Criando uma constante',
      givenVars: [],
      starter: '# crie uma constante chamada limite, com o valor 10\n\n',
      explanation: 'Uma <b>constante</b> usa <code>const</code> no lugar de <code>var</code> — depois de criada, o valor nunca muda.<pre>const MAX_VIDAS = 3</pre>',
      desc: 'Crie uma constante chamada <code>limite</code>, com o valor <b>10</b>.',
      hint: 'Existe uma palavra que substitui o <code>var</code> quando o valor de uma variável nunca deve mudar depois de criada.',
      solution: 'const limite = 10',
      check: { type: 'variable', name: 'limite' },
      tests: [
        { values: {}, expected: 10 }
      ]
    },
    {
      id: 12,
      title: 'Criando uma função',
      givenVars: [],
      starter: '# crie a funcao Dobro(numero) que devolve numero vezes 2\n\n\n# depois, crie a variavel resultado chamando Dobro(5)\n',
      explanation: 'Uma <b>função</b> começa com <code>func</code>, termina com dois-pontos, e o corpo fica indentado (sem chaves).<pre>func Triplo(x):\n\treturn x * 3</pre>',
      desc: 'Crie uma função chamada <code>Dobro</code>, que recebe <code>numero</code> e devolve o dobro dele. Depois, crie <code>resultado</code> com o valor de <code>Dobro(5)</code>.',
      hint: 'Uma função começa com <code>func</code> + nome + parâmetros entre parênteses + dois-pontos, e usa <code>return</code> (indentado) pra devolver o valor. Depois, você a chama como chamaria qualquer outro comando.',
      solution: 'func Dobro(numero):\n\treturn numero * 2\nvar resultado = Dobro(5)',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: {}, expected: 10 }
      ]
    },
    {
      id: 13,
      title: 'Decidindo com if/else',
      givenVars: ['idade'],
      starter: 'var resultado\nif idade >= 18:\n\t\nelse:\n\t\n',
      explanation: '<code>if</code> testa uma condição; <code>else</code> roda quando ela é falsa — os dois-pontos e a indentação marcam onde cada bloco começa.<pre>var status\nif vida > 0:\n\tstatus = "Vivo"\nelse:\n\tstatus = "Morto"</pre>',
      desc: 'A variável <code>idade</code> já existe. Complete o código: se <code>idade</code> for maior ou igual a <b>18</b>, <code>resultado</code> deve ser <code>"Maior"</code>; senão, <code>"Menor"</code>.',
      hint: 'Dentro de cada bloco (indentado) você reatribui a variável <code>resultado</code>, sem a palavra <code>var</code> de novo — pense no texto certo pra cada lado da condição.',
      solution: 'var resultado\nif idade >= 18:\n\tresultado = "Maior"\nelse:\n\tresultado = "Menor"',
      check: { type: 'variable', name: 'resultado' },
      tests: [
        { values: { idade: 20 }, expected: 'Maior' },
        { values: { idade: 18 }, expected: 'Maior' },
        { values: { idade: 10 }, expected: 'Menor' }
      ]
    },
    {
      id: 14,
      title: 'Repetindo com for',
      givenVars: [],
      starter: '# use um for pra mostrar 0, 1, 2, 3 e 4 no console (5 numeros)\n\n',
      explanation: '<code>for</code> repete um bloco pra cada número dentro de <code>range(...)</code>.<pre>for i in range(3):\n\tprint(i)</pre>',
      desc: 'Use um laço <code>for</code> para mostrar no console os números de <b>0</b> a <b>4</b>, um <code>print</code> por número.',
      hint: '<code>range(N)</code> gera uma sequência de números sozinho — pense em quantas repetições você precisa pra cobrir de 0 até 4.',
      solution: 'for i in range(5):\n\tprint(i)',
      check: { type: 'console' },
      tests: [
        { values: {}, expected: [0, 1, 2, 3, 4] }
      ]
    }
  ];

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'GDScript — Desafios de Código',
      subtitle: 'Prática · Trilha GDScript · Turma Jogos Digitais',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        answer: c.tests.map(t => {
          const inputs = Object.entries(t.values || {}).map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join(', ');
          const prefix = inputs ? `Com ${inputs}` : 'Sem variáveis de entrada';
          if (c.check.type === 'console') {
            return `${prefix} → print deve mostrar ${JSON.stringify(t.expected)}`;
          }
          return `${prefix} → ${c.check.name} deve ser ${JSON.stringify(t.expected)}`;
        }).join('\n') + '\n\nCódigo de referência (não é a única forma correta):\n' + c.solution
      })),
      fileName: 'gdscript-desafios-pratica-gabarito.txt'
    });
  };

  window.PortalGdscriptChallenges.run({
    activityLocation: 'gdscript_desafios',
    challenges: CHALLENGES,
    reportLabel: 'GDScript — Desafios de Código'
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
