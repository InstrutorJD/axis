<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Linguagens e Plataformas: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --green:#3aa0ff; --green-dim:#2b6ba3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#d6e2ec; --ink-dim:#6c8698;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050a10;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(58,160,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(58,160,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:8px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--yellow); white-space:pre;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(58,160,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,91,77,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04150c; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(58,160,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'devsis_linguagem_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/quiz-teoria-engine.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>DEV SISTEMAS — CENTRAL DE SISTEMAS (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">9</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const STEPS = [
    {
      story: 'Última parada! Eu sou o <b>Bit</b> de novo. Agora vamos falar de como escolher a <b>linguagem certa pra cada plataforma</b>. As três grandes plataformas — <b>Web</b>, <b>Desktop</b> e <b>Mobile</b> — têm linguagens/tecnologias dominantes diferentes, e escolher errado custa retrabalho.',
      question: {
        prompt: 'Um dev usa exatamente a mesma stack pra construir um site e um app Android nativo, sem adaptar nada. Qual problema ele provavelmente vai enfrentar?',
        options: [
          'Vai descobrir que a tecnologia ideal muda de plataforma pra plataforma, e terá retrabalho',
          'Nenhum — toda tecnologia roda igual em qualquer plataforma',
          'O problema vai ser só de design visual, nada técnico',
          'Só existe problema se o app for muito grande'
        ],
        correctIndex: 0,
        explanation: 'Isso! Cada plataforma tem seu próprio ecossistema — o que funciona bem na Web não é necessariamente o ideal pra Mobile ou Desktop.'
      }
    },
    {
      story: 'Na <b>Web</b>, a combinação dominante é <b>HTML</b> (estrutura), <b>CSS</b> (estilo) e <b>JavaScript</b> (comportamento) — é o que todo navegador entende nativamente, sem precisar instalar nada.',
      question: {
        prompt: 'Você precisa entregar uma página que rode direto no navegador, sem o usuário instalar absolutamente nada. Qual stack faz isso?',
        options: ['HTML, CSS e JavaScript', 'Swift e Kotlin', 'C# e .NET', 'Python e Django'],
        correctIndex: 0,
        explanation: 'Correto! Todo navegador entende HTML/CSS/JS nativamente — por isso essa é a combinação padrão pra Web.'
      }
    },
    {
      story: 'No <b>Mobile</b>, cada sistema operacional tem sua linguagem nativa preferida: <b>Kotlin</b> pra Android, <b>Swift</b> pra iOS. Também existem frameworks multiplataforma (como React Native e Flutter) que escrevem uma vez e rodam nos dois.',
      question: {
        prompt: 'Uma empresa quer o app rodando com o MÁXIMO desempenho possível, só no iPhone — sem se preocupar com Android por enquanto. Qual linguagem nativa é a mais indicada?',
        options: ['Swift', 'JavaScript', 'PHP', 'SQL'],
        correctIndex: 0,
        explanation: 'Isso! Swift é a linguagem nativa da Apple pra iOS — a escolha certa quando o objetivo é máximo desempenho naquela plataforma específica.'
      }
    },
    {
      story: 'No <b>Desktop</b>, é comum ver C#/.NET (forte no Windows), ou até tecnologias web empacotadas com <b>Electron</b> (JavaScript rodando como app desktop, como o VS Code e o Discord).',
      question: {
        prompt: 'Uma equipe já tem um site pronto em HTML/CSS/JS e quer entregar também uma versão instalável de desktop, sem reescrever o front-end do zero. O que permite empacotar essas tecnologias web como um app desktop de verdade?',
        options: [
          'Electron, empacotando o JS/HTML/CSS como aplicativo desktop',
          'Rodar o mesmo site só dentro do navegador, sem instalar nada',
          'Substituir totalmente o sistema operacional do usuário',
          'Compilar o JavaScript direto pra Android'
        ],
        correctIndex: 0,
        explanation: 'Exato! Electron permite reaproveitar conhecimento web pra construir aplicativos desktop de verdade — é assim que VS Code e Discord funcionam.'
      }
    },
    {
      story: 'Independente da plataforma, um app precisa ter <b>responsividade</b>: a interface se adapta bem tanto numa tela pequena de celular quanto num monitor grande — sem elementos cortados ou ilegíveis.',
      question: {
        prompt: 'Um site fica ótimo no monitor grande, mas no celular os botões saem da tela e o texto fica cortado. Que qualidade está faltando nesse site?',
        options: ['Responsividade', 'Compilação', 'Peer Review', 'Debugging'],
        correctIndex: 0,
        explanation: 'Isso! Responsividade é a capacidade da interface se adaptar a diferentes tamanhos de tela, mantendo tudo legível e usável.'
      }
    },
    {
      story: 'Depois de pronto, é essencial fazer <b>testes de compatibilidade</b>: o mesmo site pode se comportar diferente no Chrome, Firefox e Safari; o mesmo app pode ter bugs só em uma versão específica de Android ou iOS.',
      question: {
        prompt: 'Um site funciona perfeitamente no Chrome, mas trava no Safari. Que tipo de verificação, feita ANTES do lançamento, teria pego esse problema?',
        options: [
          'Testes de compatibilidade entre navegadores/sistemas operacionais',
          'Testes de velocidade do banco de dados',
          'Testes de segurança da rede',
          'Nenhum teste pega esse tipo de problema'
        ],
        correctIndex: 0,
        explanation: 'Correto! Testes de compatibilidade garantem que o comportamento seja consistente entre diferentes navegadores e sistemas operacionais.'
      }
    },
    {
      story: 'Por fim, o código-fonte terminado precisa virar um <b>binário final</b> pronto pra distribuir — esse processo de transformar o projeto num arquivo instalável/executável se chama <b>build</b> (ou empacotamento).',
      question: {
        prompt: 'O código está pronto e testado, mas ainda precisa virar um instalador (.exe, .apk...) pra chegar até o usuário final. Como se chama esse processo de empacotamento?',
        options: ['Build (empacotamento)', 'Peer Review', 'Debugging', 'Requisito funcional'],
        correctIndex: 0,
        explanation: 'Isso! O build empacota tudo (código, dependências, recursos) num binário final, pronto pra rodar sem precisar do ambiente de desenvolvimento.'
      }
    },
    {
      story: 'A linguagem "favorita" do desenvolvedor não deveria ser o critério principal — o que importa é o <b>público-alvo</b> e a <b>plataforma</b> onde o produto vai rodar de verdade. Um app Mobile nativo de alta performance pede uma escolha diferente de um site institucional simples.',
      question: {
        prompt: 'Um dev insiste em usar Kotlin em TODO projeto, só porque é a linguagem favorita dele — mesmo num projeto que é puramente um site institucional. Qual é o problema dessa escolha?',
        options: [
          'Ignora o público-alvo e a plataforma onde o produto realmente vai rodar',
          'Nenhum — a linguagem favorita do dev sempre deve vencer',
          'O problema é puramente estético, nada técnico',
          'Só existe problema se o site for muito grande'
        ],
        correctIndex: 0,
        explanation: 'Exato! Assim como a escolha de tecnologia parte dos requisitos, a escolha de linguagem parte de ONDE e PRA QUEM o produto vai rodar.'
      }
    },
    {
      story: 'Resumindo: escolher a linguagem certa significa alinhar três coisas — a <b>plataforma-alvo</b> (Web, Desktop, Mobile), os <b>requisitos</b> do projeto (que você já viu na trilha anterior) e o <b>ecossistema</b> disponível pra essa combinação. Com isso, você já sabe selecionar linguagem e plataforma com critério.',
      question: {
        prompt: 'Antes de bater o martelo na linguagem de um projeto novo, quais três coisas você precisa olhar juntas — nenhuma sozinha basta?',
        options: [
          'Plataforma-alvo, requisitos do projeto e ecossistema disponível',
          'Só a opinião pessoal do desenvolvedor',
          'Só o preço da licença da linguagem',
          'Só a popularidade da linguagem nas redes sociais'
        ],
        correctIndex: 0,
        explanation: 'Isso! Plataforma, requisitos e ecossistema juntos apontam pra escolha certa — nenhum dos três sozinho é suficiente.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Dev Sistemas — Linguagens e Plataformas',
      subtitle: 'Aula Teórica · Trilha Linguagem e Plataforma · Turma Sistemas',
      capacidade: 'Selecionar linguagem de programação de acordo com os requisitos.',
      steps: STEPS,
      fileName: 'devsis-linguagem-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Sistemas: Linguagem e Plataforma" no Axis para os alunos resolverem chamados de verdade.'
    });
  };

  // Mesmo esquema do generateSlidesForGestao acima: exposto sempre pra a aba
  // "Gestão" poder chamar remotamente, num iframe oculto, e baixar um .txt
  // com pergunta + resposta esperada de cada etapa — sem o professor precisar
  // decorar as respostas ou abrir o módulo pra conferir.

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Dev Sistemas — Linguagens e Plataformas',
      subtitle: 'Aula Teórica · Trilha Linguagem e Plataforma · Turma Sistemas',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'devsis-linguagem-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "devsis_linguagem_teoria",
    steps: STEPS,
    reportLabel: "Dev Sistemas — Linguagem e Plataforma",
    mentor: { rowClass: "eri", avatar: "🧑‍💻", name: "Bit, Mentor de Código" },
    finishPassed: {
      title: "Linguagens e Plataformas concluídas!",
      introHtml: "<p>Você já sabe as tecnologias dominantes de Web, Desktop e Mobile, além de responsividade, testes de compatibilidade e build/empacotamento.</p>",
      closingHtml: "<p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Sistemas.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
