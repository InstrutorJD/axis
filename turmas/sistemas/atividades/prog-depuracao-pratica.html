<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Dev Sistemas: Depuração</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --green:#3aa0ff; --green-dim:#2b6ba3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#d6e2ec; --ink-dim:#6c8698;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050a10;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(58,160,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:110px; flex-shrink:0; height:100%; overflow-y:auto; transition:width 0.15s ease;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar.expanded{ width:200px; }
  .sidebar-title{
    display:flex; align-items:center; gap:4px; width:100%; margin:0 0 8px; padding:6px 2px;
    font-family:inherit; font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px;
    background:none; border:none; cursor:pointer; white-space:nowrap;
  }
  .sidebar-title:hover{ color:var(--ink); }
  #challengeList{ display:none; }
  .sidebar.expanded #challengeList{ display:block; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--green); color:var(--green); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex-shrink:0; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }

  .ticket-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .ticket-icon{ font-size:26px; line-height:1; }
  .ticket-status{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; padding:3px 8px; border-radius:2px; }
  .ticket-status.pending{ background:rgba(255,91,77,0.15); color:var(--blood-bright); }
  .ticket-status.done{ background:rgba(58,160,255,0.15); color:var(--green); }

  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--green); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:12px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--yellow); }

  .explanation-box{
    background:#050a10; border:1px solid var(--green-dim); padding:7px 12px;
    font-size:11px; color:var(--ink-dim); line-height:1.5; flex-shrink:0;
  }
  .explanation-box b{ color:var(--green); }
  .explanation-box code{ color:var(--yellow); }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--yellow); border:1px solid var(--green-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(224,196,106,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--yellow);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--yellow); }

  .code-panel{ background:var(--panel); border:1px solid var(--line); padding:10px 14px; flex-shrink:0; }
  .code-panel .code-title{
    display:flex; justify-content:space-between; align-items:center;
    font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;
  }
  .code-box{
    background:#000; border:1px solid var(--line); padding:12px; margin:0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--yellow);
    white-space:pre; line-height:1.6;
  }
  .answer-panel{ background:var(--panel); border:1px solid var(--line); padding:10px 14px; flex-shrink:0; }
  .answer-panel label{ display:block; font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .code-editor{
    width:100%; height:200px; border:1px solid var(--line); border-radius:2px; overflow:hidden;
  }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04150c; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .console{
    background:#060806; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:1; min-height:50px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.log{ color:var(--ink); }
  .console .line.warn{ color:var(--yellow); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--green); font-weight:bold; }

  /* Tela de regras/início e tela de bloqueio (ver shared/exam-proctor.js) */
  .gate-wrap{ width:100%; height:100%; display:none; align-items:center; justify-content:center; }
  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px; }
  .gate-card{ max-width:480px; width:100%; }
  .gate-card ul{ margin:10px 0 0; padding-left:20px; font-size:13px; line-height:1.8; }
  .gate-card li{ margin-bottom:4px; }
  .gate-card .warn-icon{ font-size:40px; margin-bottom:8px; }
  .token-form{ display:flex; flex-direction:column; gap:12px; max-width:320px; margin:16px auto 0; text-align:left; }
  .token-form label{ display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .token-form input{
    font-family:inherit; font-size:14px; padding:9px 10px; background:#000; color:var(--ink);
    border:1px solid var(--line); border-radius:2px;
  }
  .token-form input:focus{ outline:none; border-color:var(--green-dim); }
  .token-msg{ font-size:12.5px; padding:8px 10px; border:1px dashed var(--line); }
  .token-msg.erro{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .token-msg.ok{ border-color:var(--green); color:var(--green); }

  /* Overlay de advertência — aparece POR CIMA da atividade quando o aluno
     volta pra aba depois de ter saído (ver shared/exam-proctor.js) */
  .warn-overlay{
    position:fixed; inset:0; background:rgba(5,10,16,0.88); z-index:999;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .warn-overlay .card{ max-width:420px; text-align:center; border-color:var(--blood-bright); }
  .warn-overlay .warn-icon{ font-size:44px; margin-bottom:8px; }
  .warn-overlay h2{ color:var(--blood-bright); }
  .warn-overlay p{ font-size:13.5px; line-height:1.7; margin:0 0 14px; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; }
    .sidebar.expanded{ width:100%; max-height:200px; overflow-y:auto; }
    .main-panel{ height:auto; overflow-y:visible; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'prog_depuracao_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/code-editor-widget.js"></script>
<script src="../../../shared/professor-visto.js"></script>
<script src="../../../shared/exam-proctor.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>DEV SISTEMAS — CENTRAL DE SISTEMAS (DEPURAÇÃO)</div>
    <div>RESOLVIDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="gate-wrap" id="gateWrap"></div>
    <div class="layout" id="practiceLayout" style="display:none;">
      <div class="sidebar" id="sidebarPanel">
        <button type="button" class="sidebar-title" id="sidebarToggle">▸ Atividades</button>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <div class="ticket-row">
            <div class="ticket-icon" id="ticketIcon">🐛</div>
            <div class="ticket-status pending" id="ticketStatus">PENDENTE</div>
          </div>
          <h2 id="challengeTitle">--</h2>
          <p id="challengeDesc"></p>
        </div>

        <div class="explanation-box">
          📘 Leia o bug abaixo, digite a correção no editor e clique em <b>Executar</b> (Ctrl+Enter).
        </div>

        <div class="code-panel">
          <div class="code-title">
            <span>Código com bug</span>
          </div>
          <pre class="code-box" id="codeBox"></pre>
          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <div class="answer-panel">
          <label for="answerCode">Sua correção</label>
          <div id="answerCode" class="code-editor"></div>
        </div>

        <div class="actions">
          <button class="btn" id="btnRun">▶ Executar</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo chamado →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `prog_depuracao_pratica_progress_${username}`;

  // Prática de code review de verdade: o `code` abaixo (mostrado, mas não
  // copiável) tem um bug real e FIXO. O aluno lê, digita do zero a versão
  // corrigida no textarea de resposta e clica em Executar — o código
  // digitado roda de verdade aqui (sandbox via `new Function`, igual ao
  // PixelCode), e o console mostra a saída real ou o erro lançado. O
  // chamado só é dado como resolvido quando algum console.log(...) do
  // código do aluno bate (trim + minúsculas) com `expectedOutput` — não
  // é comparação de texto "de olho", é execução de verdade.
  const CHALLENGES = [
    {
      id: 1,
      title: 'Nome sem aspas',
      icon: '📛',
      desc: 'Esse código deveria mostrar uma mensagem de boas-vindas usando o nome guardado numa variável.',
      code: 'let nome = joao;\nconsole.log("Bem-vindo, " + nome);',
      hint: 'Texto (string) em JavaScript precisa ficar entre aspas — sem elas, o computador tenta achar uma VARIÁVEL chamada joao, que não existe.',
      bugExplanation: 'Faltavam aspas em <code>joao</code> — sem elas, o JavaScript tenta usar joao como o NOME de uma variável (que não existe), em vez de tratar como texto. Com aspas (<code>"joao"</code>), vira uma string de verdade.',
      solution: 'let nome = "joao";\nconsole.log("Bem-vindo, " + nome);',
      expectedOutput: 'Bem-vindo, joao'
    },
    {
      id: 2,
      title: 'Idade com erro de digitação',
      icon: '🔤',
      desc: 'Esse código deveria mostrar a idade da pessoa daqui a 1 ano.',
      code: 'let idade = 15;\nconsole.log(idad + 1);',
      hint: 'Confira se o nome da variável usada no <code>console.log</code> é exatamente igual ao nome declarado com <code>let</code>.',
      bugExplanation: 'A variável foi declarada como <code>idade</code>, mas usada como <code>idad</code> (faltando uma letra) — nomes de variável precisam ser IDÊNTICOS, letra por letra, em todo o código.',
      solution: 'let idade = 15;\nconsole.log(idade + 1);',
      expectedOutput: '16'
    },
    {
      id: 3,
      title: 'Maiúscula ou minúscula?',
      icon: '🔡',
      desc: 'Esse código deveria mostrar o nome guardado na variável.',
      code: 'let Nome = "Maria";\nconsole.log(nome);',
      hint: 'JavaScript diferencia letra maiúscula de minúscula no nome das variáveis — "Nome" e "nome" não são a mesma coisa.',
      bugExplanation: 'A variável foi declarada com N maiúsculo (<code>Nome</code>), mas usada com n minúsculo (<code>nome</code>) — pra JavaScript, maiúsculas e minúsculas tornam o nome completamente diferente.',
      solution: 'let Nome = "Maria";\nconsole.log(Nome);',
      expectedOutput: 'Maria'
    },
    {
      id: 4,
      title: 'Dobro errado',
      icon: '✖️',
      desc: 'Essa função deveria devolver o DOBRO do número recebido.',
      code: 'function dobro(numero) {\n  return numero + 1;\n}\n\nconsole.log(dobro(5));',
      hint: '"Dobro" significa multiplicar por 2 — confira a operação usada dentro da função.',
      bugExplanation: 'A função somava 1 (<code>numero + 1</code>) em vez de multiplicar por 2 (<code>numero * 2</code>) — o dobro de um número é ele vezes 2, não ele mais 1.',
      solution: 'function dobro(numero) {\n  return numero * 2;\n}\n\nconsole.log(dobro(5));',
      expectedOutput: '10'
    },
    {
      id: 5,
      title: 'Acesso liberado?',
      icon: '🚪',
      desc: 'Essa função deveria liberar o acesso só quando a idade for maior ou igual a 18, e bloquear caso contrário.',
      code: 'function verificarAcesso(idade) {\n  if (idade = 18) {\n    return "liberado";\n  } else {\n    return "bloqueado";\n  }\n}\n\nconsole.log(verificarAcesso(15));',
      hint: 'Repare no operador dentro do <code>if</code> — <code>=</code> (atribuição) não é o mesmo que comparar dois valores.',
      bugExplanation: 'O <code>if</code> usava <code>=</code> (atribuição) em vez de <code>&gt;=</code> (comparação) — isso troca o valor de <code>idade</code> por 18 e o resultado da atribuição (18) é sempre "verdadeiro", então a função SEMPRE retornava "liberado", não importa a idade.',
      solution: 'function verificarAcesso(idade) {\n  if (idade >= 18) {\n    return "liberado";\n  } else {\n    return "bloqueado";\n  }\n}\n\nconsole.log(verificarAcesso(15));',
      expectedOutput: 'bloqueado'
    },
    {
      id: 6,
      title: 'Conceito da nota',
      icon: '📊',
      desc: 'Essa função deveria classificar a nota num conceito: A (≥9), B (≥7), C (≥5) ou D (abaixo de 5).',
      code: 'function classificarNota(nota) {\n  let conceito;\n  switch (true) {\n    case nota >= 9:\n      conceito = "A";\n    case nota >= 7:\n      conceito = "B";\n    case nota >= 5:\n      conceito = "C";\n    default:\n      conceito = "D";\n  }\n  return conceito;\n}\n\nconsole.log(classificarNota(9.5));',
      hint: 'Depois que um <code>case</code> do <code>switch</code> é escolhido, o código continua rodando os próximos <code>case</code> também — a não ser que algo pare essa continuação.',
      bugExplanation: 'Faltava <code>break;</code> depois de cada atribuição dentro do <code>switch</code> — sem ele, mesmo depois de entrar no <code>case</code> certo, a execução continua "caindo" nos próximos e sobrescrevendo <code>conceito</code>, até chegar no <code>default</code>.',
      solution: 'function classificarNota(nota) {\n  let conceito;\n  switch (true) {\n    case nota >= 9:\n      conceito = "A";\n      break;\n    case nota >= 7:\n      conceito = "B";\n      break;\n    case nota >= 5:\n      conceito = "C";\n      break;\n    default:\n      conceito = "D";\n  }\n  return conceito;\n}\n\nconsole.log(classificarNota(9.5));',
      expectedOutput: 'A'
    },
    {
      id: 7,
      title: 'Metade errada',
      icon: '➗',
      desc: 'Essa função deveria devolver a metade do número recebido, reaproveitando uma função genérica de divisão.',
      code: 'function dividir(a, b) {\n  return a / b;\n}\n\nfunction metade(numero) {\n  return dividir(2, numero);\n}\n\nconsole.log(metade(10));',
      hint: 'Confira a ORDEM dos argumentos passados pra <code>dividir(...)</code> dentro de <code>metade(...)</code>.',
      bugExplanation: 'Os argumentos estavam invertidos: <code>dividir(2, numero)</code> calcula <code>2 / numero</code>, quando deveria ser <code>dividir(numero, 2)</code> pra calcular <code>numero / 2</code>.',
      solution: 'function dividir(a, b) {\n  return a / b;\n}\n\nfunction metade(numero) {\n  return dividir(numero, 2);\n}\n\nconsole.log(metade(10));',
      expectedOutput: '5'
    },
    {
      id: 8,
      title: 'Faixa etária',
      icon: '🎂',
      desc: 'Essa função deveria classificar a idade em "adulto" (≥18), "adolescente" (≥12) ou "crianca" (abaixo de 12).',
      code: 'function faixaEtaria(idade) {\n  if (idade >= 0) {\n    return "crianca";\n  } else if (idade >= 12) {\n    return "adolescente";\n  } else if (idade >= 18) {\n    return "adulto";\n  }\n  return "invalido";\n}\n\nconsole.log(faixaEtaria(25));',
      hint: 'Num encadeamento de <code>if/else if</code>, a ORDEM das condições importa — pense em qual delas "captura" o valor primeiro.',
      bugExplanation: 'As condições estavam na ordem errada: como <code>idade &gt;= 0</code> é verdadeiro pra quase qualquer idade, ela captura o caso primeiro e as duas condições seguintes nunca são alcançadas. A ordem certa é da mais restritiva pra menos restritiva: <code>&gt;= 18</code>, depois <code>&gt;= 12</code>, depois <code>&gt;= 0</code>.',
      solution: 'function faixaEtaria(idade) {\n  if (idade >= 18) {\n    return "adulto";\n  } else if (idade >= 12) {\n    return "adolescente";\n  } else if (idade >= 0) {\n    return "crianca";\n  }\n  return "invalido";\n}\n\nconsole.log(faixaEtaria(25));',
      expectedOutput: 'adulto'
    },
    {
      id: 9,
      title: 'Dia seguinte',
      icon: '📅',
      desc: 'Essa função deveria devolver o nome do dia da semana IMEDIATAMENTE seguinte ao número recebido (1 = segunda).',
      code: 'function diaDaSemana(numero) {\n  switch (numero) {\n    case 1: return "segunda";\n    case 2: return "terca";\n    case 3: return "quarta";\n    case 4: return "quinta";\n    case 5: return "sexta";\n    default: return "fim de semana";\n  }\n}\n\nfunction diaSeguinte(numero) {\n  return diaDaSemana(numero + 2);\n}\n\nconsole.log(diaSeguinte(3));',
      hint: '"Seguinte" significa o próximo — confira o número que está sendo somado dentro de <code>diaSeguinte(...)</code>.',
      bugExplanation: 'A função somava <code>numero + 2</code> em vez de <code>numero + 1</code>, pulando um dia — o dia seguinte a quarta (3) é quinta (4), não sexta (5).',
      solution: 'function diaDaSemana(numero) {\n  switch (numero) {\n    case 1: return "segunda";\n    case 2: return "terca";\n    case 3: return "quarta";\n    case 4: return "quinta";\n    case 5: return "sexta";\n    default: return "fim de semana";\n  }\n}\n\nfunction diaSeguinte(numero) {\n  return diaDaSemana(numero + 1);\n}\n\nconsole.log(diaSeguinte(3));',
      expectedOutput: 'quinta'
    },
    {
      id: 10,
      title: 'Contagem de aprovados',
      icon: '✅',
      desc: 'Essa função deveria contar quantas notas são de aprovação — ou seja, maiores OU IGUAIS a 6.',
      code: 'function contarAprovados(notas) {\n  let total = 0;\n  for (let i = 0; i < notas.length; i++) {\n    if (notas[i] > 6) {\n      total++;\n    }\n  }\n  return total;\n}\n\nconsole.log(contarAprovados([5, 6, 7, 4, 9, 3]));',
      hint: 'Uma nota exatamente igual a 6 deveria contar como aprovada. O operador de comparação usado está incluindo esse caso?',
      bugExplanation: 'O <code>if</code> usava <code>&gt;</code> (maior que) em vez de <code>&gt;=</code> (maior ou igual) — isso deixava de contar a nota 6 como aprovada, mesmo ela sendo exatamente o limite de aprovação.',
      solution: 'function contarAprovados(notas) {\n  let total = 0;\n  for (let i = 0; i < notas.length; i++) {\n    if (notas[i] >= 6) {\n      total++;\n    }\n  }\n  return total;\n}\n\nconsole.log(contarAprovados([5, 6, 7, 4, 9, 3]));',
      expectedOutput: '3'
    },
    {
      id: 11,
      title: 'Senha correta?',
      icon: '🔑',
      desc: 'Essa função deveria liberar acesso só quando a senha digitada for igual à senha correta.',
      code: 'function senhaCorreta(digitada, correta) {\n  if (digitada = correta) {\n    return "acesso liberado";\n  }\n  return "senha incorreta";\n}\n\nconsole.log(senhaCorreta("1234", "5678"));',
      hint: 'De novo o <code>=</code> dentro do <code>if</code> — compare com o que você aprendeu no chamado "Acesso liberado?".',
      bugExplanation: 'O <code>if</code> usava <code>=</code> (atribuição) em vez de <code>===</code> (comparação) — isso troca o valor de <code>digitada</code> pelo de <code>correta</code>, e como o resultado é uma string não vazia, o <code>if</code> é sempre "verdadeiro", liberando o acesso mesmo com a senha errada.',
      solution: 'function senhaCorreta(digitada, correta) {\n  if (digitada === correta) {\n    return "acesso liberado";\n  }\n  return "senha incorreta";\n}\n\nconsole.log(senhaCorreta("1234", "5678"));',
      expectedOutput: 'senha incorreta'
    },
    {
      id: 12,
      title: 'Turno do dia',
      icon: '🌗',
      desc: 'Essa função deveria classificar a hora em "manhã" (a partir das 5h), "tarde" (a partir das 12h) ou "noite" (a partir das 18h).',
      code: 'function turnoDoDia(hora) {\n  if (hora >= 5) {\n    return "manha";\n  } else if (hora >= 12) {\n    return "tarde";\n  } else if (hora >= 18) {\n    return "noite";\n  }\n  return "madrugada";\n}\n\nconsole.log(turnoDoDia(19));',
      hint: 'Mesmo problema do chamado "Faixa etária" — confira a ORDEM das condições no <code>if/else if</code>.',
      bugExplanation: 'As condições estavam na ordem errada: como <code>hora &gt;= 5</code> já é verdadeiro às 19h, ela captura o caso primeiro e as condições seguintes nunca são testadas. A ordem certa é da mais restritiva pra menos restritiva: <code>&gt;= 18</code>, depois <code>&gt;= 12</code>, depois <code>&gt;= 5</code>.',
      solution: 'function turnoDoDia(hora) {\n  if (hora >= 18) {\n    return "noite";\n  } else if (hora >= 12) {\n    return "tarde";\n  } else if (hora >= 5) {\n    return "manha";\n  }\n  return "madrugada";\n}\n\nconsole.log(turnoDoDia(19));',
      expectedOutput: 'noite'
    },
    {
      id: 13,
      title: 'Categoria do pedido',
      icon: '📦',
      desc: 'Essa função deveria classificar o peso do pedido em "leve" (até 1kg), "medio" (até 5kg) ou "pesado" (acima de 5kg).',
      code: 'function categoriaPedido(peso) {\n  let categoria;\n  switch (true) {\n    case peso <= 1:\n      categoria = "leve";\n    case peso <= 5:\n      categoria = "medio";\n    default:\n      categoria = "pesado";\n  }\n  return categoria;\n}\n\nconsole.log(categoriaPedido(0.5));',
      hint: 'Mesmo problema do chamado "Conceito da nota" — falta algo depois de cada atribuição dentro do <code>switch</code>.',
      bugExplanation: 'Faltava <code>break;</code> depois de cada atribuição dentro do <code>switch</code> — sem ele, mesmo entrando no <code>case</code> certo (peso 0.5 é "leve"), a execução continua caindo nos próximos e sobrescrevendo <code>categoria</code> até o <code>default</code>.',
      solution: 'function categoriaPedido(peso) {\n  let categoria;\n  switch (true) {\n    case peso <= 1:\n      categoria = "leve";\n      break;\n    case peso <= 5:\n      categoria = "medio";\n      break;\n    default:\n      categoria = "pesado";\n  }\n  return categoria;\n}\n\nconsole.log(categoriaPedido(0.5));',
      expectedOutput: 'leve'
    },
    {
      id: 14,
      title: 'Reprovados por falta',
      icon: '🧮',
      desc: 'Essa função deveria contar quantos alunos têm 4 faltas ou MAIS (reprovados por falta).',
      code: 'function contarReprovados(faltas) {\n  let total = 0;\n  for (let i = 0; i < faltas.length; i++) {\n    if (faltas[i] > 4) {\n      total++;\n    }\n  }\n  return total;\n}\n\nconsole.log(contarReprovados([2, 4, 5, 1, 4, 6]));',
      hint: 'Mesmo problema do chamado "Contagem de aprovados" — o limite de 4 faltas deveria contar, e o operador usado está deixando esse caso de fora.',
      bugExplanation: 'O <code>if</code> usava <code>&gt;</code> (maior que) em vez de <code>&gt;=</code> (maior ou igual) — isso deixava de contar quem tem exatamente 4 faltas, mesmo esse sendo o limite de reprovação.',
      solution: 'function contarReprovados(faltas) {\n  let total = 0;\n  for (let i = 0; i < faltas.length; i++) {\n    if (faltas[i] >= 4) {\n      total++;\n    }\n  }\n  return total;\n}\n\nconsole.log(contarReprovados([2, 4, 5, 1, 4, 6]));',
      expectedOutput: '4'
    }
  ];

  // Exposto sempre (não só quando o botão local aparece) pra a aba "Gestão"
  // do portal da turma conseguir chamar isso remotamente, num iframe oculto,
  // e baixar um .txt com o código, a resposta esperada e a explicação do bug
  // de cada chamado — sem o professor precisar rodar tudo de novo.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Dev Sistemas: Compilação e Depuração',
      subtitle: 'Prática · Turma Sistemas',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: `${c.desc}\n\nCódigo com bug:\n${c.code}`,
        answer: `Console após corrigir: ${c.expectedOutput}\n\nBug: ${c.bugExplanation.replace(/<[^>]+>/g, '')}\n\nCódigo corrigido (não é a única forma correta):\n${c.solution}`
      })),
      fileName: 'prog-depuracao-pratica-gabarito.txt'
    });
  };

  const gateWrap = document.getElementById('gateWrap');
  const practiceLayoutEl = document.getElementById('practiceLayout');
  const sidebarPanel = document.getElementById('sidebarPanel');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const challengeListEl = document.getElementById('challengeList');
  const challengeTitleEl = document.getElementById('challengeTitle');
  const challengeDescEl = document.getElementById('challengeDesc');
  const codeBoxEl = document.getElementById('codeBox');
  const ticketIconEl = document.getElementById('ticketIcon');
  const ticketStatusEl = document.getElementById('ticketStatus');
  const answerCodeContainer = document.getElementById('answerCode');
  const btnRun = document.getElementById('btnRun');
  let codeEditor = null; // instância do Monaco, criada de forma assíncrona — ver initEditor()
  const btnNext = document.getElementById('btnNext');
  const btnHint = document.getElementById('btnHint');
  const hintBox = document.getElementById('hintBox');
  const consoleOutput = document.getElementById('consoleOutput');
  const lblProgress = document.getElementById('lblProgress');

  function getCompleted() {
    try {
      return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }
  function saveCompleted(set) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify([...set]));
  }

  let completed = getCompleted();
  let selectedId = CHALLENGES.find(c => !completed.has(c.id))?.id || CHALLENGES[0].id;

  // Bypass pro professor: ele quer ver/preparar todos os chamados sem
  // precisar resolver cada um em ordem (ver PENDENCIAS.md, "Desbloquear
  // todas as etapas das atividades para o professor"). A checagem é
  // assíncrona, então a sidebar é re-renderizada assim que ela resolver.
  let isProfessor = false;
  (async function () {
    const user = window.PortalSession ? await window.PortalSession.getUser() : null;
    isProfessor = !!(user && user.role === 'professor');
    if (isProfessor) renderSidebar();
  })();

  function isUnlocked(challenge) {
    if (isProfessor) return true;
    const idx = CHALLENGES.findIndex(c => c.id === challenge.id);
    if (idx === 0) return true;
    return completed.has(CHALLENGES[idx - 1].id);
  }

  function renderSidebar() {
    challengeListEl.innerHTML = '';
    CHALLENGES.forEach(c => {
      const unlocked = isUnlocked(c);
      const isDone = completed.has(c.id);
      const item = document.createElement('div');
      item.className = 'challenge-item' + (c.id === selectedId ? ' active' : '') + (isDone ? ' completed' : '') + (!unlocked ? ' locked' : '');
      const statusIcon = isDone ? '✅' : (unlocked ? '🐛' : '🔒');
      item.innerHTML = `<span class="status">${statusIcon}</span><span class="name">${c.icon} ${c.title}</span>`;
      if (unlocked) item.addEventListener('click', () => selectChallenge(c.id));
      challengeListEl.appendChild(item);
    });
    lblProgress.textContent = `${completed.size}/${CHALLENGES.length}`;
  }

  function clearConsole() { consoleOutput.innerHTML = ''; }
  function logConsole(msg, type) {
    const line = document.createElement('div');
    line.className = 'line ' + (type || 'info');
    line.innerHTML = msg;
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function normalize(text) {
    return String(text ?? '').trim().toLowerCase();
  }

  function formatArg(arg) {
    if (typeof arg === 'string') return arg;
    if (arg instanceof Error) return arg.stack || arg.message;
    try {
      return JSON.stringify(arg, null, 2);
    } catch (e) {
      return String(arg);
    }
  }

  // Roda o código do aluno num sandbox simples (mesmo esquema do PixelCode:
  // `new Function` recebendo um console falso) — nunca deixa uma exceção do
  // código do aluno escapar pra fora, vira `error` com nome+mensagem.
  function runStudentCode(code) {
    const logs = [];
    const fakeConsole = {
      log: (...args) => logs.push({ type: 'log', text: args.map(formatArg).join(' ') }),
      warn: (...args) => logs.push({ type: 'warn', text: args.map(formatArg).join(' ') }),
      error: (...args) => logs.push({ type: 'error', text: args.map(formatArg).join(' ') }),
      info: (...args) => logs.push({ type: 'info', text: args.map(formatArg).join(' ') }),
    };
    try {
      const fn = new Function('console', code);
      fn(fakeConsole);
      return { logs, error: null };
    } catch (err) {
      const location = (err instanceof SyntaxError)
        ? ''
        : (err.stack || '').split('\n').find(l => l.includes('<anonymous>')) || '';
      return { logs, error: `${err.name}: ${err.message}${location ? '\n  ' + location.trim() : ''}` };
    }
  }

  function handleRun(challenge) {
    const code = codeEditor.getValue();
    if (!code.trim()) {
      logConsole('Digite o código corrigido antes de executar.', 'fail');
      return;
    }

    clearConsole();
    const { logs, error } = runStudentCode(code);
    logs.forEach(l => logConsole(l.text, l.type === 'error' ? 'fail' : l.type));

    if (error) {
      logConsole(error, 'fail');
      return;
    }
    if (logs.length === 0) {
      logConsole('Seu código rodou sem erros, mas não exibiu nada — use console.log(...).', 'warn');
      return;
    }

    const loggedTexts = logs.filter(l => l.type === 'log').map(l => normalize(l.text));
    const matched = loggedTexts.includes(normalize(challenge.expectedOutput));

    if (matched) {
      codeEditor.updateOptions({ readOnly: true });
      btnRun.disabled = true;

      completed.add(challenge.id);
      saveCompleted(completed);
      ticketStatusEl.textContent = 'RESOLVIDO';
      ticketStatusEl.classList.add('done');
      ticketStatusEl.classList.remove('pending');

      logConsole(`✅ Isso mesmo! ${challenge.bugExplanation}`, 'success');

      const isLast = CHALLENGES[CHALLENGES.length - 1].id === challenge.id;
      if (isLast) {
        logConsole('🏆 Chamado resolvido! Você corrigiu todos os bugs desta trilha!', 'success');
      } else {
        btnNext.style.display = 'inline-block';
      }
      renderSidebar();

      if (typeof window.reportActivity === 'function') {
        window.reportActivity(
          'prog_depuracao_pratica',
          `Dev Sistemas — Depuração — Chamado ${challenge.id}: ${challenge.title} (resolvido)`,
          { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
        );
      }
    } else {
      logConsole('❌ Ainda não é esse resultado. Revise a lógica e execute de novo.', 'fail');
    }
  }

  function selectChallenge(id) {
    const challenge = CHALLENGES.find(c => c.id === id);
    if (!challenge || !isUnlocked(challenge)) return;
    selectedId = id;

    challengeTitleEl.textContent = `Chamado ${challenge.id}: ${challenge.title}`;
    challengeDescEl.innerHTML = challenge.desc;
    codeBoxEl.textContent = challenge.code;
    btnNext.style.display = 'none';

    hintBox.innerHTML = challenge.hint || '';
    hintBox.classList.remove('show');
    btnHint.textContent = '💡 Ver dica';

    ticketIconEl.textContent = challenge.icon;
    const alreadyDone = completed.has(id);
    ticketStatusEl.textContent = alreadyDone ? 'RESOLVIDO' : 'PENDENTE';
    ticketStatusEl.classList.toggle('done', alreadyDone);
    ticketStatusEl.classList.toggle('pending', !alreadyDone);

    codeEditor.setValue('');
    codeEditor.updateOptions({ readOnly: alreadyDone });
    btnRun.disabled = alreadyDone;

    clearConsole();
    if (alreadyDone) {
      logConsole(`Você já resolveu este chamado. ${challenge.bugExplanation}`, 'info');
    } else {
      logConsole('Digite a correção e clique em Executar.', 'info');
    }
    renderSidebar();

    if (typeof window.reportActivity === 'function') {
      window.reportActivity(
        'prog_depuracao_pratica',
        `Dev Sistemas — Depuração — Chamado ${challenge.id}: ${challenge.title}`,
        { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
      );
    }
  }

  sidebarToggle.addEventListener('click', () => {
    const expanded = sidebarPanel.classList.toggle('expanded');
    sidebarToggle.textContent = (expanded ? '▾' : '▸') + ' Atividades';
  });
  btnHint.addEventListener('click', () => {
    const showing = hintBox.classList.toggle('show');
    btnHint.textContent = showing ? '💡 Ocultar dica' : '💡 Ver dica';
  });
  btnRun.addEventListener('click', () => {
    const challenge = CHALLENGES.find(c => c.id === selectedId);
    if (challenge) handleRun(challenge);
  });
  btnNext.addEventListener('click', () => {
    const idx = CHALLENGES.findIndex(c => c.id === selectedId);
    const next = CHALLENGES[idx + 1];
    if (next) selectChallenge(next.id);
  });

  // Monaco carrega de forma assíncrona (via CDN) — só depois que o editor
  // estiver pronto é que dá pra popular/travar o campo de resposta, então
  // selectChallenge() só roda depois que initEditor() resolver.
  function initEditor() {
    return window.PortalCodeEditor.create(answerCodeContainer, { value: '' }).then((editor) => {
      codeEditor = editor;
      codeEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
        if (!btnRun.disabled) handleRun(CHALLENGES.find(c => c.id === selectedId));
      });
    });
  }

  function startPractice() {
    gateWrap.style.display = 'none';
    practiceLayoutEl.style.display = 'flex';
    consoleOutput.innerHTML = '<div class="line info">Carregando editor de código...</div>';
    renderSidebar();
    initEditor().then(() => {
      selectChallenge(selectedId);
    });
  }

  // Punição por sair da aba/janela durante a prática, mesmo esquema da
  // trilha de Modelagem de Sistemas (ver shared/exam-proctor.js): depois
  // de clicar em "Iniciar", sair da aba conta advertência; na 2ª, a
  // atividade fica bloqueada até o professor liberar com o token de "Dar
  // Visto". Como o progresso aqui é um array de ids resolvidos (não o
  // formato `{completed:true}` do quiz), passamos nosso próprio
  // `isCompleted` — depois que os 14 chamados forem resolvidos, sair da
  // aba deixa de contar (ver `arm` em shared/exam-proctor.js).
  function allChallengesCompleted() {
    return completed.size >= CHALLENGES.length;
  }

  function renderWarningOverlay(count, onDismiss) {
    const overlay = document.createElement('div');
    overlay.className = 'warn-overlay';
    overlay.innerHTML = `
      <div class="card">
        <div class="warn-icon">⚠️</div>
        <h2>Advertência ${count}/2</h2>
        <p>Você saiu da aba/janela do portal durante a prática. Isso conta como uma advertência.<br>
        Na <b>2ª advertência</b>, esta atividade é <b>bloqueada</b> — só o professor consegue liberar de novo.</p>
        <div class="actions" style="justify-content:center;">
          <button class="btn" id="btnWarnOk">Entendi, continuar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('btnWarnOk').addEventListener('click', () => {
      overlay.remove();
      if (onDismiss) onDismiss();
    });
  }

  function renderBlockedScreen(guard) {
    practiceLayoutEl.style.display = 'none';
    gateWrap.style.display = 'flex';
    gateWrap.innerHTML = `
      <div class="card gate-card" style="text-align:center;">
        <div class="warn-icon">🔒</div>
        <h2>Atividade bloqueada</h2>
        <p>Você saiu da aba/janela do portal 2 vezes durante a prática. Por isso, esta atividade foi bloqueada.</p>
        <p>Procure o professor. Ele pode liberar de novo com o mesmo token que usa pra "Dar visto" (Gestão → "Token — Dar Visto / Pular Etapa").</p>
        <div class="token-form">
          <label>Token do professor
            <input type="text" id="unlockToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnUnlock">Desbloquear</button>
          <div class="token-msg" id="unlockMsg" style="display:none;"></div>
        </div>
      </div>
    `;
    const btnUnlock = document.getElementById('btnUnlock');
    const unlockMsg = document.getElementById('unlockMsg');
    btnUnlock.addEventListener('click', async () => {
      const t = document.getElementById('unlockToken').value;
      unlockMsg.style.display = 'none';
      if (!t) {
        unlockMsg.className = 'token-msg erro';
        unlockMsg.textContent = 'Informe o token do professor.';
        unlockMsg.style.display = 'block';
        return;
      }
      btnUnlock.disabled = true;
      btnUnlock.textContent = 'Verificando...';
      const result = await window.PortalExamGuard.unlock(guard, t);
      if (!result.ok) {
        unlockMsg.className = 'token-msg erro';
        unlockMsg.textContent = result.erro;
        unlockMsg.style.display = 'block';
        btnUnlock.disabled = false;
        btnUnlock.textContent = 'Desbloquear';
        return;
      }
      renderStartScreen(guard);
    });
  }

  function renderStartScreen(guard) {
    practiceLayoutEl.style.display = 'none';
    gateWrap.style.display = 'flex';
    gateWrap.innerHTML = `
      <div class="card gate-card">
        <h2>⚠️ Regras desta prática</h2>
        <ul>
          <li>São <b>${CHALLENGES.length} chamados</b> — leia o bug, digite a correção e rode.</li>
          <li>A partir do momento que você clicar em "Iniciar", <b>não saia da aba/janela do portal</b> até terminar.</li>
          <li>Se você sair (trocar de aba, minimizar, trocar de app ou <b>clicar em outra janela, mesmo com a tela dividida</b>), recebe uma <b>advertência</b>.</li>
          <li><b>Copiar, colar e arrastar texto</b> ficam bloqueados durante toda a prova.</li>
          <li>Na <b>2ª advertência</b>, a atividade é <b>bloqueada</b> — só o professor libera de novo.</li>
        </ul>
        <div class="actions" style="margin-top:14px; justify-content:center;">
          <button class="btn" id="btnIniciar">▶ Iniciar prática</button>
        </div>
      </div>
    `;
    document.getElementById('btnIniciar').addEventListener('click', () => {
      window.PortalExamGuard.arm(guard, {
        onWarning: (count) => renderWarningOverlay(count, () => {}),
        onBlocked: () => renderBlockedScreen(guard),
        isCompleted: allChallengesCompleted
      });
      startPractice();
    });
  }

  (async function boot() {
    const guard = await window.PortalExamGuard.create('prog_depuracao_pratica');

    // Sem sessão de aluno reconhecida (professor, ou iframe oculto da
    // Gestão gerando gabarito remotamente) ou prática já 100% concluída —
    // guarda desligada: abre direto, sem tela de regras nem risco de bloqueio.
    if (guard.disabled || allChallengesCompleted()) {
      startPractice();
      return;
    }

    if (guard.blocked) {
      renderBlockedScreen(guard);
    } else {
      renderStartScreen(guard);
    }
  })();
</script>
