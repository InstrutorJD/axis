<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — FinancApp: Como o FinancApp Conversa com a Internet</title>
<!-- Padrão novo de trilhas (docs/padrao-trilhas.md): visual base compartilhado
     das práticas. Cor de destaque do projeto FinancApp (turma Sistemas) abaixo —
     a Personalização do aluno (cor/tema) sobrescreve, porque o portal injeta as
     variáveis no <html>. -->
<link rel="stylesheet" href="../../../shared/aula-base.css">
<style>
  :root{ --green:#3aa0ff; --green-dim:#2b6ba3; --yellow:#e0c46a; }
</style>
<script>
  window.ACTIVITY_LOCATION = 'redes_servicos_financapp_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>

<script src="../../../shared/professor-visto.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/aula-base.js"></script>
</head>
<body>

<div class="ab-app">
  <header class="ab-topo">
    <div class="ab-topo-titulo">Redes de Computadores — FinancApp: Como o FinancApp Conversa com a Internet</div>
    <div class="ab-topo-etapa">Etapa <span id="lblStepNum">1</span> de <span id="lblStepTotal">8</span></div>
  </header>
  <div class="ab-progresso"><div class="ab-progresso-fill" id="progressFill"></div></div>

  <main class="ab-palco" id="palco">
    <div class="ab-coluna" id="stepWrap"></div>
  </main>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `redes_servicos_financapp_pratica_progress_${username}`;
  const STEP_KEY = `redes_servicos_financapp_pratica_step_${username}`;

  // 4ª de 5 peças do projeto interdisciplinar "FinancApp" — módulo EXTRA
  // dentro da trilha JÁ EXISTENTE "Serviços de Internet e Modelos" (não é
  // trilha nova, pra não duplicar a capacidade sem necessidade — ver
  // config.js, requires:'pratica'). Usa o banco Supabase criado na peça 3
  // (Banco de Dados) pra observar tráfego HTTP real com o DevTools. Sem
  // correção automática — visto do professor no final.
  const STEPS = [
    {
      titulo: 'Apresentação',
      corpo: `
Esta é a **4ª de 5 peças** do projeto FinancApp. O time de Redes da PixelForge Studios precisa garantir que a comunicação entre o navegador do usuário e o servidor do FinancApp (Supabase) é entendida e monitorável.

Você vai abrir o FinancApp (ou só o projeto Supabase da peça de Banco de Dados), inspecionar o tráfego real com o **DevTools** e responder sobre o que está vendo.

### O que entregar aqui

Anotações sobre a requisição HTTP real observada: método, URL, headers, papel do DNS, HTTPS, um status code de erro provocado de propósito, e a relação com a camada de aplicação do modelo TCP/IP.

### Como funciona aqui

1. Leia os blocos de conteúdo.
2. Abra o DevTools de verdade e observe o tráfego.
3. Responda cada comando por escrito (num arquivo, README ou papel — o professor confere na hora do visto).
4. Peça o visto pessoalmente ao professor.`
    },
    {
      titulo: 'Requisição HTTP',
      corpo: `
Uma requisição HTTP tem **método** (GET/POST/...), **URL**, **headers** e, em alguns casos, **corpo**.

### Faça

1. Abra o DevTools (aba **Network**) do navegador.
2. Faça login ou carregue o extrato do FinancApp (ou dispare uma consulta no SQL Editor/Data API do projeto Supabase ¤financapp¤).
3. Encontre a requisição pro seu projeto Supabase.
4. Anote o **método**, a **URL** e **2 headers**.`
    },
    {
      titulo: 'DNS',
      corpo: `
**DNS** traduz um domínio (nome) em endereço IP, pra o navegador saber pra onde mandar a requisição.

### Faça

Identifique o domínio ¤*.supabase.co¤ na requisição e explique o que aconteceria se o DNS não conseguisse resolvê-lo.`
    },
    {
      titulo: 'HTTPS',
      corpo: `
**HTTPS** criptografa a comunicação — essencial quando trafegam dados como senha e valores financeiros.

### Faça

Confira o cadeado do navegador e o protocolo (¤https://¤) na URL da requisição.`
    },
    {
      titulo: 'Status code',
      corpo: `
O **status code** (200 OK, 201 Created, 401 Unauthorized, 403 Forbidden) diz o resultado da requisição.

### Faça

Force um erro (ex.: desative temporariamente uma policy de RLS no Supabase, ou tente uma operação sem permissão) e leia o status code retornado na aba Network. Depois, reative a policy.`
    },
    {
      titulo: 'Camada de aplicação',
      corpo: `
No modelo TCP/IP, HTTP roda na **camada de aplicação** — a mais próxima do usuário.

### Faça

Relacione a requisição observada com a camada de aplicação, explicando o que aconteceria se essa camada não existisse.`
    },
    {
      titulo: 'Checklist final antes do visto',
      corpo: `
Confira antes de chamar o professor:

- [ ] Requisição HTTP real identificada (método/URL/headers).
- [ ] Domínio Supabase e papel do DNS explicados.
- [ ] HTTPS conferido.
- [ ] Status code de erro observado e explicado.
- [ ] Camada de aplicação relacionada à requisição.

Quando tudo estiver certo, avance e peça o visto — é isso que libera a próxima peça do projeto, em Programação de Aplicativos.`
    }
  ];

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveProgress(data) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }

  function loadStepIndex() {
    try {
      const n = parseInt(localStorage.getItem(STEP_KEY), 10);
      return Number.isInteger(n) && n >= 0 && n <= STEPS.length ? n : 0;
    } catch (e) { return 0; }
  }
  function saveStepIndex(i) { try { localStorage.setItem(STEP_KEY, String(i)); } catch (e) {} }

  const savedProgress = loadProgress();
  let currentIndex = (savedProgress && savedProgress.completed) ? STEPS.length : loadStepIndex();

  const stepWrap = document.getElementById('stepWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');
  lblStepTotal.textContent = STEPS.length + 1;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de modelagem-dados-requisitos-trabalho.html.
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('redes_servicos_financapp_pratica', label, { step: currentIndex + 1, total: STEPS.length + 1 });
    }
  }

  function renderNav(showBack, showNext) {
    return `
      <div class="ab-nav">
        ${showBack ? '<button class="btn btn-secondary" id="btnBack">← Voltar</button>' : '<span></span>'}
        <span class="ab-nav-dica">use ← → do teclado</span>
        ${showNext ? '<button class="btn" id="btnNext">Próximo →</button>' : '<span></span>'}
      </div>`;
  }

  // Direção da última troca de etapa (1 = avançou, -1 = voltou) pra animação.
  let direcao = 1;
  function irPara(i) {
    direcao = i < currentIndex ? -1 : 1;
    currentIndex = Math.max(0, Math.min(i, STEPS.length));
    renderStep();
  }
  // Volta o scroll pro topo e anima a entrada do cartão novo.
  function mostrarEtapa() {
    document.getElementById('palco').scrollTop = 0;
    window.AulaBase.transicao(stepWrap.querySelector('.ab-cartao'), direcao);
  }
  // Setas do teclado = os botões Voltar/Próximo da tela (se existirem).
  window.AulaBase.teclado({
    proximo: () => { const b = document.getElementById('btnNext'); if (b) b.click(); },
    anterior: () => { const b = document.getElementById('btnBack'); if (b) b.click(); },
  });

  function renderStep() {
    if (currentIndex >= STEPS.length) { renderVisto(); return; }
    saveStepIndex(currentIndex);

    const pct = Math.round((currentIndex / STEPS.length) * 100);
    progressFill.style.width = Math.min(pct, 100) + '%';
    lblStepNum.textContent = currentIndex + 1;

    const step = STEPS[currentIndex];
    reportStep(`Trabalho — ${step.titulo}`);
    // As classes antigas (card, md-body, visto-box) continuam junto das .ab-*
    // só como ganchos dos testes (tests/projeto-financapp-*.spec.js etc.) — sem CSS.
    stepWrap.innerHTML = `
      <article class="ab-cartao card">
        <div class="ab-cartao-etapa">Etapa ${currentIndex + 1} de ${STEPS.length + 1}</div>
        <h2>${escapeHtml(step.titulo)}</h2>
        <div class="ab-conteudo md-body">${mdToHtml(step.corpo)}</div>
      </article>
      ${renderNav(currentIndex > 0, true)}
    `;
    // Código com Copiar e checklist clicável (lembra o que já foi marcado nesta etapa).
    window.AulaBase.decorar(stepWrap, { chaveChecklist: `redes_servicos_financapp_pratica_check_${username}_${currentIndex}` });
    mostrarEtapa();
    const btnBack = document.getElementById('btnBack');
    if (btnBack) btnBack.addEventListener('click', () => irPara(currentIndex - 1));
    document.getElementById('btnNext').addEventListener('click', () => irPara(currentIndex + 1));
  }

  function renderVisto() {
    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length + 1;
    reportStep('Trabalho — Visto do professor');

    const already = loadProgress();
    if (already && already.completed) {
      const quando = already.vistoEm ? new Date(already.vistoEm).toLocaleString('pt-BR') : '';
      stepWrap.innerHTML = `
        <div class="ab-cartao ab-concluida card visto-box">
          <h2>✅ Atividade concluída</h2>
          <p>Visto dado por <b>${escapeHtml(already.vistoPor || '')}</b>${quando ? ' em ' + escapeHtml(quando) : ''}.</p>
          <p>A próxima peça do projeto FinancApp (Programação de Aplicativos) já pode ser liberada pelo professor.</p>
        </div>
        ${renderNav(true, false)}
      `;
      mostrarEtapa();
      document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));
      return;
    }

    stepWrap.innerHTML = `
      <div class="ab-cartao card visto-box">
        <div class="ab-cartao-etapa">Etapa ${STEPS.length + 1} de ${STEPS.length + 1}</div>
        <h2>🧑‍🏫 Etapa final — Visto do professor</h2>
        <div class="ab-conteudo">
        <p>Você já observou a requisição HTTP real (DevTools), identificou DNS/HTTPS, provocou e leu um status code de erro, e relacionou tudo à camada de aplicação?</p>
        <p>Chame o professor pra conferir suas anotações. Quando ele confirmar, peça o token de professor (Gestão → "Token — Dar Visto / Pular Etapa") e digite abaixo — é assim que a atividade é marcada como concluída.</p>
        </div>
        <div class="ab-form">
          <label>Token do professor
            <input type="text" id="vistoToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnDarVisto">Dar visto</button>
          <div class="ab-msg" id="vistoMsg" style="display:none;"></div>
        </div>
      </div>
      ${renderNav(true, false)}
    `;
    mostrarEtapa();
    document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));

    const btnDarVisto = document.getElementById('btnDarVisto');
    const vistoMsg = document.getElementById('vistoMsg');
    btnDarVisto.addEventListener('click', async () => {
      const t = document.getElementById('vistoToken').value;
      vistoMsg.style.display = 'none';
      if (!t) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Informe o token do professor.';
        vistoMsg.style.display = 'block';
        return;
      }
      btnDarVisto.disabled = true;
      btnDarVisto.textContent = 'Verificando...';
      try {
        const result = window.PortalProfessorVisto
          ? await window.PortalProfessorVisto.verificarToken(t)
          : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!result.ok) {
          vistoMsg.className = 'ab-msg erro';
          vistoMsg.textContent = result.erro;
          vistoMsg.style.display = 'block';
          btnDarVisto.disabled = false;
          btnDarVisto.textContent = 'Dar visto';
          return;
        }
        saveProgress({ completed: true, vistoPor: result.nome, vistoEm: new Date().toISOString() });
        renderVisto();
      } catch (e) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Erro inesperado ao verificar. Tente de novo.';
        vistoMsg.style.display = 'block';
        btnDarVisto.disabled = false;
        btnDarVisto.textContent = 'Dar visto';
      }
    });
  }

  // Gabarito aqui é o checklist de critérios pro professor conferir as
  // observações do aluno sobre o tráfego HTTP real do projeto FinancApp.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Projeto FinancApp — Como o FinancApp Conversa com a Internet — Checklist de correção',
      subtitle: 'Módulo extra (observação real com DevTools) · Serviços de Internet e Modelos · Turma Sistemas',
      items: [
        { number: 1, title: 'Requisição HTTP', prompt: 'O aluno identificou uma requisição real?', answer: 'Método (GET/POST), URL do projeto Supabase e pelo menos 2 headers anotados a partir do DevTools.' },
        { number: 2, title: 'DNS e HTTPS', prompt: 'As explicações estão corretas?', answer: 'Domínio *.supabase.co reconhecido, com explicação do papel do DNS; cadeado/HTTPS conferido na URL.' },
        { number: 3, title: 'Status code', prompt: 'O aluno observou e explicou um erro real?', answer: 'Status code de erro (401/403, tipicamente) provocado de propósito (ex.: policy de RLS desativada) e relacionado à causa.' },
        { number: 4, title: 'Camada de aplicação', prompt: 'A relação com o modelo TCP/IP está correta?', answer: 'HTTP relacionado à camada de aplicação do modelo TCP/IP, com explicação do que aconteceria sem essa camada.' }
      ],
      fileName: 'projeto-financapp-redes-checklist.txt'
    });
  };

  renderStep();
</script>
<script src="../../../shared/vlibras-widget.js"></script>
</body>
</html>
