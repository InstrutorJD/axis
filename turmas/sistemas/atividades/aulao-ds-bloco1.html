  EnigmaLogica.iniciar({

    abertura: {
      titulo: 'Bem-vindo à Pequi Sistemas',
      html: `
        <p>A Pequi Sistemas está criando o <b>MerendaApp</b>, um aplicativo para os alunos verem o cardápio da escola.</p>
        <p>A equipe tem quatro pessoas: <b>Ana, Bruno, Carla e Davi</b>. Você vai descobrir o trabalho de cada uma.</p>
        <blockquote>No caderno, você vai copiar dois textos (um no começo e outro no meio do desafio) e também cada atividade, com a sua resposta. Se errar, você recebe uma dica e tenta de novo.</blockquote>`,
    },
    fechamento: {
      titulo: '✅ Desafio 1 concluído!',
      html: `
        <p>Você descobriu o trabalho de cada pessoa pelo que ela <b>faz</b>, e não pelo nome do cargo.</p>
        <p>No <b>Desafio 2</b>, você vai ver como cada uma foi contratada.</p>`,

    etapas: [
      {
        id: 'copiar', tipo: 'copiar', icone: '📝',
        titulo: 'Profissões no desenvolvimento de sistemas',

          <ul>
            <li><b>Front-end:</b> programa as telas que o usuário vê e toca.</li>
            <li><b>Back-end:</b> programa o servidor, as regras e o banco de dados.</li>
            <li><b>Testes (QA):</b> usa o sistema várias vezes e registra os erros.</li>
            <li><b>Requisitos:</b> conversa com o cliente e anota o que o sistema deve fazer.</li>
          </ul>
          <p>O nome do cargo pode enganar. O que vale é o que a pessoa faz no dia a dia.</p>`,
      },
      {
        id: 'grade-equipe', tipo: 'grade', icone: '🧩',

          { t: 'Bruno não programa as telas do app.', ok: s => s.Bruno !== FRONT },
          { t: 'Bruno também não mexe no servidor nem no banco de dados.', ok: s => s.Bruno !== BACK },
          { t: 'Davi nunca abriu o banco de dados do projeto.', ok: s => s.Davi !== BACK },
        ],
        solucao: { Ana: BACK, Bruno: QA, Carla: REQ, Davi: FRONT },
        resultado: '<p><b>Equipe:</b> Ana é back-end, Bruno é de testes (QA), Carla cuida dos requisitos e Davi é front-end.</p>',

      {
        id: 'copiar-2', tipo: 'copiar', icone: '📝',
        titulo: 'A regra do "se... então"',
        texto: `
          <h3>A regra do "se... então"</h3>
          <p><b>Regra:</b> se o celular está sem bateria, então ele não liga.</p>

            <li><b>O celular não ligou:</b> não dá para ter certeza. Ele pode estar quebrado.</li>
          </ul>
          <p>Uma pista pode ajudar, mas nem sempre prova tudo.</p>`,
      },
      {
        id: 'caso-se-funcionou', tipo: 'caso', icone: '✅',
        titulo: 'Caso 3: o app funcionou',
        cenario: '<p>Ana explica a regra do sistema: <b>"Se o servidor está fora do ar, então o app não mostra o cardápio."</b> Hoje, o app mostrou o cardápio normalmente.</p>',
        pergunta1: 'O que é certo?',
        opcoes: [
          { t: 'O servidor estava no ar', ok: true },
          { t: 'O servidor caiu por pouco tempo' },
          { t: 'Alguém consertou o servidor hoje' },
          { t: 'Nada se pode concluir sobre isso' },

        dica: 'Releia o caso do celular que ligou. O que dá para afirmar com certeza?',
        explica: 'Se o servidor estivesse fora do ar, o app não mostraria o cardápio. Como mostrou, o servidor estava no ar.',

        titulo: 'Caso 4: o app não funcionou',
        cenario: '<p>Mesma regra: <b>"Se o servidor está fora do ar, então o app não mostra o cardápio."</b> Agora, o app não mostrou o cardápio no celular de um aluno.</p>',

        opcoes: [
          { t: 'O servidor está fora do ar, com certeza' },
          { t: 'O servidor está no ar, com certeza' },
          { t: 'Pode ser o servidor, ou outro motivo', ok: true },
          { t: 'O aluno apagou o app do celular' },

        pergunta2: 'Por quê?',
        motivos: [
          { t: 'A internet do celular também pode ter caído', ok: true },
          { t: 'Quando o app falha, a culpa é sempre do servidor' },
          { t: 'A regra só vale nos dias em que o app funciona' },
        ],
        dica: 'É a armadilha do celular que não ligou. Existe outro jeito de o app falhar?',
        explica: 'O servidor fora do ar é uma explicação possível, mas não a única: a internet do aluno, por exemplo, também pode ter caído.',
      },
    ],
  });
