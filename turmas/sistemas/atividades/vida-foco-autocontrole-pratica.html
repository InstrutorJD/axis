<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto de Vida — Combinado de Foco</title>
<link rel="stylesheet" href="../../../shared/aula-base.css">
<style>
  :root{ --green:#5ec8ff; --green-dim:#2f7aa8; --yellow:#ffd166; }
  /* Específico deste exercício: casos de convivência, normas × valores e o combinado da turma. */
  .cf-campo{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .cf-campo > span{ font-size:11.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--ab-acento); }
  .cf-campo small{ color:var(--ink-dim); font-size:12px; }
  .cf-campo input, .cf-campo textarea, .cf-campo select{ width:100%; font:inherit; font-size:14px; padding:9px 11px; border-radius:10px; background:var(--panel2); color:var(--ink); border:1px solid var(--line); }
  .cf-campo textarea{ min-height:80px; resize:vertical; }
  .cf-caso{ margin-top:12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; }
  .cf-caso.ok{ border-color:var(--ok); } .cf-caso.erro{ border-color:var(--blood-bright); }
  .cf-caso > p{ margin:0 0 4px; }
  .cf-dica{ margin-top:8px; font-size:13px; } .cf-dica:empty{ display:none; }
  .cf-acoes{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .cf-acoes .ab-msg{ flex:1; min-width:200px; }
  .cf-lista{ list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .cf-lista li{ padding:8px 12px; border-radius:10px; border:1px solid var(--line); font-size:13px; }
  .cf-lista li.ok{ border-color:var(--ok); color:var(--ok); } .cf-lista li.falha{ border-color:var(--blood-bright); } .cf-lista li.falha b{ color:var(--blood-bright); }
  .cf-radio{ display:inline-flex; margin-right:8px; }
</style>
<script>
  window.ACTIVITY_LOCATION = 'vida_foco_autocontrole_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/professor-visto.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
<script src="../../../shared/aula-base.js"></script>
</head>
<body>

<div class="ab-app">
  <header class="ab-topo">
    <div class="ab-topo-titulo">Projeto de Vida — Combinado de Foco</div>
    <div class="ab-topo-etapa">Etapa <span id="lblStepNum">1</span> de <span id="lblStepTotal">7</span></div>
  </header>
  <div class="ab-progresso"><div class="ab-progresso-fill" id="progressFill"></div></div>
  <main class="ab-palco" id="palco">
    <div class="ab-coluna" id="stepWrap"></div>
  </main>
</div>

<script>
// Combinado de Foco: o aluno julga situações de convivência no laboratório,
// liga cada norma ao valor que ela protege, escreve 3 normas para o combinado
// da turma e faz a autoavaliação da própria conduta na aula. Fecha com o
// visto. Progresso: { completed, casos, valores, normas, auto, ... }.
// Compartilhada pelas turmas Sistemas e Jogos.
(function () {
  const LOC = 'vida_foco_autocontrole_pratica';
  const user = new URLSearchParams(location.search).get('user') || 'anon';
  const PROGRESS_KEY = `${LOC}_progress_${user}`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ler = () => { try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null') || {}; } catch (e) { return {}; } };
  const estado = Object.assign({ completed: false, casos: {}, valores: {}, normas: [], auto: {}, lastStepIndex: 0 }, ler());
  ['casos', 'valores', 'auto'].forEach(k => { if (!estado[k] || typeof estado[k] !== 'object' || Array.isArray(estado[k])) estado[k] = {}; });
  if (!Array.isArray(estado.normas)) estado.normas = [];
  while (estado.normas.length < 3) estado.normas.push({ texto: '', valor: '' });
  let timer = 0;
  function salvar(agora) { clearTimeout(timer); const f = () => { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(estado)); } catch (e) {} }; if (agora) f(); else timer = setTimeout(f, 800); }
  function reportar(r) { if (typeof window.reportActivity === 'function') window.reportActivity(LOC, r, { step: atual + 1, total: TOTAL }); }
  const palavras = s => (String(s || '').trim().match(/\S+/g) || []).length;

  const VALORES = [
    ['respeito', 'Respeito'],
    ['responsabilidade', 'Responsabilidade'],
    ['honestidade', 'Honestidade'],
    ['cooperacao', 'Cooperação'],
  ];
  const nomeValor = k => (VALORES.find(v => v[0] === k) || [, ''])[1];

  // Cada caso: a atitude certa (a) e três atitudes que parecem razoáveis na hora.
  const CASOS = [
    {
      id: 'celular', texto: 'Durante a atividade, o celular da Júlia vibra várias vezes com mensagens do grupo da família.',
      opcoes: [
        ['a', 'Deixar no silencioso, guardado, e ler as mensagens no intervalo'],
        ['b', 'Responder rapidinho por baixo da mesa e voltar para a atividade'],
        ['c', 'Deixar o celular na mesa com o som ligado, para não perder nada'],
        ['d', 'Sair da sala para responder com calma, sem avisar o professor'],
      ],
      norma: 'Celular guardado durante a atividade', valor: 'Responsabilidade com a própria tarefa',
      dica: 'Se for urgente, a família liga. Dá para esperar o intervalo?',
    },
    {
      id: 'video', texto: 'O Gustavo achou um vídeo engraçado e quer mostrar para o colega ao lado, que está concentrado na atividade.',
      opcoes: [
        ['b', 'Mostrar rapidinho, com o volume baixo, porque é só um minuto'],
        ['a', 'Guardar o vídeo para mostrar no intervalo, sem interromper o colega'],
        ['c', 'Mandar o link para o celular do colega ver quando ele quiser'],
        ['d', 'Chamar o colega só quando o vídeo chegar na parte engraçada'],
      ],
      norma: 'Não interromper quem está concentrado', valor: 'Respeito ao foco e ao tempo do colega',
      dica: 'Um minuto de vídeo custa ao colega bem mais que um minuto: ele perde o fio.',
    },
    {
      id: 'ajuda', texto: 'A Lara está travada há 15 minutos na mesma questão. O professor está atendendo outro aluno do outro lado da sala.',
      opcoes: [
        ['b', 'Chamar o professor em voz alta para ele vir logo até a mesa dela'],
        ['c', 'Ir até o professor e interromper o atendimento do colega'],
        ['a', 'Levantar a mão e, enquanto espera, anotar o que já tentou'],
        ['d', 'Desistir da questão e esperar a aula acabar sem perguntar'],
      ],
      norma: 'Pedir ajuda do jeito combinado', valor: 'Respeito à vez de cada um',
      dica: 'O colega que está sendo atendido também precisa de ajuda. Como esperar sem perder tempo?',
    },
    {
      id: 'ideia', texto: 'Num trabalho em grupo, a ideia da Bia é recusada pela equipe e ela fica muito irritada.',
      opcoes: [
        ['b', 'Parar de participar até o grupo mudar de opinião'],
        ['c', 'Dizer que a ideia dos outros também é ruim, para ficar quite'],
        ['d', 'Fazer a parte dela do jeito que queria, sem contar ao grupo'],
        ['a', 'Respirar, ouvir os motivos do grupo e propor um ajuste na ideia'],
      ],
      norma: 'Discordar sem ofender e sem abandonar o grupo', valor: 'Cooperação',
      dica: 'Autocontrole é perceber a raiva, pausar e escolher uma resposta que ajude o grupo.',
    },
    {
      id: 'terminou', texto: 'O Rafa terminou a atividade individual antes de todos. A turma ainda está concentrada.',
      opcoes: [
        ['b', 'Conversar com o colega do lado, já que a parte dele acabou'],
        ['a', 'Revisar o que fez ou adiantar o desafio extra, em silêncio'],
        ['c', 'Passar as respostas para quem ainda não terminou a atividade'],
        ['d', 'Colocar um vídeo no computador, com o volume bem baixinho'],
      ],
      norma: 'Atividade individual é feita por cada um, em silêncio', valor: 'Honestidade e respeito ao foco da turma',
      dica: 'Terminar antes não muda as normas para quem ainda está trabalhando.',
    },
    {
      id: 'barulho', texto: 'Duas colegas conversam alto sobre um jogo ao lado do Vítor, que está tentando se concentrar.',
      opcoes: [
        ['b', 'Gritar para a sala inteira fazer silêncio de uma vez'],
        ['c', 'Ficar calado e reclamar delas depois no grupo da turma'],
        ['a', 'Pedir com educação para as colegas falarem mais baixo'],
        ['d', 'Colocar o fone no volume máximo para abafar a conversa'],
      ],
      norma: 'Resolver o incômodo conversando, com educação', valor: 'Respeito',
      dica: 'Qual atitude resolve o problema sem criar outro (barulho, exposição ou dano aos ouvidos)?',
    },
  ];

  const NORMAS = [
    { id: 'copia', texto: 'Não copiar nem passar respostas nas atividades individuais', certa: 'honestidade' },
    { id: 'prazo', texto: 'Entregar a sua parte do trabalho em grupo no prazo combinado', certa: 'responsabilidade' },
    { id: 'silencio', texto: 'Falar baixo e não interromper quem está concentrado', certa: 'respeito' },
    { id: 'explicar', texto: 'Quem termina antes ajuda o colega a entender, sem fazer por ele', certa: 'cooperacao' },
  ];

  const AUTO = [
    ['celular', 'Mantive o celular guardado durante as atividades da aula?'],
    ['abas', 'Fiquei só no que a atividade pedia, sem abrir jogos, vídeos ou redes sociais?'],
    ['calma', 'Quando algo deu errado ou eu não entendi, mantive a calma?'],
    ['ajuda', 'Pedi ajuda do jeito combinado (mão levantada, mostrando o que tentei)?'],
    ['colegas', 'Respeitei o foco dos colegas (sem conversa alta, vídeos ou barulho)?'],
  ];

  const casosOk = () => CASOS.every(c => estado.casos[c.id] === 'a');
  const valoresOk = () => NORMAS.every(n => estado.valores[n.id] === n.certa);
  const normaOk = n => palavras(n.texto) >= 5 && !!n.valor;
  const normasOk = () => estado.normas.slice(0, 3).every(normaOk);
  const autoOk = () => AUTO.every(([k]) => estado.auto[k] !== undefined) && palavras(estado.auto.melhoria) >= 4;
  function checklist() {
    return [
      { ok: casosOk(), t: 'As 6 situações do laboratório resolvidas com a atitude certa', d: 'Volte à etapa 2.' },
      { ok: valoresOk(), t: 'Cada norma ligada ao valor que ela protege', d: 'Volte à etapa 3.' },
      { ok: normasOk(), t: '3 normas escritas para o combinado da turma, cada uma com o seu valor', d: 'Volte à etapa 4: cada norma com pelo menos 5 palavras.' },
      { ok: autoOk(), t: 'Autoavaliação respondida, com o que você vai fazer diferente', d: 'Volte à etapa 5.' },
    ];
  }
  const podeVisto = () => checklist().every(c => c.ok);

  // ---------- Telas ----------
  const ETAPAS = ['intro', 'casos', 'valores', 'combinado', 'autoavaliacao', 'checklist', 'visto'];
  const TOTAL = ETAPAS.length;
  let atual = Math.min(estado.completed ? TOTAL - 1 : (estado.lastStepIndex || 0), TOTAL - 1);
  let direcao = 1;
  const stepWrap = document.getElementById('stepWrap');
  function nav(voltar, avancar, rot) { return `<div class="ab-nav">${voltar ? '<button class="btn btn-secondary" id="btnBack">← Voltar</button>' : '<span></span>'}<span class="ab-nav-dica">use ← → do teclado</span>${avancar ? `<button class="btn" id="btnNext">${rot || 'Próximo →'}</button>` : '<span></span>'}</div>`; }
  function irPara(i) { direcao = i < atual ? -1 : 1; atual = Math.max(0, Math.min(i, TOTAL - 1)); if (atual > estado.lastStepIndex) estado.lastStepIndex = atual; salvar(true); render(); }
  function ligar() {
    const b = document.getElementById('btnBack'); if (b) b.addEventListener('click', () => irPara(atual - 1));
    const n = document.getElementById('btnNext'); if (n) n.addEventListener('click', () => irPara(atual + 1));
    document.getElementById('palco').scrollTop = 0;
    window.AulaBase.transicao(stepWrap.querySelector('.ab-cartao'), direcao);
  }
  const cartao = (t, corpo, extra) => `<article class="ab-cartao ${extra || ''}"><div class="ab-cartao-etapa">Etapa ${atual + 1} de ${TOTAL}</div><h2>${t}</h2>${corpo}</article>`;
  const opcoes = (lista, v) => '<option value="">Escolha…</option>' + lista.map(([k, t]) => `<option value="${esc(k)}" ${v === k ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const listaChecklist = cl => `<ul class="cf-lista">${cl.map(c => c.ok ? `<li class="ok">✔ ${esc(c.t)}</li>` : `<li class="falha"><b>✘ ${esc(c.t)}</b> — ${esc(c.d)}</li>`).join('')}</ul>`;

  function render() {
    document.getElementById('lblStepNum').textContent = atual + 1;
    document.getElementById('lblStepTotal').textContent = TOTAL;
    const cl = checklist();
    document.getElementById('progressFill').style.width = (estado.completed ? 100 : Math.round(cl.filter(c => c.ok).length / cl.length * 90)) + '%';
    const e = ETAPAS[atual];
    reportar(`Combinado de foco — ${e}`);
    if (e === 'intro') {
      stepWrap.innerHTML = cartao('O combinado de foco da turma', `<div class="ab-conteudo">
        <p>O laboratório funciona melhor quando todo mundo segue as mesmas <b>normas</b>. Cada norma existe para proteger um <b>valor</b>: respeito, responsabilidade, honestidade ou cooperação. Hoje você vai reconhecer essas normas e ajudar a escrever o combinado da turma. Tempo sugerido: <b>35 minutos</b>.</p>
        <ol><li>Decidir a atitude certa em 6 situações do laboratório</li><li>Ligar cada norma ao valor que ela protege</li><li>Escrever 3 normas para o combinado da turma</li><li>Avaliar o seu próprio foco nesta aula</li><li>Conferir a checklist e pedir o visto</li></ol>
        <blockquote>Antes de começar: celular guardado e só esta aba aberta. É o primeiro item do combinado.</blockquote>
      </div>${nav(false, true)}`);
    } else if (e === 'casos') {
      renderCasos(); return;
    } else if (e === 'valores') {
      renderValores(); return;
    } else if (e === 'combinado') {
      renderCombinado(); return;
    } else if (e === 'autoavaliacao') {
      renderAuto(); return;
    } else if (e === 'checklist') {
      stepWrap.innerHTML = cartao('Checklist', `${listaChecklist(cl)}
        <div class="ab-conteudo" style="margin-top:14px;"><blockquote>${podeVisto() ? 'Tudo pronto. Chame o professor: a próxima etapa é o visto.' : 'Complete os itens com ✘ antes de pedir o visto.'}</blockquote></div>`) + nav(true, podeVisto(), 'Pedir visto →');
    } else {
      renderVisto(); return;
    }
    ligar();
  }

  function renderCasos() {
    stepWrap.innerHTML = cartao('Situações do laboratório', `
      <div class="ab-conteudo"><p>Para cada situação, escolha a atitude que respeita as normas de convivência e protege o foco de todos.</p></div>
      ${CASOS.map((c, i) => `<div class="cf-caso" data-caso="${c.id}"><p><b>${i + 1}.</b> ${esc(c.texto)}</p>
        <label class="cf-campo"><span>O que fazer?</span><select data-c="${c.id}">${opcoes(c.opcoes, estado.casos[c.id])}</select></label><div class="cf-dica"></div></div>`).join('')}
      <div class="cf-acoes"><button class="btn" id="btnConferir">Conferir</button><div class="ab-msg" id="cfMsg" style="display:none;"></div></div>`) + nav(true, true);
    stepWrap.querySelectorAll('select[data-c]').forEach(s => s.addEventListener('change', () => { estado.casos[s.dataset.c] = s.value; salvar(); }));
    document.getElementById('btnConferir').addEventListener('click', () => {
      let n = 0;
      CASOS.forEach(c => {
        const box = stepWrap.querySelector(`[data-caso="${c.id}"]`);
        const ok = estado.casos[c.id] === 'a';
        box.classList.toggle('ok', ok); box.classList.toggle('erro', !ok);
        box.querySelector('.cf-dica').innerHTML = ok
          ? `✅ <b>Norma:</b> ${esc(c.norma)} · <b>Valor:</b> ${esc(c.valor)}`
          : `💡 ${esc(estado.casos[c.id] ? c.dica : 'Escolha uma atitude.')}`;
        if (ok) n++;
      });
      const m = document.getElementById('cfMsg');
      m.style.display = 'block'; m.className = `ab-msg ${n === CASOS.length ? 'ok' : 'erro'}`;
      m.textContent = n === CASOS.length ? '✅ Todas as situações resolvidas com respeito às normas!' : `${n} de ${CASOS.length} certas.`;
      salvar(true); reportar(`Combinado de foco — situações (${n}/${CASOS.length})`);
    });
    ligar();
  }

  function renderValores() {
    stepWrap.innerHTML = cartao('Que valor cada norma protege?', `
      <div class="ab-conteudo"><p>Toda norma de convivência protege um valor. Ligue cada norma do laboratório ao valor que ela mais protege. Cada valor aparece uma vez.</p></div>
      ${NORMAS.map(n => `<div class="cf-caso" data-norma="${n.id}"><p>“${esc(n.texto)}”</p>
        <label class="cf-campo"><span>Valor</span><select data-v="${n.id}">${opcoes(VALORES, estado.valores[n.id])}</select></label><div class="cf-dica"></div></div>`).join('')}
      <div class="cf-acoes"><button class="btn" id="btnConferir">Conferir</button><div class="ab-msg" id="cfMsg" style="display:none;"></div></div>`) + nav(true, true);
    stepWrap.querySelectorAll('select[data-v]').forEach(s => s.addEventListener('change', () => { estado.valores[s.dataset.v] = s.value; salvar(); }));
    document.getElementById('btnConferir').addEventListener('click', () => {
      let n = 0;
      NORMAS.forEach(x => {
        const box = stepWrap.querySelector(`[data-norma="${x.id}"]`);
        const ok = estado.valores[x.id] === x.certa;
        box.classList.toggle('ok', ok); box.classList.toggle('erro', !ok);
        box.querySelector('.cf-dica').textContent = ok ? '✅ Isso.' : '💡 Pergunte-se: se ninguém seguir essa norma, o que se perde primeiro?';
        if (ok) n++;
      });
      const m = document.getElementById('cfMsg');
      m.style.display = 'block'; m.className = `ab-msg ${n === NORMAS.length ? 'ok' : 'erro'}`;
      m.textContent = n === NORMAS.length ? '✅ Cada norma ligada ao seu valor!' : `${n} de ${NORMAS.length} certas.`;
      salvar(true); reportar(`Combinado de foco — valores (${n}/${NORMAS.length})`);
    });
    ligar();
  }

  function renderCombinado() {
    stepWrap.innerHTML = cartao('O combinado da turma', `
      <div class="ab-conteudo"><p>Escreva <b>3 normas</b> que você proporia para o combinado de foco do laboratório. Escreva como uma ação (“Guardar…”, “Pedir…”, “Avisar…”) e diga qual valor cada uma protege. Elas não precisam ser iguais às das etapas anteriores.</p></div>
      ${estado.normas.slice(0, 3).map((n, i) => `<div class="cf-caso" data-n="${i}"><label class="cf-campo"><span>Norma ${i + 1}</span><input type="text" data-texto="${i}" maxlength="140" value="${esc(n.texto)}" placeholder="Ex.: Usar fone só com volume que o colega do lado não escute"><small></small></label>
        <label class="cf-campo"><span>Valor que ela protege</span><select data-valor="${i}">${opcoes(VALORES, n.valor)}</select></label></div>`).join('')}
      <div class="cf-acoes"><button class="btn" id="btnConferir">Conferir</button><div class="ab-msg" id="cfMsg" style="display:none;"></div></div>`) + nav(true, true);
    const marca = () => estado.normas.slice(0, 3).forEach((n, i) => {
      stepWrap.querySelector(`[data-n="${i}"] small`).textContent = `${palavras(n.texto)} palavras (mínimo 5)`;
    });
    marca();
    stepWrap.querySelectorAll('[data-texto]').forEach(el => el.addEventListener('input', () => { estado.normas[+el.dataset.texto].texto = el.value; marca(); salvar(); }));
    stepWrap.querySelectorAll('[data-valor]').forEach(el => el.addEventListener('change', () => { estado.normas[+el.dataset.valor].valor = el.value; salvar(); }));
    document.getElementById('btnConferir').addEventListener('click', () => {
      let n = 0;
      estado.normas.slice(0, 3).forEach((x, i) => {
        const ok = normaOk(x);
        const box = stepWrap.querySelector(`[data-n="${i}"]`);
        box.classList.toggle('ok', ok); box.classList.toggle('erro', !ok);
        if (ok) n++;
      });
      const m = document.getElementById('cfMsg');
      m.style.display = 'block'; m.className = `ab-msg ${n === 3 ? 'ok' : 'erro'}`;
      m.textContent = n === 3 ? '✅ Combinado pronto para mostrar ao professor.' : 'Cada norma precisa de pelo menos 5 palavras e de um valor escolhido.';
      salvar(true); reportar(`Combinado de foco — normas (${n}/3)`);
    });
    ligar();
  }

  function renderAuto() {
    const opc = (k, v, t) => `<label class="ab-check cf-radio"><input type="radio" name="auto_${k}" value="${v}" ${estado.auto[k] === v ? 'checked' : ''}> <span>${t}</span></label>`;
    stepWrap.innerHTML = cartao('Autoavaliação: como foi o meu foco hoje?', `
      <div class="ab-conteudo"><p>Responda com sinceridade sobre esta aula: é para você se conhecer, não para ganhar nota.</p></div>
      ${AUTO.map(([k, t]) => `<div class="cf-caso"><p style="margin:0 0 8px;">${t}</p>${opc(k, 'sim', 'Sim')}${opc(k, 'parcial', 'Em parte')}${opc(k, 'nao', 'Não')}</div>`).join('')}
      <label class="cf-campo" style="margin-top:14px;"><span>O que eu faço diferente na próxima aula?</span><textarea id="cfMelhoria" placeholder="Ex.: deixar o celular na mochila desde o começo da aula">${esc(estado.auto.melhoria || '')}</textarea></label>`) + nav(true, true);
    stepWrap.querySelectorAll('input[type="radio"]').forEach(r => r.addEventListener('change', () => { estado.auto[r.name.slice(5)] = r.value; salvar(); }));
    document.getElementById('cfMelhoria').addEventListener('input', ev => { estado.auto.melhoria = ev.target.value; salvar(); });
    ligar();
  }

  function renderVisto() {
    if (!estado.completed && !podeVisto()) { atual = ETAPAS.indexOf('checklist'); render(); return; }
    if (estado.completed) {
      const quando = estado.vistoEm ? new Date(estado.vistoEm).toLocaleString('pt-BR') : '';
      stepWrap.innerHTML = cartao('✅ Combinado entregue', `<p>Visto dado por <b>${esc(estado.vistoPor || '')}</b>${quando ? ' em ' + esc(quando) : ''}.</p>`, 'ab-concluida') + nav(true, false);
      ligar(); return;
    }
    stepWrap.innerHTML = cartao('🧑‍🏫 Visto do professor', `
      <div class="ab-conteudo"><p>Mostre ao professor as suas 3 normas e a autoavaliação. Quando ele conferir, peça o token de professor (Gestão → "Token — Dar Visto / Pular Etapa") e digite abaixo.</p>
      <ul>${estado.normas.slice(0, 3).map(n => `<li>${esc(n.texto)} <i>(${esc(nomeValor(n.valor))})</i></li>`).join('')}</ul></div>
      <div class="ab-form"><label>Token do professor <input type="text" id="vistoToken" inputmode="numeric" maxlength="6" autocomplete="off"></label>
        <button class="btn" id="btnDarVisto">Dar visto</button><div class="ab-msg" id="vistoMsg" style="display:none;"></div></div>`) + nav(true, false);
    ligar();
    const btn = document.getElementById('btnDarVisto');
    const m = document.getElementById('vistoMsg');
    btn.addEventListener('click', async () => {
      const t = document.getElementById('vistoToken').value;
      m.style.display = 'none';
      if (!t) { m.className = 'ab-msg erro'; m.textContent = 'Informe o token do professor.'; m.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = 'Verificando...';
      try {
        const r = window.PortalProfessorVisto ? await window.PortalProfessorVisto.verificarToken(t) : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!r.ok) throw new Error(r.erro);
        Object.assign(estado, { completed: true, vistoPor: r.nome, vistoEm: new Date().toISOString() });
        salvar(true); reportar('Combinado de foco — entregue com visto'); render();
      } catch (e) {
        m.className = 'ab-msg erro'; m.textContent = e.message || 'Erro inesperado ao verificar. Tente de novo.'; m.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Dar visto';
      }
    });
  }

  window.generateGabaritoForGestao = function () {
    const certa = c => c.opcoes.find(o => o[0] === 'a')[1];
    return window.PortalGabarito.generate({
      title: 'Projeto de Vida — Combinado de Foco',
      subtitle: 'Prática · Identificar normas e valores sociais relevantes à convivência cidadã · Sistemas e Jogos',
      items: CASOS.map((c, i) => ({ number: i + 1, title: `Situação ${i + 1}`, prompt: c.texto, answer: `${certa(c)} (norma: ${c.norma}; valor: ${c.valor})` }))
        .concat([
          { number: CASOS.length + 1, title: 'Normas × valores', prompt: 'Ligar cada norma ao valor que ela protege.', answer: NORMAS.map(n => `${n.texto} → ${nomeValor(n.certa)}`).join(' | ') },
          { number: CASOS.length + 2, title: 'Combinado da turma e autoavaliação', prompt: '3 normas escritas pelo aluno, cada uma com um valor, e autoavaliação do foco na aula.', answer: 'Conferir se cada norma é uma ação concreta de convivência no laboratório e se o valor escolhido faz sentido; ler o que o aluno vai fazer diferente.' },
        ]),
      fileName: 'vida-foco-autocontrole-gabarito.txt',
    });
  };

  window.AulaBase.teclado({
    proximo: () => { const b = document.getElementById('btnNext'); if (b) b.click(); },
    anterior: () => { const b = document.getElementById('btnBack'); if (b) b.click(); },
  });
  render();
})();
</script>
