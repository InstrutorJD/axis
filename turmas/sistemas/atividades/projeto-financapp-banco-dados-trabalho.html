<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `projeto_financapp_banco_dados_trabalho_progress_${username}`;
  const STEP_KEY = `projeto_financapp_banco_dados_trabalho_step_${username}`;

  // 3ª de 5 peças do projeto interdisciplinar "FinancApp" — o DER já existe
  // (docs/der.png, peça 2, Modelagem de Sistemas 1). Aqui o aluno cria, num
  // projeto Supabase próprio, as 4 tabelas do DER (usuarios, lancamentos,
  // tags, lancamento_tags — a última é a tabela de JUNÇÃO do relacionamento
  // N:N entre lançamentos e tags) com FK e RLS — mesmo padrão de ponta a
  // ponta já usado na trilha "Conexão com Supabase" (TikTak). Sem correção
  // automática — visto do professor no final.
  const STEPS = [
    {
      titulo: 'Apresentação',
      corpo: `
O DER do FinancApp já existe (¤docs/der.png¤, feito na Modelagem de Sistemas 1). Esta é a **3ª de 5 peças** do projeto — agora é preciso transformar esse modelo em um banco de dados de verdade, no Supabase, seguro (com RLS) — pronto pra receber as funções de backend da próxima peça.

### O que entregar aqui

Um projeto Supabase com as 4 tabelas do DER (¤usuarios¤, ¤lancamentos¤, ¤tags¤, ¤lancamento_tags¤), com FK entre elas, RLS habilitado e policies — tudo commitado no MESMO repositório ¤financapp-seuusuario¤.

### Como funciona aqui

1. Leia os blocos de conteúdo (tabelas, RLS, policies) — cada um já traz o SQL pronto pra copiar no **SQL Editor** do Supabase.
2. Execute cada SQL no seu projeto Supabase de verdade.
3. Commite os scripts no repositório.
4. Peça o visto pessoalmente ao professor, mostrando as tabelas e as policies funcionando.`
    },
    {
      titulo: 'Criar o projeto Supabase',
      corpo: `
Um **projeto Supabase** é um banco PostgreSQL gerenciado, com API pronta pra uso via JavaScript.

### Faça

Crie um novo projeto Supabase chamado ¤financapp¤ (mesmo passo que você já fez na trilha "Conexão com Supabase", agora num projeto novo, só pro FinancApp).`
    },
    {
      titulo: 'Tabela usuarios',
      corpo: `
Toda tabela precisa de uma **chave primária** única.

### Faça

No **SQL Editor** do Supabase, digite e execute:

§§§sql
create table usuarios (
    id bigint generated always as identity primary key,
    nome text,
    turma text,
    foto_url text,
    usuario text unique,
    senha text,
    criado_em timestamptz default now()
);
§§§

¤unique¤ em ¤usuario¤ impede 2 contas com o mesmo nome de usuário — sem isso, o login do app (que busca UM usuário por nome e senha) quebraria pros dois donos do nome repetido.

Salve esse mesmo código em ¤database/schema.sql¤, no repositório ¤financapp-seuusuario¤ (vai crescer com as próximas 3 tabelas).

> Já criou a tabela ¤usuarios¤ sem o ¤unique¤? Não precisa apagar nada: rode ¤alter table usuarios add constraint usuarios_usuario_key unique (usuario);¤ no SQL Editor (se der erro, é porque já existem usuários repetidos — apague os repetidos antes) e atualize o ¤database/schema.sql¤.`
    },
    {
      titulo: 'Tabela lancamentos (com FK)',
      corpo: `
**Chave estrangeira** (FK) conecta uma linha de uma tabela a uma linha de outra — aqui, cada lançamento "aponta" pro usuário dono dele.

### Faça

§§§sql
create table lancamentos (
    id bigint generated always as identity primary key,
    autor_id bigint references usuarios(id),
    descricao text,
    valor numeric not null,
    tipo text not null check (tipo in ('receita', 'despesa')),
    criado_em timestamptz default now()
);
§§§

¤check (tipo in ('receita', 'despesa'))¤ garante, no próprio banco, que ¤tipo¤ só aceite um desses 2 valores — nunca um texto qualquer digitado errado. Adicione esse trecho ao ¤database/schema.sql¤.`
    },
    {
      titulo: 'Tabela tags',
      corpo: `
Uma tag é um rótulo reaproveitável (ex.: "mercado" pode estar em vários lançamentos diferentes) — por isso ela mora numa tabela própria, em vez de ser só um texto solto dentro de ¤lancamentos¤.

### Faça

§§§sql
create table tags (
    id bigint generated always as identity primary key,
    nome text not null unique,
    criado_em timestamptz default now()
);
§§§

¤unique¤ em ¤nome¤ evita 2 tags com o mesmo nome (ex.: "mercado" duas vezes). Adicione ao ¤database/schema.sql¤.`
    },
    {
      titulo: 'Tabela lancamento_tags (a junção N:N)',
      corpo: `
Um **Lançamento** pode ter várias **Tags**, e uma **Tag** pode estar em vários **Lançamentos** — isso é um relacionamento **N:N** (muitos-pra-muitos), e SQL não representa N:N direto entre 2 tabelas: precisa de uma 3ª tabela no meio, a **tabela de junção**, com uma FK pra cada lado.

### Faça

§§§sql
create table lancamento_tags (
    id bigint generated always as identity primary key,
    lancamento_id bigint references lancamentos(id),
    tag_id bigint references tags(id),
    criado_em timestamptz default now(),
    unique (lancamento_id, tag_id)
);
§§§

¤unique (lancamento_id, tag_id)¤ trava a dupla — o banco recusa marcar a MESMA tag 2 vezes no mesmo lançamento. Adicione ao ¤database/schema.sql¤ e faça commit + push.`
    },
    {
      titulo: 'Testar manualmente',
      corpo: `
### Faça

Insira 1 usuário, 1 lançamento, 2 tags, e associe as 2 tags ao lançamento (2 linhas em ¤lancamento_tags¤) — direto pelo SQL Editor ou pela interface de tabela do Supabase. Confira que os relacionamentos (FK) foram respeitados.`
    },
    {
      titulo: 'Revisão da Data API',
      corpo: `
A **Data API** do Supabase transforma comandos SQL em chamadas que o JavaScript do navegador consegue fazer — revisão do que já foi visto na trilha "Conexão com Supabase" (TikTak).

### Faça

Localize a **Project URL** e a **Publishable Key** do projeto ¤financapp¤ (Project Settings → API) — vão ser usadas na próxima matéria.`
    },
    {
      titulo: 'Habilitar RLS e policies de leitura/inserção',
      corpo: `
Sem RLS habilitado, o banco recusa qualquer acesso pela Data API, mesmo com a chave certa. Policies de ¤select¤/¤insert¤ controlam, linha por linha, quem pode ler e quem pode criar.

### Faça

1. Habilite RLS nas 4 tabelas:

§§§sql
alter table usuarios enable row level security;
alter table lancamentos enable row level security;
alter table tags enable row level security;
alter table lancamento_tags enable row level security;
§§§

2. Crie policy de leitura pública em ¤usuarios¤ (repita trocando o nome, pra ¤lancamentos¤, ¤tags¤ e ¤lancamento_tags¤):

§§§sql
create policy "permitir leitura"
on usuarios
for select
to anon
using (true);
§§§

3. Crie policy de inserção liberada em ¤usuarios¤ (repita trocando o nome, pra ¤lancamentos¤, ¤tags¤ e ¤lancamento_tags¤):

§§§sql
create policy "permitir insercao"
on usuarios
for insert
to anon
with check (true);
§§§

Salve todo esse SQL (as 4 tabelas × 2 policies cada = 8 policies) em ¤database/policies.sql¤.`
    },
    {
      titulo: 'Policy de atualização/exclusão restrita ao autor',
      corpo: `
Nem toda operação deve ser liberada geral — editar/apagar um lançamento deveria ser restrito a quem criou.

### Faça

§§§sql
create policy "permitir update proprio lancamento"
on lancamentos
for update
to anon
using (true)
with check (true);

create policy "permitir delete proprio lancamento"
on lancamentos
for delete
to anon
using (true);
§§§

> ⚠️ **Limitação didática, documente no README**: sem Supabase Auth, o banco não tem como saber de verdade QUEM está fazendo a requisição — por isso essas policies usam ¤using (true)¤ (permitem a operação pra qualquer requisição anônima). A restrição "só o dono edita/apaga o próprio lançamento" nesta atividade fica por conta do **JavaScript** da próxima matéria, que só chama update/delete quando ¤autor_id === usuário logado¤. Numa aplicação de produção, isso exigiria autenticação de verdade (Supabase Auth) pra a policy comparar com o usuário autenticado, não com um valor que o próprio cliente envia.`
    },
    {
      titulo: 'Checklist final antes do visto',
      corpo: `
Teste ¤select¤/¤insert¤/¤update¤ de cada tabela antes de chamar o professor. Confira:

- [ ] Projeto Supabase ¤financapp¤ criado.
- [ ] 4 tabelas criadas com FK corretas (¤database/schema.sql¤ com os 4 ¤create table¤).
- [ ] ¤check (tipo in (...))¤ em ¤lancamentos¤ e ¤unique¤ em ¤usuarios.usuario¤, em ¤tags.nome¤ e em ¤lancamento_tags¤.
- [ ] RLS habilitado nas 4 tabelas.
- [ ] 8 policies de leitura/inserção + 2 de atualização/exclusão restrita testadas (¤database/policies.sql¤ com as 10 ¤create policy¤).
- [ ] Limitação da restrição por autor documentada no README.
- [ ] ¤database/schema.sql¤ e ¤database/policies.sql¤ commitados no repositório ¤financapp-seuusuario¤.

Quando tudo estiver certo, avance e peça o visto — é isso que libera a próxima peça do projeto, em Programação de Aplicativos.`
    }
  ];

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveProgress(data) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }

  function loadStepIndex() {
    try {
      const n = parseInt(localStorage.getItem(STEP_KEY), 10);
      return Number.isInteger(n) && n >= 0 && n <= STEPS.length ? n : 0;
    } catch (e) { return 0; }
  }
  function saveStepIndex(i) { try { localStorage.setItem(STEP_KEY, String(i)); } catch (e) {} }

  const savedProgress = loadProgress();
  let currentIndex = (savedProgress && savedProgress.completed) ? STEPS.length : loadStepIndex();

  const stepWrap = document.getElementById('stepWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');
  lblStepTotal.textContent = STEPS.length + 1;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de modelagem-dados-requisitos-trabalho.html.
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('projeto_financapp_banco_dados_trabalho', label, { step: currentIndex + 1, total: STEPS.length + 1 });
    }
  }

  function renderNav(showBack, showNext) {
    return `
      <div class="ab-nav">
        ${showBack ? '<button class="btn btn-secondary" id="btnBack">← Voltar</button>' : '<span></span>'}
        <span class="ab-nav-dica">use ← → do teclado</span>
        ${showNext ? '<button class="btn" id="btnNext">Próximo →</button>' : '<span></span>'}
      </div>`;
  }

  // Direção da última troca de etapa (1 = avançou, -1 = voltou) pra animação.
  let direcao = 1;
  function irPara(i) {
    direcao = i < currentIndex ? -1 : 1;
    currentIndex = Math.max(0, Math.min(i, STEPS.length));
    renderStep();
  }
  // Volta o scroll pro topo e anima a entrada do cartão novo.
  function mostrarEtapa() {
    document.getElementById('palco').scrollTop = 0;
    window.AulaBase.transicao(stepWrap.querySelector('.ab-cartao'), direcao);
  }
  // Setas do teclado = os botões Voltar/Próximo da tela (se existirem).
  window.AulaBase.teclado({
    proximo: () => { const b = document.getElementById('btnNext'); if (b) b.click(); },
    anterior: () => { const b = document.getElementById('btnBack'); if (b) b.click(); },
  });

  function renderStep() {
    if (currentIndex >= STEPS.length) { renderVisto(); return; }
    saveStepIndex(currentIndex);

    const pct = Math.round((currentIndex / STEPS.length) * 100);
    progressFill.style.width = Math.min(pct, 100) + '%';
    lblStepNum.textContent = currentIndex + 1;

    const step = STEPS[currentIndex];
    reportStep(`Trabalho — ${step.titulo}`);
    // As classes antigas (card, md-body, visto-box) continuam junto das .ab-*
    // só como ganchos dos testes (tests/projeto-financapp-*.spec.js etc.) — sem CSS.
    stepWrap.innerHTML = `
      <article class="ab-cartao card">
        <div class="ab-cartao-etapa">Etapa ${currentIndex + 1} de ${STEPS.length + 1}</div>
        <h2>${escapeHtml(step.titulo)}</h2>
        <div class="ab-conteudo md-body">${mdToHtml(step.corpo)}</div>
      </article>
      ${renderNav(currentIndex > 0, true)}
    `;
    // Código com Copiar e checklist clicável (lembra o que já foi marcado nesta etapa).
    window.AulaBase.decorar(stepWrap, { chaveChecklist: `projeto_financapp_banco_dados_trabalho_check_${username}_${currentIndex}` });
    mostrarEtapa();
    const btnBack = document.getElementById('btnBack');
    if (btnBack) btnBack.addEventListener('click', () => irPara(currentIndex - 1));
    document.getElementById('btnNext').addEventListener('click', () => irPara(currentIndex + 1));
  }

  function renderVisto() {
    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length + 1;
    reportStep('Trabalho — Visto do professor');

    const already = loadProgress();
    if (already && already.completed) {
      const quando = already.vistoEm ? new Date(already.vistoEm).toLocaleString('pt-BR') : '';
      stepWrap.innerHTML = `
        <div class="ab-cartao ab-concluida card visto-box">
          <h2>✅ Atividade concluída</h2>
          <p>Visto dado por <b>${escapeHtml(already.vistoPor || '')}</b>${quando ? ' em ' + escapeHtml(quando) : ''}.</p>
          <p>A próxima peça do projeto FinancApp (Programação de Aplicativos) já pode ser liberada pelo professor.</p>
        </div>
        ${renderNav(true, false)}
      `;
      mostrarEtapa();
      document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));
      return;
    }

    stepWrap.innerHTML = `
      <div class="ab-cartao card visto-box">
        <div class="ab-cartao-etapa">Etapa ${STEPS.length + 1} de ${STEPS.length + 1}</div>
        <h2>🧑‍🏫 Etapa final — Visto do professor</h2>
        <div class="ab-conteudo">
        <p>Suas 4 tabelas (<code>usuarios</code>, <code>lancamentos</code>, <code>tags</code>, <code>lancamento_tags</code>) estão criadas no projeto Supabase <code>financapp</code>, com RLS habilitado, policies testadas, e os scripts <code>database/schema.sql</code>/<code>database/policies.sql</code> commitados no repositório <code>financapp-seuusuario</code>?</p>
        <p>Chame o professor pra conferir. Quando ele confirmar, peça o token de professor (Gestão → "Token — Dar Visto / Pular Etapa") e digite abaixo — é assim que a atividade é marcada como concluída.</p>
        </div>
        <div class="ab-form">
          <label>Token do professor
            <input type="text" id="vistoToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnDarVisto">Dar visto</button>
          <div class="ab-msg" id="vistoMsg" style="display:none;"></div>
        </div>
      </div>
      ${renderNav(true, false)}
    `;
    mostrarEtapa();
    document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));

    const btnDarVisto = document.getElementById('btnDarVisto');
    const vistoMsg = document.getElementById('vistoMsg');
    btnDarVisto.addEventListener('click', async () => {
      const t = document.getElementById('vistoToken').value;
      vistoMsg.style.display = 'none';
      if (!t) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Informe o token do professor.';
        vistoMsg.style.display = 'block';
        return;
      }
      btnDarVisto.disabled = true;
      btnDarVisto.textContent = 'Verificando...';
      try {
        const result = window.PortalProfessorVisto
          ? await window.PortalProfessorVisto.verificarToken(t)
          : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!result.ok) {
          vistoMsg.className = 'ab-msg erro';
          vistoMsg.textContent = result.erro;
          vistoMsg.style.display = 'block';
          btnDarVisto.disabled = false;
          btnDarVisto.textContent = 'Dar visto';
          return;
        }
        saveProgress({ completed: true, vistoPor: result.nome, vistoEm: new Date().toISOString() });
        renderVisto();
      } catch (e) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Erro inesperado ao verificar. Tente de novo.';
        vistoMsg.style.display = 'block';
        btnDarVisto.disabled = false;
        btnDarVisto.textContent = 'Dar visto';
      }
    });
  }

  // Gabarito aqui é o checklist de critérios pro professor conferir o banco
  // Supabase e os scripts commitados no repositório do aluno.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Projeto FinancApp — Banco de Dados e RLS — Checklist de correção',
      subtitle: 'Trabalho (projeto Supabase real, scripts commitados no GitHub) · Banco de Dados · Turma Sistemas',
