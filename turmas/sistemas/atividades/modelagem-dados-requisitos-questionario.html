<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Modelagem de Dados e Requisitos: Questionário</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0d0912; --panel:#171022; --panel2:#130d1c; --line:#2e2340;
    --accent:#b98cff; --accent-dim:#7c56b3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#e7defa; --ink-dim:#8b7aa8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--accent-dim); background:#0a0710;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(185,140,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--accent); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(185,140,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--accent-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--accent);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--accent-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--accent); background:rgba(185,140,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--accent); color:var(--accent); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,91,77,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--accent); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--accent); color:#150a24; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--accent); border:1px solid var(--accent-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--accent); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--accent); border:1px solid var(--accent-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(185,140,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  /* Tela inicial (regras) e tela de bloqueio — mesmo visual de .card */
  .gate-card ul{ margin:10px 0 0; padding-left:20px; font-size:13px; line-height:1.8; }
  .gate-card li{ margin-bottom:4px; }
  .gate-card .warn-icon{ font-size:40px; margin-bottom:8px; }
  .token-form{ display:flex; flex-direction:column; gap:12px; max-width:320px; margin-top:16px; }
  .token-form label{ display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .token-form input{
    font-family:inherit; font-size:14px; padding:9px 10px; background:#000; color:var(--ink);
    border:1px solid var(--line); border-radius:2px;
  }
  .token-form input:focus{ outline:none; border-color:var(--accent-dim); }
  .token-msg{ font-size:12.5px; padding:8px 10px; border:1px dashed var(--line); }
  .token-msg.erro{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .token-msg.ok{ border-color:var(--accent); color:var(--accent); }

  /* Overlay de advertência — aparece POR CIMA do quiz quando o aluno volta
     pra aba depois de ter saído (ver shared/exam-proctor.js) */
  .warn-overlay{
    position:fixed; inset:0; background:rgba(5,3,8,0.88); z-index:999;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .warn-overlay .card{ max-width:420px; text-align:center; border-color:var(--blood-bright); }
  .warn-overlay .warn-icon{ font-size:44px; margin-bottom:8px; }
  .warn-overlay h2{ color:var(--blood-bright); }
  .warn-overlay p{ font-size:13.5px; line-height:1.7; margin:0 0 14px; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'modelagem_dados_requisitos_questionario';
</script>

<body>

<div class="env">
  <div class="topbar">
    <div>MODELAGEM DE SISTEMAS — QUESTIONÁRIO: MODELAGEM DE DADOS E REQUISITOS</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">11</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="gateWrap" style="display:none;"></div>
    <div class="story-wrap" id="storyWrap" style="display:none;"></div>
  </div>
</div>

<script>
  // Este questionário só cobra o que a etapa "Trabalho" desta trilha pediu
  // pra pesquisar (ver turmas/sistemas/atividades/modelagem-dados-
  // requisitos-trabalho.html, Blocos 1 e 2) — nenhuma pergunta aqui sai
  // desses assuntos.
  const STEPS = [
    {
      story: 'Bit aqui de novo! Vamos falar de <b>Modelagem de Dados</b> — o primeiro passo antes de programar qualquer sistema. Tudo começa identificando as <b>entidades</b>: uma entidade é uma pessoa, objeto ou conceito relevante pro sistema, que vira uma tabela no banco de dados. Numa locadora de jogos, por exemplo, "Cliente" e "Jogo" são entidades.',
      question: {
        prompt: 'Num sistema de biblioteca, qual das opções abaixo é um exemplo de ENTIDADE?',
        options: ['O livro do acervo', 'O título do livro', 'Emprestar um livro', 'A data de devolução'],
        correctIndex: 0,
        explanation: 'Isso! "Livro" é um objeto relevante pro sistema — vira uma tabela. As outras opções são ação, característica e valor, não entidades.'
      }
    },
    {
      story: 'Depois de identificar a entidade, é hora dos <b>atributos</b>: as características DAQUELA entidade, que viram as colunas da tabela. A entidade "Livro" pode ter atributos como título, autor e ano de publicação.',
      question: {
        prompt: 'Qual das opções abaixo é um ATRIBUTO da entidade "Aluno"?',
        options: ['Data de nascimento do aluno', 'A turma em que o aluno estuda', 'A matrícula do aluno numa turma', 'O sistema de biblioteca'],
        correctIndex: 0,
        explanation: 'Exato! Data de nascimento é uma característica do próprio Aluno — vira uma coluna da tabela Aluno.'
      }
    },
    {
      story: 'Entidades sozinhas não contam a história toda — é preciso saber como elas se conectam. Isso é um <b>relacionamento</b>: por exemplo, um Cliente FAZ um Pedido, ou um Aluno MATRICULA-SE numa Turma.',
      question: {
        prompt: 'Qual das opções abaixo descreve um RELACIONAMENTO entre duas entidades?',
        options: ['Um Professor LECIONA uma Disciplina', 'O nome completo de um Professor', 'O valor total de um Pedido feito', 'A cor de fundo escolhida pro sistema'],
        correctIndex: 0,
        explanation: 'Isso! "Leciona" conecta as entidades Professor e Disciplina — é um relacionamento.'
      }
    },
    {
      story: 'Todo relacionamento tem uma <b>cardinalidade</b>: quantos registros de um lado se conectam a quantos do outro. As três formas básicas são 1:1, 1:N e N:N. Um Pedido tem VÁRIOS Itens, mas cada Item pertence a UM só Pedido — isso é 1:N.',
      question: {
        prompt: 'Um Aluno pode se matricular em VÁRIAS Turmas, e uma Turma tem VÁRIOS Alunos matriculados. Qual é a cardinalidade desse relacionamento?',
        options: ['N:N — muitos pra muitos, dos dois lados', '1:1 — sempre um pra um, nunca mais', '1:N — um pra muitos, só de um lado', 'Não existe cardinalidade nesse caso'],
        correctIndex: 0,
        explanation: 'Correto! Quando os dois lados podem ter vários do outro lado, é N:N — normalmente resolvido com uma tabela extra no banco.'
      }
    },
    {
      story: 'Toda tabela precisa de um jeito único de identificar cada linha — é pra isso que serve a <b>chave primária</b>: um valor que nunca se repete e nunca fica vazio, geralmente um <code>id</code> gerado automaticamente pelo banco.',
      question: {
        prompt: 'Por que uma tabela precisa de uma chave primária?',
        options: ['Identifica cada registro de forma única, sem repetir', 'Deixa a tabela mais bonita e organizada visualmente', 'Só é obrigatória em tabelas realmente muito grandes', 'Serve pra guardar a senha de acesso do sistema'],
        correctIndex: 0,
        explanation: 'Isso! Nome e e-mail podem, teoricamente, coincidir entre duas pessoas — a chave primária garante que cada linha tenha uma identidade única e confiável.'
      }
    },
    {
      story: 'É a <b>chave estrangeira</b> que efetivamente cria um relacionamento entre duas tabelas: ela é uma coluna que guarda o valor da chave primária de OUTRA tabela. Um Pedido guarda o <code>id</code> do Cliente que fez ele — essa coluna é a chave estrangeira.',
      question: {
        prompt: 'Qual é o papel de uma CHAVE ESTRANGEIRA?',
        options: ['Referenciar a chave primária de outra tabela, ligando as duas', 'Gerar automaticamente um valor aleatório pra cada linha nova', 'Impedir que a tabela tenha qualquer coluna repetida', 'Guardar apenas o nome que a tabela recebeu'],
        correctIndex: 0,
        explanation: 'Exato! A chave estrangeira aponta pra chave primária de outra tabela — é o mecanismo real por trás de todo relacionamento no banco.'
      }
    },
    {
      story: 'Uma tabela mal modelada repete dado à toa: se cada Pedido guardasse o NOME e o TELEFONE inteiros do cliente de novo a cada linha, um mesmo cliente apareceria escrito várias vezes — e se ele mudar o telefone, seria preciso atualizar TODAS as linhas. <b>Normalizar</b> é organizar os dados pra evitar essa repetição, separando em tabelas diferentes (Cliente de um lado, Pedido do outro, ligados por chave estrangeira).',
      question: {
        prompt: 'Qual situação abaixo é um exemplo de tabela MAL normalizada (com redundância)?',
        options: ['Pedidos repetem nome e telefone do cliente em cada linha, sem tabela própria', 'Clientes ficam numa tabela própria, ligados a Pedidos por chave estrangeira', 'Toda tabela tem uma chave primária única pra cada linha', 'Cada tabela guarda só as colunas que realmente precisa'],
        correctIndex: 0,
        explanation: 'Isso! Repetir nome/telefone em toda linha de Pedido é redundância — a normalização resolve isso separando Cliente numa tabela própria.'
      }
    },
    {
      story: 'Antes de criar as tabelas de verdade no banco, é comum desenhar um <b>DER (Diagrama de Entidade-Relacionamento)</b> — também chamado de MER (Modelo de Entidade-Relacionamento): um desenho que mostra as entidades, os atributos de cada uma e como elas se relacionam, tudo antes de escrever qualquer <code>CREATE TABLE</code>.',
      question: {
        prompt: 'Pra que serve montar um DER/MER antes de começar a programar?',
        options: ['Planejar entidades, atributos e relações antes das tabelas', 'Decidir a paleta de cores que o sistema vai usar', 'Só serve depois que o sistema inteiro já estiver pronto', 'Escrever o código da interface visual do usuário'],
        correctIndex: 0,
        explanation: 'Correto! O DER/MER é o planejamento visual dos dados — evita erros de modelagem que seriam caros de corrigir depois de o banco já estar em uso.'
      }
    },
    {
      story: 'Agora, <b>Requisitos</b>: um requisito funcional é uma AÇÃO concreta que o sistema executa. Numa locadora de jogos, por exemplo: "o sistema deve permitir registrar o empréstimo de um jogo pra um cliente".',
      question: {
        prompt: 'Qual das opções abaixo é um exemplo de REQUISITO FUNCIONAL?',
        options: ['"Permitir cadastrar um novo jogo no catálogo"', '"Responder a qualquer ação em menos de 2 segundos"', '"Ficar disponível 24 horas por dia, todo dia"', '"Funcionar corretamente em qualquer navegador"'],
        correctIndex: 0,
        explanation: 'Isso! Cadastrar um jogo é uma AÇÃO que o sistema executa — típico requisito funcional.'
      }
    },
    {
      story: 'Já um requisito não funcional descreve uma QUALIDADE de como o sistema se comporta, não uma ação específica. "O sistema deve suportar 500 usuários simultâneos" não é UMA funcionalidade — é uma característica de TODO o sistema.',
      question: {
        prompt: 'Qual das opções abaixo é um exemplo de REQUISITO NÃO FUNCIONAL?',
        options: ['"Permanecer disponível mesmo com muitos acessos"', '"Permitir cancelar um empréstimo de jogo feito"', '"Enviar um e-mail de confirmação ao cliente"', '"Gerar um relatório de jogos alugados no mês"'],
        correctIndex: 0,
        explanation: 'Exato! Disponibilidade sob carga é uma QUALIDADE do sistema — não uma ação específica. É por isso que é não funcional.'
      }
    },
    {
      story: 'Por fim: um requisito, funcional ou não, só é útil se estiver <b>documentado</b> de um jeito que o time inteiro entenda — seja numa lista simples, numa tabela, ou no formato "user story": "Como [tipo de usuário], eu quero [ação], para [motivo]".',
      question: {
        prompt: 'Qual das opções abaixo está escrita no formato "user story"?',
        options: ['"Como cliente, eu quero ver meu histórico de aluguéis, para saber o que já peguei"', '"O sistema possui, ao todo, doze tabelas diferentes no banco"', '"Este é o requisito número quatro da lista de exigências"', '"O banco de dados do sistema fica hospedado na nuvem"'],
        correctIndex: 0,
        explanation: 'Isso! Segue exatamente o formato Como [usuário], eu quero [ação], para [motivo] — uma forma clara e padronizada de documentar um requisito.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Modelagem de Sistemas — Modelagem de Dados e Requisitos',
      subtitle: 'Questionário · Trilha Modelagem de Dados e Requisitos · Turma Sistemas',
      capacidade: 'Elaborar modelo de dados e definir requisitos funcionais e não funcionais de um sistema.',
      steps: STEPS,
      fileName: 'modelagem-dados-requisitos-questionario-slides.pptx',
      closingTitle: 'Revise antes de responder!',
      closingText: 'O questionário só cobra o que foi pedido no trabalho (Canva/Slides) desta trilha — reveja sua apresentação antes de responder.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Modelagem de Sistemas — Modelagem de Dados e Requisitos (Questionário)',
      subtitle: 'Questionário · Trilha Modelagem de Dados e Requisitos · Turma Sistemas',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'modelagem-dados-requisitos-questionario-gabarito.txt'
    });
  };

  const gateWrap = document.getElementById('gateWrap');
  const storyWrap = document.getElementById('storyWrap');

  function quizAlreadyCompleted() {
    const username = new URLSearchParams(window.location.search).get('user') || 'anon';
    try {
      const data = JSON.parse(localStorage.getItem(`modelagem_dados_requisitos_questionario_progress_${username}`) || 'null');
      return !!(data && data.completed);
    } catch (e) { return false; }
  }

  function startQuizEngine() {
    storyWrap.style.display = 'flex';
    gateWrap.style.display = 'none';
    window.PortalQuizTeoria.run({
      activityLocation: 'modelagem_dados_requisitos_questionario',
      steps: STEPS,
      reportLabel: 'Modelagem de Dados e Requisitos — Questionário',
      mentor: { rowClass: 'eri', avatar: '🧑‍💻', name: 'Bit, Mentor de Código' },
      finishPassed: {
        title: 'Modelagem de Dados e Requisitos concluído!',
        introHtml: '<p>Você já sabe identificar entidades, atributos, relacionamentos e cardinalidade, além de diferenciar requisitos funcionais de não funcionais.</p>',
        closingHtml: '<p>Trilha concluída — bom trabalho!</p>',
        restartLabel: '🔁 Rever o questionário'
      }
    });

    const btnGenSlides = document.getElementById('btnGenSlides');
    if (btnGenSlides) {
      (async function () {
        const user = window.PortalSession ? await window.PortalSession.getUser() : null;
        if (!user || user.role !== 'professor') return;
        btnGenSlides.style.display = 'inline-block';
        btnGenSlides.addEventListener('click', () => {
          btnGenSlides.disabled = true;
          btnGenSlides.textContent = '⏳ Gerando...';
          setTimeout(() => {
            window.generateSlidesForGestao();
            btnGenSlides.disabled = false;
            btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
          }, 50);
        });
      })();
    }
  }

  function renderWarningOverlay(count, onDismiss) {
    const overlay = document.createElement('div');
    overlay.className = 'warn-overlay';
    overlay.innerHTML = `
      <div class="card">
        <div class="warn-icon">⚠️</div>
        <h2>Advertência ${count}/2</h2>
        <p>Você saiu da aba/janela do portal durante o questionário. Isso conta como uma advertência.<br>
        Na <b>2ª advertência</b>, esta atividade é <b>bloqueada</b> — só o professor consegue liberar de novo.</p>
        <div class="actions" style="justify-content:center;">
          <button class="btn" id="btnWarnOk">Entendi, continuar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('btnWarnOk').addEventListener('click', () => {
      overlay.remove();
      if (onDismiss) onDismiss();
    });
  }

  function renderBlockedScreen(guard) {
    storyWrap.style.display = 'none';
    gateWrap.style.display = 'flex';
    progressFillReset();
    gateWrap.innerHTML = `
      <div class="card gate-card" style="text-align:center;">
        <div class="warn-icon">🔒</div>
        <h2>Atividade bloqueada</h2>
        <p>Você saiu da aba/janela do portal 2 vezes durante o questionário. Por isso, esta atividade foi bloqueada.</p>
        <p>Procure o professor. Ele pode liberar de novo com o mesmo token que usa pra "Dar visto" (Gestão → "Token — Dar Visto / Pular Etapa").</p>
        <div class="token-form" style="margin-left:auto; margin-right:auto; text-align:left;">
          <label>Token do professor
            <input type="text" id="unlockToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnUnlock">Desbloquear</button>
          <div class="token-msg" id="unlockMsg" style="display:none;"></div>
        </div>
      </div>
    `;
    const btnUnlock = document.getElementById('btnUnlock');
    const unlockMsg = document.getElementById('unlockMsg');
    btnUnlock.addEventListener('click', async () => {
      const t = document.getElementById('unlockToken').value;
      unlockMsg.style.display = 'none';
      if (!t) {
        unlockMsg.className = 'token-msg erro';
        unlockMsg.textContent = 'Informe o token do professor.';
        unlockMsg.style.display = 'block';
        return;
      }
      btnUnlock.disabled = true;
      btnUnlock.textContent = 'Verificando...';
      const result = await window.PortalExamGuard.unlock(guard, t);
      if (!result.ok) {
        unlockMsg.className = 'token-msg erro';
        unlockMsg.textContent = result.erro;
        unlockMsg.style.display = 'block';
        btnUnlock.disabled = false;
        btnUnlock.textContent = 'Desbloquear';
        return;
      }
      renderStartScreen(guard);
    });
  }

  function progressFillReset() {
    document.getElementById('progressFill').style.width = '0%';
  }

  function renderStartScreen(guard) {
    storyWrap.style.display = 'none';
    gateWrap.style.display = 'flex';
    progressFillReset();
    gateWrap.innerHTML = `
      <div class="eri-row">
        <div class="eri-avatar">🧑‍💻</div>
        <div class="speech-bubble">
          <span class="eri-name">Bit, Mentor de Código</span>
          Antes de começar: este questionário só pergunta sobre o que você já pesquisou pro seu trabalho (Modelagem de Dados e Requisitos) — revise sua apresentação se precisar, antes de clicar em Iniciar.
        </div>
      </div>
      <div class="card gate-card">
        <h2>⚠️ Regras deste questionário</h2>
        <ul>
          <li>Você tem <b>11 perguntas</b> e precisa de pelo menos <b>80% de acerto</b> pra concluir.</li>
          <li>A partir do momento que você clicar em "Iniciar", <b>não saia da aba/janela do portal</b> até terminar.</li>
          <li>Se você sair (trocar de aba, minimizar, trocar de app ou <b>clicar em outra janela, mesmo com a tela dividida</b>), recebe uma <b>advertência</b>.</li>
          <li><b>Copiar, colar e arrastar texto</b> ficam bloqueados durante toda a prova.</li>
          <li>Na <b>2ª advertência</b>, o questionário é <b>bloqueado</b> — só o professor libera de novo.</li>
        </ul>
        <div class="actions" style="margin-top:14px;">
          <button class="btn" id="btnIniciar">▶ Iniciar questionário</button>
        </div>
      </div>
    `;
    document.getElementById('btnIniciar').addEventListener('click', () => {
      window.PortalExamGuard.arm(guard, {
        onWarning: (count) => renderWarningOverlay(count, () => {}),
        onBlocked: () => renderBlockedScreen(guard)
      });
      startQuizEngine();
    });
  }

  (async function boot() {
    const guard = await window.PortalExamGuard.create('modelagem_dados_requisitos_questionario');

    // Sem sessão de aluno reconhecida (professor, ou iframe oculto da Gestão
    // gerando slides/gabarito remotamente) — guarda desligada: abre direto,
    // sem tela de regras nem risco de bloqueio.
    if (guard.disabled || quizAlreadyCompleted()) {
      startQuizEngine();
      return;
    }

    if (guard.blocked) {
      renderBlockedScreen(guard);
    } else {
      renderStartScreen(guard);
    }
  })();
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
