<div class="ab-app">

    <div class="ab-topo-etapa">Etapa <span id="lblStepNum">1</span> de <span id="lblStepTotal">7</span></div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `projeto_financapp_kickoff_trabalho_progress_${username}`;
  const STEP_KEY = `projeto_financapp_kickoff_trabalho_step_${username}`;

  // Atividade sem correção automática (o "produto" é um repositório real no
  // GitHub, fora do portal) — cada tela só navega com Voltar/Próximo, sem
  // quiz nenhum. Quem marca como concluída é o professor, na última etapa
  // (ver renderVisto), o mesmo padrão de modelagem-dados-requisitos-trabalho.html
  // e oficina-comunicacao-trabalho.html (mesma matéria). Este é o 1º de 5
  // módulos do projeto interdisciplinar "FinancApp" (app de controle
  // financeiro pessoal) — ver Atividades/Desenvolvimento de Sistemas/
  // Projeto FinancApp — *.md para as próximas 4 peças (Modelagem, Banco de
  // Dados, Redes, Programação de Aplicativos — esta última incorpora o que
  // antes era a peça separada de Desenvolvimento de Sistemas 1), todas
  // usando o MESMO repositório GitHub criado aqui.
  const STEPS = [
    {
      titulo: 'Apresentação',
      corpo: `
A PixelForge Studios foi contratada por um grupo de investidores pra criar um app de **controle financeiro pessoal** — o **FinancApp** —, onde cada usuário registra seus gastos e ganhos e acompanha o próprio saldo. Você faz parte do time.

Este é só o **primeiro** de 5 passos de um projeto que vai atravessar o curso inteiro, um passo por matéria: aqui você cuida do kickoff (repositório); os próximos ficam por conta de Modelagem de Sistemas, Banco de Dados, Redes de Computadores e Programação de Aplicativos — todos usando o MESMO repositório que você vai criar agora.

### 1ª versão do FinancApp

- [ ] Cadastro e login
- [ ] Perfil (nome, turma, foto)
- [ ] Registrar lançamento (receita ou despesa)
- [ ] Ver extrato (lista de lançamentos + saldo)
- [ ] Marcar lançamentos com tags (ex.: "mercado", "transporte", "lazer")

### O que entregar aqui

Nada de código ainda — só a organização inicial: repositório, README e o plano de trabalho em issues.

### Como funciona aqui

1. Leia os blocos de conteúdo (fases, repositório, README, issues).
2. Faça cada ação no GitHub de verdade, conforme for pedido.
3. Peça o visto pessoalmente ao professor no final, mostrando o repositório.`
    },
    {
      titulo: 'Fases de um projeto, agora na prática',
      corpo: `
Você já estudou, na trilha **Oficina de Comunicação**, as fases de elaboração de um projeto: levantamento, planejamento, desenvolvimento, testes e entrega.

O Kickoff do FinancApp é a fase de **planejamento** virando ação de verdade — em vez de só documentar as fases, você vai criar a estrutura real (repositório, README, issues) do projeto que vai continuar sendo construído nas próximas matérias.

> Pense: em qual fase o projeto está agora? E em qual fase ele vai estar quando o Diagrama de Entidade-Relacionamento (DER) do FinancApp estiver pronto, na Modelagem de Sistemas?`
    },
    {
      titulo: 'Criar o repositório do FinancApp',
      corpo: `
Um **repositório** é a "casa" do projeto: todo código, documentação e histórico moram ali. O **GitHub** hospeda esse histórico na nuvem e também funciona como um portfólio: qualquer pessoa (inclusive um recrutador, no futuro) pode ver o que você construiu.

### Faça

1. Acesse sua conta no GitHub.
2. Clique em **New repository**.
3. Nome do repositório:
§§§text
financapp-seuusuario
§§§
(troque ¤seuusuario¤ pelo seu usuário do portal — ex.: ¤financapp-joao¤)
4. Marque **Public**.
5. Marque a opção de já criar um ¤README.md¤.
6. Crie o repositório.

### Entrega

O projeto deverá possuir um repositório próprio no GitHub, chamado ¤financapp-seuusuario¤.`
    },
    {
      titulo: 'README como cartão de visita',
      corpo: `
O **README** é a primeira coisa que qualquer pessoa vê ao abrir o repositório — ele precisa explicar o projeto sem exigir que ninguém pergunte nada.

### Faça

Edite o ¤README.md¤ do seu repositório e escreva:

- [ ] **Objetivo** — o que é o FinancApp, com suas palavras.
- [ ] **Funcionalidades** — a lista das 5 funcionalidades da 1ª versão.
- [ ] **Tecnologias** — HTML, CSS, JavaScript, GitHub, Supabase.

> Dica: pode editar o README direto pelo navegador, clicando no ícone de lápis na página do arquivo — não precisa de Codespace ainda.`
    },
    {
      titulo: 'Issues como plano de trabalho',
      corpo: `
**Issues** (no GitHub) são tarefas — o jeito de quebrar um projeto grande em pedaços pequenos e acompanháveis, em vez de uma tarefa gigante e vaga.

### Faça

Na aba **Issues** do seu repositório, crie 5 issues, uma por funcionalidade:

1. Cadastro e login
2. Perfil do usuário
3. Registrar lançamento
4. Extrato e saldo
5. Tags nos lançamentos

Cada issue pode ficar só com o título — o objetivo aqui é planejar, não descrever tudo ainda.`
    },
    {
      titulo: 'Documentar decisões desde o início',
      corpo: `
Decisões de projeto (nome, público-alvo, escopo) documentadas desde o começo evitam retrabalho e desalinhamento mais pra frente.

### Faça

Adicione ao ¤README.md¤ uma seção:

§§§text
## Decisões de Projeto
§§§

Com:

- [ ] **Nome do app** (pode manter "FinancApp" ou escolher outro).
- [ ] **Público-alvo** (ex.: alunos e professores da turma/escola, controlando o próprio dinheiro).`
    },
    {
      titulo: 'Checklist antes do visto',
      corpo: `
Confira antes de chamar o professor:

- [ ] Repositório ¤financapp-seuusuario¤ criado (público, com README).
- [ ] README com objetivo, as 5 funcionalidades, tecnologias e "Decisões de Projeto".
- [ ] 5 issues criadas (uma por funcionalidade).

Quando estiver tudo certo, avance e peça o visto — é isso que libera a próxima peça do projeto, em Modelagem de Sistemas.`
    }
  ];

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveProgress(data) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }

  function loadStepIndex() {
    try {
      const n = parseInt(localStorage.getItem(STEP_KEY), 10);
      return Number.isInteger(n) && n >= 0 && n <= STEPS.length ? n : 0;
    } catch (e) { return 0; }
  }
  function saveStepIndex(i) { try { localStorage.setItem(STEP_KEY, String(i)); } catch (e) {} }

  const savedProgress = loadProgress();
  let currentIndex = (savedProgress && savedProgress.completed) ? STEPS.length : loadStepIndex();

  const stepWrap = document.getElementById('stepWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');
  lblStepTotal.textContent = STEPS.length + 1;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de modelagem-dados-requisitos-trabalho.html
  // (cabeçalhos, blocos §§§lang...§§§, tabela, listas/checklist, citação).
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('projeto_financapp_kickoff_trabalho', label, { step: currentIndex + 1, total: STEPS.length + 1 });
    }
  }

  function renderNav(showBack, showNext) {
    return `
      <div class="ab-nav">
        ${showBack ? '<button class="btn btn-secondary" id="btnBack">← Voltar</button>' : '<span></span>'}
        <span class="ab-nav-dica">use ← → do teclado</span>
        ${showNext ? '<button class="btn" id="btnNext">Próximo →</button>' : '<span></span>'}
      </div>`;
  }

  // Direção da última troca de etapa (1 = avançou, -1 = voltou) pra animação.
  let direcao = 1;
  function irPara(i) {
    direcao = i < currentIndex ? -1 : 1;
    currentIndex = Math.max(0, Math.min(i, STEPS.length));
    renderStep();
  }
  // Volta o scroll pro topo e anima a entrada do cartão novo.
  function mostrarEtapa() {
    document.getElementById('palco').scrollTop = 0;
    window.AulaBase.transicao(stepWrap.querySelector('.ab-cartao'), direcao);
  }
  // Setas do teclado = os botões Voltar/Próximo da tela (se existirem).
  window.AulaBase.teclado({
    proximo: () => { const b = document.getElementById('btnNext'); if (b) b.click(); },
    anterior: () => { const b = document.getElementById('btnBack'); if (b) b.click(); },
  });

  function renderStep() {
    if (currentIndex >= STEPS.length) { renderVisto(); return; }
    saveStepIndex(currentIndex);

    const pct = Math.round((currentIndex / STEPS.length) * 100);
    progressFill.style.width = Math.min(pct, 100) + '%';
    lblStepNum.textContent = currentIndex + 1;

    const step = STEPS[currentIndex];
    reportStep(`Trabalho — ${step.titulo}`);
    // As classes antigas (card, md-body, visto-box) continuam junto das .ab-*
    // só como ganchos dos testes (tests/projeto-financapp-*.spec.js etc.) — sem CSS.
    stepWrap.innerHTML = `
      <article class="ab-cartao card">
        <div class="ab-cartao-etapa">Etapa ${currentIndex + 1} de ${STEPS.length + 1}</div>
        <h2>${escapeHtml(step.titulo)}</h2>
        <div class="ab-conteudo md-body">${mdToHtml(step.corpo)}</div>
      </article>
      ${renderNav(currentIndex > 0, true)}
    `;
    // Código com Copiar e checklist clicável (lembra o que já foi marcado nesta etapa).
    window.AulaBase.decorar(stepWrap, { chaveChecklist: `projeto_financapp_kickoff_trabalho_check_${username}_${currentIndex}` });
    mostrarEtapa();
    const btnBack = document.getElementById('btnBack');
    if (btnBack) btnBack.addEventListener('click', () => irPara(currentIndex - 1));
    document.getElementById('btnNext').addEventListener('click', () => irPara(currentIndex + 1));
  }

  function renderVisto() {
    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length + 1;
    reportStep('Trabalho — Visto do professor');

    const already = loadProgress();
    if (already && already.completed) {
      const quando = already.vistoEm ? new Date(already.vistoEm).toLocaleString('pt-BR') : '';
      stepWrap.innerHTML = `
        <div class="ab-cartao ab-concluida card visto-box">
          <h2>✅ Atividade concluída</h2>
          <p>Visto dado por <b>${escapeHtml(already.vistoPor || '')}</b>${quando ? ' em ' + escapeHtml(quando) : ''}.</p>
          <p>A próxima peça do projeto FinancApp (Modelagem de Sistemas) já pode ser liberada pelo professor.</p>
        </div>
        ${renderNav(true, false)}
      `;
      mostrarEtapa();
      document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));
      return;
    }

    stepWrap.innerHTML = `
      <div class="ab-cartao card visto-box">
        <div class="ab-cartao-etapa">Etapa ${STEPS.length + 1} de ${STEPS.length + 1}</div>
        <h2>🧑‍🏫 Etapa final — Visto do professor</h2>
        <div class="ab-conteudo">
        <p>Seu repositório <code>financapp-seuusuario</code> já está com README (objetivo, funcionalidades, tecnologias, decisões de projeto) e as 5 issues criadas?</p>
        <p>Chame o professor pra conferir o repositório no GitHub. Quando ele confirmar, peça o token de professor (Gestão → "Token — Dar Visto / Pular Etapa") e digite abaixo — é assim que a atividade é marcada como concluída.</p>
        </div>
        <div class="ab-form">
          <label>Token do professor
            <input type="text" id="vistoToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnDarVisto">Dar visto</button>
          <div class="ab-msg" id="vistoMsg" style="display:none;"></div>
        </div>
      </div>
      ${renderNav(true, false)}
    `;
    mostrarEtapa();
    document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));

    const btnDarVisto = document.getElementById('btnDarVisto');
    const vistoMsg = document.getElementById('vistoMsg');
    btnDarVisto.addEventListener('click', async () => {
      const t = document.getElementById('vistoToken').value;
      vistoMsg.style.display = 'none';
      if (!t) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Informe o token do professor.';
        vistoMsg.style.display = 'block';
        return;
      }
      btnDarVisto.disabled = true;
      btnDarVisto.textContent = 'Verificando...';
      try {
        const result = window.PortalProfessorVisto
          ? await window.PortalProfessorVisto.verificarToken(t)
          : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!result.ok) {
          vistoMsg.className = 'ab-msg erro';
          vistoMsg.textContent = result.erro;
          vistoMsg.style.display = 'block';
          btnDarVisto.disabled = false;
          btnDarVisto.textContent = 'Dar visto';
          return;
        }
        saveProgress({ completed: true, vistoPor: result.nome, vistoEm: new Date().toISOString() });
        renderVisto();
      } catch (e) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Erro inesperado ao verificar. Tente de novo.';
        vistoMsg.style.display = 'block';
        btnDarVisto.disabled = false;
        btnDarVisto.textContent = 'Dar visto';
      }
    });
  }

  // Gabarito aqui é o checklist de critérios pro professor conferir o
  // repositório GitHub do aluno sem precisar reabrir este módulo.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Projeto FinancApp — Kickoff — Checklist de correção',
      subtitle: 'Trabalho (repositório GitHub real, fora do portal) · Introdução de Desenvolvimento de Projetos · Turma Sistemas',
      items: [
        { number: 1, title: 'Repositório', prompt: 'O aluno criou o repositório?', answer: 'Repositório público chamado financapp-<usuario>, com README inicial criado.' },
        { number: 2, title: 'README', prompt: 'O README cobre o esperado?', answer: 'Objetivo do FinancApp, lista das 5 funcionalidades da 1ª versão (cadastro/login, perfil, registrar lançamento, extrato/saldo, tags), tecnologias (HTML, CSS, JavaScript, GitHub, Supabase) e seção "Decisões de Projeto" (nome + público-alvo).' },
        { number: 3, title: 'Issues', prompt: 'As issues foram criadas?', answer: '5 issues, uma por funcionalidade: Cadastro e login; Perfil do usuário; Registrar lançamento; Extrato e saldo; Tags nos lançamentos.' }
      ],
      fileName: 'projeto-financapp-kickoff-checklist.txt'
    });
  };

  renderStep();
</script>
<script src="../../../shared/vlibras-widget.js"></script>
</body>
