     a Personalização do aluno (cor/tema) sobrescreve, porque o portal injeta as
     variáveis no <html>. -->

<body>

<div class="ab-app">
  <header class="ab-topo">
    <div class="ab-topo-titulo">Modelagem de Sistemas 1 — Trabalho: FinancApp — Modelagem de Dados e Requisitos</div>
    <div class="ab-topo-etapa">Etapa <span id="lblStepNum">1</span> de <span id="lblStepTotal">8</span></div>
  </header>
  <div class="ab-progresso"><div class="ab-progresso-fill" id="progressFill"></div></div>

  <main class="ab-palco" id="palco">
    <div class="ab-coluna" id="stepWrap"></div>
  </main>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `projeto_financapp_modelagem_trabalho_progress_${username}`;
  const STEP_KEY = `projeto_financapp_modelagem_trabalho_step_${username}`;

  // 2ª de 5 peças do projeto interdisciplinar "FinancApp" (ver
  // projeto-financapp-kickoff-trabalho.html, matéria Introdução de
  // Desenvolvimento de Projetos, pra 1ª peça). Mesmo padrão de trabalho sem
  // correção automática (produto vai pro MESMO repositório GitHub criado no
  // Kickoff — docs/der.png) — visto do professor no final. Reaproveita a
  // MESMA capacidade da trilha genérica "Modelagem de Dados e Requisitos"
  // (mesma matéria) — produto diferente (DER real do projeto FinancApp, não
  // uma apresentação Canva/Slides isolada) — por isso não repete o
  // questionário já coberto por aquela trilha.
  const STEPS = [
    {
      titulo: 'Apresentação',
      corpo: `
A PixelForge Studios já tem o repositório do FinancApp criado (Kickoff, em Introdução de Desenvolvimento de Projetos). Esta é a **2ª de 5 peças** do mesmo projeto.

Antes de criar qualquer tabela, o time de modelagem precisa definir: **o que o sistema precisa fazer** (requisitos) e **como os dados vão se organizar** (entidades, atributos, relacionamentos).

### 1ª versão do FinancApp (relembrando)

- [ ] Cadastro e login
- [ ] Perfil (nome, turma, foto)
- [ ] Registrar lançamento (receita ou despesa)
- [ ] Ver extrato (lista de lançamentos + saldo)
- [ ] Marcar lançamentos com tags (ex.: "mercado", "transporte", "lazer")

### O que entregar aqui

Requisitos funcionais/não funcionais, entidades e atributos, cardinalidade, chave primária/estrangeira, e um **DER** (Diagrama de Entidade-Relacionamento) desenhado e salvo como ¤docs/der.png¤ no MESMO repositório ¤financapp-seuusuario¤ do Kickoff.

### Como funciona aqui

1. Leia os blocos de conteúdo (requisitos, entidades, relacionamentos, chaves).
2. Monte cada parte por fora (papel, Canva, draw.io ou dbdiagram.io).
3. Desenhe o DER, exporte como imagem e commite no repositório.
4. Peça o visto pessoalmente ao professor, mostrando o ¤docs/der.png¤ commitado.`
    },
    {
      titulo: 'Requisitos funcionais e não funcionais',
      corpo: `
Requisito funcional é uma **AÇÃO** que o sistema faz; requisito não funcional é uma **QUALIDADE** do sistema (desempenho, segurança, usabilidade).

### Faça

- [ ] Liste **5 requisitos funcionais** — um por funcionalidade do MVP (cadastro/login, perfil, registrar lançamento, extrato/saldo, tags).
- [ ] Liste **3 requisitos não funcionais** (ex.: o extrato precisa carregar rápido mesmo com muitos lançamentos, layout responsivo, senha nunca aparece em texto puro na tela).`
    },
    {
      titulo: 'Entidades e atributos',
      corpo: `
**Entidade** é algo do mundo real que vira tabela; **atributo** é uma característica dela, que vira coluna.

### Faça

Liste os atributos de cada entidade:

- [ ] **Usuário** — nome, turma, foto, usuário, senha.
- [ ] **Lançamento** — descrição, valor, tipo (receita ou despesa), data.
- [ ] **Tag** — nome (ex.: "mercado", "transporte", "lazer", "salário").`
    },
    {
      titulo: 'Relacionamentos e cardinalidade',
      corpo: `
Cardinalidade descreve quantos registros de uma entidade se relacionam com quantos de outra (1:N, N:N).

### Faça

- [ ] Defina: um **Usuário** pode ter quantos **Lançamentos**?
- [ ] Defina: um **Lançamento** pode ter quantas **Tags**? E uma **Tag** pode estar em quantos **Lançamentos** diferentes? (pense bem nessa — não é a mesma resposta da pergunta anterior!)`
    },
    {
      titulo: 'Chave primária e chave estrangeira',
      corpo: `
A **chave primária** identifica um registro de forma única; a **chave estrangeira** cria o link entre duas tabelas. Quando duas entidades se relacionam N:N (muitos-pra-muitos), como Lançamento e Tag, é preciso uma **tabela de junção** no meio, com uma FK pra cada lado.

### Faça

- [ ] Marque a **PK** de cada uma das 3 entidades (Usuário, Lançamento, Tag).
- [ ] Marque a FK: Lançamento → Usuário.
- [ ] Desenhe a tabela de junção **LancamentoTag**, com 2 FKs: uma pra Lançamento, outra pra Tag.`
    },
    {
      titulo: 'Desenhar o DER',
      corpo: `
O Diagrama de Entidade-Relacionamento (**DER/MER**) é o "mapa" visual do banco de dados antes de criar qualquer tabela.

### Faça

1. Desenhe o DER do FinancApp, com as 4 "tabelas" (Usuário, Lançamento, Tag, LancamentoTag), atributos, PK/FK e cardinalidade — use Canva, draw.io ou dbdiagram.io.
2. Exporte como imagem.
3. Salve como ¤docs/der.png¤ no repositório ¤financapp-seuusuario¤.
4. Faça commit + push.`
    },
    {
      titulo: 'Checklist final antes do visto',
      corpo: `
Confira antes de chamar o professor:

- [ ] 5 requisitos funcionais + 3 não funcionais listados.
- [ ] Entidades Usuário/Lançamento/Tag com atributos definidos.
- [ ] Cardinalidade Usuário→Lançamento (1:N) e Lançamento↔Tag (N:N) definida.
- [ ] PK/FK marcadas, incluindo a tabela de junção LancamentoTag.
- [ ] DER desenhado, exportado e commitado em ¤docs/der.png¤.

Quando tudo estiver certo, avance e peça o visto — é isso que libera a próxima peça do projeto, em Banco de Dados.`
    }
  ];

  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null'); } catch (e) { return null; }
  }
  function saveProgress(data) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(data)); }

  function loadStepIndex() {
    try {
      const n = parseInt(localStorage.getItem(STEP_KEY), 10);
      return Number.isInteger(n) && n >= 0 && n <= STEPS.length ? n : 0;
    } catch (e) { return 0; }
  }
  function saveStepIndex(i) { try { localStorage.setItem(STEP_KEY, String(i)); } catch (e) {} }

  const savedProgress = loadProgress();
  let currentIndex = (savedProgress && savedProgress.completed) ? STEPS.length : loadStepIndex();

  const stepWrap = document.getElementById('stepWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');
  lblStepTotal.textContent = STEPS.length + 1;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de modelagem-dados-requisitos-trabalho.html.
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('projeto_financapp_modelagem_trabalho', label, { step: currentIndex + 1, total: STEPS.length + 1 });
    }
  }

  function renderNav(showBack, showNext) {
    return `
      <div class="ab-nav">
        ${showBack ? '<button class="btn btn-secondary" id="btnBack">← Voltar</button>' : '<span></span>'}
        <span class="ab-nav-dica">use ← → do teclado</span>
        ${showNext ? '<button class="btn" id="btnNext">Próximo →</button>' : '<span></span>'}
      </div>`;
  }

  // Direção da última troca de etapa (1 = avançou, -1 = voltou) pra animação.
  let direcao = 1;
  function irPara(i) {
    direcao = i < currentIndex ? -1 : 1;
    currentIndex = Math.max(0, Math.min(i, STEPS.length));
    renderStep();
  }
  // Volta o scroll pro topo e anima a entrada do cartão novo.
  function mostrarEtapa() {
    document.getElementById('palco').scrollTop = 0;
    window.AulaBase.transicao(stepWrap.querySelector('.ab-cartao'), direcao);
  }
  // Setas do teclado = os botões Voltar/Próximo da tela (se existirem).
  window.AulaBase.teclado({
    proximo: () => { const b = document.getElementById('btnNext'); if (b) b.click(); },
    anterior: () => { const b = document.getElementById('btnBack'); if (b) b.click(); },
  });

  function renderStep() {
    if (currentIndex >= STEPS.length) { renderVisto(); return; }
    saveStepIndex(currentIndex);

    const pct = Math.round((currentIndex / STEPS.length) * 100);
    progressFill.style.width = Math.min(pct, 100) + '%';
    lblStepNum.textContent = currentIndex + 1;

    const step = STEPS[currentIndex];
    reportStep(`Trabalho — ${step.titulo}`);
    // As classes antigas (card, md-body, visto-box) continuam junto das .ab-*
    // só como ganchos dos testes (tests/projeto-financapp-*.spec.js etc.) — sem CSS.
    stepWrap.innerHTML = `
      <article class="ab-cartao card">
        <div class="ab-cartao-etapa">Etapa ${currentIndex + 1} de ${STEPS.length + 1}</div>
        <h2>${escapeHtml(step.titulo)}</h2>
        <div class="ab-conteudo md-body">${mdToHtml(step.corpo)}</div>
      </article>
      ${renderNav(currentIndex > 0, true)}
    `;
    // Código com Copiar e checklist clicável (lembra o que já foi marcado nesta etapa).
    window.AulaBase.decorar(stepWrap, { chaveChecklist: `projeto_financapp_modelagem_trabalho_check_${username}_${currentIndex}` });
    mostrarEtapa();
    const btnBack = document.getElementById('btnBack');
    if (btnBack) btnBack.addEventListener('click', () => irPara(currentIndex - 1));
    document.getElementById('btnNext').addEventListener('click', () => irPara(currentIndex + 1));
  }

  function renderVisto() {
    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length + 1;
    reportStep('Trabalho — Visto do professor');

    const already = loadProgress();
    if (already && already.completed) {
      const quando = already.vistoEm ? new Date(already.vistoEm).toLocaleString('pt-BR') : '';
      stepWrap.innerHTML = `
        <div class="ab-cartao ab-concluida card visto-box">
          <h2>✅ Atividade concluída</h2>
          <p>Visto dado por <b>${escapeHtml(already.vistoPor || '')}</b>${quando ? ' em ' + escapeHtml(quando) : ''}.</p>
          <p>A próxima peça do projeto FinancApp (Banco de Dados) já pode ser liberada pelo professor.</p>
        </div>
        ${renderNav(true, false)}
      `;
      mostrarEtapa();
      document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));
      return;
    }

    stepWrap.innerHTML = `
      <div class="ab-cartao card visto-box">
        <div class="ab-cartao-etapa">Etapa ${STEPS.length + 1} de ${STEPS.length + 1}</div>
        <h2>🧑‍🏫 Etapa final — Visto do professor</h2>
        <div class="ab-conteudo">
        <p>Seu repositório <code>financapp-seuusuario</code> já está com o <code>docs/der.png</code> commitado, junto dos requisitos, entidades/atributos, cardinalidade e chaves documentados?</p>
        <p>Chame o professor pra conferir. Quando ele confirmar, peça o token de professor (Gestão → "Token — Dar Visto / Pular Etapa") e digite abaixo — é assim que a atividade é marcada como concluída.</p>
        </div>
        <div class="ab-form">
          <label>Token do professor
            <input type="text" id="vistoToken" inputmode="numeric" maxlength="6" autocomplete="off">
          </label>
          <button class="btn" id="btnDarVisto">Dar visto</button>
          <div class="ab-msg" id="vistoMsg" style="display:none;"></div>
        </div>
      </div>
      ${renderNav(true, false)}
    `;
    mostrarEtapa();
    document.getElementById('btnBack').addEventListener('click', () => irPara(STEPS.length - 1));

    const btnDarVisto = document.getElementById('btnDarVisto');
    const vistoMsg = document.getElementById('vistoMsg');
    btnDarVisto.addEventListener('click', async () => {
      const t = document.getElementById('vistoToken').value;
      vistoMsg.style.display = 'none';
      if (!t) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Informe o token do professor.';
        vistoMsg.style.display = 'block';
        return;
      }
      btnDarVisto.disabled = true;
      btnDarVisto.textContent = 'Verificando...';
      try {
        const result = window.PortalProfessorVisto
          ? await window.PortalProfessorVisto.verificarToken(t)
          : { ok: false, erro: 'Verificação indisponível nesta tela.' };
        if (!result.ok) {
          vistoMsg.className = 'ab-msg erro';
          vistoMsg.textContent = result.erro;
          vistoMsg.style.display = 'block';
          btnDarVisto.disabled = false;
          btnDarVisto.textContent = 'Dar visto';
          return;
        }
        saveProgress({ completed: true, vistoPor: result.nome, vistoEm: new Date().toISOString() });
        renderVisto();
      } catch (e) {
        vistoMsg.className = 'ab-msg erro';
        vistoMsg.textContent = 'Erro inesperado ao verificar. Tente de novo.';
        vistoMsg.style.display = 'block';
        btnDarVisto.disabled = false;
        btnDarVisto.textContent = 'Dar visto';
      }
    });
  }

  // Gabarito aqui é o checklist de critérios pro professor conferir o DER e
  // os requisitos commitados no repositório GitHub do aluno.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Projeto FinancApp — Modelagem de Dados e Requisitos — Checklist de correção',
      subtitle: 'Trabalho (DER real, commitado no GitHub) · Modelagem de Sistemas 1 · Turma Sistemas',
      items: [
        { number: 1, title: 'Requisitos', prompt: 'Os requisitos foram listados?', answer: '5 requisitos funcionais (um por funcionalidade do MVP) e 3 não funcionais (ex.: desempenho do extrato, layout responsivo, senha protegida).' },
        { number: 2, title: 'Entidades e atributos', prompt: 'As 3 entidades estão completas?', answer: 'Usuário (nome, turma, foto, usuário, senha), Lançamento (descrição, valor, tipo, data), Tag (nome).' },
        { number: 3, title: 'Cardinalidade e chaves', prompt: 'A modelagem está correta?', answer: 'Usuário 1:N Lançamento; Lançamento N:N Tag (via tabela de junção LancamentoTag); PK em cada entidade; FK Lançamento→Usuário e as 2 FKs de LancamentoTag.' },
        { number: 4, title: 'DER commitado', prompt: 'O arquivo existe no repositório?', answer: '`docs/der.png` presente no repositório `financapp-<usuario>`, com as 4 "tabelas" (Usuário, Lançamento, Tag, LancamentoTag), atributos, PK/FK e cardinalidade visíveis no diagrama.' }
      ],
      fileName: 'projeto-financapp-modelagem-checklist.txt'
    });
  };

  renderStep();
</script>
<script src="../../../shared/vlibras-widget.js"></script>
</body>
</html>
