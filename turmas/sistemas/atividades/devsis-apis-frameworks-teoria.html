<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Ferramentas, APIs e Frameworks: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --green:#3aa0ff; --green-dim:#2b6ba3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#d6e2ec; --ink-dim:#6c8698;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050a10;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(58,160,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(58,160,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:8px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--yellow); white-space:pre;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(58,160,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,91,77,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04150c; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(58,160,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  /* Celular: deixa a página rolar em vez de prender tudo numa tela só, e
     tira padding/borda que só rouba espaço útil numa tela pequena. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'devsis_apis_frameworks_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

<div class="env">
  <div class="topbar">
    <div>DEV SISTEMAS — CENTRAL DE SISTEMAS (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">14</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const STEPS = [
    {
      story: 'Olá! Eu sou o <b>Bit</b>, mentor de código da Central de Sistemas. Antes dos chamados de verdade, vamos revisar o ferramental do dia a dia. Primeiro: o <b>VS Code</b>, editor de código com extensões (plugins pra cada linguagem/ferramenta), temas visuais e um <b>terminal integrado</b> — tudo sem sair do editor.',
      question: {
        prompt: 'Você precisa rodar um comando Git enquanto edita um arquivo, sem perder o contexto do que estava fazendo. O que o VS Code oferece pra isso ser feito sem trocar de janela/programa?',
        options: [
          'Um terminal integrado ao próprio editor',
          'Um tema visual diferente',
          'A opção de salvar o arquivo automaticamente',
          'Nenhum recurso — sempre é preciso abrir outro programa'
        ],
        correctIndex: 0,
        explanation: 'Um terminal integrado deixa o fluxo de trabalho mais rápido — você roda comandos sem sair do contexto do editor.'
      }
    },
    {
      story: 'Todo projeto sério usa um <b>repositório Git local</b>: um histórico de versões do código, guardado no seu próprio computador antes (ou além) de subir pra um serviço remoto. Cada mudança significativa vira um "commit" — um ponto no tempo que você pode voltar se precisar.',
      question: {
        prompt: 'Você quebrou uma funcionalidade que funcionava perfeitamente ontem, e quer voltar o código pro estado de ontem. O que te permite fazer isso?',
        options: [
          'O histórico de commits guardado no repositório Git',
          'Reinstalar o editor de código',
          'Recompilar o projeto do zero',
          'Não tem como — mudanças antigas se perdem sempre'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo — Git rastreia o histórico de mudanças do código, essencial pra trabalho em equipe e pra desfazer erros.'
      }
    },
    {
      story: 'Linguagens <b>compiladas</b> precisam de uma etapa de <b>compilação</b> (transformar código-fonte em algo executável) antes de rodar. Linguagens <b>interpretadas</b>, como JavaScript, rodam direto — por isso ferramentas como o <b>CodePen</b> mostram o resultado instantaneamente, sem build.',
      question: {
        prompt: 'Você escreve um trecho de JavaScript no CodePen e o resultado já aparece na tela, sem nenhuma etapa de build antes. Por que isso é possível?',
        options: [
          'Porque JavaScript é interpretada — o código roda direto, sem precisar compilar antes',
          'Porque o CodePen ignora erros de sintaxe',
          'Porque só linguagens compiladas mostram resultado visual',
          'Porque JavaScript não é uma linguagem de programação de verdade'
        ],
        correctIndex: 0,
        explanation: 'Exato — compilar transforma o código em algo executável antes da execução; interpretar executa o código diretamente, linha a linha.'
      }
    },
    {
      story: 'Quando um bug é difícil de achar só lendo o código, usamos <b>breakpoints</b>: marcamos uma linha pra a execução PAUSAR ali, e então inspecionamos o valor de cada variável naquele momento exato — muito mais preciso que espalhar <code>console.log</code> por todo lado.',
      question: {
        prompt: 'Um bug só aparece depois de várias chamadas de função, e espalhar console.log pelo código não está ajudando a entender o que houve. Qual recurso permite pausar a execução numa linha exata e inspecionar as variáveis naquele momento?',
        options: [
          'Um breakpoint',
          'Apagar a função suspeita',
          'Rodar o programa mais rápido',
          'Comentar todo o código'
        ],
        correctIndex: 0,
        explanation: 'Isso! O breakpoint congela a execução naquele ponto, permitindo examinar o estado exato do programa.'
      }
    },
    {
      story: 'Nomear bem variáveis, funções e classes facilita MUITO a leitura do código. As convenções mais comuns: <b>camelCase</b> (<code>nomeVariavel</code>) pra variáveis/funções, <b>PascalCase</b> (<code>NomeClasse</code>) pra classes/componentes, e <b>snake_case</b> (<code>nome_variavel</code>) usado em algumas linguagens/contextos.',
      question: {
        prompt: 'Um componente chamado "UserProfile" tem a primeira letra de CADA palavra em maiúscula, sem underline nem hífen entre elas. Que convenção de nomenclatura é essa?',
        options: ['PascalCase', 'camelCase', 'snake_case', 'kebab-case'],
        correctIndex: 0,
        explanation: 'Correto! PascalCase (primeira letra de cada palavra maiúscula, sem separador) é o padrão pra nomes de classes e componentes.'
      }
    },
    {
      story: 'Além de nomear bem, uma <b>indentação</b> (recuo) consistente mostra visualmente onde cada bloco de código começa e termina — essencial em blocos aninhados (um <code>if</code> dentro de outro <code>if</code>, por exemplo). Editores como o VS Code ajudam a manter isso automático.',
      question: {
        prompt: 'Um código com vários "if" aninhados, mas sem nenhum recuo entre eles, fica quase impossível de acompanhar visualmente onde cada bloco começa e termina. O que resolveria esse problema?',
        options: [
          'Aplicar uma indentação consistente entre os blocos',
          'Fazer o código rodar mais rápido',
          'Nada — é só uma questão estética, sem impacto real',
          'Remover as chaves { } do código'
        ],
        correctIndex: 0,
        explanation: 'Isso! Indentação consistente é um guia visual da estrutura do código — fundamental pra entender blocos aninhados rapidamente.'
      }
    },
    {
      story: 'Antes de uma mudança entrar oficialmente no projeto, é comum passar por <b>Peer Review</b> (revisão por pares): outra pessoa da equipe lê o código no repositório e aponta problemas, sugestões ou aprova — pegando bugs e compartilhando conhecimento antes de virar problema em produção.',
      question: {
        prompt: 'Antes de uma mudança entrar oficialmente no projeto, um colega lê o código no repositório e aponta um bug que passou despercebido pelo autor. Que prática de equipe é essa, e qual seu principal benefício?',
        options: [
          'Peer Review — pega bugs e espalha conhecimento antes da mudança entrar no projeto',
          'Apenas deixa o código visualmente mais bonito, sem outro efeito',
          'É uma etapa burocrática sem propósito real',
          'Serve só pra aumentar artificialmente o número de commits'
        ],
        correctIndex: 0,
        explanation: 'Exato! Peer review é uma camada de qualidade: outra pessoa encontra o que passou despercebido, e todo mundo aprende com o código do outro.'
      }
    },
    {
      story: 'Chegou a parte de conectar sistemas: uma <b>API</b> (Interface de Programação de Aplicações) é o "cardápio" que um sistema oferece pra outros pedirem dados ou ações. A maioria das APIs modernas troca dados no formato <b>JSON</b> — um jeito de organizar informação em objetos (<code>{ }</code>) e listas (<code>[ ]</code>), fácil de ler tanto por humanos quanto por código.',
      question: {
        prompt: 'Você consome uma API e recebe uma resposta organizada em objetos <code>{ }</code> e listas <code>[ ]</code>, fácil de ler tanto por humano quanto por código. Qual formato é esse, o mais comum entre APIs modernas?',
        options: ['JSON', 'Apenas XML', 'Texto puro sem estrutura nenhuma', 'Apenas imagens'],
        correctIndex: 0,
        explanation: 'Correto! JSON é o formato mais comum hoje pra troca de dados entre sistemas — leve e fácil de interpretar.'
      }
    },
    {
      story: 'Consumir uma API pública geralmente significa: pedir os dados, receber uma resposta em JSON, e então exibir isso de forma útil — seja um log no terminal, uma lista na tela do navegador, ou um <b>dashboard</b> (painel visual que resume os dados em gráficos/números destacados).',
      question: {
        prompt: 'Depois de consumir uma API de vendas, o time monta uma tela com gráficos e números destacados que resumem os dados, em vez de mostrar o JSON cru. Como se chama esse tipo de painel visual?',
        options: [
          'Dashboard',
          'O nome de uma API específica',
          'Um tipo de banco de dados',
          'Um comando do terminal'
        ],
        correctIndex: 0,
        explanation: 'Isso! Um dashboard transforma dados brutos (como um JSON de uma API) numa visualização fácil de entender rapidamente.'
      }
    },
    {
      story: 'Em vez de programar tudo do zero, usamos <b>bibliotecas de terceiros</b>: pacotes de código pronto que resolvem um problema específico (formatar datas, desenhar gráficos, etc.). É preciso pesquisar, escolher e <b>gerenciar</b> essas dependências no projeto — sem exagerar (cada biblioteca extra é mais código pra manter atualizado).',
      question: {
        prompt: 'Em vez de programar do zero uma função pra formatar datas, você instala um pacote pronto que já resolve isso. Qual a vantagem principal dessa abordagem?',
        options: [
          'Resolve um problema comum sem reinventar a roda, economizando tempo',
          'Deixa o projeto automaticamente mais seguro',
          'Elimina a necessidade de testar o código',
          'É sempre gratuito e sem manutenção'
        ],
        correctIndex: 0,
        explanation: 'Exato! Bibliotecas prontas evitam retrabalho — mas ainda exigem pesquisa e gerenciamento consciente (nem toda dependência vale a pena).'
      }
    },
    {
      story: 'Um <b>framework</b> vai um passo além de uma biblioteca: ele define uma <b>estrutura geral</b> pro seu projeto (como organizar pastas, como as peças se conectam), e você constrói DENTRO dessa estrutura — diferente de uma biblioteca, que você só chama quando precisa de uma função específica.',
      question: {
        prompt: 'Um framework obriga você a organizar as pastas do projeto do jeito dele; já uma biblioteca de formatação de datas você só chama quando precisa, sem mudar nada da estrutura do projeto. Qual é essa diferença fundamental entre os dois?',
        options: [
          'O framework define a estrutura geral do projeto (você se encaixa nele); a biblioteca você chama quando precisa',
          'Não existe diferença nenhuma entre os dois, são só nomes diferentes pra mesma coisa',
          'Framework é sempre mais lento de rodar do que qualquer biblioteca equivalente',
          'Biblioteca só funciona numa linguagem de programação específica, framework não'
        ],
        correctIndex: 0,
        explanation: 'Isso! Frameworks moldam a arquitetura do projeto inteiro; bibliotecas são ferramentas pontuais que você invoca quando precisa.'
      }
    },
    {
      story: 'Frameworks modernos costumam ter uma <b>CLI</b> (interface de linha de comando) pra iniciar um projeto novo já com a estrutura de pastas pronta — o chamado <b>scaffold</b> (esqueleto inicial). Isso evita montar tudo manualmente do zero.',
      question: {
        prompt: 'Ao rodar o comando de criação de projeto de um framework, ele já entrega pastas, arquivos de configuração e uma estrutura básica prontos — sem você montar nada manualmente. Como se chama esse esqueleto inicial?',
        options: [
          'Scaffold',
          'Um tipo de banco de dados',
          'O nome do servidor de produção',
          'Um comando pra apagar o projeto'
        ],
        correctIndex: 0,
        explanation: 'Correto! O scaffold é o "esqueleto" inicial do projeto — pastas, arquivos de configuração e estrutura básica, gerados automaticamente.'
      }
    },
    {
      story: 'Frameworks modernos de interface trabalham com <b>componentes</b>: pedaços reutilizáveis de tela (um botão, um cartão, um formulário) que você monta como blocos de LEGO. Cada componente tem um <b>ciclo de vida</b> — é criado (montado), pode ser atualizado várias vezes, e eventualmente é removido (desmontado) da tela.',
      question: {
        prompt: 'Um botão "Confirmar" é reaproveitado em 5 telas diferentes do mesmo app, sempre com a mesma aparência e comportamento, sem duplicar código. O que ele representa, num framework moderno de interface?',
        options: [
          'Um componente — pedaço reutilizável de tela',
          'Um arquivo de configuração do projeto',
          'Um tipo de banco de dados',
          'Um comando de terminal'
        ],
        correctIndex: 0,
        explanation: 'Isso! Componentes são blocos reutilizáveis de interface — a peça fundamental de frameworks modernos como React, Vue e Angular.'
      }
    },
    {
      story: 'Por fim, aplicações com várias "telas" usam <b>rotas</b>: cada URL (ex: <code>/perfil</code>, <code>/configuracoes</code>) é mapeada pra um componente/página específico, permitindo navegar dentro do app sem recarregar tudo do zero a cada clique. Com isso, você já tem o panorama completo das ferramentas e conceitos do dia a dia de desenvolvimento!',
      question: {
        prompt: 'Ao clicar num link pra "/perfil", a tela muda pro componente de perfil sem recarregar a página inteira do zero. O que faz esse mapeamento entre a URL e o componente certo?',
        options: [
          'O sistema de rotas da aplicação',
          'A velocidade da conexão com a internet',
          'O banco de dados do sistema',
          'A etapa de compilação do projeto'
        ],
        correctIndex: 0,
        explanation: 'Exato! O sistema de rotas conecta URLs a telas específicas — a base da navegação em qualquer aplicação com múltiplas páginas.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Dev Sistemas — Ferramentas, APIs e Frameworks',
      subtitle: 'Aula Teórica · Trilha APIs, Bibliotecas e Frameworks · Turma Sistemas',
      capacidade: 'Aplicar linguagem de programação por meio de apis, bibliotecas, frameworks na construção de rotinas de software.',
      steps: STEPS,
      fileName: 'devsis-apis-frameworks-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Sistemas: Ferramentas e APIs" no Axis para os alunos resolverem chamados de verdade.'
    });
  };

  // Mesmo esquema do generateSlidesForGestao acima: exposto sempre pra a aba
  // "Gestão" poder chamar remotamente, num iframe oculto, e baixar um .txt
  // com pergunta + resposta esperada de cada etapa — sem o professor precisar
  // decorar as respostas ou abrir o módulo pra conferir.

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Dev Sistemas — Ferramentas, APIs e Frameworks',
      subtitle: 'Aula Teórica · Trilha APIs, Bibliotecas e Frameworks · Turma Sistemas',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'devsis-apis-frameworks-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "devsis_apis_frameworks_teoria",
    steps: STEPS,
    reportLabel: "Dev Sistemas — Ferramentas e APIs",
    mentor: { rowClass: "eri", avatar: "🧑‍💻", name: "Bit, Mentor de Código" },
    finishPassed: {
      title: "Ferramentas, APIs e Frameworks concluídos!",
      introHtml: "<p>Você já conhece VS Code, Git, debugging, convenções de nomenclatura, peer review, APIs/JSON, bibliotecas, frameworks, CLI scaffold, componentes e rotas.</p>",
      closingHtml: "<p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Sistemas.</p>",
      restartLabel: "🔁 Rever a teoria"
    }
  });
</script>
