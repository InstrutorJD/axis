<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Compilação e Depuração: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --green:#3aa0ff; --green-dim:#2b6ba3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#d6e2ec; --ink-dim:#6c8698;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050a10;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(58,160,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(58,160,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:8px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--yellow); white-space:pre;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(58,160,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,91,77,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04150c; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(58,160,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>

<body>

<div class="env">
  <div class="topbar">
    <div>PROGRAMAÇÃO DE APLICATIVOS — CENTRAL DE SISTEMAS (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">15</span></span>

<script>
  const STEPS = [
    {
      story: 'Nem todo problema no código avisa que existe. Um <b>erro de sintaxe</b> (ex.: esquecer um parêntese) impede o código de sequer rodar. Um <b>erro de execução</b> (ex.: chamar uma função que não existe) quebra o programa NO MEIO da execução. Mas o mais traiçoeiro é o <b>erro de lógica</b>: o código roda inteiro, sem travar nada — só que devolve o resultado ERRADO.',
      question: {
        prompt: 'Uma função calcula o troco de uma compra, roda sem nenhum erro no console, mas devolve um valor incorreto. Que tipo de erro é esse?',
        options: [
          'Erro de lógica',
          'Erro de sintaxe',
          'Erro de execução',
          'Não é um erro, é o comportamento normal'
        ],
        correctIndex: 0,
        explanation: 'Isso! Como o código roda sem travar, mas o resultado sai errado, é um erro de LÓGICA — o mais difícil de perceber, porque nada "quebra" pra avisar.'
      }
    },
    {
      story: 'Erro de sintaxe é o mais fácil de perceber: o próprio ambiente recusa RODAR o código e aponta a linha do problema — geralmente algo como parênteses ou chaves que não foram fechados.',
      question: {
        prompt: 'Um aluno esquece de fechar uma chave <code>{</code> ao escrever uma função e tenta rodar o arquivo. O que acontece?',
        options: [
          'O programa nem chega a rodar — o erro aparece antes de qualquer execução',
          'O programa roda normalmente até o fim, sem nenhum aviso',
          'O programa roda, mas só ignora a função com problema',
          'Nada acontece — o erro só aparece na próxima vez que o arquivo for aberto'
        ],
        correctIndex: 0,
        explanation: 'Exato! Erro de sintaxe barra a execução logo de cara — o código sequer chega a começar a rodar.'
      }
    },
    {
      story: 'Um erro de execução muito comum: usar uma variável com o nome ERRADO — seja por causa de um texto sem aspas (o JavaScript tenta achar essa palavra como se fosse uma variável), seja por confundir maiúscula com minúscula (JavaScript diferencia "nome" de "Nome"). Nos dois casos, o resultado é o mesmo: <code>ReferenceError</code>, a variável não existe.',
      question: {
        prompt: 'No trecho <code>let cidade = Recife;\nconsole.log(cidade);</code>, por que esse código quebra ao rodar?',
        options: [
          '"Recife" está sem aspas — vira nome de variável',
          'O nome da variável "cidade" está escrito errado',
          'Falta um ponto e vírgula no final da primeira linha',
          'Esse código roda normalmente, sem nenhum erro'
        ],
        correctIndex: 0,
        explanation: 'Isso! Sem aspas, "Recife" vira o NOME de uma variável que ninguém declarou — daí o erro. Com aspas ("Recife"), vira um texto de verdade.'
      }
    },
    {
      story: '<b>Depurar</b> (debugar) não é só "trocar linhas até o erro sumir" — é o processo de ENTENDER por que o código está se comportando diferente do esperado, achar a causa raiz, e só então corrigir. Mudar código no escuro, sem entender o motivo, costuma trocar um bug por outro.',
      question: {
        prompt: 'Um desenvolvedor vai mudando linhas ao acaso até o erro sumir da tela, sem entender por que aquilo resolveu. Isso é depurar de verdade?',
        options: [
          'Não — exige entender a causa raiz do problema',
          'Sim, o objetivo é só fazer o erro sumir, não importa como',
          'Sim, sempre que o programa "roda" o processo terminou',
          'Depurar e testar por tentativa e erro são a mesma coisa'
        ],
        correctIndex: 0,
        explanation: 'Isso! Sem entender a causa, a "correção" pode só estar escondendo o problema — ele volta (ou aparece outro) mais tarde.'
      }
    },
    {
      story: 'Antes de partir pra prática, vale revisar 5 pontos de sintaxe que costumam esconder erros de lógica — são exatamente os tipos de bug que você vai caçar nos próximos desafios. O primeiro: <code>=</code> ATRIBUI um valor a uma variável; <code>==</code>, <code>===</code>, <code>&gt;</code> e <code>&gt;=</code> COMPARAM dois valores. Confundir os dois é um dos erros mais comuns — e mais traiçoeiros, porque o código continua rodando sem travar.',
      question: {
        prompt: 'No trecho <code>if (nota = 10) { aprovado = true; }</code>, o que esse código realmente faz, em vez de comparar se nota é igual a 10?',
        options: [
          'Atribui o valor 10 e o if quase sempre entra',
          'Compara se nota é realmente igual a 10',
          'Gera um erro de sintaxe, o código nem roda',
          'Não faz nada — a linha inteira é ignorada'
        ],
        correctIndex: 0,
        explanation: 'Isso! <code>=</code> atribui — o resultado da atribuição é o próprio valor (10), que o if trata como "verdadeiro", então o bloco quase sempre roda, não importa o que nota tinha antes.'
      }
    },
    {
      story: 'Segundo ponto: dentro de um <code>switch</code>, depois que um <code>case</code> é escolhido, a execução CONTINUA rodando os próximos <code>case</code> também, um atrás do outro — só um <code>break;</code> interrompe essa sequência. Esquecer o <code>break</code> é um bug clássico de switch.',
      question: {
        prompt: 'Sem nenhum break, no trecho <code>switch (x) { case 1: y = "um"; case 2: y = "dois"; default: y = "outro"; }</code>, se x for 1, qual é o valor final de y?',
        options: [
          '"outro" — a execução cai em todos os cases até o fim',
          '"um" — só o case escolhido chega a rodar',
          '"dois" — o switch pula direto pro segundo case',
          'Nenhum — falta de break quebra o código'
        ],
        correctIndex: 0,
        explanation: 'Exato! Sem break, depois de entrar no case 1 a execução continua pros próximos também, sobrescrevendo y até chegar no fim do switch.'
      }
    },
    {
      story: 'Terceiro ponto: os parâmetros de uma função são preenchidos pela POSIÇÃO em que os argumentos são passados, não pelo nome. Chamar <code>funcao(a, b)</code> não é o mesmo que <code>funcao(b, a)</code> — trocar a ordem muda o resultado sempre que a operação não é comutativa.',
      question: {
        prompt: 'Dada a função <code>function subtrair(a, b) { return a - b; }</code>, qual é a diferença entre chamar <code>subtrair(10, 3)</code> e <code>subtrair(3, 10)</code>?',
        options: [
          'O resultado muda (7 e -7) — a ordem dos argumentos importa',
          'O resultado é sempre igual, JavaScript reordena sozinho',
          'A segunda chamada gera erro, por inverter a ordem',
          'Só a primeira chamada é considerada válida'
        ],
        correctIndex: 0,
        explanation: 'Isso! Cada argumento preenche o parâmetro daquela posição — inverter a ordem muda completamente o resultado quando a operação (como subtração ou divisão) não é comutativa.'
      }
    },
    {
      story: 'Quarto ponto: numa cadeia de <code>if / else if / else if</code>, o JavaScript testa as condições NA ORDEM escrita e para na PRIMEIRA que for verdadeira — mesmo que uma condição mais abaixo também fosse verdadeira. Por isso, condições que se sobrepõem precisam vir da mais restritiva pra mais ampla.',
      question: {
        prompt: 'No trecho <code>if (nota >= 0) resultado = "valido"; else if (nota >= 5) resultado = "aprovado";</code>, para nota igual a 8, qual é o valor final de resultado?',
        options: [
          '"valido" — a primeira condição já captura o caso',
          '"aprovado" — a condição mais específica vence',
          'As duas rodam, e o valor final vira "aprovado"',
          'Nenhuma roda, pois nota é maior que cinco'
        ],
        correctIndex: 0,
        explanation: 'Isso! Como "nota >= 0" já é verdadeiro pra 8, o else if seguinte nunca chega a ser testado — por isso a ordem, da mais restritiva pra mais ampla, evita esse bloco "inalcançável".'
      }
    },
    {
      story: 'Quinto e último ponto: operadores de comparação parecem parecidos, mas incluem limites diferentes. <code>&gt;</code> (maior que) EXCLUI o valor exato do limite; <code>&gt;=</code> (maior ou igual) INCLUI esse valor. Trocar um pelo outro é um erro sutil — o código roda normalmente, só erra bem na borda.',
      question: {
        prompt: 'Uma regra diz que a nota 6, exatamente, já conta como aprovação. Qual comparação representa essa regra corretamente pra uma variável nota?',
        options: [
          'nota >= 6',
          'nota > 6',
          'nota == 7',
          'nota <= 6'
        ],
        correctIndex: 0,
        explanation: 'Isso! Como o próprio 6 já conta como aprovado, a comparação precisa incluir esse valor — por isso >=, e não apenas >.'
      }
    },
    {
      story: 'O <b>PixelCode</b> é o editor de JavaScript do próprio portal: um editor de código de um lado e um console do outro, direto no navegador — sem precisar instalar nada na sua máquina. Ele abre no botão <b>"💻 PixelCode"</b>, no topo do portal.',
      question: {
        prompt: 'Um aluno quer testar um código sem instalar editor, compilador nem nada, só usando o que o portal já oferece. Que ferramenta resolve isso?',
        options: [
          'O PixelCode, aberto pelo botão no topo do portal',
          'Um editor de texto qualquer, sem nenhuma configuração',
          'Isso só é possível instalando um programa na máquina',
          'Um aplicativo de celular específico pra cada linguagem'
        ],
        correctIndex: 0,
        explanation: 'Isso! O PixelCode entrega um editor completo com console, no navegador, sem instalar nada — só clicar no botão no topo do portal.'
      }
    },
    {
      story: 'Pra abrir o PixelCode: no topo do portal, clique no botão <b>"💻 PixelCode"</b> — ele abre numa aba nova, já com um editor pronto pra escrever JavaScript.',
      question: {
        prompt: 'Um colega nunca abriu o PixelCode e não sabe por onde começar. Por onde ele deve procurar?',
        options: [
          'No botão "💻 PixelCode", no topo do portal',
          'No menu de configurações da própria conta',
          'Isso só é possível pelo aplicativo de celular',
          'Dentro da aba "Perfil" do portal'
        ],
        correctIndex: 0,
        explanation: 'Exato! O botão "💻 PixelCode" fica no topo do portal e abre o editor numa aba nova.'
      }
    },
    {
      story: 'Dentro do PixelCode, digite o código no editor à esquerda e clique em <b>"▶ Executar"</b> (ou Ctrl+Enter) pra rodar. Tudo que o código imprimir com <code>console.log(...)</code> aparece no <b>Console</b>, à direita.',
      question: {
        prompt: 'Você digitou um código no editor do PixelCode e quer rodá-lo pra ver o resultado. O que você faz?',
        options: [
          'Clica em "▶ Executar" (ou usa Ctrl+Enter)',
          'Salva o arquivo e espera o resultado aparecer sozinho',
          'Recarrega a página inteira do portal',
          'Copia o código pra barra de endereço do navegador'
        ],
        correctIndex: 0,
        explanation: 'Isso! O botão "▶ Executar" (ou o atalho Ctrl+Enter) roda o código e manda tudo que os console.log() imprimirem pro Console ao lado.'
      }
    },
    {
      story: 'Quando o resultado sai errado (erro de lógica), rodar de novo do mesmo jeito não ajuda — é hora de <b>depurar de verdade</b>. Como o PixelCode não tem breakpoint, a técnica é outra: espalhe <code>console.log(...)</code> extras entre as linhas do código, pra ver o valor de cada variável NAQUELE ponto exato da execução.',
      question: {
        prompt: 'Uma função devolve um valor errado e você quer ver o que uma variável vale no meio da execução, sem breakpoint disponível. O que você faz?',
        options: [
          'Adiciona um console.log(variavel) logo depois daquele ponto',
          'Só fica olhando o código, sem rodar de novo',
          'Apaga a variável e espera o erro sumir sozinho',
          'Não dá pra investigar isso sem um depurador com breakpoint'
        ],
        correctIndex: 0,
        explanation: 'Isso! Um console.log(variavel) extra, no ponto certo do código, mostra o valor real da variável naquele instante — é a versão "na mão" de olhar um breakpoint.'
      }
    },
    {
      story: 'Quando o código quebra de verdade (erro de sintaxe ou de execução), o PixelCode mostra a mensagem de erro em VERMELHO no Console — o nome do erro, a mensagem e, quando possível, até a linha. Leia essa mensagem com atenção: ela costuma apontar direto pra causa do bug.',
      question: {
        prompt: 'Você rodou um código no PixelCode e o console mostrou uma linha vermelha com "ReferenceError: joao is not defined". O que essa mensagem indica?',
        options: [
          'Um erro de execução: o código usou uma variável que não existe',
          'Um aviso sem importância, que pode ser ignorado',
          'Que o PixelCode travou e precisa recarregar a página',
          'Que o código rodou certo, só demorou mais que o normal'
        ],
        correctIndex: 0,
        explanation: 'Exato! ReferenceError indica que o código tentou usar uma variável (ou nome) que não foi declarada — a mensagem em vermelho já aponta a causa.'
      }
    },
    {
      story: 'Resumindo o fluxo de prática: leia o que o código DEVERIA fazer, rode no PixelCode, compare com o que ele REALMENTE faz e, se estiver errado, leia a mensagem de erro (ou adicione console.log() extras) pra rastrear onde a lógica diverge. Corrija, rode de novo, e só então confirme o valor certo no console. Agora você já sabe o que é compilação, os tipos de erro, e como depurar de verdade no PixelCode!',
      question: {
        prompt: 'Depois de corrigir um bug e rodar o código de novo no PixelCode, qual é o próximo passo antes de responder no portal?',
        options: [
          'Conferir, no console, o valor que o código imprime agora',
          'Responder de cabeça, sem rodar o código outra vez',
          'Apagar todo o código e reescrever tudo do zero',
          'Pular a prática, já que o erro parece corrigido'
        ],
        correctIndex: 0,
        explanation: 'Isso! Só o valor que realmente aparece no console, depois da correção, garante que o bug foi mesmo resolvido — não o que parece "fazer sentido" de cabeça.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Dev Sistemas — Compilação e Depuração',
      subtitle: 'Aula Teórica · Trilha Compilação e Depuração de Código · Turma Sistemas',
      capacidade: 'Identificar erros de acordo com o requisito do programa e linguagem; Utilizar o ambiente de desenvolvimento (IDE) para rastreabilidade do código.',
      steps: STEPS,
      fileName: 'prog-depuracao-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Sistemas: Depuração" no Axis para os alunos corrigirem bugs de verdade, digitando e rodando o código direto na atividade.'
    });
  };

  // Mesmo esquema do generateSlidesForGestao acima: exposto sempre pra a aba
  // "Gestão" poder chamar remotamente, num iframe oculto, e baixar um .txt
  // com pergunta + resposta esperada de cada etapa.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Dev Sistemas — Compilação e Depuração',
      subtitle: 'Aula Teórica · Trilha Compilação e Depuração de Código · Turma Sistemas',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'prog-depuracao-teoria-gabarito.txt'
    });
  };

  window.PortalQuizTeoria.run({
    activityLocation: "prog_depuracao_teoria",
    steps: STEPS,
    reportLabel: "Dev Sistemas — Compilação e Depuração",
    mentor: { rowClass: "eri", avatar: "🧑‍💻", name: "Bit, Mentor de Código" },
    finishPassed: {
