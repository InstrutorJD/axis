<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — IoT: Central de Conectividade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --green:#3aa0ff; --green-dim:#2b6ba3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#d6e2ec; --ink-dim:#6c8698;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050a10;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(58,160,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:200px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--green); color:var(--green); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex-shrink:0; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }

  .ticket-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .ticket-icon{ font-size:26px; line-height:1; }
  .ticket-status{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; padding:3px 8px; border-radius:2px; }
  .ticket-status.pending{ background:rgba(255,91,77,0.15); color:var(--blood-bright); }
  .ticket-status.done{ background:rgba(58,160,255,0.15); color:var(--green); }

  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--green); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:12px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--yellow); }

  .explanation-box{
    background:#050a10; border:1px solid var(--green-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--green); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--yellow); }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--yellow); border:1px solid var(--green-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(224,196,106,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--yellow);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--yellow); }

  .options-panel{ background:var(--panel); border:1px solid var(--line); padding:10px 14px; flex-shrink:0; }
  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(58,160,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,91,77,0.08); opacity:0.6; cursor:not-allowed; }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04150c; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .console{
    background:#060806; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:1; min-height:50px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--green); font-weight:bold; }

  /* Celular/telas estreitas: a barra lateral + painel lado a lado espreme
     demais o conteúdo. Empilha tudo numa coluna só e deixa a página
     inteira rolar, em vez de depender de várias regiões de scroll aninhadas. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'iot_conectividade_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="../../../shared/session.js"></script>
<script src="../../../shared/vendor/supabase.js"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>IOT — CENTRAL DE CAMPO (CONECTIVIDADE)</div>
    <div>RESOLVIDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Chamados</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <div class="ticket-row">
            <div class="ticket-icon" id="ticketIcon">🎫</div>
            <div class="ticket-status pending" id="ticketStatus">PENDENTE</div>
          </div>
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>

          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <div class="options-panel" id="optionsPanel"></div>

        <div class="actions">
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo chamado →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `iot_conectividade_pratica_progress_${username}`;

  const CHALLENGES = [
    {
      id: 1,
      title: 'GPS do drone em voo',
      icon: '🛰️',
      explanation: 'O GPS (junto com GLONASS e Galileo) é recebido direto de satélites em órbita — funciona em praticamente qualquer lugar aberto, sem depender de nenhuma infraestrutura terrestre por perto, exatamente o que o drone precisa pra ficar paradinho no ar sozinho.',
      desc: 'Durante o voo do <b>DJI Mini 4 Pro</b>, ele precisa saber sua posição exata pra ficar paradinho no ar (hover) sozinho, mesmo num campo aberto, longe de qualquer roteador ou torre de celular. Qual tecnologia o drone usa pra isso?',
      hint: 'Pense em qual tecnologia funciona mesmo sem NENHUMA infraestrutura terrestre por perto — a mesma que orienta um GPS de carro.',
      options: ['Conectividade via satélite (GPS/GNSS)', 'WiFi', 'Bluetooth', 'Cabo de rede (Ethernet)'],
      correctIndex: 0
    },
    {
      id: 2,
      title: 'Fone de ouvido do instrutor',
      icon: '🎧',
      explanation: 'Bluetooth (BLE) foi feito exatamente pra isso: curtíssimo alcance entre dois dispositivos próximos, com consumo de energia baixo — ideal pra acessórios pessoais com bateria pequena.',
      desc: 'Antes do voo, o instrutor empareia um fone de ouvido sem fio com o celular pra dar as instruções da aula sem precisar gritar. O fone fica sempre a poucos metros dele e a bateria precisa durar a aula inteira. Qual tecnologia é a mais indicada?',
      hint: 'Curto alcance + baixo consumo de energia — qual das opções tem exatamente esse perfil?',
      options: ['Bluetooth', 'WiFi', 'Conectividade via satélite', 'Rádio AM/FM'],
      correctIndex: 0
    },
    {
      id: 3,
      title: 'Transferir fotos do drone pro celular',
      icon: '📸',
      explanation: 'Com o drone parado e por perto, o WiFi dá a banda necessária pra transferir arquivos de foto/vídeo (que são pesados) rapidamente — o Bluetooth seria lento demais pra isso, e o satélite não faz sentido aqui.',
      desc: 'O <b>Mini 4 Pro</b> já pousou depois do voo. Você quer puxar as fotos e vídeos gravados direto da memória do drone pro celular, sem tirar o cartão de memória. Qual tecnologia de conectividade é a mais indicada nessa hora?',
      hint: 'O drone está parado e por perto — e os arquivos de foto/vídeo são pesados.',
      options: ['WiFi', 'Bluetooth', 'Conectividade via satélite', 'Rádio frequência simples (RF)'],
      correctIndex: 0
    },
    {
      id: 4,
      title: 'Boia oceanográfica',
      icon: '🌊',
      explanation: 'No meio do oceano não existe torre de celular nem roteador — só o satélite tem alcance suficiente pra tirar os dados de lá, mesmo sendo uma transmissão pequena e pouco frequente.',
      desc: 'Uma boia no meio do oceano mede temperatura da água e envia a leitura <b>uma vez por hora</b> pra um servidor em terra. Não existe nenhuma torre ou roteador por perto. Qual tecnologia resolve isso?',
      hint: 'De novo: zero infraestrutura terrestre por perto, e a distância até a terra é enorme.',
      options: ['Conectividade via satélite', 'WiFi', 'Bluetooth', 'Cabo de rede (Ethernet)'],
      correctIndex: 0
    },
    {
      id: 5,
      title: 'Fechadura da sala onde o drone fica guardado',
      icon: '🔐',
      explanation: 'De novo o perfil do Bluetooth (BLE): curtíssimo alcance (só quando o professor está bem perto) e consumo de energia mínimo, essencial pra um dispositivo que funciona a pilha por meses.',
      desc: 'A sala onde o <b>Mini 4 Pro</b> fica guardado tem uma fechadura inteligente que só precisa "conversar" com o smartphone do professor quando ele está a <b>poucos metros da porta</b>, com o menor consumo de energia possível — ela funciona a pilha. Qual tecnologia é a mais indicada?',
      hint: 'Curtíssimo alcance + pilha que precisa durar meses: qual tecnologia já resolveu esse mesmo problema num chamado anterior?',
      options: ['Bluetooth (BLE)', 'WiFi', 'Conectividade via satélite', 'Cabo de rede (Ethernet)'],
      correctIndex: 0
    },
    {
      id: 6,
      title: 'Vídeo e comandos de voo do Mini 4 Pro',
      icon: '🚁',
      explanation: 'O Mini 4 Pro usa o O4 (OcuSync 4), um link de rádio proprietário da DJI: ele usa as mesmas faixas de frequência do WiFi (2,4 GHz e 5,8 GHz), mas com um protocolo próprio, otimizado pra alcançar muito mais longe e resistir muito mais à interferência do que WiFi ou Bluetooth comuns.',
      desc: 'Durante o voo, o controle remoto do <b>DJI Mini 4 Pro</b> precisa enviar comandos e receber vídeo em tempo real do drone, a até <b>20 km</b> de distância e com baixíssimo atraso, mesmo com outras redes WiFi por perto causando interferência. Qual tecnologia resolve isso?',
      hint: 'Não é WiFi doméstico nem Bluetooth — pense numa tecnologia de rádio feita sob medida pra drones, com alcance de quilômetros.',
      options: ['Link de rádio proprietário (DJI O4/OcuSync)', 'WiFi doméstico comum', 'Bluetooth (BLE)', 'Cabo de rede (Ethernet)'],
      correctIndex: 0
    },
    {
      id: 7,
      title: 'Correção de rota de última hora',
      icon: '⚡',
      explanation: 'Latência baixa é o que garante que o comando do piloto chegue no drone a tempo de fazer diferença — banda alta sozinha não resolve se o comando demorar demais pra chegar.',
      desc: 'O piloto precisa desviar o <b>Mini 4 Pro</b> de um obstáculo que apareceu de repente, e o comando do manche precisa chegar no drone quase instantaneamente. Além de banda alta pro vídeo, qual característica do link de rádio é essencial nesse momento?',
      hint: 'Pense no tempo entre "mover o manche" e "o drone reagir" — não em quantos dados cabem por segundo.',
      options: ['Latência baixa (resposta quase instantânea)', 'Maior número de fotos por segundo na câmera', 'Bateria com mais miliamperes', 'Cor da carcaça do drone'],
      correctIndex: 0
    },
    {
      id: 8,
      title: 'Voo perto da escola cheia de WiFi',
      icon: '📡',
      explanation: 'O O4 monitora o espectro de rádio e troca automaticamente de canal/frequência (inclusive pra 5,8 GHz) assim que detecta interferência — sem o piloto precisar fazer nada.',
      desc: 'Pilotando perto do prédio da escola, cheio de roteadores WiFi e celulares na faixa de 2,4 GHz, a imagem do <b>Mini 4 Pro</b> segue estável. Que mecanismo do sistema O4 explica isso?',
      hint: 'O drone não "desliga" os outros sinais — ele foge deles trocando de canal sozinho.',
      options: ['Ele troca automaticamente de canal/frequência pra fugir da interferência (agile frequency)', 'Ele desliga o WiFi de todos os celulares próximos', 'Ele para de transmitir vídeo até a área ficar vazia', 'Ele muda para conexão via cabo Ethernet'],
      correctIndex: 0
    },
    {
      id: 9,
      title: 'Prédio bloqueando o sinal',
      icon: '🏢',
      explanation: 'Ondas de rádio viajam melhor em linha de visada — subir a altitude do drone (ou se reposicionar) tende a tirar o obstáculo do meio do caminho e restaurar o link.',
      desc: 'Durante o voo, um prédio ficou entre o piloto e o <b>Mini 4 Pro</b>, e a imagem começou a engasgar. Qual ajuste tem mais chance de resolver, com base em como ondas de rádio se propagam?',
      hint: 'Pense em "linha de visada": o que existe entre o controle e o drone importa.',
      options: ['Voar mais alto ou se reposicionar pra tirar o prédio da linha de visada', 'Trocar a bateria do controle remoto', 'Reiniciar o aplicativo do celular', 'Desligar o GPS do drone'],
      correctIndex: 0
    },
    {
      id: 10,
      title: 'Sinal do controle perdido em pleno voo',
      icon: '🆘',
      explanation: 'O failsafe do drone ativa o Retorno para Casa (RTH): usando o GPS, ele volta sozinho até o ponto exato de decolagem e pousa — por isso a conectividade também é um sistema de segurança, não só de vídeo.',
      desc: 'Por algum motivo, o controle remoto perde o sinal com o <b>Mini 4 Pro</b> por tempo demais durante o voo. O que o drone é projetado pra fazer automaticamente nessa situação?',
      hint: 'Pense em qual outra tecnologia de conectividade (a primeira que vimos na teoria) permite o drone "saber o caminho de volta" sozinho.',
      options: ['Ativa o Retorno para Casa (RTH), usando GPS pra voltar sozinho ao ponto de decolagem', 'Cai imediatamente onde está', 'Liga o Bluetooth pra buscar qualquer celular por perto', 'Continua voando reto até a bateria acabar'],
      correctIndex: 0
    }
  ];

  // Exposto sempre (não só quando o botão local aparece) pra a aba "Gestão"
  // do portal da turma conseguir chamar isso remotamente, num iframe oculto,
  // e baixar um .txt com enunciado + resposta esperada de cada chamado.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'IoT: Central de Conectividade',
      subtitle: 'Prática · Turma Sistemas · Contexto: DJI Mini 4 Pro',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        options: c.options,
        correctIndex: c.correctIndex,
        answer: c.options[c.correctIndex]
      })),
      fileName: 'iot-conectividade-pratica-gabarito.txt'
    });
  };

  const challengeListEl = document.getElementById('challengeList');
  const challengeTitleEl = document.getElementById('challengeTitle');
  const challengeDescEl = document.getElementById('challengeDesc');
  const explanationTextEl = document.getElementById('explanationText');
  const ticketIconEl = document.getElementById('ticketIcon');
  const ticketStatusEl = document.getElementById('ticketStatus');
  const optionsPanel = document.getElementById('optionsPanel');
  const btnNext = document.getElementById('btnNext');
  const btnHint = document.getElementById('btnHint');
  const hintBox = document.getElementById('hintBox');
  const consoleOutput = document.getElementById('consoleOutput');
  const lblProgress = document.getElementById('lblProgress');

  function getCompleted() {
    try {
      return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }
  function saveCompleted(set) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify([...set]));
  }

  let completed = getCompleted();
  let selectedId = CHALLENGES.find(c => !completed.has(c.id))?.id || CHALLENGES[0].id;

  // Bypass pro professor: ele quer ver/preparar todos os desafios sem
  // precisar resolver cada um em ordem (ver PENDENCIAS.md, "Desbloquear
  // todas as etapas das atividades para o professor"). A checagem é
  // assíncrona, então a sidebar é re-renderizada assim que ela resolver.
  let isProfessor = false;
  (async function () {
    const user = window.PortalSession ? await window.PortalSession.getUser() : null;
    isProfessor = !!(user && user.role === 'professor');
    if (isProfessor) renderSidebar();
  })();

  function isUnlocked(challenge) {
    if (isProfessor) return true;
    const idx = CHALLENGES.findIndex(c => c.id === challenge.id);
    if (idx === 0) return true;
    return completed.has(CHALLENGES[idx - 1].id);
  }

  function renderSidebar() {
    challengeListEl.innerHTML = '';
    CHALLENGES.forEach(c => {
      const unlocked = isUnlocked(c);
      const isDone = completed.has(c.id);
      const item = document.createElement('div');
      item.className = 'challenge-item' + (c.id === selectedId ? ' active' : '') + (isDone ? ' completed' : '') + (!unlocked ? ' locked' : '');
      const statusIcon = isDone ? '✅' : (unlocked ? '🎫' : '🔒');
      item.innerHTML = `<span class="status">${statusIcon}</span><span class="name">${c.icon} ${c.title}</span>`;
      if (unlocked) item.addEventListener('click', () => selectChallenge(c.id));
      challengeListEl.appendChild(item);
    });
    lblProgress.textContent = `${completed.size}/${CHALLENGES.length}`;
  }

  function clearConsole() { consoleOutput.innerHTML = ''; }
  function logConsole(msg, type) {
    const line = document.createElement('div');
    line.className = 'line ' + (type || 'info');
    line.textContent = msg;
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function renderOptions(challenge, alreadyDone) {
    optionsPanel.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];
    const wrongTried = new Set();

    challenge.options.forEach((optText, idx) => {
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${optText}</span>`;
      if (alreadyDone) {
        opt.classList.add('disabled');
        if (idx === challenge.correctIndex) opt.classList.add('correct');
      } else {
        opt.addEventListener('click', () => handleAnswer(challenge, idx, opt));
      }
      optionsPanel.appendChild(opt);
    });

    function handleAnswer(challenge, idx, opt) {
      if (idx === challenge.correctIndex) {
        optionsPanel.querySelectorAll('.option').forEach(el => el.classList.add('disabled'));
        opt.classList.add('correct');

        completed.add(challenge.id);
        saveCompleted(completed);
        ticketStatusEl.textContent = 'RESOLVIDO';
        ticketStatusEl.classList.add('done');
        ticketStatusEl.classList.remove('pending');

        const isLast = CHALLENGES[CHALLENGES.length - 1].id === challenge.id;
        if (isLast) {
          logConsole('🏆 Chamado resolvido! Você concluiu todos os chamados de conectividade!', 'success');
        } else {
          logConsole('✅ Chamado resolvido! Próximo chamado liberado.', 'success');
          btnNext.style.display = 'inline-block';
        }
        renderSidebar();

        if (typeof window.reportActivity === 'function') {
          window.reportActivity(
            'iot_conectividade_pratica',
            `IoT — Conectividade — Chamado ${challenge.id}: ${challenge.title} (resolvido)`,
            { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
          );
        }
      } else {
        wrongTried.add(idx);
        opt.classList.add('incorrect');
        logConsole('❌ Não é essa. Tente outra opção — a dica pode ajudar.', 'fail');
      }
    }
  }

  function selectChallenge(id) {
    const challenge = CHALLENGES.find(c => c.id === id);
    if (!challenge || !isUnlocked(challenge)) return;
    selectedId = id;

    challengeTitleEl.textContent = `Chamado ${challenge.id}: ${challenge.title}`;
    explanationTextEl.innerHTML = challenge.explanation;
    challengeDescEl.innerHTML = challenge.desc;
    btnNext.style.display = 'none';

    hintBox.innerHTML = challenge.hint || '';
    hintBox.classList.remove('show');
    btnHint.textContent = '💡 Ver dica';

    ticketIconEl.textContent = challenge.icon;
    const alreadyDone = completed.has(id);
    ticketStatusEl.textContent = alreadyDone ? 'RESOLVIDO' : 'PENDENTE';
    ticketStatusEl.classList.toggle('done', alreadyDone);
    ticketStatusEl.classList.toggle('pending', !alreadyDone);

    clearConsole();
    if (alreadyDone) logConsole('Você já resolveu este chamado. Pode revisar as opções.', 'info');
    renderOptions(challenge, alreadyDone);
    renderSidebar();

    if (typeof window.reportActivity === 'function') {
      window.reportActivity(
        'iot_conectividade_pratica',
        `IoT — Conectividade — Chamado ${challenge.id}: ${challenge.title}`,
        { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
      );
    }
  }

  btnHint.addEventListener('click', () => {
    const showing = hintBox.classList.toggle('show');
    btnHint.textContent = showing ? '💡 Ocultar dica' : '💡 Ver dica';
  });
  btnNext.addEventListener('click', () => {
    const idx = CHALLENGES.findIndex(c => c.id === selectedId);
    const next = CHALLENGES[idx + 1];
    if (next) selectChallenge(next.id);
  });

  renderSidebar();
  selectChallenge(selectedId);
</script>

<script src="../../../shared/vlibras-widget.js"></script>

</body>
</html>
