Uma **função assíncrona** é uma operação que espera uma resposta (do banco) sem travar o resto do programa. Toda chamada ao Supabase retorna ¤{ data, error }¤ — ignorar ¤error¤ esconde falhas do usuário (e, num app financeiro, um erro escondido é sério), por isso toda função abaixo já trata os dois casos.

### Faça

No ¤app.js¤:

§§§javascript
async function cadastrarUsuario(nome, turma, usuario, senha) {
  const { data, error } = await supabaseClient
    .from('usuarios')
    .insert([{ nome: nome, turma: turma, usuario: usuario, senha: senha }])
    .select();

  if (error) {
    console.error(error);
    return { data: null, error: error };
  }

  console.log('Usuário cadastrado:', data);
  return { data: data, error: null };
}
§§§

¤.insert([...])¤ recebe uma lista com o objeto a gravar; ¤.select()¤ no final pede que o Supabase devolva a linha recém-criada (com o ¤id¤ gerado), em vez de devolver só a confirmação vazia.`

Uma consulta condicional (¤.eq()¤) filtra linhas por um valor específico.

### Faça

§§§javascript
async function fazerLogin(usuario, senha) {
  const { data, error } = await supabaseClient
    .from('usuarios')
    .select('*')
    .eq('usuario', usuario)
    .eq('senha', senha)
    .maybeSingle();

  if (error) {
    console.error(error);
    return { data: null, error: error };
  }

  if (!data) {
    return { data: null, error: { message: 'Usuário ou senha incorretos.' } };
  }

  console.log('Login ok:', data);
  return { data: data, error: null };
}
§§§

¤.eq('usuario', usuario).eq('senha', senha)¤ encadeia 2 filtros — só volta linha que bate com os 2 ao mesmo tempo. ¤.maybeSingle()¤ (em vez de ¤.select('*')¤ sozinho) espera **no máximo uma linha**: devolve ¤null¤ em ¤data¤ se não achar ninguém, em vez de uma lista vazia — mais fácil de checar com ¤if (!data)¤.`

Um insert com relação grava a **FK** (quem é o autor) junto com o dado. Aqui você registra uma **receita** ou uma **despesa**.

### Faça

§§§javascript

  const { data, error } = await supabaseClient
    .from('lancamentos')
    .insert([{ autor_id: autorId, descricao: descricao, valor: Number(valor), tipo: tipo }])
    .select()
    .single();

  if (error) {
    console.error(error);
    return { data: null, error: error };
  }

  console.log('Lançamento criado:', data);
  return { data: data, error: null };
}
§§§

¤Number(valor)¤ garante que o valor vá pro banco como número, mesmo que venha de um input HTML (que sempre entrega texto). ¤tipo¤ precisa ser exatamente ¤'receita'¤ ou ¤'despesa'¤ — o ¤check¤ que você criou na tabela (peça de Banco de Dados) recusa qualquer outro valor, então um erro aqui também pode vir de lá.`

Select com **join** junta dados de duas (ou mais) tabelas relacionadas numa única consulta; **ordenação** define a sequência de exibição.

### Faça

§§§javascript
async function carregarLancamentos(autorId) {
  const { data, error } = await supabaseClient
    .from('lancamentos')
    .select('*, lancamento_tags(tags(nome))')
    .eq('autor_id', autorId)
    .order('criado_em', { ascending: false });

  if (error) {
    console.error(error);
    return { data: [], error: error };
  }

  const lancamentos = data.map(function (lancamento) {
    const tags = lancamento.lancamento_tags.map(function (lt) { return lt.tags.nome; });
    return Object.assign({}, lancamento, { tags: tags });
  });

  return { data: lancamentos, error: null };
}
§§§

¤select('*, lancamento_tags(tags(nome))')¤ é um **select aninhado**: além das colunas de ¤lancamentos¤ (¤*¤), pede também, pra cada linha, a lista de ¤lancamento_tags¤ ligada a ela — e dentro de cada uma, o ¤nome¤ da ¤tags¤ correspondente. O resultado bruto vem como ¤lancamento.lancamento_tags = [{ tags: { nome: 'mercado' } }, ...]¤ — por isso o ¤.map()¤ achata isso num array simples de nomes (¤lancamento.tags = ['mercado', ...]¤), mais fácil de usar na tela. ¤.order('criado_em', { ascending: false })¤ traz o mais recente primeiro.`

Uma tag pode já existir (reaproveita) ou ser nova (precisa ser criada) — a função precisa lidar com os 2 casos antes de ligar a tag ao lançamento.

### Faça

§§§javascript
async function adicionarTag(lancamentoId, nomeTag) {
  const nome = nomeTag.trim().toLowerCase();
  if (!nome) {
    return { data: null, error: { message: 'Tag vazia.' } };
  }

  let tag = null;
  const busca = await supabaseClient
    .from('tags')
    .select('*')
    .eq('nome', nome)
    .maybeSingle();

  if (busca.error) {
    console.error(busca.error);
    return { data: null, error: busca.error };
  }
  tag = busca.data;

  if (!tag) {
    const criacao = await supabaseClient
      .from('tags')
      .insert([{ nome: nome }])
      .select()
      .single();

    if (criacao.error) {
      console.error(criacao.error);
      return { data: null, error: criacao.error };
    }
    tag = criacao.data;
  }

  const { data, error } = await supabaseClient
    .from('lancamento_tags')
    .insert([{ lancamento_id: lancamentoId, tag_id: tag.id }])
    .select();

  if (error) {
    if (error.code === '23505') {
      console.warn('Essa tag já estava nesse lançamento.');
      return { data: null, error: null };
    }
    console.error(error);
    return { data: null, error: error };
  }

  return { data: data, error: null };
}
§§§

1) ¤busca¤ procura uma tag com esse ¤nome¤ (¤.maybeSingle()¤ — no máximo uma, mesma ideia de ¤fazerLogin¤). 2) Se ¤tag¤ continuar ¤null¤, ¤criacao¤ cria a tag nova. 3) Por fim, insere a linha em ¤lancamento_tags¤ ligando ¤lancamento_id¤ e ¤tag_id¤. O código ¤23505¤ é o código do PostgreSQL pra "violação de ¤unique constraint¤" — é o que o banco devolve quando você tenta marcar a MESMA tag 2 vezes no mesmo lançamento (o ¤unique(lancamento_id, tag_id)¤ que você criou na peça de Banco de Dados); tratado aqui como algo esperado (não um erro pro usuário ver), não como falha.`

      titulo: 'Saldo e Extrato',
      corpo: `
Renderizar uma lista dinâmica significa transformar um array de dados em elementos HTML na tela. O **saldo** é a soma de todas as receitas menos a soma de todas as despesas.

### Faça

§§§javascript
async function atualizarExtrato() {
  const resultado = await carregarLancamentos(usuarioLogado.id);
  const extratoContainer = document.getElementById('extratoContainer');
  extratoContainer.innerHTML = '';

  if (resultado.error) {
    extratoContainer.textContent = 'Erro ao carregar o extrato.';
    return;
  }

  let saldo = 0;
  resultado.data.forEach(function (lancamento) {
    extratoContainer.appendChild(renderLancamento(lancamento));
    if (lancamento.tipo === 'receita') {
      saldo += Number(lancamento.valor);
    } else {
      saldo -= Number(lancamento.valor);
    }
  });

  const saldoValor = document.getElementById('saldoValor');
  saldoValor.textContent = saldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  saldoValor.classList.toggle('positivo', saldo >= 0);
  saldoValor.classList.toggle('negativo', saldo < 0);
}

function renderLancamento(lancamento) {
  const card = document.createElement('div');
  card.className = 'lancamento-card';

  const descricao = document.createElement('p');
  descricao.className = 'lancamento-desc';
  descricao.textContent = lancamento.descricao;

  const data = document.createElement('span');
  data.className = 'lancamento-data';
  data.textContent = new Date(lancamento.criado_em).toLocaleDateString('pt-BR');

  const valor = document.createElement('span');
  valor.className = 'lancamento-valor ' + (lancamento.tipo === 'receita' ? 'receita' : 'despesa');
  const sinal = lancamento.tipo === 'receita' ? '+ ' : '- ';
  valor.textContent = sinal + Number(lancamento.valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  const tagsDiv = document.createElement('div');
  tagsDiv.className = 'lancamento-tags';
  (lancamento.tags || []).forEach(function (tag) {
    const badge = document.createElement('span');
    badge.className = 'tag-badge';
    badge.textContent = tag;
    tagsDiv.appendChild(badge);
  });

  card.appendChild(descricao);
  card.appendChild(data);
  card.appendChild(valor);
  card.appendChild(tagsDiv);
  return card;
}

### O que cada campo faz

- ¤name¤/¤short_name¤: nome completo e nome curto (usado quando não há espaço, ex.: embaixo do ícone na tela inicial).

- ¤display: "standalone"¤: esconde a barra de endereço e os controles do navegador quando instalado — o FinancApp passa a se parecer com um app nativo, não uma aba de navegador.
- ¤background_color¤/¤theme_color¤: cor de fundo da tela de splash (enquanto o app carrega) e cor da barra do sistema — usei os mesmos tons de ¤style.css¤ (fundo ¤#eef6f0¤, verde ¤#1f7a4d¤), pra ficar consistente.

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function inline(s) {
    let t = escapeHtml(s);
    t = t.replace(/¤([^¤]+)¤/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return t;
  }

  // Mesmo parser markdown-enxuto de modelagem-dados-requisitos-trabalho.html.
  function mdToHtml(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (line === '') { i++; continue; }

      if (line.startsWith('§§§')) {
        i++;
        const codeLines = [];
        while (i < lines.length && lines[i].trim() !== '§§§') { codeLines.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`;
        continue;
      }

      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const level = Math.min(hm[1].length + 2, 6);
        html += `<h${level}>${inline(hm[2])}</h${level}>`;
        i++; continue;
      }

      if (line.startsWith('|') && lines[i + 1] && /^\s*\|[\s:-]+\|/.test(lines[i + 1])) {
        const headerCells = line.slice(1, -1).split('|').map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          rows.push(lines[i].trim().slice(1, -1).split('|').map(s => s.trim()));
          i++;
        }
        html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>'
          + headerCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'
          + rows.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
          + '</tbody></table></div>';
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^\d+\.\s+/, '')); i++; }
        html += '<ol class="md-list">' + items.map(it => `<li>${inline(it)}</li>`).join('') + '</ol>';
        continue;
      }

      if (/^-\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^-\s+/.test(lines[i].trim())) { items.push(lines[i].trim()); i++; }
        html += '<ul class="md-list">' + items.map(it => {
          const cbm = it.match(/^-\s+\[( |x)\]\s*(.*)$/i);
          if (cbm) return `<li class="md-check">${inline(cbm[2])}</li>`;
          return `<li>${inline(it.replace(/^-\s+/, ''))}</li>`;
        }).join('') + '</ul>';
        continue;
      }

      if (line.startsWith('>')) {
        const q = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${inline(q.join(' '))}</blockquote>`;
        continue;
      }

      const para = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(§§§|#|\||-|\d+\.|>)/.test(lines[i].trim())) {
        para.push(lines[i].trim());
        i++;
      }
      html += `<p>${inline(para.join(' '))}</p>`;
    }
    return html;
  }
