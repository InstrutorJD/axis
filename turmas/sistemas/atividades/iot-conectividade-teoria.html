<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --green:#3aa0ff; --green-dim:#2b6ba3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#d6e2ec; --ink-dim:#6c8698;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050a10;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(58,160,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(58,160,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:8px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--yellow); white-space:pre;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(58,160,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,91,77,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04150c; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(58,160,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  /* Celular: deixa a página rolar em vez de prender tudo numa tela só, e
     tira padding/borda que só rouba espaço útil numa tela pequena. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>

<script>
  const STEPS = [
    {
      story: 'Olá! Eu sou a <b>Zenit</b>, engenheira de campo de IoT — e hoje é dia de aula prática pilotando um <b>DJI Mini 4 Pro</b> de verdade! Mas antes de decolar, você precisa entender COMO um drone troca dados com o mundo. Tudo começa com <b>ondas de rádio</b>: sinais eletromagnéticos que viajam pelo ar em diferentes <b>frequências</b> (medidas em Hz). WiFi, Bluetooth, sinal de satélite e até o link do controle remoto do drone usam ondas de rádio — a diferença está em qual frequência, qual protocolo e qual alcance cada tecnologia usa. Vamos começar pela mais distante de todas: a conectividade <b>via satélite</b>. O dispositivo transmite (ou recebe) o sinal direto de um satélite em órbita, cobrindo praticamente qualquer ponto do planeta, mesmo sem nenhuma rede terrestre por perto. É assim que o <b>GPS</b> do Mini 4 Pro funciona: ele recebe sinais de rádio de satélites (GPS, GLONASS e Galileo) pra calcular sua posição exata e manter o drone paradinho no ar (hover) sozinho, sem você precisar segurar o manche o tempo todo.',
      question: {
        prompt: 'Você precisa enviar, uma vez por hora, a leitura de um sensor de umidade instalado numa fazenda muito isolada, sem cobertura de celular nem roteador WiFi por perto. Qual tecnologia de conectividade resolve isso?',
        options: ['Conectividade via satélite', 'Bluetooth', 'WiFi doméstico', 'Cabo de rede (Ethernet)'],
        correctIndex: 0,
        explanation: 'Isso! Sem nenhuma infraestrutura terrestre por perto, o satélite é a única opção com alcance suficiente pra tirar o dado de lá — é o mesmo princípio que faz o GPS do drone funcionar até no meio de um campo aberto, longe de qualquer roteador.'
      }
    },
    {
      story: 'Antes de seguir, vale entender o que "frequência" realmente significa. Uma onda de rádio oscila (vibra) um certo número de vezes por segundo, e essa contagem é medida em <b>Hertz (Hz)</b>: 1 Hz é 1 oscilação por segundo, 1 quilohertz (kHz) são mil oscilações, 1 megahertz (MHz) é um milhão, e 1 <b>gigahertz (GHz)</b> é um <b>bilhão</b> de oscilações por segundo. Quando um WiFi ou Bluetooth opera em <b>2,4 GHz</b>, a onda está oscilando 2,4 bilhões de vezes a cada segundo; em <b>5 GHz</b>, são 5 bilhões — mais do que o dobro. Essa diferença física muda o comportamento do sinal: frequências mais baixas (2,4 GHz) têm um comprimento de onda maior, o que ajuda a atravessar paredes e obstáculos e alcançar mais longe; frequências mais altas (5 GHz) têm comprimento de onda menor, perdem força mais rápido ao esbarrar em obstáculos, mas — por oscilarem mais vezes por segundo — conseguem carregar mais informação no mesmo intervalo de tempo, ou seja, mais velocidade. Alcance contra velocidade: essa troca está por trás de quase toda escolha de frequência em conectividade sem fio.',
      question: {
        prompt: 'Uma onda de 5 GHz oscila aproximadamente quantas vezes por segundo, e o que isso costuma significar na prática comparado a uma onda de 2,4 GHz?',
        options: [
          '5 bilhões de vezes por segundo — mais velocidade de transmissão, porém menos alcance e mais dificuldade pra atravessar obstáculos',
          '5 mil vezes por segundo — exatamente igual ao 2,4 GHz, só muda o nome comercial',
          '5 vezes por segundo — uma onda muito mais lenta que o 2,4 GHz',
          '5 bilhões de vezes por segundo — mais alcance e mais facilidade pra atravessar paredes do que o 2,4 GHz'
        ],
        correctIndex: 0,
        explanation: 'Isso! "GHz" quer dizer bilhões de oscilações por segundo, então 5 GHz vibra mais que o dobro de vezes por segundo que 2,4 GHz — o que permite mais velocidade de transmissão, só que à custa de alcance e capacidade de atravessar obstáculos, já que o comprimento de onda fica menor.'
      }
    },
    {
      story: 'Já o <b>Bluetooth</b> é um padrão de comunicação sem fio de curto alcance, criado pra ligar dispositivos pessoais entre si sem cabo. Ele também usa ondas de rádio, numa faixa de <b>2,4 GHz</b>, mas com potência bem mais baixa que o WiFi. Na versão de baixo consumo, chamada <b>BLE</b> (Bluetooth Low Energy), ele foi otimizado pro oposto do satélite: distâncias bem curtas — só alguns metros — entre dois dispositivos próximos, como um celular e um fone de ouvido. A vantagem é o consumo de energia baixíssimo, o que faz acessórios a bateria pequena durarem dias ou meses. Curiosidade pra hoje: o controle remoto do Mini 4 Pro <b>não</b> usa Bluetooth pra falar com o drone — vídeo em tempo real e comandos de voo exigem muito mais banda e alcance do que o Bluetooth aguenta.',
      question: {
        prompt: 'Uma pulseira inteligente mede a frequência cardíaca e envia os dados pro celular do usuário, que fica sempre a poucos metros de distância. A bateria da pulseira precisa durar vários dias sem recarregar. Qual tecnologia é a mais indicada?',
        options: ['Bluetooth (BLE)', 'WiFi', 'Conectividade via satélite', 'Rádio AM/FM'],
        correctIndex: 0,
        explanation: 'Exato! Curto alcance + baixíssimo consumo de energia é exatamente o ponto forte do Bluetooth de baixo consumo (BLE) — perfeito pra wearables com bateria pequena.'
      }
    },
    {
      story: 'Por sua vez, o <b>WiFi</b> é a tecnologia sem fio que conecta um dispositivo a uma rede local já existente — o mesmo roteador que seu celular ou notebook usa em casa. Ele também usa ondas de rádio, geralmente nas faixas de <b>2,4 GHz</b> e <b>5 GHz</b>, e entra em cena quando já existe essa rede local por perto e o dispositivo precisa de mais banda do que o Bluetooth oferece — como vídeo ou muitos dados por segundo. O alcance cobre um cômodo ou um andar inteiro, mas cai bastante em campo aberto e longas distâncias. O Mini 4 Pro até usa WiFi puro em algumas situações — como transferir fotos e vídeos direto pro celular depois de pousar — mas não pra pilotar em voo: a distância e a estabilidade que um voo exige vão além do que o WiFi tradicional entrega.',
      question: {
        prompt: 'Uma câmera de segurança residencial precisa transmitir vídeo em tempo real quase o dia inteiro pro roteador que já existe na casa. Qual tecnologia de conectividade é a mais indicada?',
        options: ['WiFi', 'Bluetooth', 'Conectividade via satélite', 'Rádio frequência simples (RF)'],
        correctIndex: 0,
        explanation: 'Isso mesmo! Com roteador por perto e a necessidade de banda alta pra vídeo contínuo, o WiFi é a escolha certa — o Bluetooth não teria banda suficiente, e o satélite seria caro e desnecessário aqui.'
      }
    },
    {
      story: 'Vamos juntar as três tecnologias que já vimos numa comparação direta, lado a lado. <b>GPS/satélite</b>: usa uma faixa própria de rádio vinda do espaço (perto de 1,5 GHz, dedicada só à navegação), alcance praticamente global, banda muito baixa (dá só pra receber coordenadas de posição, não serve pra vídeo) e não depende de nenhuma infraestrutura terrestre por perto. <b>Bluetooth (BLE)</b>: opera em 2,4 GHz, alcance de poucos metros, banda baixa (não aguenta vídeo em tempo real) e consumo de energia baixíssimo — ideal pra acessórios com bateria pequena, como fones e pulseiras. <b>WiFi</b>: opera em 2,4 GHz e 5 GHz, alcance de um cômodo ou andar (dezenas de metros), banda alta (aguenta vídeo, streaming e vários dispositivos ao mesmo tempo), mas exige um roteador (uma rede local) por perto e consome mais energia que o Bluetooth. Repare que nenhuma das três é "a melhor" no geral — cada uma equilibra alcance, banda e consumo de energia de um jeito diferente, e a tecnologia certa depende do que a situação exige.',
      question: {
        prompt: 'Comparando GPS/satélite, Bluetooth e WiFi, qual afirmação está CORRETA?',
        options: [
          'Cada uma equilibra alcance, banda e consumo de energia de um jeito diferente — não existe uma "melhor" tecnologia no geral, existe a mais adequada pra cada situação',
          'WiFi sempre tem mais alcance do que GPS/satélite',
          'Bluetooth foi feito pra transmitir vídeo em tempo real com o mesmo desempenho do WiFi',
          'GPS/satélite serve pra qualquer tipo de dado, inclusive vídeo em alta definição'
        ],
        correctIndex: 0,
        explanation: 'Isso! Cada tecnologia foi projetada com prioridades diferentes: satélite prioriza alcance global (com banda mínima), Bluetooth prioriza economia de energia em curta distância, e WiFi prioriza banda alta com um roteador por perto — escolher a certa depende do que a situação exige, não existe uma que vença as outras em tudo.'
      }
    },
    {
      story: 'Mas como um número — a leitura de um sensor de umidade, por exemplo — realmente "viaja" dentro de uma onda de rádio? O transmissor não manda a palavra "42%" pelo ar: primeiro ele converte a informação numa sequência de <b>bits</b> (0s e 1s), e depois <b>modula</b> essa sequência sobre a onda de rádio, variando alguma característica dela (amplitude, frequência ou fase) de um jeito que o receptor consiga reconhecer cada 0 e cada 1. Esse processo — transformar dados digitais num sinal de rádio capaz de viajar pelo ar — chama-se <b>modulação</b>; o processo inverso, feito pelo receptor pra reconstruir os bits originais, chama-se demodulação. Cada tecnologia sem fio usa um esquema de modulação diferente, otimizado pra uma prioridade diferente: velocidade máxima, economia de energia, ou robustez contra interferência a longa distância. É exatamente por isso que duas tecnologias podem usar a mesma faixa de frequência — como o O4 do drone e o WiFi, ambos por volta de 2,4/5,8 GHz — e mesmo assim se comportarem de formas bem diferentes: a "estrada" (frequência) é a mesma, mas o "idioma" (o jeito de modular e organizar os bits) é outro.',
      question: {
        prompt: 'O sensor de umidade da fazenda mede 42% e precisa mandar esse valor pro celular do produtor via rádio. O que realmente viaja pelo ar entre o sensor e o receptor?',
        options: [
          'Uma sequência de bits (0s e 1s) codificada sobre a onda de rádio por meio de modulação',
          'O texto "42%" exatamente do jeito que aparece na tela do celular',
          'Uma gravação de voz falando o valor em voz alta',
          'Nada viaja pelo ar; o valor só é transmitido depois, quando os dois aparelhos são ligados por cabo'
        ],
        correctIndex: 0,
        explanation: 'Exato! Todo dado — seja um número de sensor ou um quadro de vídeo — é convertido em bits e depois modulado sobre a onda de rádio; o receptor demodula o sinal de volta em bits e só então reconstrói o valor original (os 42%, nesse caso).'
      }
    },
    {
      story: 'Pra fechar, vamos entender como o <b>DJI Mini 4 Pro</b> junta tudo isso na prática. Ele carrega vários <b>sensores</b> — GPS/GLONASS/Galileo (posição), IMU (giroscópio + acelerômetro, pra estabilidade), barômetro (altitude) e câmera — e cada um gera um tipo de dado diferente. Pra levar o vídeo em tempo real e os comandos de voo entre o controle remoto e o drone, a até <b>20 km</b> de distância e com baixíssimo atraso, nem WiFi nem Bluetooth comuns dão conta do recado. Por isso a DJI criou uma tecnologia própria de rádio chamada <b>O4</b> (a 4ª geração do sistema OcuSync). O O4 usa as mesmas faixas de frequência do WiFi (2,4 GHz e 5,8 GHz) — a mesma "estrada" de ondas de rádio — só que com um protocolo próprio, feito pra ser muito mais robusto contra interferência e alcançar muito mais longe do que um roteador doméstico. Mesma faixa de frequência, protocolo diferente, resultado bem diferente.',
      question: {
        prompt: 'O controle remoto do DJI Mini 4 Pro e o próprio drone conversam nas mesmas faixas de frequência que o WiFi (2,4 GHz e 5,8 GHz), mas NÃO usam o protocolo WiFi comum. Por quê?',
        options: [
          'Porque a DJI criou um protocolo de rádio próprio (O4/OcuSync), otimizado pra mais alcance e menos interferência do que o WiFi doméstico',
          'Porque WiFi não consegue transmitir nenhum tipo de vídeo',
          'Porque essas frequências são proibidas para uso de WiFi',
          'Porque o drone não usa nenhum tipo de onda de rádio'
        ],
        correctIndex: 0,
        explanation: 'Exato! Frequência (a "estrada") e protocolo (as regras de uso dela) são coisas diferentes — o O4 usa a mesma faixa do WiFi, mas com regras próprias pra alcançar até 20 km com baixa latência, algo que o WiFi tradicional não foi projetado pra fazer.'
      }
    },
    {
      story: 'Voltando à ideia de "estrada" de ondas de rádio: a maioria dos dispositivos sem fio usa duas faixas livres de frequência, chamadas de bandas <b>ISM</b>: <b>2,4 GHz</b> e <b>5 GHz</b> (o drone usa uma variação próxima, <b>5,8 GHz</b>). A banda de 2,4 GHz atravessa paredes e obstáculos com mais facilidade e alcança mais longe, mas é a mais "lotada" — praticamente todo roteador doméstico, fone Bluetooth e forno de micro-ondas usa essa faixa, o que gera interferência. Já a de 5/5,8 GHz é mais "vazia" (menos dispositivos disputando o mesmo espaço) e permite mais velocidade, só que o sinal se degrada mais rápido com distância e obstáculos. O sistema O4 do Mini 4 Pro monitora as duas o tempo todo e escolhe automaticamente qual usar (ou alterna entre elas) conforme a interferência de cada ambiente — uma técnica chamada <b>agile frequency</b>.',
      question: {
        prompt: 'Você está pilotando numa área cheia de gente usando celular e roteadores WiFi 2,4 GHz por perto (a quadra da escola, por exemplo). Por que o link do drone tende a sofrer menos interferência se conseguir usar a faixa de 5,8 GHz nesse momento?',
        options: [
          'Porque menos dispositivos usam essa faixa por perto, deixando o "espaço" menos disputado',
          'Porque 5,8 GHz atravessa paredes melhor que 2,4 GHz',
          'Porque 5,8 GHz não é uma onda de rádio',
          'Porque o Bluetooth do celular do instrutor bloqueia só o 2,4 GHz'
        ],
        correctIndex: 0,
        explanation: 'Isso! Menos aparelhos "brigando" pela mesma faixa significa menos interferência — é por isso que o O4 do Mini 4 Pro pode alternar pra 5,8 GHz quando o ambiente em 2,4 GHz está muito cheio.'
      }
    },
    {
      story: '"Banda" (ou largura de banda) é a quantidade de dados que cabem por segundo num link — quanto mais banda, mais nítido pode ser o vídeo, por exemplo. Já <b>latência</b> é o tempo que um dado leva pra ir de um lado a outro: no caso do drone, o tempo entre você mover o manche no controle e o drone realmente reagir no ar. Pra pilotar com segurança, o Mini 4 Pro precisa das duas coisas: banda suficiente pro vídeo em tempo real E latência baixíssima (poucos milissegundos) pros comandos de voo — porque um comando "atrasado" pode chegar tarde demais pra corrigir a trajetória. É por isso que o O4 foi desenhado priorizando latência baixa e estável, mesmo a quilômetros de distância, em vez de só focar em velocidade máxima como o WiFi doméstico costuma priorizar.',
      question: {
        prompt: 'Um piloto precisa desviar o drone de um obstáculo no último segundo. Por que a baixa LATÊNCIA do link de rádio é tão importante nesse momento, além da banda alta?',
        options: [
          'Porque um comando de voo atrasado pode chegar tarde demais pro drone reagir a tempo',
          'Porque latência alta consome mais bateria do controle',
          'Porque latência é só relevante pra transferir fotos',
          'Latência não importa, só a banda importa'
        ],
        correctIndex: 0,
        explanation: 'Exato! Banda alta garante um vídeo nítido, mas é a latência baixa que garante que o comando do piloto chegue no drone a tempo de fazer diferença — as duas coisas são necessárias, não uma no lugar da outra.'
      }
    },
    {
      story: 'A faixa de 2,4 GHz em particular fica lotada de sinais concorrendo pelo mesmo "espaço": outros WiFis, fones Bluetooth, e até fornos de micro-ondas emitem nessa frequência. Isso causa <b>interferência</b> — o sinal que você quer captar se mistura com "ruído" de outros aparelhos, podendo travar a imagem ou atrasar comandos. Pra resolver isso, o O4 do Mini 4 Pro monitora o espectro em tempo real e pula automaticamente pra um canal ou faixa menos ocupada assim que detecta interferência — sem o piloto precisar fazer nada. É a mesma ideia por trás do WiFi de um roteador bom, que também tenta trocar de canal quando o seu vizinho liga um monte de aparelho na mesma faixa.',
      question: {
