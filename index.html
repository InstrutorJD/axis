<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- App instalável (manifest.json na raiz) e ícone do Axis (shared/assets/app/). -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="shared/assets/app/icone.svg">
<link rel="icon" type="image/png" sizes="32x32" href="shared/assets/app/favicon-32.png">
<link rel="apple-touch-icon" href="shared/assets/app/apple-touch-icon.png">
<meta name="theme-color" content="#0b0e12">
<meta name="apple-mobile-web-app-title" content="Axis">
<title>Axis — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root {
    --bg: #0b0e12; --panel: #12161c; --panel2: #0e1116; --line: #262c34;
    --green: #8fa6c9; --green-dim: #56637a; --blood-bright: #ff5b4d;
    --yellow: #d4c86a; --ink: #dde3ea; --ink-dim: #7b8493;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .login-card {
    width: 100%; max-width: 420px; background: var(--panel);
    border: 2px solid var(--green-dim); padding: 24px; border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65), 0 0 28px rgba(143, 166, 201, 0.22);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .login-card:hover {
    transform: translateY(-3px); border-color: var(--green);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 36px rgba(143, 166, 201, 0.32);
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 11px; color: var(--yellow);
    text-transform: uppercase; margin-bottom: 6px; font-weight: bold;
  }
  .form-group input {
    width: 100%; background: var(--panel2); border: 1px solid var(--line);
    color: var(--ink); font-size: 13px; padding: 10px; outline: none;
    font-family: inherit; border-radius: 8px;
    transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
  }
  .form-group input:hover { border-color: var(--green-dim); background: #10141a; }
  .form-group input:focus {
    border-color: var(--green); box-shadow: 0 0 0 3px rgba(143, 166, 201, 0.18);
  }
  /* Olho pra mostrar/esconder a senha, dentro do campo */
  .senha-wrap { position: relative; }
  .senha-wrap input { padding-right: 42px; }
  .ver-senha {
    position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    width: 32px; height: 32px; display: grid; place-items: center;
    background: none; border: none; border-radius: 6px; padding: 0;
    color: var(--ink-dim); cursor: pointer; transition: color 0.2s, background-color 0.2s;
  }
  .ver-senha:hover { color: var(--ink); background: rgba(143, 166, 201, 0.1); }
  .ver-senha:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
  .ver-senha svg { width: 18px; height: 18px; }
  .ver-senha .olho-fechado { display: none; }
  .ver-senha[aria-pressed="true"] .olho-aberto { display: none; }
  .ver-senha[aria-pressed="true"] .olho-fechado { display: block; }
  .btn-submit {
    width: 100%; background: var(--green); color: #0b0e12; border: none;
    font-weight: 800; font-size: 12px; text-transform: uppercase;
    padding: 12px; cursor: pointer; margin-top: 8px; font-family: inherit;
    border-radius: 8px;
    transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  .btn-submit:hover {
    filter: brightness(1.12); transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(143, 166, 201, 0.35);
  }
  .btn-submit:active { transform: translateY(0); box-shadow: 0 3px 8px rgba(143, 166, 201, 0.25); }
  /* Palavra "Axis" em rabisco na parte de cima do card de login: neon ciano,
     segue o mouse de leve; com o mouse em cima ela para, o traço vira um
     gradiente ciano → violeta → rosa girando (camada .camada-grad, uma cópia
     da mesma palavra por cima) e o brilho passa de ciano pra magenta. */
  .login-mark {
    display: flex; justify-content: center;
    margin: -4px 0 20px; padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    pointer-events: none;
  }
  .login-letter {
    --axis-stroke: #5ee7ff;
    width: 211px; height: 84px; display: block; overflow: visible;
    pointer-events: auto; cursor: default;
    will-change: transform, filter;
    filter: drop-shadow(0 0 2px rgba(94, 231, 255, 0.9))
            drop-shadow(0 0 7px rgba(94, 231, 255, 0.55))
            drop-shadow(0 0 16px rgba(94, 231, 255, 0.3));
    transition: filter 0.45s ease;
  }
  /* A cor vem de uma variável, assim a mesma palavra serve pra camada
     ciano e pra cópia em gradiente (.camada-grad, criada pelo script). */
  .login-letter .risco {
    fill: none; stroke: var(--axis-stroke); stroke-linecap: round; stroke-linejoin: round;
  }
  .login-letter .risco-fino { stroke-width: 1.6; opacity: 0.55; }
  .login-letter .risco-forte { stroke-width: 3.6; }
  .login-letter .camada-grad {
    --axis-stroke: url(#axisGrad);
    opacity: 0; transition: opacity 0.45s ease;
  }
  .login-letter.acesa .camada-grad { opacity: 1; }
  .login-letter.acesa {
    filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.9))
            drop-shadow(0 0 7px rgba(255, 79, 216, 0.85))
            drop-shadow(0 0 16px rgba(167, 139, 250, 0.7))
            drop-shadow(0 0 30px rgba(255, 79, 216, 0.45));
  }
  @media (max-width: 420px) {
    .login-letter { width: 173px; height: 69px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .login-letter { transition: none; transform: none !important; }
    .login-card, .form-group input, .btn-submit { transition: none; }
    .login-card:hover, .btn-submit:hover { transform: none; }
  }
  /* "Permanecer logado" */
  .lembrar {
    display: flex; align-items: center; gap: 10px; margin: -4px 0 18px;
    font-size: 14px; color: var(--ink-dim); cursor: pointer; user-select: none;
  }
  .lembrar input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .lembrar-caixa {
    flex: none; width: 18px; height: 18px; border-radius: 5px;
    border: 2px solid var(--green-dim); background: var(--panel2);
    display: grid; place-items: center; transition: background .15s ease, border-color .15s ease;
  }
  .lembrar-caixa::after {
    content: ''; width: 9px; height: 5px; margin-top: -2px;
    border-left: 2px solid var(--bg); border-bottom: 2px solid var(--bg);
    transform: rotate(-45deg) scale(0); transition: transform .15s ease;
  }
  .lembrar:hover { color: var(--ink); }
  .lembrar:hover .lembrar-caixa { border-color: var(--green); }
  .lembrar input:checked + .lembrar-caixa { background: var(--green); border-color: var(--green); }
  .lembrar input:checked + .lembrar-caixa::after { transform: rotate(-45deg) scale(1); }
  .lembrar input:focus-visible + .lembrar-caixa { outline: 2px solid var(--green); outline-offset: 2px; }
  .error-msg {
    color: var(--blood-bright); font-size: 11px; margin-top: 12px;
    text-align: center; display: none; font-weight: bold;
  }
  /* Rodapé só da tela de login: versão do portal + copyright. */
  .login-footer {
    position: fixed; left: 0; right: 0; bottom: 12px;
    text-align: center; font-size: 10.5px; color: var(--ink-dim);
    letter-spacing: 0.5px; pointer-events: none;
  }
  .login-footer .sep { margin: 0 6px; opacity: 0.5; }
</style>
</head>
<body>

<div class="login-card">
<div class="login-mark">
  <svg class="login-letter" id="loginLetter" viewBox="0 0 240 96" role="img" aria-label="Axis" focusable="false">
    <defs>
      <!-- gradiente da camada de hover: gira devagar enquanto o mouse está em cima -->
      <linearGradient id="axisGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="96">
        <stop offset="0" stop-color="#5ee7ff"/>
        <stop offset="0.5" stop-color="#a78bfa"/>
        <stop offset="1" stop-color="#ff4fd8"/>
        <animateTransform attributeName="gradientTransform" type="rotate" from="0 120 48" to="360 120 48" dur="6s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
    <!-- área transparente só para o mouse "pegar" a palavra inteira -->
    <rect x="0" y="0" width="240" height="96" fill="transparent"/>
    <g id="axisRiscos">
    <!-- "A" desconstruído: as pernas não se encontram no topo, cada uma
         quebrada em pedaços desalinhados; a barra é um traço solto que
         escapa para fora da letra. Dá para ler um A, mas não é um A. -->
    <!-- perna esquerda, em dois pedaços com um vão e um desvio -->
    <path class="risco risco-forte" d="M12 90 C 17 78, 22 67, 28 55"/>
    <path class="risco risco-forte" d="M33 47 C 37 36, 41 26, 46 15"/>
    <!-- perna direita: começa afastada e acima do topo, também partida -->
    <path class="risco risco-forte" d="M57 4 C 61 16, 65 29, 70 42"/>
    <path class="risco risco-forte" d="M75 57 C 79 68, 83 79, 89 92"/>
    <!-- barra: traço solto, fora de esquadro, que passa da perna esquerda -->
    <path class="risco risco-forte" d="M6 66 C 20 62, 34 60, 52 59"/>
    <!-- sobras de rabisco: ponta da barra do outro lado, marca no topo e
         um fiapo acompanhando a perna direita -->
    <path class="risco risco-fino" d="M62 58 C 66 58, 70 58, 73 59"/>
    <path class="risco risco-fino" d="M44 9 C 47 6, 50 5, 53 7"/>
    <path class="risco risco-fino" d="M64 20 C 68 32, 72 44, 78 60"/>
    <path class="risco risco-fino" d="M18 84 C 21 77, 23 72, 25 68"/>

    <!-- "x" desconstruído: uma diagonal inteira; a outra partida bem no
         cruzamento, com os dois pedaços desalinhados -->
    <path class="risco risco-forte" d="M103 43 C 114 55, 126 67, 151 92"/>
    <path class="risco risco-forte" d="M150 42 C 144 49, 138 56, 131 63"/>
    <path class="risco risco-forte" d="M123 72 C 117 79, 111 86, 105 93"/>
    <!-- sobras: fiapo acompanhando a diagonal e marca na ponta de cima -->
    <path class="risco risco-fino" d="M110 47 C 120 57, 130 67, 141 79"/>
    <path class="risco risco-fino" d="M146 38 C 149 36, 152 37, 155 40"/>

    <!-- "i" desconstruído: haste quebrada em dois e o pingo virou um traço
         solto, deslocado para o lado -->
    <path class="risco risco-forte" d="M169 46 C 170 56, 170 64, 169 72"/>
    <path class="risco risco-forte" d="M171 79 C 172 84, 172 88, 174 93"/>
    <path class="risco risco-forte" d="M172 24 C 175 21, 179 20, 183 21"/>
    <!-- sobras: fiapo ao lado da haste e resto do pingo -->
    <path class="risco risco-fino" d="M176 50 C 177 59, 177 67, 176 74"/>
    <path class="risco risco-fino" d="M163 30 C 165 29, 167 29, 169 30"/>

    <!-- "s" desconstruído: a curva de cima e a de baixo não se encontram
         no meio; a de baixo começa afastada e passa do fim da letra -->
    <path class="risco risco-forte" d="M230 49 C 222 40, 201 40, 197 52 C 195 60, 204 64, 212 66"/>
    <path class="risco risco-forte" d="M219 71 C 229 74, 235 81, 231 88 C 226 96, 205 97, 191 87"/>
    <!-- sobras: rabicho no topo, segunda passada no meio e ponta que escapa -->
    <path class="risco risco-fino" d="M232 44 C 234 47, 234 50, 232 53"/>
    <path class="risco risco-fino" d="M201 58 C 207 64, 217 67, 227 74"/>
    <path class="risco risco-fino" d="M195 91 C 192 93, 189 93, 186 91"/>
    </g>
    <!-- a camada em gradiente (.camada-grad) é uma cópia deste grupo feita
         pelo script abaixo — um <use> não pegaria o CSS dos .risco -->
  </svg>
</div>

  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="form-group">
      <label for="txtUser">Usuário</label>
      <input type="text" id="txtUser" placeholder="usuario" required autofocus autocomplete="off">
    </div>

    <div class="form-group">
      <label for="txtPass">Senha</label>
      <div class="senha-wrap">
        <input type="password" id="txtPass" placeholder="••••••••" required>
        <button type="button" class="ver-senha" id="btnVerSenha" aria-pressed="false" aria-label="Mostrar senha" title="Mostrar senha">
          <svg class="olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.3 3.2M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>
        </button>
      </div>
    </div>

    <!-- Marcado: entra direto da próxima vez, até clicar em Sair.
         Desmarcado: a sessão acaba quando o navegador fecha (ver
         lembrarLogin() em shared/session.js). A escolha fica lembrada. -->
    <label class="lembrar">
      <input type="checkbox" id="chkLembrar">
      <span class="lembrar-caixa" aria-hidden="true"></span>
      Permanecer logado
    </label>

    <button type="submit" class="btn-submit">Entrar</button>
    <div class="error-msg" id="errMsg"></div>
  </form>
</div>

<!-- versão: manter igual ao "version" do package.json -->
<footer class="login-footer">
  Portal v1.0.0<span class="sep">|</span>&copy; <span id="anoCopy">2026</span> Axis Corp.
</footer>

<script src="shared/supabase-config.js"></script>
<script src="shared/vendor/supabase.js"></script>
<script src="shared/session.js"></script>
<script>
document.getElementById('anoCopy').textContent = new Date().getFullYear();

// Palavra "Axis" do topo: acompanha o mouse inclinando alguns graus (suavizado
// com requestAnimationFrame). Com o mouse em cima dela, volta ao centro,
// fica parada e acende o neon forte (classe .acesa).
(function () {
  const letra = document.getElementById('loginLetter');
  if (!letra) return;
  // Cópia da palavra por cima, em gradiente — aparece com o mouse em cima (.acesa).
  const riscos = letra.querySelector('#axisRiscos');
  if (riscos) {
    const grad = riscos.cloneNode(true);
    grad.removeAttribute('id');
    grad.setAttribute('class', 'camada-grad');
    letra.appendChild(grad);
  }
  const semMovimento = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let alvoX = 0, alvoY = 0, atualX = 0, atualY = 0;
  let parada = false, animando = false;

  letra.addEventListener('pointerenter', () => {
    parada = true; alvoX = 0; alvoY = 0;
    letra.classList.add('acesa');
    animar();
  });
  letra.addEventListener('pointerleave', () => {
    parada = false;
    letra.classList.remove('acesa');
  });
  if (semMovimento) return;

  document.addEventListener('pointermove', (ev) => {
    if (parada) return;
    const r = letra.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    // -1..1 em relação ao tamanho da janela
    alvoX = Math.max(-1, Math.min(1, (ev.clientX - cx) / (window.innerWidth / 2)));
    alvoY = Math.max(-1, Math.min(1, (ev.clientY - cy) / (window.innerHeight / 2)));
    animar();
  });
  document.documentElement.addEventListener('pointerleave', () => {
    alvoX = 0; alvoY = 0; animar();
  });

  function animar() {
    if (animando || semMovimento) return;
    animando = true;
    requestAnimationFrame(passo);
  }
  function passo() {
    atualX += (alvoX - atualX) * 0.12;
    atualY += (alvoY - atualY) * 0.12;
    letra.style.transform =
      `perspective(400px) translate(${(atualX * 5).toFixed(2)}px, ${(atualY * 4).toFixed(2)}px) ` +
      `rotateY(${(atualX * 16).toFixed(2)}deg) rotateX(${(-atualY * 12).toFixed(2)}deg)`;
    if (Math.abs(alvoX - atualX) > 0.001 || Math.abs(alvoY - atualY) > 0.001) {
      requestAnimationFrame(passo);
    } else {
      animando = false;
    }
  }
})();

const DESATIVADO_MSG = 'Esta conta foi desativada. Fale com o professor.';
// Olho do campo de senha: alterna entre mostrar e esconder o que foi
// digitado, sem tirar o foco do campo.
document.getElementById('btnVerSenha').addEventListener('click', function () {
  const campo = document.getElementById('txtPass');
  const mostrar = campo.type === 'password';
  campo.type = mostrar ? 'text' : 'password';
  this.setAttribute('aria-pressed', String(mostrar));
  const rotulo = mostrar ? 'Esconder senha' : 'Mostrar senha';
  this.setAttribute('aria-label', rotulo);
  this.title = rotulo;
  campo.focus();
});

const CREDENCIAIS_MSG = 'Usuário ou senha incorretos!';

// Voltou pra cá porque a sessão foi derrubada no meio de uma navegação
// (aba que já estava aberta quando o professor arquivou o aluno — ver
// requireUser() em shared/session.js) — mensagem específica em vez do
// genérico "usuário ou senha incorretos", que aqui seria enganoso.
if (new URLSearchParams(window.location.search).get('arquivado') === '1') {
  const err = document.getElementById('errMsg');
  err.textContent = DESATIVADO_MSG;
  err.style.display = 'block';
}

async function handleLogin(e) {
  e.preventDefault();
  const uVal = document.getElementById('txtUser').value.trim();
  const pVal = document.getElementById('txtPass').value.trim();
  const err = document.getElementById('errMsg');
  const btn = document.querySelector('.btn-submit');

  btn.disabled = true;
  const lembrar = document.getElementById('chkLembrar').checked;
  const { error } = await window.PortalSession.signIn(uVal, pVal, lembrar);

  if (error) {
    // GoTrue devolve uma mensagem específica pra conta banida (ver
    // arquivar_aluno() no Supabase) em vez do erro genérico de senha —
    // ainda não confirmado em produção o texto exato, então o match é por
    // "banned" (case-insensitive) e cai pro genérico se não bater.
    err.textContent = /banned/i.test(error.message || '') ? DESATIVADO_MSG : CREDENCIAIS_MSG;
    err.style.display = 'block';
    btn.disabled = false;
    return false;
  }

  const user = await window.PortalSession.getUser();
  if (!user) {
    err.textContent = CREDENCIAIS_MSG;
    err.style.display = 'block';
    btn.disabled = false;
    return false;
  }

  err.style.display = 'none';
  entrar(user);
  return false;
}

// Cada turma tem sua própria tela; o professor cai num painel único.
function entrar(user) {
  window.location.href = (user.role === 'professor')
    ? 'professor/painel.html'
    : `turmas/${encodeURIComponent(user.turma)}/plataforma.html`;
}

// "Permanecer logado": a caixa vem como ficou da última vez. Entra direto,
// sem pedir a senha, se a caixa foi marcada ou se a sessão é a desta
// janela do navegador (caixa desmarcada, navegador ainda não fechado).
// Quem logou antes desta opção existir (sem escolha gravada) vê o login
// normalmente. Conta arquivada nunca entra direto — requireUser() mandaria
// de volta pra cá.
(async function () {
  let escolha = null;
  try { escolha = localStorage.getItem('axis.lembrar'); } catch (e) { /* bloqueado */ }
  document.getElementById('chkLembrar').checked = escolha === '1';
  if (new URLSearchParams(window.location.search).get('arquivado') === '1') return;
  const destaVez = document.cookie.split(';').some(c => c.trim() === 'axis_sessao=1');
  if (escolha !== '1' && !destaVez) return;
  const user = await window.PortalSession.getUser();
  if (user && !user.archived_at) entrar(user);
})();
</script>

</body>
</html>
