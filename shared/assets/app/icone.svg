    <g opacity=".55" filter="url(#desfoque)"><path stroke-width="12.32" d="M12 90 C 17 78, 22 67, 28 55"/><path stroke-width="12.32" d="M33 47 C 37 36, 41 26, 46 15"/><path stroke-width="12.32" d="M57 4 C 61 16, 65 29, 70 42"/><path stroke-width="12.32" d="M75 57 C 79 68, 83 79, 89 92"/><path stroke-width="12.32" d="M6 66 C 20 62, 34 60, 52 59"/></g>
    <path stroke-width="5.6" d="M12 90 C 17 78, 22 67, 28 55"/><path stroke-width="5.6" d="M33 47 C 37 36, 41 26, 46 15"/><path stroke-width="5.6" d="M57 4 C 61 16, 65 29, 70 42"/><path stroke-width="5.6" d="M75 57 C 79 68, 83 79, 89 92"/><path stroke-width="5.6" d="M6 66 C 20 62, 34 60, 52 59"/>
