<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícone do app Axis: o "A" em rabisco da marca (mesmos traços de shared/axis-logo.js), degradê ciano → violeta → rosa. Gerado junto com os PNGs; mudou aqui, gere os PNGs de novo. Versão com cantos arredondados. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151c2e"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#a78bfa" stop-opacity=".05"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="traco" gradientUnits="userSpaceOnUse" x1="6" y1="4" x2="89" y2="93">
      <stop offset="0" stop-color="#6eeaff"/>
      <stop offset=".5" stop-color="#ad8cff"/>
      <stop offset="1" stop-color="#ff5ad9"/>
    </linearGradient>
    <filter id="desfoque" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#5ee7ff" stroke-opacity=".12" stroke-width="6"/>
